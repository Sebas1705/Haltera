name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (detekt, tests, assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew detekt testDebugUnitTest testAndroidHostTest verifySqlDelightMigration :androidApp:assembleDebug --continue
      # Kover merges the host tests that just ran (they stay up to date) into one report and fails the
      # job if line coverage drops below the threshold in build.gradle.kts (koverVerify).
      - name: Coverage report (Kover)
        run: ./gradlew koverXmlReport koverHtmlReport koverVerify --continue
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "build/reports/kover/report.xml";
            if (!fs.existsSync(path)) { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Coverage\n\nNo Kover report was produced.\n"); process.exit(0); }
            const xml = fs.readFileSync(path, "utf8");
            const pct = (type) => {
              // The report-level counters are the last ones in the JaCoCo-style XML.
              const all = [...xml.matchAll(new RegExp(`<counter type="${type}" missed="(\\d+)" covered="(\\d+)"`, "g"))];
              const [, missed, covered] = all[all.length - 1].map(Number);
              return { pct: (100 * covered / (covered + missed)).toFixed(1), covered, total: covered + missed };
            };
            const line = pct("LINE"), branch = pct("BRANCH");
            const threshold = (fs.readFileSync("build.gradle.kts", "utf8").match(/minBound\((\d+)\)/) || [])[1];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Coverage (Kover, host tests)\n\n` +
              `| Metric | Covered | Coverage |\n|---|---|---|\n` +
              `| Lines | ${line.covered} / ${line.total} | **${line.pct} %** |\n` +
              `| Branches | ${branch.covered} / ${branch.total} | ${branch.pct} % |\n\n` +
              `Minimum line coverage enforced by koverVerify: ${threshold} %. HTML report in the kover-html-report artifact.\n`);
          '
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: kover-html-report
          path: build/reports/kover/html/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  ios:
    name: iOS app (simulator)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: brew install xcodegen
      - working-directory: iosApp
        run: xcodegen generate
      - working-directory: iosApp
        run: |
          xcodebuild build -project Haltera.xcodeproj -scheme Haltera -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO -quiet

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/rules-test/package-lock.json
      - run: npm ci --prefix firebase/rules-test
      - working-directory: firebase
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-haltera "npm --prefix rules-test test"

  catalog:
    name: Exercise catalogue and brand files (tests, up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/catalog/package-lock.json
      - run: npm ci --prefix scripts/catalog
      - run: npm test --prefix scripts/catalog
      - run: node scripts/catalog/build.mjs --check
      # Generic foods database (nutrition/README.md).
      - run: npm ci --prefix scripts/nutrition
      - run: npm test --prefix scripts/nutrition
      - run: node scripts/nutrition/build.mjs --check
      # App icons, splash theme and logo are generated from brand/tokens.json (docs/BRAND.md).
      - name: Brand files up to date
        run: node scripts/brand.mjs --check
      # The former app name must not come back outside the allow-list in docs/NAMING.md.
      - name: No stray former app name
        run: node scripts/check-name.mjs
