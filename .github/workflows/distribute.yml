name: Distribute

# Every merge to `main` that changes the app reaches the testers through Firebase App
# Distribution (group `testers`): the same app and key as future Play releases, versionName
# main-<n>. See docs/RELEASE.md.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: distribute
  cancel-in-progress: true

jobs:
  # Chooses where the heavy build runs: the owner's PC (self-hosted runner, see Sebas1705/ci-runner) when its
  # heartbeat variable is under 3 minutes old, otherwise a GitHub-hosted runner. Only push and manual runs may
  # use the PC; pull requests and every other event stay on GitHub-hosted runners.
  pick-runner:
    name: Pick the runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.PC_RUNNER_HEARTBEAT }}
          EVENT: ${{ github.event_name }}
        run: |
          runner='"ubuntu-latest"'
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ -n "${HEARTBEAT:-}" ]; then
            age=$(( $(date +%s) - HEARTBEAT ))
            if [ "$age" -ge 0 ] && [ "$age" -lt 180 ]; then runner='["self-hosted","pc"]'; fi
          fi
          echo "Runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  distribute:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 45
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `npx firebase-tools` needs npm: the PC image ships an old Node without npx, so install the same Node
      # on every runner.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Version name
        id: ver
        run: echo "name=main-$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-release
        with:
          version-name: ${{ steps.ver.outputs.name }}
          extra-secrets: FIREBASE_SERVICE_ACCOUNT_JSON

      - name: Upload to Firebase App Distribution
        env:
          TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP || 'testers' }}
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          export NOTES="$NAME: $(git log -1 --pretty='%s (%h)')"
          doppler run -- bash -c '
            umask 077
            printf "%s" "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools@15.32.1 appdistribution:distribute androidApp/build/outputs/apk/release/androidApp-release.apk \
              --app "$FIREBASE_ANDROID_APP_ID" \
              --groups "$TESTER_GROUP" \
              --release-notes "$NOTES"'

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-sa.json"
