# Spanish names and instructions per free-exercise-db source id (catalog/README.md).
# Values are Spanish UI data; keys and comments in English.
3_4_Sit-Up:
  name: "Abdominal 3/4"
  instructions:
    - "Túmbate en el suelo y fija los pies. Las piernas deben estar flexionadas por las rodillas."
    - "Coloca las manos detrás de la cabeza o a los lados de esta. Empieza con la espalda apoyada en el suelo. Esta es la posición inicial."
    - "Flexiona las caderas y la columna para elevar el torso hacia las rodillas."
    - "En lo más alto de la contracción, el torso debe quedar perpendicular al suelo. Invierte el movimiento, bajando solo ¾ del recorrido."
    - "Repite el número de repeticiones indicado."
90_90_Hamstring:
  name: "Isquiotibiales 90/90"
  instructions:
    - "Túmbate boca arriba con una pierna extendida en línea recta."
    - "Con la otra pierna, flexiona la cadera y la rodilla a 90 grados. Si es necesario, puedes sujetar la pierna con las manos. Esta es la posición inicial."
    - "Extiende la pierna recta hacia el aire, haciendo una breve pausa arriba. Vuelve con la pierna a la posición inicial."
    - "Repite de 10 a 20 repeticiones y después cambia de pierna."
Ab_Crunch_Machine:
  name: "Máquina de encogimientos abdominales"
  instructions:
    - "Selecciona una resistencia ligera y siéntate en la máquina de abdominales colocando los pies bajo las almohadillas y agarrando las asas superiores. Los brazos deben estar flexionados a 90 grados mientras apoyas los tríceps en las almohadillas. Esta es la posición inicial."
    - "A la vez, empieza a elevar las piernas mientras encoges la parte superior del torso. Espira mientras realizas este movimiento. Consejo: usa un movimiento lento y controlado. Concéntrate en mover el peso con los abdominales mientras relajas las piernas y los pies."
    - "Tras una pausa de un segundo, vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el movimiento el número de repeticiones prescrito."
Ab_Roller:
  name: "Rueda abdominal"
  instructions:
    - "Sujeta la rueda abdominal con ambas manos y ponte de rodillas en el suelo."
    - "Ahora coloca la rueda en el suelo frente a ti de modo que quedes a cuatro patas (como en una posición de flexión de rodillas). Esta es la posición inicial."
    - "Rueda lentamente hacia delante en línea recta, estirando el cuerpo hasta quedar en posición recta. Consejo: baja todo lo que puedas sin tocar el suelo con el cuerpo. Inspira durante esta parte del movimiento."
    - "Tras una pausa en la posición estirada, empieza a tirar de ti mismo para volver a la posición inicial mientras espiras. Consejo: ve despacio y mantén los abdominales tensos en todo momento."
Adductor:
  name: "Aductores (foam roller)"
  instructions:
    - "Túmbate boca abajo con una pierna sobre un foam roller."
    - "Rota la pierna para que el foam roller quede en contacto con la cara interna del muslo. Carga sobre el foam roller todo el peso que puedas tolerar."
    - "Mientras intentas relajar los músculos de la cara interna del muslo, rueda sobre el foam roller entre la cadera y la rodilla, manteniendo los puntos de tensión de 10 a 30 segundos. Repite con la otra pierna."
Adductor_Groin:
  name: "Aductores/ingle"
  instructions:
    - "Túmbate boca arriba con los pies elevados hacia el techo."
    - "Pide a tu compañero que te sujete los pies o los tobillos. Abre las piernas todo lo que puedas. Esta es la posición inicial."
    - "Intenta juntar las piernas apretando durante 10 o más segundos, mientras tu compañero te lo impide."
    - "Ahora relaja los músculos de las piernas mientras tu compañero te separa los pies, estirando hasta donde te resulte cómodo. Avisa a tu compañero cuando el estiramiento sea suficiente para evitar un estiramiento excesivo o una lesión."
Advanced_Kettlebell_Windmill:
  name: "Molino con kettlebell avanzado"
  instructions:
    - "Haz una cargada y un press con una kettlebell por encima de la cabeza con un brazo."
    - "Manteniendo la kettlebell bloqueada en todo momento, saca el glúteo en la dirección de la kettlebell bloqueada. Mantén el brazo que no trabaja detrás de la espalda y gira los pies hacia fuera a cuarenta y cinco grados respecto al brazo que sostiene la kettlebell."
    - "Desciende tanto como puedas."
    - "Haz una pausa de un segundo e invierte el movimiento hasta la posición inicial."
Air_Bike:
  name: "Abdominal bicicleta"
  instructions:
    - "Túmbate en el suelo con la zona lumbar pegada al suelo. Para este ejercicio tendrás que poner las manos a los lados de la cabeza. Procura no tensar el cuello al hacerlo. Ahora eleva los hombros hasta la posición de encogimiento."
    - "Sube las rodillas hasta que queden perpendiculares al suelo, con las piernas por debajo de la rodilla paralelas al suelo. Esta es la posición inicial."
    - "Ahora, de forma simultánea y lenta, realiza un movimiento de pedaleo, estirando hacia delante la pierna derecha y llevando hacia ti la rodilla de la pierna izquierda. Acerca el codo derecho a la rodilla izquierda encogiéndote hacia el lado mientras espiras."
    - "Vuelve a la posición inicial mientras inspiras."
    - "Encógete hacia el lado contrario mientras pedaleas con las piernas, acercando el codo izquierdo a la rodilla derecha, y espira."
    - "Sigue alternando de este modo hasta completar todas las repeticiones recomendadas de cada lado."
All_Fours_Quad_Stretch:
  name: "Estiramiento de cuádriceps a cuatro patas"
  instructions:
    - "Empieza a cuatro patas, después levanta una pierna del suelo y sujeta el pie con la mano."
    - "Usa la mano para sujetar el pie o el tobillo, manteniendo la rodilla completamente flexionada, estirando el cuádriceps y los flexores de la cadera."
    - "Concéntrate en extender las caderas, empujándolas hacia el suelo. Mantén de 10 a 20 segundos y después cambia de lado."
Alternate_Hammer_Curl:
  name: "Curl martillo alterno"
  instructions:
    - "De pie, con el torso erguido y una mancuerna en cada mano con los brazos extendidos. Los codos deben estar cerca del torso."
    - "Las palmas de las manos deben mirar hacia el torso. Esta es la posición inicial."
    - "Manteniendo la parte superior del brazo inmóvil, flexiona la mancuerna derecha hacia delante contrayendo el bíceps mientras espiras. Continúa el movimiento hasta que el bíceps esté completamente contraído y las mancuernas estén a la altura de los hombros. Mantén la posición contraída durante un segundo mientras aprietas el bíceps. Consejo: solo deben moverse los antebrazos."
    - "Empieza a bajar lentamente las mancuernas hasta la posición inicial mientras inspiras."
    - "Repite el movimiento con la mano izquierda. Esto equivale a una repetición."
    - "Continúa alternando de este modo el número de repeticiones recomendado."
Alternate_Heel_Touchers:
  name: "Toques de talón alternos"
  instructions:
    - "Túmbate en el suelo con las rodillas flexionadas y los pies en el suelo separados unos 45-60 cm. Los brazos deben estar extendidos a los lados. Esta es la posición inicial."
    - "Encoge el torso hacia delante y hacia arriba unos 8-10 cm hacia el lado derecho y toca el talón derecho, manteniendo la contracción durante un segundo. Espira mientras realizas este movimiento."
    - "Ahora vuelve lentamente a la posición inicial mientras inspiras."
    - "Ahora encoge el torso hacia delante y hacia arriba unos 8-10 cm hacia el lado izquierdo y toca el talón izquierdo, manteniendo la contracción durante un segundo. Espira mientras realizas este movimiento y después vuelve a la posición inicial mientras inspiras. Cuando hayas tocado ambos talones, se considera 1 repetición."
    - "Continúa alternando los lados de este modo hasta completar todas las repeticiones prescritas."
Alternate_Incline_Dumbbell_Curl:
  name: "Curl alterno con mancuernas en banco inclinado"
  instructions:
    - "Siéntate en un banco inclinado con una mancuerna en cada mano y los brazos extendidos. Consejo: mantén los codos cerca del torso. Esta es la posición inicial."
    - "Manteniendo la parte superior del brazo inmóvil, flexiona la mancuerna derecha hacia delante contrayendo el bíceps mientras espiras. Mientras lo haces, rota la mano de modo que la palma mire hacia arriba. Continúa el movimiento hasta que el bíceps esté completamente contraído y las mancuernas estén a la altura de los hombros. Mantén la posición contraída durante un segundo mientras aprietas el bíceps. Consejo: solo deben moverse los antebrazos."
    - "Empieza a bajar lentamente la mancuerna hasta la posición inicial mientras inspiras."
    - "Repite el movimiento con la mano izquierda. Esto equivale a una repetición."
    - "Continúa alternando de este modo el número de repeticiones recomendado."
Alternate_Leg_Diagonal_Bound:
  name: "Salto diagonal con piernas alternas"
  instructions:
    - "Adopta una postura cómoda con un pie ligeramente adelantado respecto al otro."
    - "Empieza impulsándote con la pierna adelantada, llevando la rodilla contraria hacia delante y lo más alto posible antes de aterrizar. Intenta cubrir la mayor distancia posible hacia cada lado con cada salto."
    - "Puede ayudar usar una línea en el suelo para calcular la distancia de un lado a otro."
    - "Repite la secuencia con la otra pierna."
Alternating_Cable_Shoulder_Press:
  name: "Press de hombros alterno en polea"
  instructions:
    - "Coloca las poleas en la parte inferior de la torre y selecciona un peso adecuado."
    - "Agarra las asas de las poleas y sostenlas a la altura de los hombros, con las palmas hacia delante. Esta es la posición inicial."
    - "Manteniendo la cabeza y el pecho erguidos, extiende el codo para empujar un lado directamente por encima de la cabeza."
    - "Tras una pausa arriba, vuelve a la posición inicial y repite con el lado contrario."
Alternating_Deltoid_Raise:
  name: "Elevación de deltoides alterna"
  instructions:
    - "De pie, sujeta un par de mancuernas a los lados."
    - "Manteniendo los codos ligeramente flexionados, eleva las pesas directamente frente a ti hasta la altura de los hombros, evitando balanceos o trampas."
    - "Devuelve las pesas a los lados."
    - "En la siguiente repetición, eleva las pesas lateralmente, hacia los lados hasta aproximadamente la altura de los hombros."
    - "Devuelve las pesas a la posición inicial y continúa alternando entre elevación frontal y lateral."
Alternating_Floor_Press:
  name: "Press en suelo alterno con kettlebell"
  instructions:
    - "Túmbate en el suelo con dos kettlebells junto a los hombros."
    - "Coloca una sobre el pecho y después la otra, agarrando las kettlebells por el asa con las palmas hacia delante."
    - "Extiende ambos brazos, de modo que las kettlebells queden sostenidas sobre el pecho. Baja una kettlebell hasta el pecho y gira la muñeca en la dirección de la kettlebell que sigue bloqueada."
    - "Sube la kettlebell y repite con el lado contrario."
Alternating_Hang_Clean:
  name: "Cargada alterna desde colgado con kettlebell"
  instructions:
    - "Coloca dos kettlebells entre los pies. Para adoptar la posición inicial, lleva el glúteo hacia atrás y mira al frente."
    - "Haz una cargada con una kettlebell hasta el hombro y sujeta la otra en posición colgada. Lleva la kettlebell al hombro extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia los hombros. Rota la muñeca mientras lo haces."
    - "Baja la kettlebell hasta la posición colgada y haz una cargada con la otra kettlebell. Repite."
Alternating_Kettlebell_Press:
  name: "Press alterno con kettlebell"
  instructions:
    - "Haz una cargada con dos kettlebells hasta los hombros. Lleva las kettlebells a los hombros extendiendo las piernas y las caderas mientras tiras de ellas hacia los hombros. Rota las muñecas mientras lo haces."
    - "Empuja una directamente por encima de la cabeza extendiendo el codo, girándola de modo que la palma mire hacia delante mientras mantienes la otra kettlebell inmóvil."
    - "Baja la kettlebell empujada hasta la posición inicial y empuja inmediatamente con el otro brazo."
Alternating_Kettlebell_Row:
  name: "Remo alterno con kettlebell"
  instructions:
    - "Coloca dos kettlebells delante de los pies. Flexiona ligeramente las rodillas y saca el glúteo todo lo que puedas. Al inclinarte para adoptar la posición inicial, agarra ambas kettlebells por las asas."
    - "Levanta una kettlebell del suelo mientras sujetas la otra. Retrae la escápula del lado que trabaja mientras flexionas el codo, llevando la kettlebell hacia el estómago o la caja torácica."
    - "Baja la kettlebell del brazo que trabaja y repite con el otro brazo."
Alternating_Renegade_Row:
  name: "Remo renegado alterno"
  instructions:
    - "Coloca dos kettlebells en el suelo separadas aproximadamente a la anchura de los hombros. Colócate sobre las puntas de los pies y las manos como si fueras a hacer una flexión, con el cuerpo recto y extendido. Usa las asas de las kettlebells para apoyar la parte superior del cuerpo. Puede que necesites separar los pies para tener más apoyo."
    - "Empuja una kettlebell contra el suelo y haz el remo con la otra, retrayendo la escápula del lado que trabaja mientras flexionas el codo, llevándola hacia el costado."
    - "Después baja la kettlebell al suelo y empieza con la kettlebell de la mano contraria. Repite durante varias repeticiones."
Ankle_Circles:
  name: "Círculos de tobillo"
  instructions:
    - "Usa un objeto firme, como un rack de sentadillas, para sujetarte."
    - "Levanta la pierna derecha en el aire (a unos 5 cm del suelo) y realiza un movimiento circular con el dedo gordo del pie. Imagina que dibujas con él un círculo grande. Consejo: un círculo equivale a 1 repetición. Respira con normalidad mientras realizas el movimiento."
    - "Cuando termines con el pie derecho, repite con la pierna izquierda."
Ankle_On_The_Knee:
  name: "Tobillo sobre la rodilla"
  instructions:
    - "Desde una posición tumbada, flexiona las rodillas y mantén los pies en el suelo."
    - "Coloca el tobillo de un pie sobre la rodilla contraria."
    - "Agarra el muslo o la rodilla de la pierna inferior y lleva ambas piernas hacia el pecho. Relaja el cuello y los hombros. Mantén de 10 a 20 segundos y después cambia de lado."
Anterior_Tibialis-SMR:
  name: "Tibial anterior (liberación miofascial)"
  instructions:
    - "Empieza sentado en el suelo con las piernas flexionadas y los pies en el suelo."
    - "Usando un rodillo muscular o un rodillo de cocina, aplica presión sobre los músculos de la parte externa de las espinillas. Trabaja desde justo debajo de la rodilla hasta por encima del tobillo, haciendo pausas de 10 a 30 segundos en los puntos de tensión. Repite con la otra pierna."
Anti-Gravity_Press:
  name: "Press antigravedad"
  instructions:
    - "Coloca una barra en el suelo detrás de la cabecera de un banco inclinado."
    - "Túmbate boca abajo en el banco. Con agarre prono, levanta la barra del suelo. Flexiona los codos, realizando un curl inverso para llevar la barra cerca del pecho. Esta es la posición inicial."
    - "Para empezar, empuja la barra hacia delante de la cabeza extendiendo los codos. Mantén los brazos paralelos al suelo durante todo el movimiento."
    - "Vuelve a la posición inicial y repite hasta completar la serie."
Arm_Circles:
  name: "Círculos de brazos"
  instructions:
    - "De pie, extiende los brazos rectos a los lados. Los brazos deben estar paralelos al suelo y perpendiculares (ángulo de 90 grados) al torso. Esta es la posición inicial."
    - "Empieza lentamente a hacer círculos de unos 30 cm de diámetro con cada brazo extendido. Respira con normalidad mientras realizas el movimiento."
    - "Continúa el movimiento circular de los brazos extendidos durante unos diez segundos. Después invierte el movimiento, girando en la dirección contraria."
Arnold_Dumbbell_Press:
  name: "Press Arnold con mancuernas"
  instructions:
    - "Siéntate en un banco con respaldo y sujeta dos mancuernas frente a ti a la altura de la parte superior del pecho, con las palmas hacia el cuerpo y los codos flexionados. Consejo: los brazos deben estar junto al torso. La posición inicial debe parecerse a la parte contraída de un curl con mancuernas."
    - "Ahora, para realizar el movimiento, eleva las mancuernas mientras rotas las palmas de las manos hasta que miren hacia delante."
    - "Continúa elevando las mancuernas hasta que los brazos queden extendidos sobre ti en posición recta. Espira mientras realizas esta parte del movimiento."
    - "Tras una pausa de un segundo arriba, empieza a bajar las mancuernas a la posición original rotando las palmas de las manos hacia ti. Consejo: el brazo izquierdo rotará en sentido antihorario mientras que el derecho rotará en sentido horario. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Around_The_Worlds:
  name: "Vuelta al mundo con mancuernas"
  instructions:
    - "Túmbate en un banco plano sujetando una mancuerna en cada mano con las palmas de las manos mirando hacia el techo. Consejo: los brazos deben estar paralelos al suelo y junto a los muslos. Para evitar lesiones, asegúrate de mantener los codos ligeramente flexionados. Esta es la posición inicial."
    - "Ahora mueve las mancuernas describiendo un semicírculo desde la posición inicial hasta pasar por encima de la cabeza. Todo el movimiento debe hacerse con los brazos paralelos al suelo en todo momento. Inspira mientras realizas esta parte del movimiento."
    - "Invierte el movimiento para devolver el peso a la posición inicial mientras espiras."
Atlas_Stone_Trainer:
  name: "Piedra Atlas"
  instructions:
    - "Este entrenador es eficaz para desarrollar la fuerza de piedra Atlas para quienes no tienen acceso a piedras, y suele fabricarse con extremos de barra o tubería pesada."
    - "Empieza cargando el peso deseado en la barra. Colócate a horcajadas sobre el peso, rodeando el implemento con los brazos y flexionando las caderas."
    - "Empieza tirando del peso hacia arriba pasando las rodillas, extendiendo las caderas. Cuando el peso supere las rodillas, puedes apoyarlo sobre los muslos sentándote hacia atrás, abrazándolo con fuerza contra el pecho."
    - "Termina el movimiento extendiendo las caderas y las rodillas para elevar el peso lo más alto posible. El peso puede volver a los muslos o al suelo para las repeticiones sucesivas."
Atlas_Stones:
  name: "Piedras Atlas"
  instructions:
    - "Empieza con la piedra Atlas entre los pies. Flexiona las caderas para rodear la piedra Atlas verticalmente con los brazos, intentando meter los dedos por debajo de la piedra. Muchas piedras tienen una pequeña parte plana en la base, que facilita el agarre."
    - "Tirando de la piedra hacia el torso, empuja con la parte trasera de los pies para despegar la piedra del suelo."
    - "Cuando la piedra pase las rodillas, apóyala sobre los muslos sentándote hacia atrás y llevando la piedra encima de los muslos."
    - "Siéntate bajo, subiendo la piedra alto sobre el pecho mientras cambias el agarre para pasar las manos por encima de la piedra. Ponte de pie, empujando con las caderas. Acércate a la plataforma de carga e inclínate hacia atrás, extendiendo las caderas para subir la piedra lo más alto posible."
Back_Flyes_-_With_Bands:
  name: "Pájaro con gomas elásticas"
  instructions:
    - "Pasa una goma elástica alrededor de un poste fijo, como el de un rack de sentadillas."
    - "Agarra la goma por las asas y aléjate para que aumente la tensión de la goma."
    - "Extiende y levanta los brazos rectos frente a ti. Consejo: los brazos deben estar rectos y paralelos al suelo y perpendiculares al torso. Los pies deben estar firmemente apoyados en el suelo y separados a la anchura de los hombros. Esta es la posición inicial."
    - "Mientras espiras, mueve los brazos hacia los lados y hacia atrás. Mantén los brazos extendidos y paralelos al suelo. Continúa el movimiento hasta que los brazos queden extendidos a los lados."
    - "Tras una pausa, vuelve a la posición original mientras inspiras."
    - "Repite el número de repeticiones indicado."
Backward_Drag:
  name: "Arrastre hacia atrás"
  instructions:
    - "Carga un trineo con el peso deseado, sujetando al trineo una cuerda o correas de las que puedas agarrarte."
    - "Empieza el ejercicio moviéndote hacia atrás una distancia determinada. Inclinándote hacia atrás, extiende las piernas con pasos cortos para moverte lo más rápido posible."
Backward_Medicine_Ball_Throw:
  name: "Lanzamiento de balón medicinal hacia atrás"
  instructions:
    - "Este ejercicio se hace mejor con un compañero. Si no tienes compañero, puedes lanzar y recoger el balón o lanzarlo contra una pared."
    - "Empieza de pie a unos metros delante de tu compañero, ambos mirando en la misma dirección. Empieza sujetando el balón entre las piernas."
    - "Haz una sentadilla y después invierte la dirección con fuerza, llegando a la extensión completa, y lanza el balón por encima de la cabeza hacia tu compañero."
    - "Tu compañero puede devolverte el balón rodando. Repite el número de repeticiones deseado."
Balance_Board:
  name: "Tabla de equilibrio"
  instructions:
    - "Coloca una tabla de equilibrio frente a ti."
    - "Súbete a ella e intenta mantener el equilibrio."
    - "Mantén el equilibrio el tiempo que desees."
Ball_Leg_Curl:
  name: "Curl femoral con fitball"
  instructions:
    - "Empieza tumbado en el suelo boca arriba con los pies sobre el balón."
    - "Coloca el balón de modo que, cuando las piernas estén extendidas, los tobillos queden sobre el balón. Esta es la posición inicial."
    - "Eleva las caderas del suelo, manteniendo el peso sobre los omóplatos y los pies."
    - "Flexiona las rodillas, acercando el balón hacia ti todo lo que puedas, contrayendo los isquiotibiales."
    - "Tras una breve pausa, vuelve a la posición inicial."
Band_Assisted_Pull-Up:
  name: "Dominada asistida con goma elástica"
  instructions:
    - "Pasa la goma elástica por el centro de la barra de dominadas, haciendo un nudo corredizo. Puedes usar gomas diferentes para obtener distintos niveles de asistencia."
    - "Tira del extremo de la goma hacia abajo y mete una rodilla flexionada en el lazo, asegurándote de que no se saldrá. Agarra la barra con un agarre medio a ancho. Esta es la posición inicial."
    - "Tira de ti hacia arriba contrayendo los dorsales mientras flexionas el codo. El codo debe dirigirse hacia el costado. Sube hacia delante, intentando pasar la barbilla por encima de la barra. Evita balanceos o tirones."
    - "Tras una breve pausa, vuelve a la posición inicial."
Band_Good_Morning:
  name: "Buenos días con goma elástica"
  instructions:
    - "Con una goma elástica de unos 104 cm, colócate de pie sobre un extremo, separando un poco los pies. Flexiona las caderas para pasar el extremo de la goma por detrás del cuello. Esta es la posición inicial."
    - "Manteniendo las piernas rectas, extiende las caderas hasta quedar en una posición casi vertical."
    - "Asegúrate de no redondear la espalda al bajar de nuevo a la posición inicial."
Band_Good_Morning_Pull_Through:
  name: "Buenos días con goma elástica (pull through)"
  instructions:
    - "Pasa la goma elástica alrededor de un poste. De pie, a cierta distancia, pasa el extremo opuesto alrededor del cuello. Las manos pueden ayudar a mantener la goma en su sitio."
    - "Empieza flexionando las caderas, llevando el glúteo hacia atrás todo lo que puedas. Mantén la espalda recta e inclínate hacia delante hasta unos 90 grados. Las rodillas deben estar solo ligeramente flexionadas."
    - "Vuelve a la posición inicial empujando con las caderas para volver a la posición de pie."
Band_Hip_Adductions:
  name: "Aducción de cadera con goma elástica"
  instructions:
    - "Ancla una goma elástica a un poste sólido u otro objeto."
    - "Colócate con el lado izquierdo hacia el poste y mete el pie derecho por la goma, pasándola alrededor del tobillo."
    - "Ponte erguido y agárrate al poste si es necesario. Esta es la posición inicial."
    - "Manteniendo la rodilla recta, eleva la pierna derecha hacia el lado tan lejos como puedas."
    - "Vuelve a la posición inicial y repite el número de repeticiones deseado."
    - "Cambia de lado."
Band_Pull_Apart:
  name: "Apertura de goma elástica (pull apart)"
  instructions:
    - "Empieza con los brazos extendidos rectos frente a ti, sujetando la goma con ambas manos."
    - "Inicia el movimiento realizando un movimiento de pájaro, llevando las manos hacia fuera lateralmente a los costados."
    - "Mantén los codos extendidos mientras realizas el movimiento, llevando la goma hacia el pecho. Asegúrate de mantener los hombros hacia atrás durante el ejercicio."
    - "Haz una pausa al completar el movimiento y vuelve a la posición inicial de forma controlada."
Band_Skull_Crusher:
  name: "Rompecráneos con goma elástica"
  instructions:
    - "Fija una goma elástica a la base de un rack o del banco. Túmbate en el banco de modo que la goma quede alineada con la cabeza."
    - "Agarra la goma, elevando los codos de modo que la parte superior del brazo quede perpendicular al suelo. Con el codo flexionado, la goma debe quedar por encima de la cabeza. Esta es la posición inicial."
    - "Extiende el codo para estirar el brazo, manteniendo la parte superior del brazo en su sitio. Haz una pausa en la parte alta del movimiento y vuelve a la posición inicial."
Barbell_Ab_Rollout:
  name: "Rueda abdominal con barra"
  instructions:
    - "Para este ejercicio tendrás que adoptar una posición de flexión, pero en lugar de tener las manos en el suelo, agarrarás una barra olímpica (cargada con unos 2,5-5 kg en cada lado). Esta es la posición inicial."
    - "Manteniendo un ligero arco en la espalda, eleva las caderas y rueda la barra hacia los pies mientras espiras. Consejo: mientras realizas el movimiento, los glúteos deben subir, debes mantener los abdominales tensos y conservar la postura de la espalda en todo momento. Además, los brazos deben permanecer perpendiculares al suelo durante todo el movimiento. Si no, trabajarás más los hombros y la espalda que los abdominales."
    - "Tras una contracción de un segundo arriba, empieza a rodar la barra de nuevo hacia delante hasta la posición inicial lentamente mientras inspiras."
    - "Repite el número de repeticiones indicado."
Barbell_Ab_Rollout_-_On_Knees:
  name: "Rueda abdominal con barra (de rodillas)"
  instructions:
    - "Sujeta una barra olímpica cargada con unos 2,5-5 kg en cada lado y ponte de rodillas en el suelo."
    - "Ahora coloca la barra en el suelo frente a ti de modo que quedes a cuatro patas (como en una posición de flexión de rodillas). Esta es la posición inicial."
    - "Rueda lentamente la barra hacia delante en línea recta, estirando el cuerpo hasta quedar en posición recta. Consejo: baja todo lo que puedas sin tocar el suelo con el cuerpo. Inspira durante esta parte del movimiento."
    - "Tras una pausa de un segundo en la posición estirada, empieza a tirar de ti mismo para volver a la posición inicial mientras espiras. Consejo: ve despacio y mantén los abdominales tensos en todo momento."
Barbell_Bench_Press_-_Medium_Grip:
  name: "Press de banca con barra (agarre medio)"
  instructions:
    - "Túmbate en un banco plano. Con un agarre de anchura media (un agarre que forme un ángulo de 90 grados en mitad del movimiento entre los antebrazos y la parte superior de los brazos), levanta la barra del rack y sujétala recta sobre ti con los brazos bloqueados. Esta es la posición inicial."
    - "Desde la posición inicial, inspira y empieza a bajar lentamente hasta que la barra toque la parte media del pecho."
    - "Tras una breve pausa, empuja la barra de vuelta a la posición inicial mientras espiras. Concéntrate en empujar la barra con los músculos del pecho. Bloquea los brazos y aprieta el pecho en la posición contraída en la parte alta del movimiento, mantén un segundo y empieza a bajar lentamente de nuevo. Consejo: lo ideal es que bajar el peso lleve aproximadamente el doble de tiempo que subirlo."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, devuelve la barra al rack."
Barbell_Curl:
  name: "Curl con barra"
  instructions:
    - "De pie, con el torso erguido, sujeta una barra con un agarre a la anchura de los hombros. Las palmas de las manos deben mirar hacia delante y los codos deben estar cerca del torso. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos inmóvil, flexiona el peso hacia delante contrayendo el bíceps mientras espiras. Consejo: solo deben moverse los antebrazos."
    - "Continúa el movimiento hasta que los bíceps estén completamente contraídos y la barra esté a la altura de los hombros. Mantén la posición contraída durante un segundo y aprieta los bíceps con fuerza."
    - "Empieza a bajar lentamente la barra hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Barbell_Curls_Lying_Against_An_Incline:
  name: "Curl con barra tumbado sobre banco inclinado"
  instructions:
    - "Túmbate sobre un banco inclinado, con los brazos sujetando una barra y colgando en línea horizontal. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos inmóvil, flexiona el peso hacia arriba tan alto como puedas mientras aprietas el bíceps. Espira mientras realizas esta parte del movimiento. Consejo: solo deben moverse los antebrazos. No balancees los brazos."
    - "Tras una contracción de un segundo, vuelve lentamente a la posición inicial mientras inspiras. Consejo: asegúrate de bajar por completo."
    - "Repite el número de repeticiones indicado."
Barbell_Deadlift:
  name: "Peso muerto con barra"
  instructions:
    - "Colócate de pie frente a una barra cargada."
    - "Manteniendo la espalda lo más recta posible, flexiona las rodillas, inclínate hacia delante y agarra la barra con un agarre prono medio (a la anchura de los hombros). Esta es la posición inicial. Consejo: si te resulta difícil sujetar la barra con este agarre, alterna el agarre o usa correas para las muñecas."
    - "Mientras sujetas la barra, inicia el levantamiento empujando con las piernas a la vez que llevas el torso a la posición erguida mientras espiras. En la posición erguida, saca pecho y contrae la espalda llevando los omóplatos hacia atrás. Piensa en cómo se ponen los soldados cuando están firmes."
    - "Vuelve a la posición inicial flexionando las rodillas mientras inclinas el torso hacia delante por la cintura, manteniendo la espalda recta. Cuando los discos de la barra toquen el suelo, habrás vuelto a la posición inicial y estarás listo para realizar otra repetición."
    - "Realiza el número de repeticiones prescrito en el programa."
Barbell_Full_Squat:
  name: "Sentadilla completa con barra"
  instructions:
    - "Este ejercicio se realiza mejor dentro de un rack de sentadillas por seguridad. Para empezar, coloca primero la barra en un rack justo por encima de la altura de los hombros. Una vez elegida la altura correcta y cargada la barra, métete bajo la barra y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre ella."
    - "Sujeta la barra con ambos brazos a cada lado y levántala del rack empujando primero con las piernas y enderezando a la vez el torso."
    - "Aléjate del rack y coloca las piernas en una postura media a la anchura de los hombros con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento y la espalda recta. Esta es la posición inicial."
    - "Empieza a bajar lentamente la barra flexionando las rodillas y llevando la cadera hacia atrás mientras mantienes una postura recta con la cabeza alta. Continúa hacia abajo hasta que los isquiotibiales toquen las pantorrillas. Inspira mientras realizas esta parte del movimiento."
    - "Empieza a subir la barra mientras espiras empujando el suelo con el talón o la parte media del pie mientras estiras las piernas y extiendes las caderas para volver a la posición inicial."
    - "Repite el número de repeticiones indicado."
Barbell_Glute_Bridge:
  name: "Puente de glúteos con barra"
  instructions:
    - "Empieza sentado en el suelo con una barra cargada sobre las piernas. Usar una barra gruesa o poner una almohadilla en la barra puede reducir mucho la molestia que causa este ejercicio. Rueda la barra hasta que quede justo encima de las caderas y túmbate boca arriba en el suelo."
    - "Empieza el movimiento empujando con los talones, extendiendo las caderas en vertical a través de la barra. El peso debe quedar sostenido por la parte superior de la espalda y los talones."
    - "Extiende todo lo que puedas y después invierte el movimiento para volver a la posición inicial."
Barbell_Guillotine_Bench_Press:
  name: "Press guillotina con barra"
  instructions:
    - "Con un agarre de anchura media (un agarre que forme un ángulo de 90 grados en mitad del movimiento entre los antebrazos y la parte superior de los brazos), levanta la barra del rack y sujétala recta sobre el cuello con los brazos bloqueados. Esta es la posición inicial."
    - "Mientras inspiras, baja la barra lentamente hasta que esté a unos 2,5 cm del cuello."
    - "Tras una pausa de un segundo, lleva la barra de vuelta a la posición inicial mientras espiras y empuja la barra con los músculos del pecho. Bloquea los brazos y aprieta el pecho en la posición contraída, mantén un segundo y empieza a bajar lentamente de nuevo. Bajar debe llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, devuelve la barra al rack."
Barbell_Hack_Squat:
  name: "Sentadilla hack con barra"
  instructions:
    - "De pie y erguido, sujeta una barra detrás de ti con los brazos extendidos y los pies a la anchura de los hombros. Consejo: lo mejor es un agarre a la anchura de los hombros con las palmas de las manos mirando hacia atrás. Puedes usar muñequeras para este ejercicio para un mejor agarre. Esta es la posición inicial."
    - "Manteniendo la cabeza y la mirada altas y la espalda recta, haz una sentadilla hasta que la parte superior de los muslos quede paralela al suelo. Inspira mientras bajas lentamente."
    - "Empujando principalmente con el talón del pie y apretando los muslos, sube mientras espiras."
    - "Repite el número de repeticiones indicado."
Barbell_Hip_Thrust:
  name: "Hip thrust con barra"
  instructions:
    - "Empieza sentado en el suelo con un banco justo detrás de ti. Ten una barra cargada sobre las piernas. Usar una barra gruesa o poner una almohadilla en la barra puede reducir mucho la molestia que causa este ejercicio."
    - "Rueda la barra hasta que quede justo encima de las caderas y recuéstate contra el banco de modo que los omóplatos estén cerca de la parte superior del mismo."
    - "Empieza el movimiento empujando con los pies, extendiendo las caderas en vertical a través de la barra. El peso debe quedar sostenido por los omóplatos y los pies. Extiende todo lo que puedas y después invierte el movimiento para volver a la posición inicial."
Barbell_Incline_Bench_Press_-_Medium_Grip:
  name: "Press de banca inclinado con barra (agarre medio)"
  instructions:
    - "Túmbate en un banco inclinado. Con un agarre de anchura media (un agarre que forme un ángulo de 90 grados en mitad del movimiento entre los antebrazos y la parte superior de los brazos), levanta la barra del rack y sujétala recta sobre ti con los brazos bloqueados. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente hasta notar la barra en la parte superior del pecho."
    - "Tras una pausa de un segundo, lleva la barra de vuelta a la posición inicial mientras espiras y empuja la barra con los músculos del pecho. Bloquea los brazos en la posición contraída, aprieta el pecho, mantén un segundo y empieza a bajar lentamente de nuevo. Consejo: bajar debe llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, devuelve la barra al rack."
Barbell_Incline_Shoulder_Raise:
  name: "Elevación de hombros con barra en banco inclinado"
  instructions:
    - "Túmbate en un banco inclinado. Con un agarre de anchura media (un agarre ligeramente más ancho que la anchura de los hombros), levanta la barra del rack y sujétala recta sobre ti con los brazos rectos. Esta es la posición inicial."
    - "Manteniendo los brazos rectos, levanta la barra protrayendo los omóplatos, elevando los hombros del banco mientras espiras."
    - "Lleva la barra de vuelta a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Barbell_Lunge:
  name: "Zancada con barra"
  instructions:
    - "Este ejercicio se realiza mejor dentro de un rack de sentadillas por seguridad. Para empezar, coloca primero la barra en un rack justo por debajo de la altura de los hombros. Una vez elegida la altura correcta y cargada la barra, métete bajo la barra y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre ella."
    - "Sujeta la barra con ambos brazos a cada lado y levántala del rack empujando primero con las piernas y enderezando a la vez el torso."
    - "Aléjate del rack y da un paso hacia delante con la pierna derecha y baja con las caderas, manteniendo el torso erguido y el equilibrio. Inspira mientras bajas. Nota: no permitas que la rodilla se adelante más allá de los dedos de los pies al bajar, ya que esto supondrá una tensión excesiva para la articulación de la rodilla."
    - "Usando principalmente el talón del pie, empuja hacia arriba y vuelve a la posición inicial mientras espiras."
    - "Repite el movimiento el número de repeticiones recomendado y después realiza con la pierna izquierda."
Barbell_Rear_Delt_Row:
  name: "Remo con barra para deltoides posterior"
  instructions:
    - "De pie y erguido, sujeta una barra con un agarre ancho (más ancho que los hombros) y prono (palmas hacia el cuerpo)."
    - "Flexiona ligeramente las rodillas e inclínate manteniendo el arco natural de la espalda. Deja que los brazos cuelguen frente a ti sujetando la barra. Una vez que el torso esté paralelo al suelo, abre los codos hacia fuera y alejándolos del cuerpo. Consejo: el torso y los brazos deben parecerse a la letra \"T\". Ahora estás listo para empezar el ejercicio."
    - "Manteniendo la parte superior de los brazos perpendicular al torso, tira de la barra hacia la parte superior del pecho mientras aprietas los deltoides posteriores y espiras. Consejo: si se hace correctamente, este ejercicio debe parecerse a un press de banca a la inversa. Además, evita usar los bíceps para hacer el trabajo. Concéntrate en trabajar los deltoides posteriores; los brazos solo deben actuar como ganchos."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Barbell_Rollout_from_Bench:
  name: "Rueda con barra desde banco"
  instructions:
    - "Coloca una barra cargada en el suelo, cerca del extremo de un banco. Ponte de rodillas con ambas piernas sobre el banco y agarra la barra con un agarre medio a estrecho. Esta es la posición inicial."
    - "Para empezar, extiende las caderas para hacer rodar lentamente la barra hacia delante. Al rodar, flexiona el hombro para hacer rodar la barra por encima de la cabeza. Asegúrate de que los brazos permanezcan extendidos durante todo el movimiento."
    - "Cuando la barra se haya movido tan adelante como sea posible, vuelve a la posición inicial."
Barbell_Seated_Calf_Raise:
  name: "Elevación de gemelos sentado con barra"
  instructions:
    - "Coloca un bloque a unos 30 cm delante de un banco plano."
    - "Siéntate en el banco y coloca la parte delantera de los pies sobre el bloque."
    - "Pide a alguien que coloque una barra sobre la parte superior de los muslos, unos 7,5 cm por encima de las rodillas, y que la sujete ahí. Esta es la posición inicial."
    - "Elévate sobre las puntas de los pies tan alto como puedas mientras aprietas los gemelos y espiras."
    - "Tras una contracción de un segundo, vuelve lentamente a la posición inicial. Consejo: para obtener el máximo beneficio, estira los gemelos todo lo que puedas."
    - "Repite el número de repeticiones indicado."
Barbell_Shoulder_Press:
  name: "Press de hombros con barra"
  instructions:
    - "Siéntate en un banco con respaldo dentro de un rack de sentadillas. Coloca una barra a una altura justo por encima de la cabeza. Agarra la barra con un agarre prono (palmas hacia delante)."
    - "Una vez que hayas cogido la barra con la anchura de agarre correcta, levántala por encima de la cabeza bloqueando los brazos. Mantén a la altura de los hombros aproximadamente y ligeramente por delante de la cabeza. Esta es la posición inicial."
    - "Baja la barra lentamente hasta los hombros mientras inspiras."
    - "Sube la barra de nuevo a la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Barbell_Shrug:
  name: "Encogimiento de hombros con barra"
  instructions:
    - "De pie y erguido, con los pies a la anchura de los hombros, sujeta una barra con ambas manos frente a ti con un agarre prono (palmas hacia los muslos). Consejo: las manos deben estar un poco más separadas que la anchura de los hombros. Puedes usar muñequeras para este ejercicio para un mejor agarre. Esta es la posición inicial."
    - "Eleva los hombros todo lo que puedas mientras espiras y mantén la contracción durante un segundo. Consejo: evita intentar levantar la barra usando los bíceps."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Barbell_Shrug_Behind_The_Back:
  name: "Encogimiento de hombros con barra a la espalda"
  instructions:
    - "De pie y erguido, con los pies a la anchura de los hombros, sujeta una barra con ambas manos detrás de la espalda con un agarre prono (palmas hacia atrás). Consejo: las manos deben estar un poco más separadas que la anchura de los hombros. Puedes usar muñequeras para este ejercicio para un mejor agarre. Esta es la posición inicial."
    - "Eleva los hombros todo lo que puedas mientras espiras y mantén la contracción durante un segundo. Consejo: evita intentar levantar la barra usando los bíceps. Los brazos deben permanecer estirados en todo momento."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Barbell_Side_Bend:
  name: "Flexión lateral con barra"
  instructions:
    - "De pie y erguido, sujeta una barra colocada sobre la parte posterior de los hombros (ligeramente por debajo del cuello). Los pies deben estar separados a la anchura de los hombros. Esta es la posición inicial."
    - "Manteniendo la espalda recta y la cabeza alta, flexiónate solo por la cintura hacia la derecha tanto como puedas. Inspira mientras te inclinas hacia el lado. Después mantén un segundo y vuelve a la posición inicial mientras espiras. Consejo: mantén inmóvil el resto del cuerpo."
    - "Ahora repite el movimiento pero inclinándote hacia la izquierda. Mantén un segundo y vuelve a la posición inicial."
    - "Repite el número de repeticiones indicado."
Barbell_Side_Split_Squat:
  name: "Sentadilla lateral dividida con barra"
  instructions:
    - "De pie y erguido, sujeta una barra colocada sobre la parte posterior de los hombros (ligeramente por debajo del cuello). Los pies deben estar muy separados, con el pie de la pierna adelantada girado hacia el lado. Esta es la posición inicial."
    - "Baja el cuerpo hacia el lado del pie girado flexionando la rodilla y la cadera de la pierna adelantada y manteniendo la pierna contraria solo ligeramente flexionada. Inspira mientras bajas el cuerpo."
    - "Vuelve a la posición inicial extendiendo la cadera y la rodilla de la pierna adelantada. Espira mientras realizas este movimiento."
    - "Tras realizar el número de repeticiones recomendado, repite el movimiento con la pierna contraria."
Barbell_Squat:
  name: "Sentadilla con barra"
  instructions:
    - "Este ejercicio se realiza mejor dentro de un rack de sentadillas por seguridad. Para empezar, coloca primero la barra en un rack justo por debajo de la altura de los hombros. Una vez elegida la altura correcta y cargada la barra, métete bajo la barra y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre ella."
    - "Sujeta la barra con ambos brazos a cada lado y levántala del rack empujando primero con las piernas y enderezando a la vez el torso."
    - "Aléjate del rack y coloca las piernas en una postura media a la anchura de los hombros con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento y también la espalda recta. Esta es la posición inicial. (Nota: a efectos de esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas explicadas en la sección de posturas de los pies)."
    - "Empieza a bajar lentamente la barra flexionando las rodillas y las caderas mientras mantienes una postura recta con la cabeza alta. Continúa hacia abajo hasta que el ángulo entre el muslo y las pantorrillas sea ligeramente inferior a 90 grados. Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con los dedos de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan los dedos de los pies), estás sometiendo la rodilla a una tensión excesiva y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra mientras espiras empujando el suelo con el talón del pie mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Barbell_Squat_To_A_Bench:
  name: "Sentadilla con barra a un banco"
  instructions:
    - "Este ejercicio se realiza mejor dentro de un rack de sentadillas por seguridad. Para empezar, coloca primero un banco plano o un cajón detrás de ti. El banco plano sirve para enseñarte a llevar la cadera hacia atrás y a alcanzar la profundidad."
    - ""
    - "Después, coloca la barra en un rack que se ajuste a tu altura. Una vez elegida la altura correcta y cargada la barra, métete bajo la barra y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre ella."
    - "Sujeta la barra con ambos brazos a cada lado y levántala del rack empujando primero con las piernas y enderezando a la vez el torso."
    - "Aléjate del rack y coloca las piernas en una postura media a la anchura de los hombros con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te desequilibrará, y mantén también la espalda recta. Esta es la posición inicial. (Nota: a efectos de esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas explicadas en la sección de posturas de los pies)."
    - "Empieza a bajar lentamente la barra flexionando las rodillas y llevando la cadera hacia atrás mientras mantienes una postura recta con la cabeza alta. Continúa hacia abajo hasta tocar ligeramente el banco que tienes detrás. Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con los dedos de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan los dedos de los pies), estás sometiendo la rodilla a una tensión excesiva y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra mientras espiras empujando el suelo con el talón del pie mientras estiras las piernas y extiendes las caderas para volver a la posición inicial."
    - "Repite el número de repeticiones indicado."
Barbell_Step_Ups:
  name: "Subidas al cajón con barra"
  instructions:
    - "De pie y erguido, sujeta una barra colocada sobre la parte posterior de los hombros (ligeramente por debajo del cuello) y colócate de pie detrás de una plataforma elevada (como la que se usa para asistir detrás de un banco plano). Esta es la posición inicial."
    - "Coloca el pie derecho en la plataforma elevada. Sube a la plataforma extendiendo la cadera y la rodilla de la pierna derecha. Usa principalmente el talón para elevar el resto del cuerpo y coloca también el pie de la pierna izquierda en la plataforma. Espira mientras realizas la fuerza necesaria para subir."
    - "Baja con la pierna izquierda flexionando la cadera y la rodilla de la pierna derecha mientras inspiras. Vuelve a la posición inicial de pie colocando el pie derecho junto al izquierdo."
    - "Repite con la pierna derecha el número de repeticiones recomendado y después realiza con la pierna izquierda."
Barbell_Walking_Lunge:
  name: "Zancada caminando con barra"
  instructions:
    - "Empieza de pie con los pies a la anchura de los hombros y una barra sobre la parte superior de la espalda."
    - "Da un paso hacia delante con una pierna, flexionando las rodillas para bajar las caderas. Desciende hasta que la rodilla trasera casi toque el suelo. La postura debe permanecer erguida y la rodilla delantera debe quedar sobre el pie delantero."
    - "Empuja con el talón del pie adelantado y extiende ambas rodillas para volver a subir."
    - "Da un paso hacia delante con el pie trasero, repitiendo la zancada con la pierna contraria."
Battling_Ropes:
  name: "Cuerdas de batalla"
  instructions:
    - "Para este ejercicio necesitarás una cuerda pesada anclada por su centro a 4,5-6 m de distancia. De pie frente a la cuerda, coge un extremo en cada mano con los brazos extendidos a los lados. Esta es la posición inicial."
    - "Inicia el movimiento elevando rápidamente un brazo hasta la altura del hombro tan rápido como puedas."
    - "Mientras dejas caer ese brazo a la posición inicial, eleva el del lado contrario."
    - "Continúa alternando los brazos izquierdo y derecho, azotando las cuerdas arriba y abajo tan rápido como puedas."
Bear_Crawl_Sled_Drags:
  name: "Arrastre de trineo a cuatro patas (bear crawl)"
  instructions:
    - "Con un arnés o un cinturón de lastre holgado, sujeta la cadena a la parte trasera de modo que mires en dirección contraria al trineo. Agáchate de modo que las manos queden en el suelo. La espalda debe estar recta y las rodillas flexionadas. Esta es la posición inicial."
    - "Empieza empujando con las piernas, alternando izquierda y derecha. Usa las manos para mantener el equilibrio y ayudar a tirar. Intenta mantener la espalda recta mientras avanzas una distancia determinada."
Behind_Head_Chest_Stretch:
  name: "Estiramiento de pecho con manos detrás de la cabeza"
  instructions:
    - "Siéntate erguido en el suelo con tu compañero detrás de ti."
    - "Coloca las manos detrás de la cabeza y lleva los codos hacia atrás todo lo que puedas. Tu compañero debe sujetarte los codos. Esta es la posición inicial."
    - "Intenta suavemente llevar los codos hacia delante con las manos todavía detrás de la cabeza durante 10 o más segundos. Tu compañero debe impedir que los codos se muevan."
    - "Ahora relaja los músculos y haz que tu compañero lleve suavemente los codos hacia atrás hasta donde te resulte cómodo. Avisa a tu compañero cuando el estiramiento sea suficiente para evitar un estiramiento excesivo o una lesión."
Bench_Dips:
  name: "Fondos en banco"
  instructions:
    - "Para este ejercicio tendrás que colocar un banco detrás de la espalda. Con el banco perpendicular al cuerpo y mirando en sentido contrario a él, agárrate al borde del banco con los brazos completamente extendidos, separados a la anchura de los hombros. Las piernas estarán extendidas hacia delante, flexionadas por la cintura y perpendiculares al torso. Esta es la posición inicial."
    - "Baja lentamente el cuerpo mientras inspiras flexionando los codos hasta descender lo suficiente como para que haya un ángulo ligeramente inferior a 90 grados entre la parte superior del brazo y el antebrazo. Consejo: mantén los codos lo más pegados posible durante todo el movimiento. Los antebrazos deben apuntar siempre hacia abajo."
    - "Usando los tríceps para subir de nuevo el torso, elévate hasta la posición inicial."
    - "Repite el número de repeticiones indicado."
Bench_Jump:
  name: "Salto sobre banco"
  instructions:
    - "Empieza con un cajón o banco a 30-60 cm frente a ti. Colócate con los pies a la anchura de los hombros. Esta es la posición inicial."
    - "Realiza una sentadilla corta como preparación para el salto; lleva los brazos hacia atrás."
    - "Rebota desde esta posición, extendiendo caderas, rodillas y tobillos para saltar tan alto como puedas. Lleva los brazos hacia delante y hacia arriba."
    - "Salta por encima del banco, aterrizando con las rodillas flexionadas, absorbiendo el impacto con las piernas."
    - "Date la vuelta y ponte mirando en la dirección contraria, y después salta de nuevo por encima del banco."
Bench_Press_-_Powerlifting:
  name: "Press de banca (powerlifting)"
  instructions:
    - "Empieza tumbándote en el banco, colocando la cabeza más allá de la barra si es posible. Mete los pies por debajo de ti y arquea la espalda. Usando la barra para ayudar a sostener tu peso, despega los hombros del banco y retráelos, juntando los omóplatos. Usa los pies para clavar los trapecios en el banco. Mantén esta posición tensa del cuerpo durante todo el movimiento."
    - "Sea cual sea la anchura de tu agarre, debe cubrir el anillo de la barra. Saca la barra del rack sin protraer los hombros. Concéntrate en apretar la barra e intentar separarla en dos."
    - "Baja la barra hasta la parte baja del pecho o la parte alta del estómago. La barra, la muñeca y el codo deben permanecer alineados en todo momento."
    - "Haz una pausa cuando la barra toque el torso y después empuja la barra hacia arriba con la mayor fuerza posible. Los codos deben mantenerse pegados hasta el bloqueo."
Bench_Press_-_With_Bands:
  name: "Press de banca con gomas elásticas"
  instructions:
    - "Usando un banco plano, fija una goma elástica bajo la pata del banco más cercana a la cabeza."
    - "Una vez fijada la goma, agárrala por ambas asas y túmbate en el banco."
    - "Extiende los brazos de modo que sujetes las asas de la goma frente a ti a la anchura de los hombros."
    - "Una vez a la anchura de los hombros, rota las muñecas hacia delante para que las palmas de las manos miren en dirección contraria a ti. Esta es la posición inicial."
    - "Baja las asas lentamente hasta que el codo forme un ángulo de 90 grados. Mantén el control total en todo momento."
    - "Mientras espiras, sube las asas usando los músculos pectorales. Bloquea los brazos en la posición contraída, aprieta el pecho, mantén un segundo y empieza a bajar lentamente. Consejo: bajar debe llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito en tu programa de entrenamiento."
Bench_Sprint:
  name: "Sprint en banco"
  instructions:
    - "De pie en el suelo con un pie apoyado en un banco o cajón con el talón cerca del borde."
    - "Empuja con el pie que está sobre el banco, extendiendo la cadera y la rodilla."
    - "Aterriza con el pie contrario sobre el cajón, devolviendo el otro pie a la posición inicial."
    - "Continúa alternando de un pie a otro para completar la serie."
Bent-Arm_Barbell_Pullover:
  name: "Pullover con barra y brazos flexionados"
  instructions:
    - "Túmbate en un banco plano con una barra con un agarre a la anchura de los hombros."
    - "Sujeta la barra recta sobre el pecho con los brazos flexionados. Esta es la posición inicial."
    - "Manteniendo los brazos en posición flexionada, baja el peso lentamente describiendo un arco por detrás de la cabeza mientras inspiras hasta notar un estiramiento en el pecho."
    - "En ese punto, lleva la barra de vuelta a la posición inicial siguiendo el arco por el que bajó el peso y espira mientras realizas este movimiento."
    - "Mantén el peso en la posición inicial durante un segundo y repite el movimiento el número de repeticiones prescrito."
Bent-Arm_Dumbbell_Pullover:
  name: "Pullover con mancuerna y brazos flexionados"
  instructions:
    - "Coloca una mancuerna de pie sobre un banco plano."
    - "Asegurándote de que la mancuerna permanece bien colocada en la parte superior del banco, túmbate perpendicular al banco (con el torso atravesado formando una cruz) con solo los hombros apoyados en la superficie. Las caderas deben quedar por debajo del banco y las piernas flexionadas con los pies firmemente en el suelo. La cabeza también quedará fuera del banco."
    - "Agarra la mancuerna con ambas manos y sujétala recta sobre el pecho con los brazos flexionados. Ambas palmas deben presionar contra la parte inferior de uno de los lados de la mancuerna. Esta es la posición inicial. Precaución: asegúrate siempre de que la mancuerna utilizada para este ejercicio esté bien sujeta. Usar una mancuerna con discos sueltos puede hacer que se desmonte y caiga sobre tu cara."
    - "Manteniendo los brazos bloqueados en posición flexionada, baja el peso lentamente describiendo un arco por detrás de la cabeza mientras inspiras hasta notar un estiramiento en el pecho."
    - "En ese punto, lleva la mancuerna de vuelta a la posición inicial siguiendo el arco por el que bajó el peso y espira mientras realizas este movimiento."
    - "Mantén el peso en la posición inicial durante un segundo y repite el movimiento el número de repeticiones prescrito."
Bent-Knee_Hip_Raise:
  name: "Elevación de cadera con rodillas flexionadas"
  instructions:
    - "Túmbate boca arriba en el suelo con los brazos junto a los costados."
    - "Ahora flexiona las rodillas en un ángulo de unos 75 grados y levanta los pies del suelo unos 5 cm."
    - "Usando la parte baja de los abdominales, lleva las rodillas hacia ti mientras mantienes la flexión de 75 grados en las piernas. Continúa este movimiento hasta elevar las caderas del suelo haciendo rodar la pelvis hacia atrás. Espira mientras realizas esta parte del movimiento. Consejo: al final del movimiento las rodillas quedarán sobre el pecho."
    - "Aprieta los abdominales en la parte alta del movimiento durante un segundo y después vuelve lentamente a la posición inicial mientras inspiras. Consejo: mantén un movimiento controlado en todo momento."
    - "Repite el número de repeticiones indicado."
Bent_Over_Barbell_Row:
  name: "Remo inclinado con barra"
  instructions:
    - "Sujetando una barra con agarre prono (palmas hacia abajo), flexiona ligeramente las rodillas y lleva el torso hacia delante, flexionando por la cintura, manteniendo la espalda recta hasta que esté casi paralela al suelo. Consejo: asegúrate de mantener la cabeza alta. La barra debe colgar directamente frente a ti mientras los brazos cuelgan perpendiculares al suelo y al torso. Esta es la posición inicial."
    - "Ahora, manteniendo el torso inmóvil, espira y levanta la barra hacia ti. Mantén los codos pegados al cuerpo y usa solo los antebrazos para sujetar el peso. En la posición contraída arriba, aprieta los músculos de la espalda y mantén una breve pausa."
    - "Después inspira y baja lentamente la barra de vuelta a la posición inicial."
    - "Repite el número de repeticiones indicado."
Bent_Over_Dumbbell_Rear_Delt_Raise_With_Head_On_Bench:
  name: "Elevación de deltoides posterior inclinado con mancuernas y cabeza apoyada en banco"
  instructions:
    - "De pie y erguido, sujeta una mancuerna en cada mano con un banco inclinado frente a ti."
    - "Manteniendo la espalda recta y conservando el arco natural de la espalda, inclínate hacia delante hasta que la frente toque el banco que tienes delante. Deja que los brazos cuelguen frente a ti perpendiculares al suelo. Las palmas de las manos deben mirarse entre sí y el torso debe estar paralelo al suelo. Esta es la posición inicial."
    - "Manteniendo el torso adelantado e inmóvil, y los brazos rectos con una ligera flexión en los codos, levanta las mancuernas rectas hacia los lados hasta que ambos brazos estén paralelos al suelo. Espira mientras levantas las pesas. Precaución: evita balancear el torso o llevar los brazos hacia atrás en lugar de hacia el lado."
    - "Tras una contracción de un segundo arriba, baja lentamente las mancuernas de vuelta a la posición inicial."
    - "Repite el número de repeticiones recomendado."
Bent_Over_Low-Pulley_Side_Lateral:
  name: "Elevación lateral inclinado en polea baja"
  instructions:
    - "Selecciona un peso y sujeta el asa de la polea baja con la mano derecha."
    - "Inclínate por la cintura hasta que el torso esté casi paralelo al suelo. Las piernas deben estar ligeramente flexionadas con la mano izquierda apoyada en la parte baja del muslo izquierdo. El brazo derecho debe colgar desde el hombro frente a ti con una ligera flexión en el codo. Esta es la posición inicial."
    - "Eleva el brazo derecho, con el codo ligeramente flexionado, hacia el lado hasta que el brazo esté paralelo al suelo y alineado con la oreja derecha. Espira mientras realizas este paso."
    - "Baja lentamente el peso de vuelta a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones recomendado y repite el movimiento con el otro brazo."
Bent_Over_One-Arm_Long_Bar_Row:
  name: "Remo inclinado a un brazo con barra larga"
  instructions:
    - "Pon peso en uno de los extremos de una barra olímpica. Asegúrate de colocar el otro extremo de la barra en la esquina de dos paredes o de poner un objeto pesado en el suelo para que la barra no pueda deslizarse hacia atrás."
    - "Inclínate hacia delante hasta que el torso esté lo más paralelo posible al suelo y mantén las rodillas ligeramente flexionadas."
    - "Ahora agarra la barra con un brazo justo detrás de los discos, en el lado donde se colocó el peso, y apoya la otra mano en la rodilla. Esta es la posición inicial."
    - "Tira de la barra recta hacia arriba con el codo pegado (para maximizar el estímulo de la espalda) hasta que los discos toquen la parte baja del pecho. Aprieta los músculos de la espalda mientras subes el peso y mantén un segundo en la parte alta del movimiento. Espira mientras subes el peso. Consejo: no permitas ningún balanceo del torso. Solo debe moverse el brazo."
    - "Baja lentamente la barra a la posición inicial notando un buen estiramiento en los dorsales. Consejo: no dejes que los discos toquen el suelo. Para asegurar el mejor recorrido, recomiendo usar discos pequeños (los de 10 kg) en lugar de discos más grandes (como los de 15-20 kg)."
    - "Repite el número de repeticiones recomendado y cambia de brazo."
Bent_Over_Two-Arm_Long_Bar_Row:
  name: "Remo inclinado a dos brazos con barra larga"
  instructions:
    - "Pon peso en uno de los extremos de una barra olímpica. Asegúrate de colocar el otro extremo de la barra en la esquina de dos paredes o de poner un objeto pesado en el suelo para que la barra no pueda deslizarse hacia atrás."
    - "Inclínate hacia delante hasta que el torso esté lo más paralelo posible al suelo y mantén las rodillas ligeramente flexionadas."
    - "Ahora agarra la barra con ambos brazos justo detrás de los discos, en el lado donde se colocó el peso, y apoya la otra mano en la rodilla. Esta es la posición inicial."
    - "Tira de la barra recta hacia arriba con los codos pegados (para maximizar el estímulo de la espalda) hasta que los discos toquen la parte baja del pecho. Aprieta los músculos de la espalda mientras subes el peso y mantén un segundo en la parte alta del movimiento. Espira mientras subes el peso. Consejo: usa un estribo o un accesorio de polea de doble asa enganchándolo bajo el extremo de la barra."
    - "Baja lentamente la barra a la posición inicial notando un buen estiramiento en los dorsales. Consejo: no dejes que los discos toquen el suelo. Para asegurar el mejor recorrido, recomiendo usar discos pequeños (los de 10 kg) en lugar de discos más grandes (como los de 15-20 kg)."
    - "Repite el número de repeticiones indicado."
Bent_Over_Two-Dumbbell_Row:
  name: "Remo inclinado con dos mancuernas"
  instructions:
    - "Con una mancuerna en cada mano (palmas hacia el torso), flexiona ligeramente las rodillas y lleva el torso hacia delante flexionando por la cintura; mientras te inclinas, asegúrate de mantener la espalda recta hasta que esté casi paralela al suelo. Consejo: asegúrate de mantener la cabeza alta. Las pesas deben colgar directamente frente a ti mientras los brazos cuelgan perpendiculares al suelo y al torso. Esta es la posición inicial."
    - "Manteniendo el torso inmóvil, levanta las mancuernas hacia el costado (mientras espiras), manteniendo los codos pegados al cuerpo (no ejerzas ninguna fuerza con el antebrazo aparte de sujetar las pesas). En la posición contraída arriba, aprieta los músculos de la espalda y mantén un segundo."
    - "Baja lentamente el peso de nuevo a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Bent_Over_Two-Dumbbell_Row_With_Palms_In:
  name: "Remo inclinado con dos mancuernas (agarre neutro)"
  instructions:
    - "Con una mancuerna en cada mano (palmas mirándose entre sí), flexiona ligeramente las rodillas y lleva el torso hacia delante, flexionando por la cintura, manteniendo la espalda recta hasta que esté casi paralela al suelo. Consejo: asegúrate de mantener la cabeza alta. Las pesas deben colgar directamente frente a ti mientras los brazos cuelgan perpendiculares al suelo y al torso. Esta es la posición inicial."
    - "Manteniendo el torso inmóvil, levanta las mancuernas hacia el costado mientras espiras, juntando los omóplatos. En la posición contraída arriba, aprieta los músculos de la espalda y mantén un segundo."
    - "Baja lentamente el peso de nuevo a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Bent_Press:
  name: "Bent press con kettlebell"
  instructions:
    - "Haz una cargada con una kettlebell hasta el hombro. Lleva la kettlebell al hombro extendiendo las piernas y las caderas mientras elevas la kettlebell hacia el hombro. La muñeca debe rotar mientras lo haces. Esta es la posición inicial."
    - "Empieza inclinándote hacia el lado opuesto a la kettlebell, hasta que puedas tocar el suelo con la mano libre, manteniendo la mirada en la kettlebell. Mientras lo haces, empuja el peso en vertical extendiendo el codo, manteniendo el brazo perpendicular al suelo."
    - "Vuelve a una posición erguida, con la kettlebell sobre la cabeza. Devuelve la kettlebell al hombro y repite el número de repeticiones deseado."
Bicycling:
  name: "Ciclismo"
  instructions:
    - "Para empezar, siéntate en la bicicleta y ajusta el sillín a tu altura."
Bicycling_Stationary:
  name: "Bicicleta estática"
  instructions:
    - "Para empezar, siéntate en la bicicleta y ajusta el sillín a tu altura."
    - "Selecciona la opción deseada en el menú. Puede que tengas que empezar a pedalear para encenderla. Puedes usar el ajuste manual o seleccionar un programa. Normalmente puedes introducir tu edad y peso para estimar las calorías quemadas durante el ejercicio. El nivel de resistencia se puede cambiar durante el entrenamiento. Las asas se pueden usar para controlar la frecuencia cardiaca y ayudarte a mantener una intensidad adecuada."
Board_Press:
  name: "Press con tablas"
  instructions:
    - "Empieza tumbándote en el banco, colocando la cabeza más allá de la barra si es posible. De una a cinco tablas, hechas de listones de 2x6, pueden atornillarse juntas y ser sujetadas por un compañero de entrenamiento, por gomas elásticas o simplemente metidas bajo la camiseta."
    - "Mete los pies por debajo de ti y arquea la espalda. Usando la barra para ayudar a sostener tu peso, despega los hombros del banco y retráelos, juntando los omóplatos. Usa los pies para clavar los trapecios en el banco. Mantén esta posición tensa del cuerpo durante todo el movimiento."
    - "Puedes usar un agarre estándar de banca, o a la anchura de los hombros para enfocarte en los tríceps. Saca la barra del rack sin protraer los hombros. La barra, la muñeca y el codo deben permanecer alineados en todo momento. Concéntrate en apretar la barra e intentar separarla en dos."
    - "Baja la barra hasta las tablas y después empuja la barra hacia arriba con la mayor fuerza posible. Los codos deben mantenerse pegados hasta el bloqueo."
Body-Up:
  name: "Body-up (elevación desde antebrazos)"
  instructions:
    - "Adopta una posición de plancha en el suelo. Debes apoyar el peso corporal sobre las puntas de los pies y los antebrazos, manteniendo el torso recto. Los antebrazos deben estar separados a la anchura de los hombros. Esta es la posición inicial."
    - "Presionando firmemente las palmas contra el suelo, extiende los codos para elevar el cuerpo del suelo. Mantén el torso rígido mientras realizas el movimiento."
    - "Baja lentamente los antebrazos de nuevo al suelo permitiendo que los codos se flexionen."
    - "Repite."
Body_Tricep_Press:
  name: "Press de tríceps con peso corporal"
  instructions:
    - "Coloca una barra en un rack a la altura del pecho."
    - "De pie, agarra la barra con un agarre a la anchura de los hombros y da un paso atrás de uno o dos metros, con los pies juntos y los brazos extendidos de modo que te apoyes en la barra. Esta es la posición inicial."
    - "Empieza flexionando el codo, bajando hacia la barra."
    - "Haz una pausa y después invierte el movimiento extendiendo los codos."
    - "Progresa desde el peso corporal añadiendo cadenas sobre los hombros."
Bodyweight_Flyes:
  name: "Aperturas con peso corporal"
  instructions:
    - "Coloca dos barras Z igualmente cargadas en el suelo, una junto a la otra. Asegúrate de que puedan rodar."
    - "Adopta una posición de flexión sobre las barras, apoyando el peso sobre las puntas de los pies y las manos con los brazos extendidos y el cuerpo recto."
    - "Coloca las manos sobre las barras. Esta es la posición inicial."
    - "Con un movimiento lento y controlado, aleja las manos de la línea media del cuerpo, haciendo rodar las barras separándolas. Inspira durante esta parte del movimiento."
    - "Tras separar las barras todo lo que puedas, vuelve a la posición inicial juntándolas de nuevo. Espira mientras realizas este movimiento."
Bodyweight_Mid_Row:
  name: "Remo con peso corporal (agarre medio)"
  instructions:
    - "Empieza agarrando un aparato de dominadas con un agarre medio a ancho con las palmas mirando en dirección contraria a ti. Desde una posición colgada, encoge las rodillas hacia el pecho, inclinándote hacia atrás y pasando las piernas por encima de tu lado del aparato de dominadas. Esta es la posición inicial."
    - "Empezando con los brazos rectos, flexiona los codos y retrae los omóplatos para elevar el cuerpo hasta que las piernas contacten con el aparato de dominadas."
    - "Tras una breve pausa, vuelve a la posición inicial."
Bodyweight_Squat:
  name: "Sentadilla con peso corporal"
  instructions:
    - "De pie con los pies a la anchura de los hombros. Puedes colocar las manos detrás de la cabeza. Esta es la posición inicial."
    - "Empieza el movimiento flexionando rodillas y caderas, llevando la cadera hacia atrás."
    - "Continúa hacia abajo hasta la profundidad completa si puedes e invierte rápidamente el movimiento hasta volver a la posición inicial. Mientras haces la sentadilla, mantén la cabeza y el pecho altos y empuja las rodillas hacia fuera."
Bodyweight_Walking_Lunge:
  name: "Zancada caminando con peso corporal"
  instructions:
    - "Empieza de pie con los pies a la anchura de los hombros y las manos en las caderas."
    - "Da un paso hacia delante con una pierna, flexionando las rodillas para bajar las caderas. Desciende hasta que la rodilla trasera casi toque el suelo. La postura debe permanecer erguida y la rodilla delantera debe quedar sobre el pie delantero."
    - "Empuja con el talón del pie adelantado y extiende ambas rodillas para volver a subir."
    - "Da un paso hacia delante con el pie trasero, repitiendo la zancada con la pierna contraria."
Bosu_Ball_Cable_Crunch_With_Side_Bends:
  name: "Encogimiento abdominal en polea sobre Bosu con flexiones laterales"
  instructions:
    - "Conecta un asa estándar a cada brazo de una máquina de poleas y colócalos en la posición más baja."
    - "Coge un Bosu y colócalo delante y en el centro de la máquina de poleas."
    - "Túmbate sobre el Bosu con la zona lumbar arqueada alrededor del balón. Los glúteos deben quedar cerca del suelo sin tocarlo."
    - "Con ambas manos, estira los brazos hacia atrás y agarra el asa de cada polea."
    - "Con los pies en una postura ancha, extiende los brazos rectos frente a ti y entre las rodillas. Las manos deben quedar a la altura de las rodillas."
    - "Mantén los brazos rectos y alineados con el ángulo ascendente del cable. Eleva el torso con un movimiento de encogimiento sin dejar caer ni flexionar los brazos."
    - "Mantén la posición rígida con los brazos. Baja lentamente a la posición inicial con la espalda arqueada alrededor del Bosu y los abdominales alargados."
    - "Repite la misma serie de movimientos hasta el fallo."
    - "Una vez llegues al fallo, mantén los abdominales tensos y eleva el torso hasta la posición de plancha de modo que la espalda quede elevada del Bosu."
    - "Baja los brazos a los costados; mantenlos rectos. Empieza a hacer flexiones laterales alternas; ¡intenta llegar a los talones! Este movimiento final trabajará los oblicuos."
Bottoms-Up_Clean_From_The_Hang_Position:
  name: "Cargada con kettlebell invertida desde colgado"
  instructions:
    - "Inicia el ejercicio de pie, erguido, con una kettlebell en una mano."
    - "Lanza la kettlebell hacia atrás con fuerza y después invierte el movimiento con fuerza. Aprieta el asa de la kettlebell todo lo que puedas y sube la kettlebell hasta el hombro."
Bottoms_Up:
  name: "Bottoms up"
  instructions:
    - "Empieza tumbado boca arriba en el suelo, con las piernas estiradas y los brazos a los lados. Esta es la posición inicial."
    - "Para realizar el movimiento, lleva las rodillas hacia el pecho flexionando caderas y rodillas. Después, extiende las piernas hacia arriba hasta que queden perpendiculares al suelo. Rota y eleva la pelvis para despegar los glúteos del suelo."
    - "Tras una breve pausa, vuelve a la posición inicial."
Box_Jump_Multiple_Response:
  name: "Salto al cajón (respuesta múltiple)"
  instructions:
    - "Adopta una postura relajada frente al cajón o plataforma, a una distancia aproximada de un brazo. Los brazos deben estar a los lados y las piernas ligeramente flexionadas."
    - "Ayudándote de los brazos para el impulso inicial, salta hacia arriba y hacia delante, aterrizando con ambos pies a la vez sobre el cajón o la plataforma."
    - "Baja o salta inmediatamente de vuelta al punto de partida; después repite la secuencia."
Box_Skip:
  name: "Skip al cajón"
  instructions:
    - "Necesitarás varios cajones alineados con una separación de unos 2,4 m."
    - "Empieza de frente al primer cajón con una pierna ligeramente por detrás de la otra."
    - "Impúlsate con la pierna trasera intentando ganar toda la altura posible con las caderas."
    - "Nada más aterrizar en el cajón, lanza la otra pierna hacia delante y hacia arriba para ganar altura y distancia, saltando desde el cajón. Aterriza entre los dos primeros cajones con la misma pierna con la que aterrizaste en el primero."
    - "Después, pasa al siguiente cajón y repite."
Box_Squat:
  name: "Sentadilla al cajón"
  instructions:
    - "La sentadilla al cajón te permite bajar hasta la profundidad deseada y desarrollar fuerza explosiva en el movimiento de la sentadilla. Empieza en una jaula de potencia con un cajón a la altura adecuada detrás de ti. Normalmente se busca una altura de cajón que te lleve a una sentadilla paralela, pero puedes entrenar más alto o más bajo si lo deseas."
    - "Empieza metiéndote bajo la barra y colocándola sobre la parte posterior de los hombros. Junta las escápulas y rota los codos hacia delante, intentando doblar la barra sobre los hombros. Saca la barra del soporte, creando un arco firme en la zona lumbar, y da un paso atrás hasta colocarte. Separa más los pies para dar más énfasis a la espalda, los glúteos, los aductores y los isquiotibiales, o júntalos más para desarrollar más el cuádriceps. Mantén la cabeza mirando al frente."
    - "Con la espalda, los hombros y el core tensos, saca las rodillas y los glúteos hacia fuera y comienza el descenso. Siéntate hacia atrás con las caderas hasta quedar sentado en el cajón. Lo ideal es que las espinillas queden perpendiculares al suelo. Haz una pausa al llegar al cajón y relaja los flexores de la cadera. Nunca rebotes sobre el cajón."
    - "Manteniendo el peso en los talones y empujando los pies y las rodillas hacia fuera, impúlsate hacia arriba desde el cajón liderando el movimiento con la cabeza. Continúa subiendo manteniendo la tensión de la cabeza a los pies."
Box_Squat_with_Bands:
  name: "Sentadilla al cajón con gomas elásticas"
  instructions:
    - "Empieza en una jaula de potencia con un cajón a la altura adecuada detrás de ti. Coloca las gomas elásticas en los extremos de la barra, sujetas a los anclajes para gomas, a la jaula o a mancuernas, de modo que haya la tensión adecuada. Si usas mancuernas, asegúralas para que no se muevan. Asegúrate también de que las mancuernas pesen lo suficiente para las gomas que uses. Se pueden usar discos adicionales para sujetar las mancuernas. Si necesitas más tensión, puedes ampliar la base en el suelo o acortar las gomas. Normalmente se busca una altura de cajón que te lleve a una sentadilla paralela, pero puedes entrenar más alto o más bajo si lo deseas."
    - "Empieza metiéndote bajo la barra y colocándola sobre la parte posterior de los hombros. Junta las escápulas y rota los codos hacia delante, intentando doblar la barra sobre los hombros. Saca la barra del soporte, creando un arco firme en la zona lumbar, y da un paso atrás hasta colocarte. Separa más los pies para dar más énfasis a la espalda, los glúteos, los aductores y los isquiotibiales, o júntalos más para desarrollar más el cuádriceps. Mantén la cabeza mirando al frente."
    - "Con la espalda, los hombros y el core tensos, saca las rodillas y los glúteos hacia fuera y comienza el descenso. Siéntate hacia atrás con las caderas hasta quedar sentado en el cajón. Lo ideal es que las espinillas queden perpendiculares al suelo. Haz una pausa al llegar al cajón y relaja los flexores de la cadera. Nunca rebotes sobre el cajón."
    - "Manteniendo el peso en los talones y empujando los pies y las rodillas hacia fuera, impúlsate hacia arriba desde el cajón liderando el movimiento con la cabeza. Continúa subiendo manteniendo la tensión de la cabeza a los pies. Ten cuidado al devolver la barra al soporte."
Brachialis-SMR:
  name: "Liberación miofascial del braquial con foam roller"
  instructions:
    - "Túmbate de lado, con la parte superior del brazo apoyada sobre el foam roller. El brazo debe quedar más o menos alineado con el cuerpo, con la parte exterior del bíceps presionando contra el foam roller."
    - "Eleva las caderas del suelo, apoyando tu peso en el brazo y en los pies. Mantén la posición de 10 a 30 segundos y cambia de lado."
Bradford_Rocky_Presses:
  name: "Press Bradford/Rocky"
  instructions:
    - "Siéntate en un banco de press militar con una barra a la altura de los hombros y agarre prono (palmas hacia delante). Consejo: el agarre debe ser más ancho que los hombros y formar un ángulo de 90 grados entre el antebrazo y la parte superior del brazo cuando la barra baja. Esta es la posición inicial."
    - "Una vez que hayas cogido la barra con el agarre correcto, súbela por encima de la cabeza bloqueando los brazos."
    - "Ahora baja la barra lentamente hasta la parte posterior de la cabeza mientras inspiras."
    - "Sube la barra de nuevo hasta la posición inicial mientras espiras."
    - "Baja la barra lentamente hasta la posición inicial mientras inspiras. Esto es una repetición."
    - "Alterna de esta manera hasta completar el número de repeticiones indicado."
Butt-Ups:
  name: "Elevaciones de glúteos en plancha"
  instructions:
    - "Adopta una posición de flexión pero con los codos en el suelo, apoyado sobre los antebrazos. Los brazos deben estar flexionados en un ángulo de 90 grados."
    - "Arquea ligeramente la espalda hacia fuera en lugar de mantenerla completamente recta."
    - "Eleva los glúteos hacia el techo, apretando con fuerza los abdominales para acortar la distancia entre la caja torácica y las caderas. El resultado será una posición de puente alto. Espira mientras realizas esta parte del movimiento."
    - "Baja lentamente hasta la posición inicial mientras inspiras. Consejo: no dejes que la espalda se hunda hacia abajo."
    - "Repite el número de repeticiones indicado."
Butt_Lift_Bridge:
  name: "Elevación de glúteos (puente)"
  instructions:
    - "Túmbate boca arriba en el suelo con las manos a los lados y las rodillas flexionadas. Los pies deben estar separados aproximadamente a la anchura de los hombros. Esta es la posición inicial."
    - "Empujando principalmente con los talones, eleva las caderas del suelo manteniendo la espalda recta. Espira mientras realizas esta parte del movimiento y mantén arriba durante un segundo."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
Butterfly:
  name: "Apertura en máquina (mariposa)"
  instructions:
    - "Siéntate en la máquina con la espalda totalmente apoyada en el respaldo."
    - "Agarra las asas. Consejo: la parte superior de los brazos debe quedar paralela al suelo; ajusta la máquina en consecuencia. Esta es la posición inicial."
    - "Junta las asas lentamente mientras aprietas el pecho en el centro. Espira durante esta parte del movimiento y mantén la contracción durante un segundo."
    - "Vuelve a la posición inicial lentamente mientras inspiras, hasta que los músculos del pecho estén completamente estirados."
    - "Repite el número de repeticiones indicado."
Cable_Chest_Press:
  name: "Press de pecho en polea"
  instructions:
    - "Ajusta el peso a una cantidad adecuada y siéntate, agarrando las asas. La parte superior de los brazos debe formar unos 45 grados con el cuerpo, con la cabeza y el pecho erguidos. Los codos deben estar flexionados unos 90 grados. Esta es la posición inicial."
    - "Empieza extendiendo los codos, empujando las asas juntas hacia delante. Mantén las escápulas retraídas mientras ejecutas el movimiento."
    - "Tras una pausa en la extensión completa, vuelve a la posición inicial manteniendo la tensión en los cables."
    - "También puedes realizar este movimiento con la espalda separada del respaldo, en inclinación o declinación, o alternando las manos."
Cable_Crossover:
  name: "Cruce de poleas"
  instructions:
    - "Para colocarte en la posición inicial, sitúa las poleas en una posición alta (por encima de la cabeza), selecciona la resistencia que vayas a usar y sujeta las poleas, una en cada mano."
    - "Da un paso al frente, por delante de una línea recta imaginaria entre ambas poleas, mientras juntas los brazos delante de ti. El torso debe tener una pequeña inclinación hacia delante desde la cintura. Esta es la posición inicial."
    - "Con una ligera flexión de codos para evitar tensión en el tendón del bíceps, extiende los brazos hacia los lados (totalmente abiertos a ambos lados) en un arco amplio hasta que notes un estiramiento en el pecho. Inspira mientras realizas esta parte del movimiento. Consejo: ten en cuenta que durante todo el movimiento los brazos y el torso deben permanecer fijos; el movimiento solo debe producirse en la articulación del hombro."
    - "Vuelve con los brazos a la posición inicial mientras espiras. Asegúrate de usar el mismo arco de movimiento que usaste para bajar los pesos."
    - "Mantén un segundo en la posición inicial y repite el movimiento el número de repeticiones prescrito."
Cable_Crunch:
  name: "Encogimiento abdominal en polea"
  instructions:
    - "Arrodíllate bajo una polea alta que tenga un agarre de cuerda."
    - "Agarra la cuerda y baja las manos hasta situarlas junto a la cara."
    - "Flexiona ligeramente las caderas y deja que el peso hiperextienda la zona lumbar. Esta es la posición inicial."
    - "Con las caderas fijas, flexiona la cintura mientras contraes el abdomen de modo que los codos se dirijan hacia el centro de los muslos. Espira mientras realizas esta parte del movimiento y mantén la contracción durante un segundo."
    - "Vuelve lentamente a la posición inicial mientras inspiras. Consejo: asegúrate de mantener tensión constante en el abdomen durante todo el movimiento. Además, no elijas un peso tan alto que la zona lumbar asuma la mayor parte del trabajo."
    - "Repite el número de repeticiones indicado."
Cable_Deadlifts:
  name: "Peso muerto en polea"
  instructions:
    - "Lleva las poleas a la parte inferior de las torres y selecciona un peso adecuado. Colócate justo en medio de los montantes."
    - "Para empezar, baja en sentadilla flexionando caderas y rodillas hasta alcanzar las asas."
    - "Tras agarrarlas, comienza el ascenso. Empujando con los talones, extiende caderas y rodillas manteniendo las manos colgando a los lados. Mantén la cabeza y el pecho erguidos durante todo el movimiento."
    - "Tras llegar a la posición de pie completa, vuelve a la posición inicial y repite."
Cable_Hammer_Curls_-_Rope_Attachment:
  name: "Curl martillo en polea con cuerda"
  instructions:
    - "Coloca una cuerda en una polea baja y ponte de pie frente a la máquina, a unos 30 cm de ella."
    - "Agarra la cuerda con agarre neutro (palmas hacia dentro) y ponte erguido manteniendo la curvatura natural de la espalda y el torso fijo."
    - "Pega los codos a los costados y mantenlos fijos durante todo el movimiento. Consejo: solo deben moverse los antebrazos; no la parte superior de los brazos. Esta es la posición inicial."
    - "Usando los bíceps, sube los brazos mientras espiras hasta que los bíceps toquen los antebrazos. Consejo: recuerda mantener los codos pegados y la parte superior de los brazos fija."
    - "Tras una contracción de 1 segundo en la que aprietas los bíceps, empieza a llevar lentamente el peso de vuelta a la posición original."
    - "Repite el número de repeticiones indicado."
Cable_Hip_Adduction:
  name: "Aducción de cadera en polea"
  instructions:
    - "Colócate de pie frente a una polea baja, mirando al frente, con una pierna junto a la polea y la otra alejada."
    - "Engancha la tobillera a la polea y sujétala al tobillo de la pierna que está junto a ella."
    - "Ahora da un paso hacia fuera y alejándote de la torre de pesas con las piernas abiertas y agarra la barra del sistema de poleas."
    - "Apóyate en el pie que no lleva la tobillera (el pie lejano) y deja que la pierna con la tobillera sea atraída hacia la polea baja. Esta es la posición inicial."
    - "Ahora realiza el movimiento llevando la pierna con la tobillera por delante de la pierna lejana, usando la parte interna de los muslos para aducir la cadera. Espira durante esta parte del movimiento."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado y luego repite el mismo movimiento con la pierna contraria."
Cable_Incline_Pushdown:
  name: "Extensión en polea en banco inclinado"
  instructions:
    - "Túmbate en un banco inclinado de espaldas a una polea alta que tenga una barra recta."
    - "Agarra la barra recta por encima de la cabeza con agarre prono (palmas hacia abajo) a la anchura de los hombros y extiende los brazos delante de ti. La barra debe quedar a unos 5 cm de la parte superior de los muslos. Esta es la posición inicial."
    - "Manteniendo fija la parte superior de los brazos, lleva los brazos hacia atrás en un semicírculo hasta que la barra quede justo sobre la cabeza. Inspira durante esta parte del movimiento."
    - "Vuelve lentamente a la posición inicial usando los dorsales y mantén la contracción al llegar a la posición inicial. Espira durante la ejecución de este movimiento."
    - "Repite el número de repeticiones indicado."
Cable_Incline_Triceps_Extension:
  name: "Extensión de tríceps en polea en banco inclinado"
  instructions:
    - "Túmbate en un banco inclinado de espaldas a una polea alta que tenga una barra recta."
    - "Agarra la barra recta por encima de la cabeza con agarre prono (palmas hacia abajo) estrecho (menos que la anchura de los hombros) y mantén los codos pegados a los costados. La parte superior de los brazos debe formar un ángulo de unos 25 grados medido desde el suelo."
    - "Manteniendo fija la parte superior de los brazos, extiende los brazos mientras contraes los tríceps. Espira durante esta parte del movimiento y mantén la contracción durante un segundo."
    - "Vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Cable_Internal_Rotation:
  name: "Rotación interna en polea"
  instructions:
    - "Siéntate de lado junto a una polea baja (con las piernas estiradas delante de ti o cruzadas) y agarra el asa con la mano más cercana a la polea. Consejo: si puedes ajustar la altura de la polea, puedes sentarte en un banco plano."
    - "Coloca el codo contra el costado con el codo flexionado a 90° y el brazo apuntando hacia la polea. Esta es la posición inicial."
    - "Tira del agarre hacia tu cuerpo rotando internamente el hombro hasta que el antebrazo quede cruzado sobre el abdomen. Estarás dibujando un semicírculo imaginario. Consejo: el antebrazo debe permanecer perpendicular al torso en todo momento."
    - "Vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado y luego repite el movimiento con el otro brazo."
Cable_Iron_Cross:
  name: "Cruz de hierro en polea"
  instructions:
    - "Empieza llevando las poleas a la posición alta, selecciona la resistencia que vayas a usar y coge un asa en cada mano."
    - "Colócate justo entre ambas poleas con los brazos extendidos hacia los lados. La cabeza y el pecho deben estar erguidos mientras los brazos forman una \"T\". Esta es la posición inicial."
    - "Manteniendo los codos extendidos, tira de los brazos rectos hacia los lados."
    - "Vuelve con los brazos a la posición inicial tras una pausa en el pico de la contracción."
    - "Continúa el movimiento durante el número de repeticiones prescrito."
Cable_Judo_Flip:
  name: "Volteo de judo en polea"
  instructions:
    - "Conecta una cuerda a una torre y lleva la polea a la posición más baja. Colócate de lado a la polea con las piernas abiertas y agarra la cuerda con ambas manos."
    - "Gira el cuerpo alejándote de la polea mientras pasas la cuerda por encima del hombro como si estuvieras haciendo un volteo de judo."
    - "Desplaza tu peso entre los pies mientras giras y te encoges hacia delante, tirando de la polea hacia abajo."
    - "Vuelve a la posición inicial y repite hasta el fallo."
    - "Después, cámbiate de posición y repite la misma serie de movimientos en el lado contrario."
Cable_Lying_Triceps_Extension:
  name: "Extensión de tríceps tumbado en polea"
  instructions:
    - "Túmbate en un banco plano y agarra la barra recta de una polea baja con agarre prono estrecho. Consejo: la forma más fácil es que alguien te pase la barra mientras te tumbas."
    - "Con los brazos extendidos, coloca la barra sobre el torso. Los brazos y el torso deben formar un ángulo de 90 grados. Esta es la posición inicial."
    - "Baja la barra flexionando los codos mientras mantienes fija la parte superior de los brazos y los codos pegados. Baja hasta que la barra toque suavemente la frente. Inspira mientras realizas esta parte del movimiento."
    - "Contrae los tríceps mientras subes la barra de vuelta a la posición inicial. Espira mientras realizas esta parte del movimiento."
    - "Mantén un segundo en la posición de contracción y repite el número de repeticiones indicado."
Cable_One_Arm_Tricep_Extension:
  name: "Extensión de tríceps a un brazo en polea"
  instructions:
    - "Con la mano derecha, agarra un asa individual unida a la polea alta con agarre supino (palmas hacia arriba). Debes estar de pie justo frente a la torre de pesas."
    - "Ahora baja el asa de modo que la parte superior del brazo y el codo queden fijos contra el costado del cuerpo. La parte superior del brazo y el antebrazo deben formar un ángulo agudo (menos de 90 grados). Puedes mantener el otro brazo a la cintura y colocar una pierna delante y la otra atrás para tener mejor equilibrio. Esta es la posición inicial."
    - "Mientras contraes el tríceps, baja el asa hacia tu costado hasta que el brazo quede recto. Espira mientras realizas este movimiento. Consejo: solo deben moverse los antebrazos. La parte superior de los brazos debe permanecer fija en todo momento."
    - "Aprieta el tríceps y mantén un segundo en esta posición de contracción."
    - "Vuelve lentamente con el asa a la posición inicial."
    - "Repite el número de repeticiones indicado y luego realiza el mismo movimiento con el otro brazo."
Cable_Preacher_Curl:
  name: "Curl predicador en polea"
  instructions:
    - "Coloca un banco predicador a unos 60 cm delante de una polea."
    - "Coloca una barra recta en la polea baja."
    - "Siéntate en el banco predicador con el codo y la parte superior de los brazos firmemente apoyados en el cojín del banco y pide a alguien que te pase la barra de la polea baja."
    - "Agarra la barra y extiende completamente los brazos sobre el cojín del banco predicador. Esta es la posición inicial."
    - "Ahora empieza a subir el peso hacia los hombros y aprieta con fuerza los bíceps en la parte alta del movimiento. Espira mientras realizas este movimiento. Mantén también un segundo arriba."
    - "Ahora baja lentamente el peso hasta la posición inicial."
    - "Repite el número de repeticiones indicado."
Cable_Rear_Delt_Fly:
  name: "Pájaro en polea"
  instructions:
    - "Ajusta las poleas a la altura adecuada y ajusta el peso. Las poleas deben estar por encima de tu cabeza."
    - "Agarra la polea izquierda con la mano derecha y la polea derecha con la mano izquierda, cruzándolas delante de ti. Esta es la posición inicial."
    - "Inicia el movimiento llevando los brazos hacia atrás y hacia fuera, manteniendo los brazos rectos mientras ejecutas el movimiento."
    - "Haz una pausa al final del recorrido antes de devolver las asas a la posición inicial."
Cable_Reverse_Crunch:
  name: "Encogimiento abdominal inverso en polea"
  instructions:
    - "Conecta una tobillera a una polea baja y coloca una esterilla en el suelo frente a ella."
    - "Siéntate con los pies hacia la polea y sujeta el cable a los tobillos."
    - "Túmbate, eleva las piernas y flexiona las rodillas en un ángulo de 90 grados. Las piernas y el cable deben estar alineados. Si no es así, ajusta la polea hacia arriba o hacia abajo hasta que lo estén."
    - "Con las manos detrás de la cabeza, lleva las rodillas hacia el torso y eleva las caderas del suelo."
    - "Haz una pausa un instante y, de forma lenta y controlada, baja las caderas y devuelve las piernas al ángulo inicial de 90 grados. Debes seguir teniendo tensión en el abdomen en la posición de reposo."
    - "Repite el mismo movimiento hasta el fallo."
Cable_Rope_Overhead_Triceps_Extension:
  name: "Extensión de tríceps sobre la cabeza en polea con cuerda"
  instructions:
    - "Coloca una cuerda en la polea inferior de la máquina de poleas."
    - "Agarrando la cuerda con ambas manos, extiende los brazos con las manos justo por encima de la cabeza usando agarre neutro (palmas enfrentadas). Los codos deben estar cerca de la cabeza y los brazos perpendiculares al suelo con los nudillos apuntando al techo. Esta es la posición inicial."
    - "Baja lentamente la cuerda por detrás de la cabeza mientras mantienes fija la parte superior de los brazos. Inspira mientras realizas este movimiento y haz una pausa cuando los tríceps estén completamente estirados."
    - "Vuelve a la posición inicial contrayendo los tríceps mientras espiras."
    - "Repite el número de repeticiones indicado."
Cable_Rope_Rear-Delt_Rows:
  name: "Remo para deltoides posterior en polea con cuerda"
  instructions:
    - "Siéntate en la misma posición en una estación de remo con polea baja que usarías para hacer remo sentado en polea para la espalda."
    - "Coloca una cuerda en la polea y agárrala con agarre prono. Los brazos deben estar extendidos y paralelos al suelo con los codos abiertos hacia fuera."
    - "Mantén la zona lumbar erguida y desliza las caderas hacia atrás de modo que las rodillas queden ligeramente flexionadas. Esta es la posición inicial."
    - "Tira del agarre de la polea hacia la parte superior del pecho, justo debajo del cuello, mientras mantienes los codos arriba y hacia los lados. Continúa este movimiento mientras espiras hasta que los codos pasen ligeramente por detrás de la espalda. Consejo: mantén la parte superior de los brazos horizontal, perpendicular al torso y paralela al suelo durante todo el movimiento."
    - "Vuelve a la posición inicial, con los brazos extendidos y los hombros estirados hacia delante. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Cable_Russian_Twists:
  name: "Giros rusos en polea"
  instructions:
    - "Conecta un asa estándar y coloca la polea en una posición media."
    - "Túmbate sobre un fitball perpendicular a la polea y agarra el asa con una mano. Debes estar aproximadamente a un brazo de distancia de la polea, con la tensión del peso sobre el cable."
    - "Agarra el asa con ambas manos y extiende completamente los brazos sobre el pecho. Las manos deben estar justo alineadas con la polea. Si no es así, ajusta la polea hacia arriba o hacia abajo hasta que lo estén."
    - "Mantén las caderas elevadas y el abdomen activado. Rota el torso alejándote de la polea un cuarto de vuelta completo. El cuerpo debe quedar plano desde la cabeza hasta las rodillas."
    - "Haz una pausa un instante y, de forma lenta y controlada, vuelve a la posición inicial. Debes seguir teniendo tensión lateral en el cable en la posición de reposo."
    - "Repite el mismo movimiento hasta el fallo."
    - "Después, cámbiate de posición y repite la misma serie de movimientos en el lado contrario."
Cable_Seated_Crunch:
  name: "Encogimiento abdominal sentado en polea"
  instructions:
    - "Siéntate en un banco plano de espaldas a una polea alta."
    - "Agarra la cuerda con ambas manos (con las palmas de las manos enfrentadas) y coloca las manos firmemente sobre ambos hombros. Consejo: deja que el peso hiperextienda ligeramente la zona lumbar. Esta es la posición inicial."
    - "Con las caderas fijas, flexiona la cintura de modo que los codos se dirijan hacia las caderas. Espira mientras realizas este paso."
    - "Mientras inspiras, vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Cable_Seated_Lateral_Raise:
  name: "Elevación lateral sentado en polea"
  instructions:
    - "Colócate de pie en medio de dos poleas bajas opuestas entre sí y coloca un banco plano justo detrás de ti (de forma perpendicular a ti; el lado estrecho del banco debe ser el que quede detrás de ti). Selecciona el peso que vayas a usar en cada polea."
    - "Ahora siéntate en el borde del banco plano que tienes detrás con los pies colocados delante de las rodillas."
    - "Inclínate hacia delante manteniendo la espalda plana y apoya el torso sobre los muslos."
    - "Pide a alguien que te dé las asas individuales unidas a las poleas. Agarra la polea izquierda con la mano derecha y la polea derecha con la mano izquierda tras seleccionar el peso. Las poleas deben pasar bajo las rodillas y los brazos estarán extendidos con las palmas enfrentadas y una ligera flexión en los codos. Esta es la posición inicial."
    - "Manteniendo los brazos fijos, eleva la parte superior de los brazos hacia los lados hasta que queden paralelos al suelo y a la altura de los hombros. Espira durante la ejecución de este movimiento y mantén la contracción durante un segundo."
    - "Baja lentamente los brazos hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado. Consejo: mantén la parte superior de los brazos perpendicular al torso y una posición fija de los codos (ángulo de 10 a 30 grados) durante todo el ejercicio."
Cable_Shoulder_Press:
  name: "Press de hombros en polea"
  instructions:
    - "Lleva las poleas a la parte inferior de las torres y selecciona un peso adecuado."
    - "Colócate de pie justo en medio de los montantes. Agarra las asas de las poleas y sostenlas a la altura de los hombros, con las palmas hacia delante. Esta es la posición inicial."
    - "Manteniendo la cabeza y el pecho erguidos, extiende los codos para empujar las asas justo por encima de la cabeza."
    - "Tras una pausa arriba, vuelve a la posición inicial y repite."
Cable_Shrugs:
  name: "Encogimientos de hombros en polea"
  instructions:
    - "Agarra una barra de polea unida a una polea baja con agarre prono (palmas hacia abajo) a la anchura de los hombros o ligeramente más ancho."
    - "Ponte erguido cerca de la polea con los brazos extendidos delante de ti sujetando la barra. Esta es la posición inicial."
    - "Sube la barra elevando los hombros tanto como puedas mientras espiras. Mantén la contracción arriba durante un segundo. Consejo: los brazos deben permanecer extendidos en todo momento. Evita usar los bíceps para ayudar a subir la barra. Solo deben moverse los hombros arriba y abajo."
    - "Baja la barra de vuelta a la posición original."
    - "Repite el número de repeticiones indicado."
Cable_Wrist_Curl:
  name: "Curl de muñeca en polea"
  instructions:
    - "Empieza colocando un banco plano frente a una polea baja que tenga una barra recta."
    - "Usa los brazos para agarrar la barra de la polea con agarre supino (palmas hacia arriba) de estrecho a la anchura de los hombros y súbelos de modo que los antebrazos descansen sobre la parte superior de los muslos. Las muñecas deben quedar colgando justo más allá de las rodillas."
    - "Empieza flexionando las muñecas hacia arriba y espirando. Mantén la contracción durante un segundo."
    - "Baja lentamente las muñecas hasta la posición inicial mientras inspiras."
    - "Los antebrazos deben permanecer fijos, ya que la muñeca es el único movimiento necesario para realizar este ejercicio."
    - "Repite el número de repeticiones indicado."
Calf-Machine_Shoulder_Shrug:
  name: "Encogimiento de hombros en máquina de gemelos"
  instructions:
    - "Colócate en la máquina de gemelos de modo que las hombreras queden sobre tus hombros. El torso debe estar recto con los brazos extendidos de forma natural a los lados. Esta es la posición inicial."
    - "Sube los hombros hacia las orejas mientras espiras y mantén la contracción durante un segundo completo."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Calf_Press:
  name: "Prensa de gemelos"
  instructions:
    - "Ajusta el asiento de modo que las piernas estén solo ligeramente flexionadas en la posición inicial. La parte delantera de los pies debe estar firmemente apoyada en la plataforma."
    - "Selecciona un peso adecuado y agarra las asas. Esta es la posición inicial."
    - "Estira las piernas extendiendo las rodillas, levantando apenas el peso de la pila. El tobillo debe estar completamente flexionado, con los dedos apuntando hacia arriba. Ejecuta el movimiento empujando hacia abajo con la parte delantera de los pies tanto como puedas."
    - "Tras una breve pausa, invierte el movimiento y repite."
Calf_Press_On_The_Leg_Press_Machine:
  name: "Prensa de gemelos en la prensa de piernas"
  instructions:
    - "Usando una máquina de prensa de piernas, siéntate en la máquina y coloca las piernas en la plataforma justo delante de ti con una separación de pies media (a la anchura de los hombros)."
    - "Baja las barras de seguridad que sujetan la plataforma con peso y empuja la plataforma hasta arriba del todo hasta que las piernas queden completamente extendidas delante de ti sin bloquear las rodillas. (Nota: en algunas prensas de piernas puedes dejar las barras de seguridad puestas para mayor seguridad. Si tu prensa de piernas lo permite, este es el método preferido para realizar el ejercicio.) El torso y las piernas deben formar un ángulo perfecto de 90 grados. Ahora coloca con cuidado los dedos y la parte delantera de los pies en la parte inferior de la plataforma con los talones fuera de ella. Los dedos deben apuntar hacia delante, hacia fuera o hacia dentro según se haya descrito al principio del capítulo. Esta es la posición inicial."
    - "Empuja la plataforma elevando los talones mientras espiras, extendiendo los tobillos tanto como puedas y contrayendo los gemelos. Asegúrate de que la rodilla permanezca fija en todo momento. No debe haber flexión en ningún momento. Mantén la posición de contracción durante un segundo antes de empezar a bajar."
    - "Vuelve lentamente a la posición inicial mientras inspiras, bajando los talones y flexionando los tobillos hasta que los gemelos queden estirados."
    - "Repite el número de repeticiones indicado."
Calf_Raise_On_A_Dumbbell:
  name: "Elevación de gemelos sobre una mancuerna"
  instructions:
    - "Agárrate a un objeto firme para mantener el equilibrio y colócate de pie sobre el mango de una mancuerna, preferiblemente una con discos redondos para que ruede, de modo que tengas que esforzarte más para estabilizarte, aumentando así la eficacia del ejercicio."
    - "Ahora desplaza el pie ligeramente hacia delante para lograr un buen estiramiento del gemelo. Esta es la posición inicial."
    - "Eleva el gemelo mientras haces rodar el pie sobre la parte superior del mango para lograr una extensión completa. Espira durante la ejecución de este movimiento. Contrae el gemelo con fuerza arriba y mantén un segundo. Consejo: al subir, haz rodar la mancuerna ligeramente hacia atrás."
    - "Ahora inspira mientras haces rodar la mancuerna ligeramente hacia delante al bajar para lograr un mejor estiramiento."
    - "Repite el número de repeticiones indicado."
Calf_Raises_-_With_Bands:
  name: "Elevación de gemelos con goma elástica"
  instructions:
    - "Coge una goma elástica y colócate sobre ella con la punta de los pies, asegurándote de que la longitud de la goma entre el pie y los brazos sea la misma en ambos lados."
    - "Sujetando las asas de la goma, eleva los brazos a los lados de la cabeza como si te prepararas para hacer un press de hombros. Las palmas deben mirar hacia delante con los codos flexionados y hacia los lados. Este movimiento creará tensión en la goma. Esta es la posición inicial."
    - "Manteniendo las manos junto a los hombros, ponte de puntillas mientras espiras y contrae los gemelos con fuerza en la parte alta del movimiento."
    - "Tras una contracción de un segundo, vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Calf_Stretch_Elbows_Against_Wall:
  name: "Estiramiento de gemelos con codos contra la pared"
  instructions:
    - "Colócate de pie frente a una pared, a unos 60 cm de distancia."
    - "Apóyate contra la pared, cargando tu peso sobre los antebrazos."
    - "Intenta mantener los talones en el suelo. Mantén la posición de 10 a 20 segundos. Puedes alejarte o acercarte a la pared para hacerlo más o menos difícil, respectivamente."
Calf_Stretch_Hands_Against_Wall:
  name: "Estiramiento de gemelos con manos contra la pared"
  instructions:
    - "Colócate de pie frente a una pared, a varios pies (más de un metro) de distancia. Escalona la postura, colocando un pie por delante."
    - "Inclínate hacia delante y apoya las manos en la pared, manteniendo el talón, la cadera y la cabeza en línea recta."
    - "Intenta mantener el talón en el suelo. Mantén la posición de 10 a 20 segundos y luego cambia de lado."
Calves-SMR:
  name: "Liberación miofascial de gemelos con foam roller"
  instructions:
    - "Empieza sentado en el suelo. Coloca un foam roller bajo la parte inferior de la pierna. La otra pierna puede cruzarse sobre la opuesta o apoyarse en el suelo, soportando parte de tu peso. Esta es la posición inicial."
    - "Coloca las manos a los lados o justo detrás de ti y empuja hacia abajo para elevar las caderas del suelo, cargando gran parte de tu peso contra el músculo del gemelo. Rueda desde debajo de la rodilla hasta encima del tobillo, haciendo pausas en los puntos de tensión durante 10 a 30 segundos. Repite con la otra pierna."
Car_Drivers:
  name: "Volante con disco"
  instructions:
    - "De pie y erguido, sujeta un disco de barra con ambas manos en las posiciones de las 3 y las 9 en punto. Las palmas deben estar enfrentadas y los brazos extendidos rectos delante de ti. Esta es la posición inicial."
    - "Inicia el movimiento rotando el disco hacia un lado tanto como puedas. Usa el mismo tipo de movimiento que usarías para girar un volante hacia un lado."
    - "Invierte el movimiento, girándolo por completo hacia el lado opuesto."
    - "Repite el número de repeticiones indicado."
Carioca_Quick_Step:
  name: "Paso rápido carioca"
  instructions:
    - "Empieza con los pies separados unos pocos centímetros y el brazo izquierdo arriba, en una posición atlética relajada."
    - "Con el pie derecho, da un paso rápido por detrás y sube la rodilla."
    - "Lanza los brazos de nuevo hacia arriba cuando subas la rodilla derecha, asegurándote de que la rodilla sube y baja en línea recta. Evita girar los pies mientras te mueves y sigue mirando al frente mientras te desplazas hacia el lado."
Cat_Stretch:
  name: "Estiramiento del gato"
  instructions:
    - "Colócate en el suelo a cuatro patas, apoyado sobre manos y rodillas."
    - "Mete el abdomen y redondea la columna, la zona lumbar, los hombros y el cuello, dejando caer la cabeza."
    - "Mantén 15 segundos."
Catch_and_Overhead_Throw:
  name: "Recepción y lanzamiento por encima de la cabeza"
  instructions:
    - "Empieza de pie frente a una pared o un compañero."
    - "Con ambas manos, coloca el balón detrás de la cabeza, estirándote tanto como puedas, y lanza el balón hacia delante con fuerza."
    - "Asegúrate de acompañar el lanzamiento, estando preparado para recibir el rebote. Si lanzas contra la pared, asegúrate de estar lo bastante cerca de la pared para recibir el rebote y apunta un poco más alto que si lo hicieras con un compañero."
Chain_Handle_Extension:
  name: "Extensión con cadenas y asas"
  instructions:
    - "Necesitarás dos asas de polea y un banco plano, además de cadenas, para este ejercicio. Engancha el centro de las cadenas a las asas y colócate en el banco plano. Los codos deben apuntar rectos hacia arriba."
    - "Empieza extendiendo los codos, manteniendo quieta la parte superior del brazo, con las muñecas en pronación."
    - "Haz una pausa en el bloqueo e invierte el movimiento para volver a la posición inicial."
Chain_Press:
  name: "Press con cadenas"
  instructions:
    - "Empieza conectando las cadenas a las asas de polea. Colócate en el banco plano en la misma posición que para un press con mancuernas. Las muñecas deben estar en pronación y los brazos perpendiculares al suelo. Esta es la posición inicial."
    - "Baja las cadenas flexionando los codos, descargando parte de la cadena en el suelo."
    - "Continúa hasta que el codo forme un ángulo de 90 grados y luego invierte el movimiento extendiendo los codos hasta el bloqueo."
Chair_Leg_Extended_Stretch:
  name: "Estiramiento de pierna extendida en silla"
  instructions:
    - "Siéntate erguido en una silla y agarra el asiento por los lados."
    - "Eleva una pierna, extendiendo la rodilla y flexionando el tobillo al hacerlo."
    - "Mueve lentamente esa pierna hacia fuera tanto como puedas y luego vuelve al centro y bájala."
    - "Repite con la otra pierna."
Chair_Lower_Back_Stretch:
  name: "Estiramiento lumbar en silla"
  instructions:
    - "Siéntate erguido en una silla."
    - "Inclínate hacia un lado con el brazo sobre la cabeza. Puedes agarrarte a la silla con la mano libre."
    - "Mantén 10 segundos y repite hacia el otro lado."
Chair_Squat:
  name: "Sentadilla en silla"
  instructions:
    - "Para empezar, coloca primero la barra en una posición que se ajuste mejor a tu altura. Una vez cargada la barra, métete bajo ella y colócala sobre la parte posterior de los hombros."
    - "Agarra la barra con las manos hacia delante, desbloquéala y sácala del soporte extendiendo las piernas."
    - "Adelanta los pies unos 45 cm por delante de la barra. Coloca las piernas a la anchura de los hombros con las puntas de los pies ligeramente hacia fuera. Mira al frente en todo momento y mantén la columna neutra o ligeramente arqueada. Esta es la posición inicial."
    - "Baja lentamente la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que el ángulo entre la parte superior e inferior de la pierna supere los 90 grados."
    - "Empieza a subir la barra mientras espiras empujando el suelo con los talones, extendiendo las rodillas y volviendo a la posición inicial."
    - "Repite el número de repeticiones indicado."
Chair_Upper_Body_Stretch:
  name: "Estiramiento de tren superior en silla"
  instructions:
    - "Siéntate en el borde de una silla, agarrando el respaldo."
    - "Estira los brazos, manteniendo la espalda recta, y tira de la parte superior del cuerpo hacia delante hasta notar un estiramiento. Mantén de 20 a 30 segundos."
Chest_And_Front_Of_Shoulder_Stretch:
  name: "Estiramiento de pecho y parte delantera del hombro"
  instructions:
    - "Empieza de pie con las piernas juntas, sujetando una barra de gimnasio o un palo de escoba."
    - "Agarra el palo con un agarre algo más ancho que los hombros y sujétalo delante de ti con las palmas hacia abajo."
    - "Levanta con cuidado el palo hacia arriba y por detrás de la cabeza."
Chest_Push_from_3_point_stance:
  name: "Empuje de pecho desde posición de tres apoyos"
  instructions:
    - "Empieza en una posición de tres apoyos, en cuclillas con la espalda plana y una mano en el suelo. Coloca el balón medicinal justo delante de ti."
    - "Para empezar, da el primer paso mientras llevas el balón al pecho, colocando ambas manos para prepararte para el lanzamiento."
    - "Al ejecutar el segundo paso, suelta el balón hacia delante de forma explosiva y con toda la fuerza posible."
Chest_Push_multiple_response:
  name: "Empuje de pecho (respuesta múltiple)"
  instructions:
    - "Empieza en posición de rodillas frente a una pared o utiliza un compañero. Sujeta el balón con ambas manos pegado al pecho."
    - "Ejecuta el pase explotando hacia delante y hacia fuera con las caderas mientras empujas el balón con toda la fuerza posible."
    - "Acompaña el movimiento cayendo hacia delante, frenándote con las manos."
    - "Vuelve inmediatamente a una posición erguida. Repite el número de repeticiones deseado."
Chest_Push_single_response:
  name: "Empuje de pecho (respuesta única)"
  instructions:
    - "Empieza en posición de rodillas sujetando el balón medicinal con ambas manos pegado al pecho."
    - "Ejecuta el pase explotando hacia delante y hacia fuera con las caderas mientras empujas el balón tan lejos como puedas."
    - "Acompaña el movimiento cayendo hacia delante, frenándote con las manos."
Chest_Push_with_Run_Release:
  name: "Empuje de pecho con lanzamiento y carrera"
  instructions:
    - "Empieza en una postura atlética con las rodillas flexionadas, las caderas atrás y la espalda plana. Sujeta el balón medicinal cerca de las piernas. Esta es la posición inicial."
    - "Mientras das el primer paso, lleva el balón medicinal al pecho."
    - "Al dar el segundo paso, empuja el balón hacia delante de forma explosiva y sprinta inmediatamente unos 9 m tras soltarlo. Si eres muy rápido, ¡puedes atrapar tu propio pase!"
Chest_Stretch_on_Stability_Ball:
  name: "Estiramiento de pecho sobre fitball"
  instructions:
    - "Colócate a cuatro patas junto a un fitball."
    - "Coloca los codos sobre el balón, manteniendo el brazo hacia el lado. Esta es la posición inicial."
    - "Baja el torso hacia el suelo, manteniendo el codo sobre el balón. Mantén el estiramiento de 20 a 30 segundos y repite con el otro brazo."
Childs_Pose:
  name: "Postura del niño"
  instructions:
    - "Colócate a cuatro patas y camina con las manos hacia delante."
    - "Baja los glúteos hasta sentarte sobre los talones. Deja que los brazos se arrastren por el suelo mientras te sientas hacia atrás para estirar toda la columna."
    - "Una vez que te asientes sobre los talones, lleva las manos junto a los pies y relájate. \"Respira\" hacia la espalda. Apoya la frente en el suelo. Evita esta posición si tienes problemas de rodilla."
Chin-Up:
  name: "Dominada supina"
  instructions:
    - "Agarra la barra de dominadas con las palmas mirando hacia tu torso y un agarre más cerrado que la anchura de los hombros."
    - "Con ambos brazos extendidos delante de ti sujetando la barra a la anchura de agarre elegida, mantén el torso lo más recto posible mientras creas una curvatura en la zona lumbar y sacas el pecho. Esta es la posición inicial. Consejo: mantener el torso lo más recto posible maximiza la estimulación del bíceps y minimiza la participación de la espalda."
    - "Mientras espiras, sube el torso hasta que la cabeza quede aproximadamente a la altura de la barra de dominadas. Concéntrate en usar los músculos del bíceps para realizar el movimiento. Mantén los codos cerca del cuerpo. Consejo: la parte superior del torso debe permanecer fija mientras se desplaza en el espacio y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo apretando los bíceps en la posición de contracción, baja lentamente el torso hasta la posición inicial, cuando los brazos están completamente extendidos. Inspira mientras realizas esta parte del movimiento."
    - "Repite este movimiento el número de repeticiones prescrito."
Chin_To_Chest_Stretch:
  name: "Estiramiento de barbilla al pecho"
  instructions:
    - "Siéntate en el suelo."
    - "Coloca ambas manos en la parte posterior de la cabeza, con los dedos entrelazados, los pulgares hacia abajo y los codos apuntando rectos al frente. Tira lentamente de la cabeza hacia el pecho. Mantén de 20 a 30 segundos."
Circus_Bell:
  name: "Circus bell"
  instructions:
    - "La circus bell es una mancuerna de gran tamaño con un mango grueso. Empieza con la mancuerna entre los pies y agarra el mango con ambas manos."
    - "Haz una cargada de la mancuerna extendiendo caderas y rodillas para llevar el implemento hasta el hombro deseado, soltando la mano sobrante."
    - "Asegúrate de colocar uno de los extremos de la mancuerna por detrás del hombro para no perder el equilibrio. Para subirla por encima de la cabeza, haz un pequeño descenso flexionando las rodillas y luego impúlsate hacia arriba mientras extiendes la mancuerna sobre la cabeza, inclinándote ligeramente en sentido contrario a ella."
    - "Guía con cuidado la mancuerna de vuelta al suelo, manteniéndola bajo control tanto como sea posible. Lo mejor es realizar este ejercicio sobre una esterilla de goma gruesa para evitar dañar el suelo."
Clean:
  name: "Cargada"
  instructions:
    - "Con una barra en el suelo cerca de las espinillas, agarra la barra con agarre prono (o de gancho) justo por fuera de las piernas. Baja las caderas con el peso en los talones, la espalda recta, la cabeza mirando al frente, el pecho elevado y los hombros justo por delante de la barra. Esta es la posición inicial."
    - ""
    - "Empieza el primer tirón empujando con los talones y extendiendo las rodillas. El ángulo de la espalda debe mantenerse igual y los brazos deben permanecer rectos. Mueve el peso con control hasta por encima de las rodillas."
    - "A continuación viene el segundo tirón, la principal fuente de aceleración de la cargada. Cuando la barra se acerque a la posición de la mitad del muslo, empieza a extender las caderas. Con un movimiento de salto, acelera extendiendo caderas, rodillas y tobillos, usando la velocidad para subir la barra. No debería ser necesario tirar activamente con los brazos para acelerar el peso; al final del segundo tirón, el cuerpo debe estar completamente extendido, inclinado ligeramente hacia atrás, con los brazos aún extendidos."
    - "Al alcanzar la extensión completa, pasa al tercer tirón encogiendo los hombros con fuerza y flexionando los brazos con los codos arriba y hacia fuera. En el pico de la extensión, tira de ti mismo hacia abajo con fuerza, rotando los codos bajo la barra mientras lo haces. Recibe la barra en posición de sentadilla frontal, cuya profundidad depende de la altura de la barra al final del tercer tirón. La barra debe apoyarse sobre los hombros protraídos, tocando ligeramente la garganta con las manos relajadas. Continúa descendiendo hasta la posición de sentadilla profunda, lo que ayudará en la recuperación."
    - "Recupérate de inmediato empujando con los talones, manteniendo el torso erguido y los codos arriba. Continúa hasta ponerte de pie."
Clean_Deadlift:
  name: "Peso muerto de cargada"
  instructions:
    - "Empieza de pie con una barra cerca de las espinillas. Los pies deben estar justo bajo las caderas y ligeramente girados hacia fuera. Agarra la barra con doble agarre prono o agarre de gancho, aproximadamente a la anchura de los hombros. Baja en sentadilla hasta la barra. La columna debe estar en extensión completa, con un ángulo de espalda que sitúe los hombros por delante de la barra y la espalda lo más vertical posible."
    - "Empieza empujando el suelo con la parte delantera de los talones. Mientras la barra sube, mantén un ángulo de espalda constante. Abre las rodillas hacia los lados para ayudar a mantenerlas fuera de la trayectoria de la barra."
    - "Después de que la barra pase las rodillas, completa el levantamiento llevando las caderas contra la barra hasta que caderas y rodillas estén extendidas."
Clean_Pull:
  name: "Tirón de cargada"
  instructions:
    - "Con una barra en el suelo cerca de las espinillas, agarra la barra con agarre prono o de gancho justo por fuera de las piernas. Baja las caderas con el peso en los talones, la espalda recta, la cabeza mirando al frente, el pecho elevado y los hombros justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con los talones y extendiendo las rodillas. El ángulo de la espalda debe mantenerse igual y los brazos deben permanecer rectos y los codos hacia fuera. Mueve el peso con control hasta por encima de las rodillas."
    - "A continuación viene el segundo tirón, la principal fuente de aceleración de la cargada. Cuando la barra se acerque a la posición de la mitad del muslo, empieza a extender las caderas. Con un movimiento de salto, acelera extendiendo caderas, rodillas y tobillos, usando la velocidad para subir la barra. No debería ser necesario tirar activamente con los brazos para acelerar el peso; al final del segundo tirón, el cuerpo debe estar completamente extendido, inclinado ligeramente hacia atrás, con los brazos aún extendidos. La extensión completa debe ser violenta y abrupta, y asegúrate de no prolongarla más de lo necesario."
Clean_Shrug:
  name: "Encogimiento de hombros de cargada"
  instructions:
    - "Empieza con un agarre a la anchura de los hombros, doble agarre prono o de gancho, con la barra colgando a la altura de la mitad del muslo. La espalda debe estar recta e inclinada ligeramente hacia delante."
    - "Encoge los hombros hacia las orejas. Aunque este ejercicio normalmente se puede cargar con más peso que una cargada, evita sobrecargarlo hasta el punto de que la ejecución se ralentice."
Clean_and_Jerk:
  name: "Cargada y envión"
  instructions:
    - "Con una barra en el suelo cerca de las espinillas, agarra la barra con agarre prono o de gancho justo por fuera de las piernas. Baja las caderas con el peso en los talones, la espalda recta, la cabeza mirando al frente, el pecho elevado y los hombros justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con los talones y extendiendo las rodillas. El ángulo de la espalda debe mantenerse igual y los brazos deben permanecer rectos. Mueve el peso con control hasta por encima de las rodillas."
    - "A continuación viene el segundo tirón, la principal fuente de aceleración de la cargada. Cuando la barra se acerque a la posición de la mitad del muslo, empieza a extender las caderas. Con un movimiento de salto, acelera extendiendo caderas, rodillas y tobillos, usando la velocidad para subir la barra. No debería ser necesario tirar activamente con los brazos para acelerar el peso; al final del segundo tirón, el cuerpo debe estar completamente extendido, inclinado ligeramente hacia atrás, con los brazos aún extendidos."
    - "Al alcanzar la extensión completa, pasa al tercer tirón encogiendo los hombros con fuerza y flexionando los brazos con los codos arriba y hacia fuera. En el pico de la extensión, tira de ti mismo hacia abajo con fuerza, rotando los codos bajo la barra mientras lo haces. Recibe la barra en posición de sentadilla frontal, cuya profundidad depende de la altura de la barra al final del tercer tirón. La barra debe apoyarse sobre los hombros protraídos, tocando ligeramente la garganta con las manos relajadas. Continúa descendiendo hasta la posición de sentadilla profunda, lo que ayudará en la recuperación."
    - "Recupérate de inmediato empujando con los talones, manteniendo el torso erguido y los codos arriba. Continúa hasta ponerte de pie."
    - "La segunda fase es el envión, que lleva el peso por encima de la cabeza. De pie con el peso apoyado en la parte delantera de los hombros, empieza con el dip. Con los pies justo bajo las caderas, flexiona las rodillas sin mover las caderas hacia atrás. Baja solo un poco e invierte la dirección con la mayor potencia posible."
    - "Empuja con los talones para crear tanta velocidad y fuerza como sea posible, y asegúrate de apartar la cabeza cuando la barra deje los hombros."
    - "En este momento, cuando los pies abandonan el suelo, deben colocarse en la posición de recepción lo más rápido posible. En el breve instante en que los pies no empujan activamente contra la plataforma, el esfuerzo del atleta por subir la barra los empujará hacia abajo. Los pies deben quedar abiertos, con un pie delante y otro detrás. Recibe la barra con los brazos bloqueados sobre la cabeza. Vuelve a la posición de pie."
Clean_and_Press:
  name: "Cargada y press"
  instructions:
    - "Adopta una postura a la anchura de los hombros, con las rodillas por dentro de los brazos. Ahora, manteniendo la espalda plana, flexiona rodillas y caderas para poder agarrar la barra con los brazos totalmente extendidos y un agarre prono ligeramente más ancho que los hombros. Apunta los codos hacia los lados. La barra debe estar cerca de las espinillas. Coloca los hombros sobre la barra o ligeramente por delante de ella. Establece una postura de espalda plana. Esta es la posición inicial."
    - "Empieza a tirar de la barra extendiendo las rodillas. Lleva las caderas hacia delante y sube los hombros al mismo ritmo manteniendo constante el ángulo de la espalda; continúa subiendo la barra en línea recta manteniéndola cerca del cuerpo."
    - "Cuando la barra pase la rodilla, extiende con fuerza tobillos, rodillas y caderas, de forma similar a un salto. Mientras lo haces, continúa guiando la barra con las manos, encogiendo los hombros y usando el impulso de tu movimiento para subir la barra lo más alto posible. La barra debe viajar cerca de tu cuerpo y debes mantener los codos hacia fuera."
    - "En la máxima elevación, los pies deben despegarse del suelo y debes empezar a meterte bajo la barra. La mecánica de esto puede cambiar ligeramente según el peso utilizado. Debes descender a una posición de sentadilla mientras te metes bajo la barra."
    - "Cuando la barra alcance su altura máxima, rota los codos alrededor y bajo la barra. Apoya la barra sobre la parte delantera de los hombros manteniendo el torso erguido y flexionando caderas y rodillas para absorber el peso de la barra."
    - "Ponte de pie completamente, sujetando la barra en la posición de cargada."
    - "Sin mover los pies, empuja la barra por encima de la cabeza mientras espiras. Baja la barra de forma controlada."
Clean_from_Blocks:
  name: "Cargada desde bloques"
  instructions:
    - "Con una barra sobre cajones o soportes a la altura deseada, agarra la barra con agarre prono o de gancho justo por fuera de las piernas. Baja las caderas con el peso en los talones, la espalda recta, la cabeza mirando al frente, el pecho elevado y los hombros justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con los talones y extendiendo las rodillas. El ángulo de la espalda debe mantenerse igual y los brazos deben permanecer rectos con los codos apuntando hacia fuera."
    - "Al alcanzar la extensión completa, pasa a la posición de recepción encogiendo los hombros con fuerza y flexionando los brazos con los codos arriba y hacia fuera. Tira de ti mismo hacia abajo con fuerza, rotando los codos bajo la barra mientras lo haces. Recibe la barra en posición de sentadilla frontal, cuya profundidad depende de la altura de la barra al final del tercer tirón. La barra debe apoyarse sobre los hombros protraídos, tocando ligeramente la garganta con las manos relajadas. Continúa descendiendo hasta la posición de sentadilla profunda, lo que ayudará en la recuperación."
    - "Recupérate de inmediato empujando con los talones, manteniendo el torso erguido y los codos arriba. Continúa hasta ponerte de pie. Devuelve el peso a los cajones para la siguiente repetición."
Clock_Push-Up:
  name: "Flexión reloj"
  instructions:
    - "Colócate en posición prona en el suelo, apoyando tu peso en las manos y las puntas de los pies."
    - "Los brazos deben estar totalmente extendidos con las manos aproximadamente a la anchura de los hombros. Mantén el cuerpo recto durante todo el movimiento. Esta es la posición inicial."
    - "Desciende flexionando los codos, bajando el pecho hacia el suelo."
    - "Abajo, invierte el movimiento empujándote hacia arriba mediante la extensión de los codos lo más rápido posible hasta que te quedes en el aire. Intenta \"saltar\" entre 30 y 45 cm hacia un lado."
    - "Mientras aceleras hacia arriba, mueve el pie exterior alejándolo de tu dirección de desplazamiento. Al despegar del suelo, gira el cuerpo unos 30 grados para la siguiente repetición."
    - "Vuelve a la posición inicial y repite el ejercicio, avanzando alrededor hasta volver al punto de partida."
Close-Grip_Barbell_Bench_Press:
  name: "Press de banca con barra (agarre cerrado)"
  instructions:
    - "Túmbate en un banco plano. Usando un agarre cerrado (aproximadamente a la anchura de los hombros), saca la barra del soporte y sujétala justo sobre ti con los brazos bloqueados. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente hasta notar la barra en la parte media del pecho. Consejo: asegúrate de que, a diferencia de un press de banca normal, mantienes los codos cerca del torso en todo momento para maximizar la participación del tríceps."
    - "Tras una pausa de un segundo, lleva la barra de vuelta a la posición inicial mientras espiras y empujas la barra con los músculos del tríceps. Bloquea los brazos en la posición de contracción, mantén un segundo y luego empieza a bajar lentamente de nuevo. Consejo: bajar debería llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, coloca la barra de nuevo en el soporte."
Close-Grip_Dumbbell_Press:
  name: "Press con mancuerna (agarre cerrado)"
  instructions:
    - "Coloca una mancuerna en vertical sobre un banco plano."
    - "Asegurándote de que la mancuerna se mantiene firmemente colocada en el extremo del banco, túmbate perpendicular al banco con solo los hombros apoyados en la superficie. Las caderas deben quedar por debajo del banco y las piernas flexionadas con los pies firmemente apoyados en el suelo."
    - "Agarra la mancuerna con ambas manos y sujétala recta sobre el pecho a la distancia de un brazo. Ambas palmas deben presionar contra la parte inferior de los lados de la mancuerna. Esta es la posición inicial."
    - "Inicia el movimiento bajando la mancuerna hacia el pecho."
    - "Vuelve a la posición inicial extendiendo los codos."
Close-Grip_EZ-Bar_Curl_with_Band:
  name: "Curl con barra Z con goma elástica (agarre cerrado)"
  instructions:
    - "Coloca una goma elástica en cada extremo de la barra. Coge la barra, colocando un pie sobre el centro de la goma. Ponte erguido con un agarre supino estrecho en la barra Z. Los codos deben estar cerca del torso. Esta es la posición inicial."
    - "Manteniendo fija la parte superior de los brazos, flexiona los codos para ejecutar el curl. Espira mientras se levanta el peso."
    - "Continúa el movimiento hasta que los bíceps estén completamente contraídos y la barra esté a la altura de los hombros. Mantén la posición de contracción durante un segundo y aprieta los bíceps con fuerza."
    - "Empieza a llevar lentamente la barra de vuelta a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Close-Grip_EZ-Bar_Press:
  name: "Press con barra Z (agarre cerrado)"
  instructions:
    - "Túmbate en un banco plano con una barra Z cargada con un peso adecuado."
    - "Usando un agarre estrecho, saca la barra y sujétala justo sobre el torso con los codos pegados. Los brazos deben estar perpendiculares al suelo. Esta es la posición inicial."
    - "Ahora baja la barra hasta la parte baja del pecho mientras inspiras. Mantén los codos pegados mientras realizas este movimiento."
    - "Usando los tríceps para empujar la barra hacia arriba, llévala de vuelta a la posición inicial extendiendo los codos mientras espiras."
    - "Repite."
Close-Grip_EZ_Bar_Curl:
  name: "Curl con barra Z (agarre cerrado)"
  instructions:
    - "Ponte de pie con el torso erguido sujetando una barra Z en el asa interior más cercana. Las palmas de las manos deben mirar hacia delante y estar ligeramente inclinadas hacia dentro debido a la forma de la barra. Los codos deben estar cerca del torso. Esta es la posición inicial."
    - "Manteniendo fija la parte superior de los brazos, sube el peso hacia delante mientras contraes los bíceps y espiras. Consejo: solo deben moverse los antebrazos."
    - "Continúa el movimiento hasta que los bíceps estén completamente contraídos y la barra esté a la altura de los hombros. Mantén la posición de contracción durante un segundo y aprieta los bíceps con fuerza."
    - "Empieza a llevar lentamente la barra de vuelta a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Close-Grip_Front_Lat_Pulldown:
  name: "Jalón al pecho (agarre cerrado)"
  instructions:
    - "Siéntate en una máquina de jalones con una barra ancha unida a la polea superior. Asegúrate de ajustar el rodillo de las rodillas de la máquina a tu altura. Estos rodillos evitarán que tu cuerpo se levante por la resistencia unida a la barra."
    - "Agarra la barra con las palmas hacia delante usando el agarre prescrito. Nota sobre los agarres: para un agarre ancho, las manos deben estar separadas a una distancia mayor que la anchura de los hombros. Para un agarre medio, las manos deben estar separadas a una distancia igual a la anchura de los hombros, y para un agarre cerrado, a una distancia menor que la anchura de los hombros."
    - "Con ambos brazos extendidos delante de ti, sujetando la barra a la anchura de agarre elegida, inclina el torso hacia atrás unos 30 grados mientras creas una curvatura en la zona lumbar y sacas el pecho. Esta es la posición inicial."
    - "Mientras espiras, baja la barra hasta que toque la parte superior del pecho llevando los hombros y la parte superior de los brazos hacia abajo y atrás. Consejo: concéntrate en apretar los músculos de la espalda una vez que llegues a la posición de contracción completa. La parte superior del torso debe permanecer fija (solo deben moverse los brazos). Los antebrazos no deben hacer más trabajo que sujetar la barra; por tanto, no intentes bajar la barra usando los antebrazos."
    - "Tras un segundo en la posición de contracción, mientras juntas las escápulas, sube lentamente la barra de vuelta a la posición inicial, cuando los brazos están completamente extendidos y los dorsales completamente estirados. Inspira durante esta parte del movimiento."
    - "Repite este movimiento el número de repeticiones prescrito."
Close-Grip_Push-Up_off_of_a_Dumbbell:
  name: "Flexión con agarre cerrado sobre mancuerna"
  instructions:
    - "Túmbate en el suelo y coloca las manos sobre una mancuerna en vertical. Apoyando tu peso en las puntas de los pies y las manos, mantén el torso rígido y los codos pegados con los brazos rectos. Esta es la posición inicial."
    - "Baja el cuerpo, permitiendo que los codos se flexionen mientras inspiras. Mantén el cuerpo recto, sin permitir que las caderas suban o se hundan."
    - "Vuelve a la posición inicial extendiendo los codos. Espira mientras realizas este paso."
    - "Tras una pausa en la posición de contracción, repite el movimiento el número de repeticiones prescrito."
Close-Grip_Standing_Barbell_Curl:
  name: "Curl con barra de pie (agarre cerrado)"
  instructions:
    - "Sujeta una barra con ambas manos, palmas hacia arriba y separadas unos pocos centímetros."
    - "Ponte de pie con el torso recto y la cabeza alta. Los pies deben estar aproximadamente a la anchura de los hombros y los codos cerca del torso. Esta es la posición inicial. Consejo: mantendrás la parte superior de los brazos y los codos fijos durante todo el movimiento."
    - "Sube la barra en un movimiento semicircular hasta que los antebrazos toquen los bíceps. Espira mientras realizas esta parte del movimiento y contrae los bíceps con fuerza durante un segundo arriba. Consejo: evita doblar la espalda o usar balanceos al levantar el peso. Solo deben moverse los antebrazos."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Cocoons:
  name: "Cocoons"
  instructions:
    - "Empieza tumbado boca arriba en el suelo, con las piernas estiradas y los brazos extendidos por detrás de la cabeza. Esta es la posición inicial."
    - "Para realizar el movimiento, lleva las rodillas hacia el pecho, rotando la pelvis para despegar los glúteos del suelo. Mientras lo haces, flexiona la columna, llevando los brazos de vuelta sobre la cabeza para realizar un movimiento de encogimiento simultáneo."
    - "Tras una breve pausa, vuelve a la posición inicial."
Conans_Wheel:
  name: "Rueda de Conan"
  instructions:
    - "Con el peso cargado, adopta un agarre zurcher en el extremo del implemento. Coloca la barra en el pliegue del codo y sujeta tu muñeca. Intenta mantener el peso alejado de los antebrazos."
    - "Empieza levantando el peso del suelo. Mantén una postura firme y erguida mientras empiezas a caminar, dando pasos cortos y rápidos. Mira hacia arriba y hacia fuera mientras giras en círculo. No contengas la respiración durante el ejercicio. Continúa caminando hasta completar una o más vueltas completas."
Concentration_Curls:
  name: "Curl concentrado"
  instructions:
    - "Siéntate en un banco plano con una mancuerna delante de ti entre las piernas. Las piernas deben estar abiertas con las rodillas flexionadas y los pies en el suelo."
    - "Usa el brazo derecho para coger la mancuerna. Coloca la parte posterior de la parte superior del brazo derecho sobre la parte superior del muslo derecho, por la cara interna. Gira la palma de la mano hasta que mire hacia delante, alejándose del muslo. Consejo: el brazo debe estar extendido y la mancuerna por encima del suelo. Esta es la posición inicial."
    - "Manteniendo fija la parte superior del brazo, sube el peso hacia delante mientras contraes el bíceps y espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que el bíceps esté completamente contraído y las mancuernas estén a la altura de los hombros. Consejo: en la parte alta del movimiento, asegúrate de que el dedo meñique de tu brazo esté más alto que el pulgar. Esto garantiza una buena contracción. Mantén la posición de contracción durante un segundo mientras aprietas el bíceps."
    - "Empieza a llevar lentamente las mancuernas de vuelta a la posición inicial mientras inspiras. Precaución: evita los balanceos en todo momento."
    - "Repite el número de repeticiones indicado. Luego repite el movimiento con el brazo izquierdo."
Cross-Body_Crunch:
  name: "Encogimiento abdominal cruzado"
  instructions:
    - "Túmbate boca arriba y flexiona las rodillas unos 60 grados."
    - "Mantén los pies apoyados en el suelo y coloca las manos suavemente detrás de la cabeza. Esta es la posición inicial."
    - "Ahora sube enrollando el cuerpo y lleva el codo y el hombro derechos a través del cuerpo mientras llevas al mismo tiempo la rodilla izquierda hacia el hombro izquierdo. Estira el codo e intenta tocar la rodilla. Espira mientras realizas este movimiento. Consejo: intenta llevar el hombro hacia la rodilla en lugar de solo el codo y recuerda que la clave es contraer el abdomen al realizar el movimiento; no solo mover el codo."
    - "Ahora vuelve a la posición inicial mientras inspiras y repite con el codo izquierdo y la rodilla derecha."
    - "Continúa alternando de esta manera hasta completar todas las repeticiones prescritas."
Cross_Body_Hammer_Curl:
  name: "Curl martillo cruzado"
  instructions:
    - "Ponte de pie derecho con una mancuerna en cada mano. Las manos deben estar abajo a los lados con las palmas mirando hacia dentro."
    - "Manteniendo las palmas mirando hacia dentro y sin girar el brazo, sube la mancuerna del brazo derecho hacia el hombro izquierdo mientras espiras. Toca el hombro con la parte superior de la mancuerna y mantén la contracción durante un segundo."
    - "Baja lentamente la mancuerna por el mismo recorrido mientras inspiras y luego repite el mismo movimiento con el brazo izquierdo."
    - "Continúa alternando de esta forma hasta completar el número de repeticiones indicado con cada brazo."
Cross_Over_-_With_Bands:
  name: "Cruce con gomas elásticas"
  instructions:
    - "Fija una goma elástica alrededor de un poste estable."
    - "De espaldas al poste, agarra las asas de ambos extremos de la goma y da un paso adelante lo suficiente para crear tensión en la goma."
    - "Eleva los brazos a los lados, paralelos al suelo, perpendiculares al torso (el torso y los brazos deben parecerse a la letra \"T\") y con las palmas hacia delante. Mantenlos extendidos con una ligera flexión en los codos. Esta es la posición inicial."
    - "Manteniendo los brazos rectos, llévalos cruzando el pecho en un movimiento semicircular hacia delante mientras espiras y contraes los pectorales. Mantén la contracción durante un segundo."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Realiza el número de repeticiones indicado."
Crossover_Reverse_Lunge:
  name: "Zancada hacia atrás cruzada"
  instructions:
    - "Ponte de pie con los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Realiza una zancada hacia atrás dando un paso atrás con un pie y flexionando las caderas y la rodilla delantera. Mientras lo haces, rota el torso hacia el lado de la pierna delantera."
    - "Tras una breve pausa, vuelve a la posición inicial y repite hacia el otro lado, continuando de forma alterna."
Crucifix:
  name: "Crucifijo"
  instructions:
    - "En el crucifijo, mantienes pesos de forma estática hacia los lados durante un tiempo. Aunque el ejercicio se puede practicar con mancuernas, lo mejor es practicar con alguno de los distintos implementos utilizados, como hachas y martillos, ya que se siente diferente."
    - "Empieza de pie y eleva los brazos hacia los lados sujetando los implementos. Los brazos deben estar paralelos al suelo. En competición se usan jueces o sensores para avisarte cuando pierdes el paralelo. Aguanta todo el tiempo que puedas. Normalmente, los pesos deben ser lo bastante pesados como para fallar en 30-60 segundos."
Crunch_-_Hands_Overhead:
  name: "Encogimiento abdominal con manos sobre la cabeza"
  instructions:
    - "Túmbate en el suelo con la espalda plana y las rodillas flexionadas con un ángulo de unos 60 grados entre los isquiotibiales y las pantorrillas."
    - "Mantén los pies apoyados en el suelo y estira los brazos sobre la cabeza con las palmas cruzadas. Esta es la posición inicial."
    - "Enrolla la parte superior del cuerpo hacia delante y despega las escápulas del suelo. En todo momento, mantén los brazos alineados con la cabeza, el cuello y el hombro. No los muevas hacia delante desde esa posición. Espira mientras realizas esta parte del movimiento y mantén la contracción durante un segundo."
    - "Baja lentamente hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Crunch_-_Legs_On_Exercise_Ball:
  name: "Encogimiento abdominal con piernas sobre fitball"
  instructions:
    - "Túmbate boca arriba con los pies apoyados sobre un fitball y las rodillas flexionadas en un ángulo de 90 grados."
    - "Coloca los pies a siete u ocho centímetros de distancia entre sí y apunta los dedos de los pies hacia dentro para que se toquen."
    - "Coloca las manos suavemente a ambos lados de la cabeza manteniendo los codos hacia dentro. Consejo: no entrelaces los dedos detrás de la cabeza."
    - "Empuja la parte baja de la espalda contra el suelo para aislar mejor los músculos abdominales. Esta es la posición inicial."
    - "Empieza a despegar los hombros del suelo y continúa empujando con toda tu fuerza con la zona lumbar. Los hombros solo deben subir unos diez centímetros del suelo, y la zona lumbar debe permanecer en el suelo. Espira mientras ejecutas esta parte del movimiento. Aprieta los abdominales con fuerza en lo alto de la contracción y mantén durante un segundo. Consejo: concéntrate en un movimiento lento y controlado. Evita usar impulso en todo momento."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Crunches:
  name: "Encogimientos abdominales"
  instructions:
    - "Túmbate boca arriba con los pies apoyados en el suelo, o apoyados en un banco con las rodillas flexionadas en un ángulo de 90 grados. Si apoyas los pies en un banco, colócalos a siete u ocho centímetros de distancia entre sí y apunta los dedos de los pies hacia dentro para que se toquen."
    - "Ahora coloca las manos suavemente a ambos lados de la cabeza manteniendo los codos hacia dentro. Consejo: no entrelaces los dedos detrás de la cabeza."
    - "Mientras empujas la parte baja de la espalda contra el suelo para aislar mejor los músculos abdominales, empieza a despegar los hombros del suelo."
    - "Continúa empujando con toda tu fuerza con la zona lumbar mientras contraes los abdominales y espiras. Los hombros solo deben subir unos diez centímetros del suelo, y la zona lumbar debe permanecer en el suelo. En la parte alta del movimiento, contrae los abdominales con fuerza y mantén la contracción durante un segundo. Consejo: concéntrate en un movimiento lento y controlado; no te engañes usando impulso."
    - "Tras la contracción de un segundo, empieza a bajar lentamente de nuevo a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Cuban_Press:
  name: "Press cubano"
  instructions:
    - "Coge una mancuerna en cada mano con agarre prono, de pie. Eleva la parte superior de los brazos hasta que queden paralelos al suelo, dejando que los antebrazos cuelguen en la posición de \"espantapájaros\". Esta es la posición inicial."
    - "Para iniciar el movimiento, rota externamente los hombros para mover la parte superior del brazo 180 grados. Mantén la parte superior de los brazos en su sitio, rotándolos hasta que las muñecas queden justo encima de los codos y los antebrazos perpendiculares al suelo."
    - "Ahora empuja las mancuernas extendiendo los codos, estirando los brazos sobre la cabeza."
    - "Vuelve a la posición inicial mientras inspiras invirtiendo los pasos."
    - "Repite el número de repeticiones indicado."
Dancers_Stretch:
  name: "Estiramiento del bailarín"
  instructions:
    - "Siéntate en el suelo."
    - "Cruza la pierna derecha sobre la izquierda, manteniendo la rodilla flexionada. La pierna izquierda queda recta y apoyada en el suelo."
    - "Coloca el brazo izquierdo sobre la pierna derecha y la mano derecha en el suelo."
    - "Rota la parte superior del cuerpo hacia la derecha y mantén de 10 a 20 segundos. Cambia de lado."
Dead_Bug:
  name: "Dead bug"
  instructions:
    - "Empieza tumbado boca arriba con las manos extendidas hacia el techo."
    - "Lleva los pies, las rodillas y las caderas hasta 90 grados."
    - "Espira con fuerza para bajar la caja torácica y aplanar la espalda contra el suelo, rotando la pelvis hacia arriba y apretando los glúteos. Mantén esta posición durante todo el movimiento. Esta es la posición inicial."
    - "Inicia el ejercicio extendiendo una pierna, estirando la rodilla y la cadera para llevar la pierna justo por encima del suelo."
    - "Mantén la posición de la zona lumbar y la pelvis mientras realizas el movimiento, ya que la espalda tenderá a arquearse."
    - "Mantente firme y devuelve la pierna que trabaja a la posición inicial."
    - "Repite hacia el lado contrario, alternando hasta completar la serie."
Deadlift_with_Bands:
  name: "Peso muerto con gomas elásticas"
  instructions:
    - "Para hacer peso muerto con gomas cortas, simplemente pásalas sobre la barra antes de empezar y métete en ellas para colocarte. Las gomas largas deberán anclarse a una base segura, como mancuernas pesadas o una jaula."
    - "Con los pies y el agarre colocados, toma una gran bocanada de aire y luego baja las caderas y flexiona las rodillas hasta que las espinillas toquen la barra. Mira al frente con la cabeza, mantén el pecho elevado y la espalda arqueada, y empieza a empujar con los talones para subir el peso. Después de que la barra pase las rodillas, tira de la barra hacia atrás con fuerza, juntando las escápulas mientras llevas las caderas hacia delante contra la barra."
    - "Baja la barra flexionando las caderas y guiándola hasta el suelo."
Decline_Barbell_Bench_Press:
  name: "Press de banca declinado con barra"
  instructions:
    - "Asegura las piernas en el extremo del banco declinado y túmbate lentamente en el banco."
    - "Usando un agarre de anchura media (un agarre que crea un ángulo de 90 grados en la mitad del movimiento entre los antebrazos y la parte superior de los brazos), saca la barra del soporte y sujétala recta sobre ti con los brazos bloqueados. Los brazos deben estar perpendiculares al suelo. Esta es la posición inicial. Consejo: para proteger el manguito de los rotadores, lo mejor es que un compañero te ayude a sacar la barra del soporte."
    - "Mientras inspiras, baja lentamente hasta notar la barra en la parte baja del pecho."
    - "Tras una pausa de un segundo, lleva la barra de vuelta a la posición inicial mientras espiras y empujas la barra con los músculos del pecho. Bloquea los brazos y aprieta el pecho en la posición de contracción, mantén un segundo y luego empieza a bajar lentamente de nuevo. Consejo: bajar debería llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, coloca la barra de nuevo en el soporte."
Decline_Close-Grip_Bench_To_Skull_Crusher:
  name: "Press declinado de agarre cerrado a rompecráneos"
  instructions:
    - "Asegura las piernas en el extremo del banco declinado y túmbate lentamente en el banco."
    - "Usando un agarre cerrado (un agarre ligeramente menor que la anchura de los hombros), saca la barra del soporte y sujétala recta sobre ti con los brazos bloqueados y los codos pegados. Los brazos deben estar perpendiculares al suelo. Esta es la posición inicial. Consejo: para proteger el manguito de los rotadores, lo mejor es que un compañero te ayude a sacar la barra del soporte."
    - "Ahora baja la barra hasta la parte baja del pecho mientras inspiras. Mantén los codos pegados mientras realizas este movimiento."
    - "Usando los tríceps para empujar la barra hacia arriba, llévala de vuelta a la posición inicial mientras espiras."
    - "Mientras inspiras y mantienes fija la parte superior de los brazos, baja la barra lentamente moviendo los antebrazos en un movimiento semicircular hacia ti hasta notar que la barra toca ligeramente la frente. Inspira mientras realizas esta parte del movimiento."
    - "Sube la barra de vuelta a la posición inicial contrayendo los tríceps y espirando."
    - "Repite los pasos 3-6 hasta completar el número de repeticiones recomendado."
Decline_Crunch:
  name: "Encogimiento abdominal declinado"
  instructions:
    - "Asegura las piernas en el extremo del banco declinado y túmbate."
    - "Ahora coloca las manos suavemente a ambos lados de la cabeza manteniendo los codos hacia dentro. Consejo: no entrelaces los dedos detrás de la cabeza."
    - "Mientras empujas la parte baja de la espalda contra el banco para aislar mejor los músculos abdominales, empieza a despegar los hombros del banco."
    - "Continúa empujando con toda tu fuerza con la zona lumbar mientras contraes los abdominales y espiras. Los hombros solo deben subir unos diez centímetros del banco, y la zona lumbar debe permanecer en el banco. En la parte alta del movimiento, contrae los abdominales con fuerza y mantén la contracción durante un segundo. Consejo: concéntrate en un movimiento lento y controlado; no te engañes usando impulso."
    - "Tras la contracción de un segundo, empieza a bajar lentamente de nuevo a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Decline_Dumbbell_Bench_Press:
  name: "Press de banca declinado con mancuernas"
  instructions:
    - "Sujeta las piernas en el extremo del banco declinado y túmbate con una mancuerna en cada mano apoyada sobre los muslos. Las palmas de las manos se miran entre sí."
    - "Una vez tumbado, lleva las mancuernas delante de ti a la anchura de los hombros."
    - "Una vez a la anchura de los hombros, gira las muñecas hacia delante para que las palmas de las manos miren en dirección contraria a ti. Esta es la posición inicial."
    - "Baja las pesas lentamente hacia los lados mientras sueltas el aire. Mantén el control total de las mancuernas en todo momento. Consejo: durante todo el movimiento, los antebrazos deben estar siempre perpendiculares al suelo."
    - "Mientras sueltas el aire, empuja las mancuernas hacia arriba con los pectorales. Bloquea los brazos en la posición contraída, aprieta el pecho, mantén un segundo y empieza a bajar lentamente. Consejo: la bajada debe durar al menos el doble que la subida."
    - "Repite el movimiento el número de repeticiones prescrito en tu programa de entrenamiento."
Decline_Dumbbell_Flyes:
  name: "Apertura declinada con mancuernas"
  instructions:
    - "Sujeta las piernas en el extremo del banco declinado y túmbate con una mancuerna en cada mano apoyada sobre los muslos. Las palmas de las manos se miran entre sí."
    - "Una vez tumbado, lleva las mancuernas delante de ti a la anchura de los hombros. Las palmas de las manos deben mirarse entre sí y los brazos deben estar perpendiculares al suelo y totalmente extendidos. Esta es la posición inicial."
    - "Con una ligera flexión de los codos para evitar tensión en el tendón del bíceps, baja los brazos hacia los lados en un arco amplio hasta que notes un estiramiento en el pecho. Inspira mientras realizas esta parte del movimiento. Consejo: ten en cuenta que, durante todo el movimiento, los brazos deben permanecer fijos; el movimiento solo debe producirse en la articulación del hombro."
    - "Vuelve a llevar los brazos a la posición inicial mientras aprietas los músculos del pecho y sueltas el aire. Consejo: asegúrate de usar el mismo arco de movimiento que utilizaste para bajar las pesas."
    - "Mantén un segundo en la posición contraída y repite el movimiento el número de repeticiones prescrito."
Decline_Dumbbell_Triceps_Extension:
  name: "Extensión de tríceps declinada con mancuernas"
  instructions:
    - "Sujeta las piernas en el extremo del banco declinado y túmbate con una mancuerna en cada mano apoyada sobre los muslos. Las palmas de las manos se miran entre sí."
    - "Una vez tumbado, lleva las mancuernas delante de ti a la anchura de los hombros. Las palmas de las manos deben mirarse entre sí y los brazos deben estar perpendiculares al suelo y totalmente extendidos. Esta es la posición inicial."
    - "Inspira y, manteniendo los brazos fijos (y los codos pegados), baja las mancuernas lentamente moviendo los antebrazos en un movimiento semicircular hacia ti hasta que los pulgares estén junto a las orejas. Inspira mientras realizas esta parte del movimiento."
    - "Sube las mancuernas de nuevo a la posición inicial contrayendo los tríceps y espirando."
    - "Repite el número de repeticiones indicado."
Decline_EZ_Bar_Triceps_Extension:
  name: "Extensión de tríceps declinada con barra Z"
  instructions:
    - "Sujeta las piernas en el extremo del banco declinado y túmbate lentamente en el banco."
    - "Con un agarre cerrado (ligeramente más estrecho que la anchura de los hombros), levanta la barra Z del soporte y mantenla recta sobre ti con los brazos bloqueados y los codos pegados. Los brazos deben estar perpendiculares al suelo. Esta es la posición inicial. Consejo: para proteger el manguito de los rotadores, es mejor que un compañero te ayude a sacar la barra del soporte."
    - "Inspira y, manteniendo los brazos fijos, baja la barra lentamente moviendo los antebrazos en un movimiento semicircular hacia ti hasta que notes que la barra roza ligeramente la frente. Inspira mientras realizas esta parte del movimiento."
    - "Sube la barra de nuevo a la posición inicial contrayendo los tríceps y espirando."
    - "Repite hasta completar el número de repeticiones indicado."
Decline_Oblique_Crunch:
  name: "Encogimiento abdominal oblicuo declinado"
  instructions:
    - "Sujeta las piernas en el extremo del banco declinado y túmbate lentamente en el banco."
    - "Eleva la parte superior del cuerpo del banco hasta que el torso forme unos 35-45 grados con respecto al suelo."
    - "Coloca una mano junto a la cabeza y la otra sobre el muslo. Esta es la posición inicial."
    - "Eleva lentamente la parte superior del cuerpo desde la posición inicial mientras giras el torso hacia la izquierda. Sigue subiendo mientras espiras hasta que el codo derecho toque la rodilla izquierda. Mantén esta posición contraída durante un segundo. Consejo: concéntrate en mantener los abdominales tensos y en hacer el movimiento lento y controlado."
    - "Baja el cuerpo lentamente a la posición inicial mientras inspiras."
    - "Tras completar una serie hacia la derecha con el número de repeticiones indicado, cambia al lado izquierdo. Consejo: concéntrate en girar realmente el torso y en sentir la contracción cuando estés arriba."
Decline_Push-Up:
  name: "Flexión declinada"
  instructions:
    - "Túmbate boca abajo en el suelo y coloca las manos separadas unos 90 cm mientras sostienes el torso con los brazos extendidos. Sube los pies a un cajón o banco. Esta es la posición inicial."
    - "A continuación, baja el cuerpo hasta que el pecho casi toque el suelo mientras inspiras."
    - "Ahora espira y empuja la parte superior del cuerpo hacia arriba hasta la posición inicial mientras aprietas el pecho."
    - "Tras una breve pausa en la posición contraída superior, puedes empezar a bajar de nuevo tantas repeticiones como necesites."
Decline_Reverse_Crunch:
  name: "Encogimiento abdominal inverso declinado"
  instructions:
    - "Túmbate boca arriba en un banco declinado y agárrate a la parte superior del banco con ambas manos. No dejes que el cuerpo se deslice hacia abajo desde esta posición."
    - "Mantén las piernas paralelas al suelo usando los abdominales para sostenerlas, con las rodillas y los pies juntos. Consejo: las piernas deben estar completamente extendidas con una ligera flexión de rodilla. Esta es la posición inicial."
    - "Mientras espiras, lleva las piernas hacia el torso a la vez que enrollas la pelvis hacia atrás y levantas las caderas del banco. Al final de este movimiento las rodillas tocarán el pecho."
    - "Mantén la contracción un segundo y devuelve las piernas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Decline_Smith_Press:
  name: "Press declinado en multipower"
  instructions:
    - "Coloca un banco declinado debajo del multipower. Ahora sitúa la barra a una altura que puedas alcanzar tumbado con los brazos casi totalmente extendidos. Con un agarre prono más ancho que los hombros, desbloquea la barra del soporte y sujétala recta sobre ti con los brazos extendidos. Esta es la posición inicial."
    - "Al inspirar, baja la barra de forma controlada dejando que los codos se flexionen, hasta rozar ligeramente el torso."
    - "Tras una breve pausa, devuelve la barra a la posición inicial extendiendo los codos, mientras espiras."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines la serie, bloquea la barra de nuevo en el soporte."
Deficit_Deadlift:
  name: "Peso muerto con déficit"
  instructions:
    - "Empieza teniendo una plataforma o discos de peso sobre los que puedas subirte, normalmente de unos 2,5-7,5 cm de altura. Acércate a la barra de modo que quede centrada sobre tus pies. Los pies deben estar separados aproximadamente a la anchura de las caderas. Flexiona la cadera para agarrar la barra a la anchura de los hombros, dejando que los omóplatos se protraigan. Normalmente se usa un agarre prono o un agarre mixto en las series más pesadas."
    - "Con los pies y el agarre colocados, toma una gran bocanada de aire y baja las caderas y flexiona las rodillas hasta que las espinillas toquen la barra. Mira al frente, mantén el pecho alto y la espalda arqueada, y empieza a empujar con los talones para subir el peso. Cuando la barra pase las rodillas, tira de ella con energía hacia atrás, juntando los omóplatos mientras llevas las caderas hacia delante contra la barra."
    - "Baja la barra flexionando las caderas y guiándola hasta el suelo."
Depth_Jump_Leap:
  name: "Salto en profundidad con salto largo"
  instructions:
    - "Para este ejercicio necesitarás dos cajones o bancos, uno de entre 30 y 40 cm de altura y otro de entre 55 y 65 cm."
    - "Colócate sobre uno de los dos cajones con los brazos a los lados; los pies deben estar juntos y ligeramente fuera del borde, como en el salto en profundidad. Coloca el otro cajón a unos 60-90 cm delante y de cara al ejecutante."
    - "Empieza dejándote caer del primer cajón, aterrizando y despegando a la vez con ambos pies."
    - "Rebota impulsándote hacia arriba y hacia delante con la máxima intensidad, usando los brazos y la extensión completa del cuerpo para saltar sobre el cajón más alto. De nuevo, deja que las piernas absorban el impacto."
Dip_Machine:
  name: "Fondos en máquina"
  instructions:
    - "Siéntate con firmeza en una máquina de fondos, selecciona el peso y agarra con fuerza las asas."
    - "Ahora mantén los codos pegados a los costados para poner énfasis en los tríceps. Los codos deben estar flexionados en un ángulo de 90 grados."
    - "Al contraer los tríceps, extiende los brazos hacia abajo mientras espiras. Consejo: en la parte inferior del movimiento, procura mantener una ligera flexión en los brazos para mantener la tensión en el tríceps."
    - "Ahora deja que los brazos vuelvan lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Dips_-_Chest_Version:
  name: "Fondos (versión pecho)"
  instructions:
    - "Para este ejercicio necesitarás unas barras paralelas. Para colocarte en la posición inicial, sostén el cuerpo con los brazos extendidos (bloqueados) sobre las barras."
    - "Mientras inspiras, baja lentamente con el torso inclinado hacia delante unos 30 grados y los codos ligeramente abiertos hasta que notes un ligero estiramiento en el pecho."
    - "Cuando notes el estiramiento, usa el pecho para volver a la posición inicial mientras espiras. Consejo: recuerda apretar el pecho un segundo en la parte superior del movimiento."
    - "Repite el movimiento el número de repeticiones prescrito."
Dips_-_Triceps_Version:
  name: "Fondos (versión tríceps)"
  instructions:
    - "Para colocarte en la posición inicial, sostén el cuerpo con los brazos casi bloqueados sobre las barras."
    - "Ahora, inspira y baja lentamente. El torso debe permanecer erguido y los codos deben mantenerse cerca del cuerpo. Esto ayuda a centrar mejor el trabajo en el tríceps. Baja hasta que se forme un ángulo de 90 grados entre el brazo y el antebrazo."
    - "Después, espira y empuja el torso hacia arriba usando los tríceps para volver a la posición inicial."
    - "Repite el movimiento el número de repeticiones prescrito."
Donkey_Calf_Raises:
  name: "Elevación de gemelos en máquina burro"
  instructions:
    - "Para este ejercicio necesitarás una máquina de elevación de gemelos tipo burro. Empieza colocando la zona lumbar y las caderas bajo la palanca acolchada. La zona del coxis debe ser la que haga contacto con la almohadilla."
    - "Coloca ambos brazos en las asas laterales y apoya las puntas de los pies en el bloque con los talones fuera. Orienta los dedos de los pies hacia delante, hacia dentro o hacia fuera, según la zona que quieras trabajar, y estira las rodillas sin bloquearlas. Esta es la posición inicial."
    - "Eleva los talones mientras espiras extendiendo los tobillos todo lo posible y contrayendo los gemelos. Asegúrate de mantener la rodilla fija en todo momento. No debe haber flexión en ningún momento. Mantén la posición contraída un segundo antes de empezar a bajar."
    - "Vuelve lentamente a la posición inicial mientras inspiras, bajando los talones y flexionando los tobillos hasta que los gemelos se estiren."
    - "Repite el número de repeticiones indicado."
Double_Kettlebell_Alternating_Hang_Clean:
  name: "Cargada colgada alterna con dos kettlebells"
  instructions:
    - "Coloca dos kettlebells entre tus pies. Para adoptar la posición inicial, lleva los glúteos hacia atrás y mira al frente."
    - "Lleva una kettlebell al hombro con una cargada y sujeta la otra kettlebell."
    - "Con un movimiento fluido, baja la kettlebell de arriba mientras subes la de abajo."
Double_Kettlebell_Jerk:
  name: "Envión con dos kettlebells"
  instructions:
    - "Sujeta una kettlebell por el asa en cada mano."
    - "Lleva las kettlebells a los hombros con una cargada, extendiendo las piernas y las caderas mientras tiras de ellas hacia los hombros. Rota las muñecas al hacerlo, de modo que las palmas miren hacia delante. Esta es la posición inicial."
    - "Baja el cuerpo flexionando las rodillas, manteniendo el torso erguido."
    - "Invierte inmediatamente la dirección, empujando con los talones, en esencia saltando para generar impulso."
    - "Al hacerlo, empuja las kettlebells por encima de la cabeza hasta el bloqueo extendiendo los brazos, usando el impulso del cuerpo para mover las pesas."
    - "Apoya los pies en el suelo en posición de tijera, con un pie delante y otro detrás."
    - "Manteniendo las pesas por encima de la cabeza, vuelve a la posición de pie, juntando los pies. Baja las pesas para realizar la siguiente repetición."
Double_Kettlebell_Push_Press:
  name: "Push press con dos kettlebells"
  instructions:
    - "Lleva dos kettlebells a los hombros con una cargada."
    - "Flexiona las piernas unos centímetros e invierte el movimiento rápidamente. Usa el impulso de las piernas para subir las kettlebells por encima de la cabeza."
    - "Una vez bloqueadas las kettlebells arriba, bájalas a los hombros y repite."
Double_Kettlebell_Snatch:
  name: "Arrancada con dos kettlebells"
  instructions:
    - "Coloca dos kettlebells detrás de tus pies. Flexiona las rodillas y siéntate hacia atrás para cogerlas."
    - "Balancea las kettlebells con fuerza entre las piernas e invierte la dirección."
    - "Empuja con las caderas y bloquea las kettlebells por encima de la cabeza en un solo movimiento continuo."
Double_Kettlebell_Windmill:
  name: "Molino de viento con dos kettlebells"
  instructions:
    - "Coloca una kettlebell delante de tu pie adelantado y lleva otra kettlebell por encima de la cabeza con el brazo opuesto mediante una cargada y un press. Lleva la kettlebell al hombro extendiendo las piernas y las caderas mientras tiras de ella hacia los hombros. Rota la muñeca al hacerlo, de modo que la palma mire hacia delante."
    - "Manteniendo la kettlebell bloqueada arriba en todo momento, saca los glúteos en dirección a la kettlebell bloqueada. Gira los pies hacia fuera en un ángulo de cuarenta y cinco grados respecto al brazo con la kettlebell bloqueada."
    - "Flexionando la cadera hacia un lado y sacando los glúteos, inclínate lentamente hasta poder coger la kettlebell del suelo. Mantén la vista en la kettlebell que sostienes sobre la cabeza en todo momento."
    - "Haz una pausa de un segundo tras coger la kettlebell del suelo e invierte el movimiento hasta la posición inicial."
Double_Leg_Butt_Kick:
  name: "Talones al glúteo con salto a dos piernas"
  instructions:
    - "Empieza de pie con las rodillas ligeramente flexionadas."
    - "Haz rápidamente una sentadilla corta, flexionando caderas y rodillas, y extiende de inmediato para saltar con la máxima altura vertical."
    - "Mientras subes, recoge los talones flexionando las rodillas, intentando tocar los glúteos."
    - "Termina el movimiento aterrizando con las rodillas solo parcialmente flexionadas, usando las piernas para absorber el impacto."
Downward_Facing_Balance:
  name: "Equilibrio boca abajo"
  instructions:
    - "Túmbate boca abajo sobre un fitball."
    - "Mientras apoyas el estómago en el balón, avanza con las manos por el suelo y levanta las piernas, extendiendo los codos y las rodillas."
Drag_Curl:
  name: "Curl arrastrado con barra"
  instructions:
    - "Agarra una barra con agarre supino (palmas hacia delante) y lleva los codos cerca del torso y hacia atrás. Esta es la posición inicial."
    - "Al espirar, sube la barra en un curl manteniendo los codos hacia atrás mientras \"arrastras\" la barra hacia arriba manteniéndola en contacto con el torso. Consejo: como ves, no mantendrás los codos pegados a los costados, sino que los llevarás hacia atrás. Además, no levantes los hombros."
    - "Vuelve lentamente a la posición inicial manteniendo la barra en contacto con el torso en todo momento."
    - "Repite el número de repeticiones indicado."
Drop_Push:
  name: "Flexión con caída entre cajones"
  instructions:
    - "Coloca cajones bajos u otras plataformas separados unos 60-90 cm."
    - "Colócate en posición de flexión entre ellos, apoyándote con las manos sobre los cajones."
    - "Con buena postura, déjate caer de las plataformas empujando hacia arriba y llevando las manos a la anchura de los hombros, amortiguando el aterrizaje absorbiendo el impacto con los brazos."
Dumbbell_Alternate_Bicep_Curl:
  name: "Curl de bíceps alterno con mancuernas"
  instructions:
    - "De pie (con el torso erguido), sujeta una mancuerna en cada mano con los brazos extendidos. Los codos deben estar cerca del torso y las palmas de las manos mirando hacia los muslos."
    - "Manteniendo el brazo fijo, haz el curl con la pesa derecha mientras rotas la palma de la mano hasta que mire hacia delante. En ese punto, sigue contrayendo el bíceps mientras espiras hasta que esté totalmente contraído y la mancuerna esté a la altura del hombro. Mantén la posición contraída un segundo mientras aprietas el bíceps. Consejo: solo deben moverse los antebrazos."
    - "Empieza a bajar lentamente la mancuerna a la posición inicial mientras inspiras. Consejo: recuerda girar las palmas de nuevo a la posición inicial (mirando hacia los muslos) mientras bajas."
    - "Repite el movimiento con la mano izquierda. Esto equivale a una repetición."
    - "Sigue alternando de esta manera el número de repeticiones indicado."
Dumbbell_Bench_Press:
  name: "Press de banca con mancuernas"
  instructions:
    - "Túmbate en un banco plano con una mancuerna en cada mano apoyada sobre los muslos. Las palmas de las manos se miran entre sí."
    - "Después, usando los muslos para ayudarte a subir las mancuernas, levántalas de una en una para poder sostenerlas delante de ti a la anchura de los hombros."
    - "Una vez a la anchura de los hombros, gira las muñecas hacia delante para que las palmas de las manos miren en dirección contraria a ti. Las mancuernas deben quedar justo a los lados del pecho, con el brazo y el antebrazo formando un ángulo de 90 grados. Asegúrate de mantener el control total de las mancuernas en todo momento. Esta es la posición inicial."
    - "Luego, mientras espiras, usa el pecho para empujar las mancuernas hacia arriba. Bloquea los brazos en la parte superior del movimiento y aprieta el pecho, mantén un segundo y empieza a bajar lentamente. Consejo: lo ideal es que bajar el peso lleve aproximadamente el doble de tiempo que subirlo."
    - "Repite el movimiento el número de repeticiones prescrito en tu programa de entrenamiento."
Dumbbell_Bench_Press_with_Neutral_Grip:
  name: "Press de banca con mancuernas (agarre neutro)"
  instructions:
    - "Coge una mancuerna en cada mano y túmbate en un banco plano. Los pies deben estar planos en el suelo y los omóplatos retraídos."
    - "Manteniendo un agarre neutro, con las palmas mirándose entre sí, empieza con los brazos extendidos directamente sobre ti, perpendiculares al suelo. Esta es la posición inicial."
    - "Empieza el movimiento flexionando los codos y bajando los brazos hacia los lados. Desciende hasta que las mancuernas lleguen al torso."
    - "Haz una pausa, luego extiende los codos y vuelve a la posición inicial."
Dumbbell_Bicep_Curl:
  name: "Curl de bíceps con mancuernas"
  instructions:
    - "Ponte de pie con la espalda recta y una mancuerna en cada mano con los brazos extendidos. Mantén los codos cerca del torso y gira las palmas de las manos hasta que miren hacia delante. Esta es la posición inicial."
    - "Ahora, manteniendo los brazos fijos, espira y sube las pesas contrayendo los bíceps. Sigue subiendo las pesas hasta que los bíceps estén totalmente contraídos y las mancuernas estén a la altura de los hombros. Mantén la posición contraída con una breve pausa mientras aprietas los bíceps."
    - "Luego, inspira y empieza a bajar lentamente las mancuernas a la posición inicial."
    - "Repite el número de repeticiones indicado."
Dumbbell_Clean:
  name: "Cargada con mancuernas"
  instructions:
    - "Empieza de pie con una mancuerna en cada mano y los pies separados a la anchura de los hombros."
    - "Baja las pesas hasta el suelo flexionando caderas y rodillas, llevando las caderas hacia atrás hasta que las mancuernas lleguen al suelo. Esta es la posición inicial."
    - "Para iniciar el movimiento, salta con fuerza hacia arriba extendiendo caderas, rodillas y tobillos para acelerar las pesas hacia arriba. Manteniendo un agarre neutro en las mancuernas, mantén los brazos rectos hasta alcanzar la extensión completa."
    - "Tras la extensión completa, vuelve a flexionar caderas y rodillas para recibir el peso en posición de sentadilla. Deja que los brazos se flexionen, guiando las mancuernas hasta los hombros."
    - "Al recibir el peso en la posición de sentadilla, extiende caderas y rodillas para terminar de pie con las pesas sobre los hombros."
Dumbbell_Floor_Press:
  name: "Press de suelo con mancuernas"
  instructions:
    - "Túmbate en el suelo sujetando mancuernas en las manos. Puedes tener las rodillas flexionadas. Empieza con las pesas totalmente extendidas sobre ti."
    - "Baja las pesas hasta que la parte superior del brazo entre en contacto con el suelo. Puedes pegar los codos para enfatizar el tamaño y la fuerza del tríceps, o, para centrarte en el pecho, abrir los brazos hacia los lados."
    - "Haz una pausa abajo y luego junta las pesas arriba extendiendo los codos."
Dumbbell_Flyes:
  name: "Apertura con mancuernas"
  instructions:
    - "Túmbate en un banco plano con una mancuerna en cada mano apoyada sobre los muslos. Las palmas de las manos se miran entre sí."
    - "Después, usando los muslos para ayudarte a subir las mancuernas, levántalas de una en una para poder sostenerlas delante de ti a la anchura de los hombros con las palmas de las manos mirándose entre sí. Sube las mancuernas como si fueras a hacer un press, pero detente y mantén justo antes del bloqueo. Esta es la posición inicial."
    - "Con una ligera flexión de los codos para evitar tensión en el tendón del bíceps, baja los brazos hacia los lados en un arco amplio hasta que notes un estiramiento en el pecho. Inspira mientras realizas esta parte del movimiento. Consejo: ten en cuenta que, durante todo el movimiento, los brazos deben permanecer fijos; el movimiento solo debe producirse en la articulación del hombro."
    - "Vuelve a llevar los brazos a la posición inicial mientras aprietas los músculos del pecho y espiras. Consejo: asegúrate de usar el mismo arco de movimiento que utilizaste para bajar las pesas."
    - "Mantén un segundo en la posición contraída y repite el movimiento el número de repeticiones prescrito."
Dumbbell_Incline_Row:
  name: "Remo inclinado con mancuernas en banco"
  instructions:
    - "Con un agarre neutro, apóyate sobre un banco inclinado."
    - "Coge una mancuerna en cada mano con agarre neutro, empezando con los brazos rectos. Esta es la posición inicial."
    - "Retrae los omóplatos y flexiona los codos para remar con las mancuernas hacia los costados."
    - "Haz una pausa en la parte superior del movimiento y luego vuelve a la posición inicial."
Dumbbell_Incline_Shoulder_Raise:
  name: "Elevación de hombros con mancuernas en banco inclinado"
  instructions:
    - "Siéntate en un banco inclinado sujetando una mancuerna en cada mano sobre los muslos."
    - "Levanta las piernas para impulsar las pesas hasta los hombros y échate hacia atrás. Coloca las mancuernas sobre los hombros con los brazos extendidos. Los brazos deben estar perpendiculares al suelo con las palmas hacia delante y los nudillos apuntando al techo. Esta es la posición inicial."
    - "Manteniendo los brazos rectos y bloqueados, levanta las mancuernas elevando los hombros del banco mientras espiras."
    - "Vuelve a llevar las mancuernas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Dumbbell_Lunges:
  name: "Zancadas con mancuernas"
  instructions:
    - "Ponte de pie con el torso erguido sujetando dos mancuernas en las manos a los lados. Esta es la posición inicial."
    - "Da un paso adelante con la pierna derecha, a unos 60 cm del pie que se queda fijo detrás, y baja la parte superior del cuerpo manteniendo el torso erguido y el equilibrio. Inspira mientras bajas. Nota: como en otros ejercicios, no dejes que la rodilla se adelante más allá de la punta de los pies al bajar, ya que esto supondrá un estrés innecesario para la articulación de la rodilla. Asegúrate de mantener la espinilla delantera perpendicular al suelo."
    - "Empujando principalmente con el talón, sube y vuelve a la posición inicial mientras espiras."
    - "Repite el movimiento el número de repeticiones indicado y luego hazlo con la pierna izquierda."
Dumbbell_Lying_One-Arm_Rear_Lateral_Raise:
  name: "Elevación lateral posterior con una mancuerna tumbado"
  instructions:
    - "Sujetando una mancuerna en una mano, túmbate boca abajo con el pecho apoyado en un banco ajustable ligeramente inclinado (unos 15 grados respecto al suelo). La otra mano puede agarrarse a la pata del banco para mayor estabilidad."
    - "Coloca la palma de la mano que sujeta la mancuerna en posición neutra (palma mirando hacia el torso) mientras mantienes el brazo extendido con el codo ligeramente flexionado. Esta es la posición inicial."
    - "Ahora eleva el brazo con la mancuerna hacia el lado hasta que el codo esté a la altura del hombro y el brazo esté aproximadamente paralelo al suelo mientras espiras. Consejo: mantén el brazo perpendicular al torso y extendido durante todo el movimiento. Además, mantén la contracción arriba durante un segundo."
    - "Baja lentamente la mancuerna a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Dumbbell_Lying_Pronation:
  name: "Pronación con mancuerna tumbado"
  instructions:
    - "Túmbate boca abajo en un banco plano con un brazo sujetando una mancuerna y la otra mano sobre el banco, doblada para poder apoyar la cabeza en ella."
    - "Flexiona el codo del brazo que sujeta la mancuerna de modo que se forme un ángulo de 90 grados entre el brazo y el antebrazo."
    - "Ahora eleva el brazo de modo que el antebrazo quede perpendicular al suelo y el brazo perpendicular al torso. Consejo: el brazo debe estar paralelo al suelo y formando también un ángulo de 90 grados con el torso. Esta es la posición inicial."
    - "Mientras espiras, rota externamente el antebrazo de modo que la mancuerna se eleve hacia delante manteniendo el ángulo de 90 grados entre el brazo y el antebrazo. Continuarás esta rotación externa hasta que el antebrazo esté paralelo al suelo. En ese punto mantén la contracción un segundo."
    - "Mientras inspiras, vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Dumbbell_Lying_Rear_Lateral_Raise:
  name: "Elevación lateral posterior con mancuernas tumbado"
  instructions:
    - "Sujetando una mancuerna en cada mano, túmbate boca abajo con el pecho apoyado en un banco ajustable ligeramente inclinado (unos 15 grados respecto al suelo)."
    - "Coloca las palmas de las manos en posición neutra (palmas mirando hacia el torso) mientras mantienes los brazos extendidos con los codos ligeramente flexionados. Esta es la posición inicial."
    - "Ahora eleva los brazos hacia los lados hasta que los codos estén a la altura de los hombros y los brazos estén aproximadamente paralelos al suelo mientras espiras. Consejo: mantén los brazos perpendiculares al torso y extendidos durante todo el movimiento. Además, mantén la contracción arriba durante un segundo."
    - "Baja lentamente las mancuernas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado y luego cambia al otro brazo."
Dumbbell_Lying_Supination:
  name: "Supinación con mancuerna tumbado"
  instructions:
    - "Túmbate de lado en un banco plano con un brazo sujetando una mancuerna y la otra mano sobre el banco, doblada para poder apoyar la cabeza en ella."
    - "Flexiona el codo del brazo que sujeta la mancuerna de modo que se forme un ángulo de 90 grados entre el brazo y el antebrazo."
    - "Ahora eleva el brazo de modo que el antebrazo quede paralelo al suelo y perpendicular al torso (Consejo: así el antebrazo quedará justo delante de ti). El brazo permanecerá fijo junto al torso y debe estar paralelo al suelo (alineado con el torso en todo momento). Esta es la posición inicial."
    - "Mientras espiras, rota externamente el antebrazo de modo que la mancuerna se eleve en un movimiento semicircular manteniendo el ángulo de 90 grados entre el brazo y el antebrazo. Continuarás esta rotación externa hasta que el antebrazo esté perpendicular al suelo y el torso apuntando hacia el techo. En ese punto mantén la contracción un segundo."
    - "Mientras inspiras, vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado y luego cambia al otro brazo."
Dumbbell_One-Arm_Shoulder_Press:
  name: "Press de hombros con una mancuerna"
  instructions:
    - "Coge una mancuerna y siéntate en un banco de press militar o en un banco multiusos con respaldo, colocando las mancuernas en vertical sobre los muslos, o ponte de pie con la espalda recta."
    - "Lleva la mancuerna hasta la altura del hombro con una cargada. La otra mano puede mantenerse totalmente extendida hacia el lado, junto a la cintura o agarrada a una superficie fija."
    - "Gira la muñeca para que la palma de la mano mire hacia delante. Esta es la posición inicial."
    - "Al espirar, empuja la mancuerna hacia arriba hasta que el brazo esté totalmente extendido."
    - "Tras una pausa de un segundo, baja lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado y luego cambia de brazo."
Dumbbell_One-Arm_Triceps_Extension:
  name: "Extensión de tríceps con una mancuerna"
  instructions:
    - "Coge una mancuerna y siéntate en un banco de press militar o en un banco multiusos con respaldo, colocando las mancuernas en vertical sobre los muslos, o ponte de pie con la espalda recta."
    - "Lleva la mancuerna hasta la altura del hombro con una cargada y luego extiende el brazo por encima de la cabeza de modo que todo el brazo quede perpendicular al suelo y junto a la cabeza. La mancuerna debe quedar sobre ti. La otra mano puede mantenerse totalmente extendida hacia el lado, junto a la cintura, sujetando el brazo que lleva la mancuerna o agarrada a una superficie fija."
    - "Gira la muñeca para que la palma de la mano mire hacia delante y el meñique apunte al techo. Esta es la posición inicial."
    - "Baja lentamente la mancuerna por detrás de la cabeza mientras mantienes el brazo fijo. Inspira mientras realizas este movimiento y haz una pausa cuando los tríceps estén totalmente estirados."
    - "Vuelve a la posición inicial contrayendo los tríceps mientras espiras. Consejo: es imprescindible que solo se mueva el antebrazo. El brazo debe permanecer fijo junto a la cabeza en todo momento."
    - "Repite el número de repeticiones indicado y cambia de brazo."
Dumbbell_One-Arm_Upright_Row:
  name: "Remo al mentón con una mancuerna"
  instructions:
    - "Coge una mancuerna y ponte de pie con la espalda recta y el brazo extendido delante de ti con una ligera flexión en los codos y la espalda recta. Esta es la posición inicial. Consejo: la mancuerna debe descansar sobre el muslo con la palma de la mano mirando hacia los muslos."
    - "Mantén la otra mano totalmente extendida hacia el lado, junto a la cintura o agarrada a una superficie fija. Esta es la posición inicial."
    - "Usa los hombros laterales para levantar la mancuerna mientras espiras. La mancuerna debe estar cerca del cuerpo mientras la subes. Sigue subiéndola hasta que la mancuerna esté casi a la altura de la barbilla. Consejo: los codos deben dirigir el movimiento. Al levantar la mancuerna, el codo debe estar siempre más alto que el antebrazo. Además, mantén el torso fijo y haz una pausa de un segundo en la parte superior del movimiento."
    - "Baja lentamente la mancuerna a la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado y cambia de brazo."
Dumbbell_Prone_Incline_Curl:
  name: "Curl con mancuernas boca abajo en banco inclinado"
  instructions:
    - "Coge una mancuerna en cada mano y túmbate boca abajo en un banco inclinado con los hombros cerca de la parte superior de la inclinación. Las rodillas pueden descansar sobre el asiento o puedes colocar las piernas abiertas a los lados (mi forma preferida)."
    - "Deja que los brazos se extiendan y cuelguen de forma natural delante de ti de modo que queden perpendiculares al suelo."
    - "Ahora mantén los codos pegados a los costados y orienta las palmas hacia delante. Esta es la posición inicial."
    - "Sube las mancuernas contrayendo los bíceps hasta que los brazos estén totalmente flexionados. Espira mientras realizas esta parte del movimiento y asegúrate de que solo se muevan los antebrazos. Los brazos deben permanecer fijos en todo momento."
    - "Baja las mancuernas hasta que los brazos estén totalmente extendidos."
    - "Repite el número de veces indicado."
Dumbbell_Raise:
  name: "Elevación con mancuernas"
  instructions:
    - "Coge una mancuerna en cada mano y ponte de pie con la espalda recta y los brazos extendidos a los lados con una ligera flexión en los codos. Esta es la posición inicial. Consejo: las mancuernas deben quedar junto a los muslos con las palmas de las manos mirando hacia atrás."
    - "Usa los hombros laterales para levantar las mancuernas mientras espiras. Las mancuernas deben estar a los lados del cuerpo mientras las subes. Sigue subiéndolas hasta que estén casi a la altura de la barbilla. Consejo: los codos deben dirigir el movimiento. Al levantar la mancuerna, el codo debe estar siempre más alto que el antebrazo. Además, mantén el torso fijo y haz una pausa de un segundo en la parte superior del movimiento."
    - "Baja lentamente las mancuernas a la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Dumbbell_Rear_Lunge:
  name: "Zancada hacia atrás con mancuernas"
  instructions:
    - "Ponte de pie con el torso erguido sujetando dos mancuernas en las manos a los lados. Esta es la posición inicial."
    - "Da un paso hacia atrás con la pierna derecha, a unos 60 cm del pie izquierdo, y baja la parte superior del cuerpo manteniendo el torso erguido y el equilibrio. Inspira mientras bajas. Consejo: como en otros ejercicios, no dejes que la rodilla se adelante más allá de la punta de los pies al bajar, ya que esto supondrá un estrés innecesario para la articulación de la rodilla. Asegúrate de mantener la espinilla delantera perpendicular al suelo. Mantén el torso erguido durante la zancada; es importante tener flexores de cadera flexibles. Una zancada larga enfatiza el glúteo mayor; una zancada corta enfatiza el cuádriceps."
    - "Empuja hacia arriba y vuelve a la posición inicial mientras espiras. Consejo: empuja con la parte delantera de los pies para acentuar el cuádriceps. Para centrarte en los glúteos, empuja con los talones."
    - "Ahora repite con la pierna contraria."
Dumbbell_Scaption:
  name: "Scaption con mancuernas"
  instructions:
    - "Este ejercicio correctivo fortalece los músculos que estabilizan el omóplato. Sujeta una pesa ligera en cada mano, colgando a los lados. Los pulgares deben apuntar hacia arriba."
    - "Empieza el movimiento elevando los brazos hacia delante, a unos 30 grados del centro. Los brazos deben estar totalmente extendidos mientras realizas el movimiento."
    - "Continúa hasta que los brazos estén paralelos al suelo y luego vuelve a la posición inicial."
Dumbbell_Seated_Box_Jump:
  name: "Salto al cajón desde sentado con mancuerna"
  instructions:
    - "Coloca un cajón a unos 60 cm a un lado de un banco. Sujeta una mancuerna contra el pecho con ambas manos y siéntate en el banco de cara al cajón. Esta es la posición inicial."
    - "Apoya los pies firmemente en el suelo mientras te inclinas hacia delante, extendiendo caderas y rodillas para saltar hacia arriba y hacia delante."
    - "Aterriza sobre el cajón con ambos pies, absorbiendo el impacto dejando que caderas y rodillas se flexionen."
    - "Baja del cajón y vuelve a la posición inicial."
Dumbbell_Seated_One-Leg_Calf_Raise:
  name: "Elevación de gemelos sentado a una pierna con mancuerna"
  instructions:
    - "Coloca un bloque en el suelo a unos 30 cm de un banco plano."
    - "Siéntate en un banco plano y coloca una mancuerna sobre la parte superior del muslo izquierdo, unos 7,5 cm por encima de la rodilla."
    - "Ahora apoya la punta del pie izquierdo en el bloque. Esta es la posición inicial."
    - "Eleva los dedos de los pies todo lo posible mientras espiras y contraes el gemelo. Mantén la contracción un segundo."
    - "Vuelve lentamente a la posición inicial, estirando hacia abajo todo lo posible."
    - "Repite el número de repeticiones prescrito y luego repite con la pierna derecha."
Dumbbell_Shoulder_Press:
  name: "Press de hombros con mancuernas"
  instructions:
    - "Sujetando una mancuerna en cada mano, siéntate en un banco de press militar o en un banco multiusos con respaldo. Coloca las mancuernas en vertical sobre los muslos."
    - "Ahora sube las mancuernas a la altura de los hombros de una en una, usando los muslos para ayudarte a impulsarlas hasta la posición."
    - "Asegúrate de girar las muñecas para que las palmas de las manos miren hacia delante. Esta es la posición inicial."
    - "Ahora, espira y empuja las mancuernas hacia arriba hasta que se toquen en la parte superior."
    - "Después, tras una breve pausa en la posición contraída superior, baja lentamente las pesas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Dumbbell_Shrug:
  name: "Encogimiento de hombros con mancuernas"
  instructions:
    - "Ponte de pie, erguido, con una mancuerna en cada mano (palmas mirando hacia el torso) y los brazos extendidos a los lados."
    - "Levanta las mancuernas elevando los hombros todo lo posible mientras espiras. Mantén la contracción arriba durante un segundo. Consejo: los brazos deben permanecer extendidos en todo momento. Evita usar los bíceps para ayudar a levantar las mancuernas. Solo deben moverse los hombros hacia arriba y hacia abajo."
    - "Baja las mancuernas a la posición original."
    - "Repite el número de repeticiones indicado."
Dumbbell_Side_Bend:
  name: "Inclinación lateral con mancuerna"
  instructions:
    - "Ponte de pie con la espalda recta sujetando una mancuerna en la mano izquierda (palma mirando hacia el torso) mientras la mano derecha se apoya en la cintura. Los pies deben estar a la anchura de los hombros. Esta es la posición inicial."
    - "Manteniendo la espalda recta y la cabeza alta, inclínate solo desde la cintura hacia la derecha todo lo posible. Inspira mientras te inclinas hacia el lado. Luego mantén un segundo y vuelve a la posición inicial mientras espiras. Consejo: mantén el resto del cuerpo fijo."
    - "Ahora repite el movimiento pero inclinándote hacia la izquierda. Mantén un segundo y vuelve a la posición inicial."
    - "Repite el número de repeticiones indicado y luego cambia de mano."
Dumbbell_Squat:
  name: "Sentadilla con mancuernas"
  instructions:
    - "Ponte de pie con la espalda recta sujetando una mancuerna en cada mano (palmas mirando hacia los lados de las piernas)."
    - "Coloca las piernas con una postura media a la anchura de los hombros y las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te hará perder el equilibrio, y mantén también la espalda recta. Esta es la posición inicial. Nota: para esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas explicadas en la sección de posición de los pies."
    - "Empieza a bajar lentamente el torso flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que los muslos estén paralelos al suelo. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan de la punta de los pies), estás sometiendo la rodilla a un estrés innecesario y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir el torso mientras espiras empujando el suelo principalmente con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Dumbbell_Squat_To_A_Bench:
  name: "Sentadilla con mancuernas a un banco"
  instructions:
    - "Ponte de pie con la espalda recta y un banco plano detrás de ti, sujetando una mancuerna en cada mano (palmas mirando hacia los lados de las piernas)."
    - "Coloca las piernas con una postura media a la anchura de los hombros y las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te hará perder el equilibrio, y mantén también la espalda recta. Esta es la posición inicial. Nota: para esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas explicadas en la sección de posición de los pies."
    - "Empieza a bajar lentamente el torso flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que toques ligeramente el banco que tienes detrás. Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan de la punta de los pies), estás sometiendo la rodilla a un estrés innecesario y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra mientras espiras empujando el suelo principalmente con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Dumbbell_Step_Ups:
  name: "Subidas al banco con mancuernas"
  instructions:
    - "Ponte de pie con la espalda recta sujetando una mancuerna en cada mano (palmas mirando hacia los lados de las piernas)."
    - "Coloca el pie derecho en la plataforma elevada. Sube a la plataforma extendiendo la cadera y la rodilla de la pierna derecha. Usa principalmente el talón para subir el resto del cuerpo y coloca también el pie de la pierna izquierda en la plataforma. Espira mientras ejecutas la fuerza necesaria para subir."
    - "Baja con la pierna izquierda flexionando la cadera y la rodilla de la pierna derecha mientras inspiras. Vuelve a la posición original de pie colocando el pie derecho junto al izquierdo en la posición inicial."
    - "Repite con la pierna derecha el número de repeticiones indicado y luego hazlo con la pierna izquierda."
Dumbbell_Tricep_Extension_-Pronated_Grip:
  name: "Extensión de tríceps con mancuernas (agarre prono)"
  instructions:
    - "Túmbate en un banco plano sujetando dos mancuernas justo encima de los hombros. Los brazos deben estar totalmente extendidos y formar un ángulo de 90 grados con el torso y el suelo."
    - "Las palmas de las manos deben mirar hacia delante y los codos deben estar pegados. Esta es la posición inicial."
    - "Ahora, inspira y baja lentamente las mancuernas hasta que estén cerca de las orejas. Asegúrate de mantener los brazos fijos y los codos pegados."
    - "Después, espira y usa los tríceps para devolver el peso a la posición inicial."
Dynamic_Back_Stretch:
  name: "Estiramiento dinámico de espalda"
  instructions:
    - "Ponte de pie con los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Manteniendo los brazos rectos, llévalos hacia arriba delante de ti 5-10 veces, aumentando el rango de movimiento cada vez hasta que los brazos estén por encima de la cabeza."
Dynamic_Chest_Stretch:
  name: "Estiramiento dinámico de pecho"
  instructions:
    - "Ponte de pie con las manos juntas y los brazos extendidos directamente delante de ti. Esta es la posición inicial."
    - "Manteniendo los brazos rectos, lleva rápidamente los brazos hacia atrás todo lo posible y vuelve a juntarlos, de forma similar a un movimiento exagerado de aplauso. Repite 5-10 veces, aumentando la velocidad a medida que lo haces."
EZ-Bar_Curl:
  name: "Curl con barra Z"
  instructions:
    - "Ponte de pie con la espalda recta sujetando una barra Z de curl por el asa exterior ancha. Las palmas de las manos deben mirar hacia delante y estar ligeramente inclinadas hacia dentro debido a la forma de la barra. Mantén los codos cerca del torso. Esta es la posición inicial."
    - "Ahora, manteniendo los brazos fijos, espira y sube las pesas hacia delante contrayendo los bíceps. Concéntrate en mover solo los antebrazos."
    - "Sigue subiendo el peso hasta que los bíceps estén totalmente contraídos y la barra esté a la altura de los hombros. Mantén la posición contraída superior un momento y aprieta los bíceps."
    - "Luego inspira y baja lentamente la barra a la posición inicial."
    - "Repite el número de repeticiones indicado."
EZ-Bar_Skullcrusher:
  name: "Press francés con barra Z"
  instructions:
    - "Con un agarre cerrado, levanta la barra Z y sujétala con los codos pegados mientras te tumbas en el banco. Los brazos deben estar perpendiculares al suelo. Esta es la posición inicial."
    - "Manteniendo los brazos fijos, baja la barra dejando que los codos se flexionen. Inspira mientras realizas esta parte del movimiento. Haz una pausa cuando la barra esté justo encima de la frente."
    - "Sube la barra de nuevo a la posición inicial extendiendo los codos y espirando."
    - "Repite."
Elbow_Circles:
  name: "Círculos con los codos"
  instructions:
    - "Siéntate o ponte de pie con los pies ligeramente separados."
    - "Coloca las manos sobre los hombros con los codos a la altura de los hombros y apuntando hacia fuera."
    - "Haz lentamente un círculo con los codos. Espira al empezar el círculo e inspira al completarlo."
Elbow_to_Knee:
  name: "Codo a rodilla"
  instructions:
    - "Túmbate en el suelo, cruzando la pierna derecha sobre la rodilla izquierda flexionada. Entrelaza las manos detrás de la cabeza, empezando con los omóplatos en el suelo. Esta es la posición inicial."
    - "Realiza el movimiento flexionando la columna y rotando el torso para llevar el codo izquierdo hacia la rodilla derecha."
    - "Vuelve a la posición inicial y repite el movimiento el número de repeticiones deseado antes de cambiar de lado."
Elbows_Back:
  name: "Codos atrás"
  instructions:
    - "Ponte de pie con la espalda recta."
    - "Coloca ambas manos en la zona lumbar, con los dedos apuntando hacia abajo y los codos hacia fuera."
    - "Luego tira suavemente de los codos hacia atrás intentando que se toquen entre sí."
Elevated_Back_Lunge:
  name: "Zancada hacia atrás elevada"
  instructions:
    - "Coloca una barra en un rack a la altura de los hombros cargada con un peso adecuado. Coloca detrás de ti una plataforma elevada y baja."
    - "Coloca la barra en la parte superior de la espalda, manteniendo la espalda arqueada y tensa. Sube a la plataforma elevada con ambos pies. Esta es la posición inicial."
    - "Empieza dando un paso hacia atrás con una pierna. Desciende flexionando caderas y rodillas hasta que la rodilla toque el suelo."
    - "Haz una pausa y extiende caderas y rodillas para subir, volviendo por completo a la posición inicial antes de alternar."
Elevated_Cable_Rows:
  name: "Remo en polea con elevación"
  instructions:
    - "Consigue una plataforma de algún tipo (puede ser una plataforma de aeróbic o de elevación de gemelos) de unos 10-15 cm de altura."
    - "Colócala sobre el asiento de la máquina de remo en polea."
    - "Siéntate en la máquina y coloca los pies en la plataforma delantera o en el travesaño previsto, asegurándote de que las rodillas estén ligeramente flexionadas y no bloqueadas."
    - "Inclínate hacia delante manteniendo la alineación natural de la espalda y agarra las asas en V."
    - "Con los brazos extendidos, tira hacia atrás hasta que el torso esté en un ángulo de 90 grados respecto a las piernas. La espalda debe estar ligeramente arqueada y el pecho sacado. Deberías notar un buen estiramiento en los dorsales mientras sujetas la barra delante de ti. Esta es la posición inicial."
    - "Manteniendo el torso fijo, tira de las asas hacia el torso manteniendo los brazos cerca de él hasta que toques los abdominales. Espira mientras realizas ese movimiento. En ese punto deberías estar apretando con fuerza los músculos de la espalda. Mantén esa contracción un segundo y vuelve lentamente a la posición original mientras inspiras."
    - "Repite el número de repeticiones indicado."
Elliptical_Trainer:
  name: "Elíptica"
  instructions:
    - "Para empezar, sube a la elíptica y selecciona la opción deseada en el menú. La mayoría de las elípticas tienen un modo manual, o puedes seleccionar un programa. Normalmente puedes introducir tu edad y tu peso para estimar las calorías quemadas durante el ejercicio. Se puede ajustar la elevación para cambiar la intensidad del entrenamiento."
    - "Las asas se pueden usar para monitorizar la frecuencia cardiaca y ayudarte a mantener una intensidad adecuada."
Exercise_Ball_Crunch:
  name: "Encogimiento abdominal en fitball"
  instructions:
    - "Túmbate sobre un fitball con la curvatura de la zona lumbar apoyada contra la superficie esférica del balón. Las piernas deben estar flexionadas por las rodillas y los pies firmemente apoyados en el suelo. La parte superior del torso debe quedar colgando sobre la parte superior del balón. Los brazos deben mantenerse a los lados del cuerpo o cruzados sobre el pecho, ya que estas posiciones evitan tensiones en el cuello (a diferencia de la posición con las manos detrás de la cabeza)."
    - "Baja el torso hasta una posición de estiramiento manteniendo el cuello fijo en todo momento. Esta es la posición inicial."
    - "Con las caderas fijas, flexiona la cintura contrayendo los abdominales y enrolla los hombros y el tronco hacia arriba hasta que notes una buena contracción en los abdominales. Los brazos simplemente deben deslizarse por el lateral de las piernas si los tienes a los lados, o permanecer sobre el pecho si los tienes cruzados. La zona lumbar debe permanecer siempre en contacto con el balón. Espira mientras realizas este movimiento y mantén la contracción un segundo."
    - "Al inspirar, vuelve a la posición inicial."
    - "Repite el número de repeticiones indicado."
Exercise_Ball_Pull-In:
  name: "Recogida de rodillas con fitball"
  instructions:
    - "Coloca un fitball cerca y túmbate en el suelo frente a él con las manos en el suelo separadas a la anchura de los hombros, en posición de flexión."
    - "Ahora coloca la parte inferior de las espinillas sobre el fitball. Consejo: en este punto las piernas deben estar totalmente extendidas con las espinillas sobre el balón y la parte superior del cuerpo debe estar en una posición de tipo flexión, sostenida por tus dos brazos extendidos delante de ti. Esta es la posición inicial."
    - "Manteniendo la espalda completamente recta y la parte superior del cuerpo fija, lleva las rodillas hacia el pecho mientras espiras, dejando que el balón ruede hacia delante bajo los tobillos. Aprieta los abdominales y mantén esa posición un segundo."
    - "Ahora estira lentamente las piernas, haciendo rodar el balón de vuelta a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Extended_Range_One-Arm_Kettlebell_Floor_Press:
  name: "Press de suelo con una kettlebell y rango ampliado"
  instructions:
    - "Túmbate en el suelo y coloca una kettlebell para que un brazo la empuje. La kettlebell debe sujetarse por el asa. La pierna del mismo lado que vas a empujar debe estar flexionada, con la rodilla cruzando la línea media del cuerpo."
    - "Empuja la kettlebell extendiendo el codo y aduciendo el brazo, presionándola por encima del cuerpo. Vuelve a la posición inicial."
External_Rotation:
  name: "Rotación externa con mancuerna"
  instructions:
    - "Túmbate de lado en un banco plano con un brazo sujetando una mancuerna y la otra mano sobre el banco, doblada para poder apoyar la cabeza en ella."
    - "Flexiona el codo del brazo que sujeta la mancuerna de modo que se forme un ángulo de 90 grados entre el brazo y el antebrazo. Consejo: mantén el brazo paralelo al torso."
    - "Ahora flexiona el codo manteniendo el brazo fijo. De este modo, el antebrazo quedará paralelo al suelo y perpendicular al torso (Consejo: así el antebrazo quedará justo delante de ti). El brazo permanecerá fijo junto al torso y debe estar paralelo al suelo (alineado con el torso en todo momento). Esta es la posición inicial."
    - "Mientras espiras, rota externamente el antebrazo de modo que la mancuerna se eleve en un movimiento semicircular manteniendo el ángulo de 90 grados entre el brazo y el antebrazo. Continuarás esta rotación externa hasta que el antebrazo esté perpendicular al suelo y el torso apuntando hacia el techo. En ese punto mantén la contracción un segundo."
    - "Mientras inspiras, vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado y luego cambia al otro brazo."
External_Rotation_with_Band:
  name: "Rotación externa con goma elástica"
  instructions:
    - "Anuda la goma elástica alrededor de un poste. La goma debe estar a la misma altura que tu codo. Colócate con el lado izquierdo hacia la goma, a unos 60 cm de distancia."
    - "Agarra el extremo de la goma con la mano derecha y mantén el codo pegado firmemente al costado. Recomendamos sujetar una almohadilla o un foam roller con el codo para mantenerlo firmemente en posición."
    - "Con el brazo en posición, el codo debe estar flexionado a 90 grados con la mano cruzando por delante del torso. Esta es la posición inicial."
    - "Ejecuta el movimiento rotando el brazo con un movimiento de revés, manteniendo el codo en su sitio."
    - "Continúa hasta donde puedas, haz una pausa y vuelve a la posición inicial."
External_Rotation_with_Cable:
  name: "Rotación externa en polea"
  instructions:
    - "Ajusta la polea a la misma altura que tu codo. Colócate con el lado izquierdo hacia la goma, a unos 60 cm de distancia."
    - "Agarra el asa con la mano derecha y mantén el codo pegado firmemente al costado. Recomendamos sujetar una almohadilla o un foam roller con el codo para mantenerlo firmemente en posición."
    - "Con el brazo en posición, el codo debe estar flexionado a 90 grados con la mano cruzando por delante del torso. Esta es la posición inicial."
    - "Ejecuta el movimiento rotando el brazo con un movimiento de revés, manteniendo el codo en su sitio."
Face_Pull:
  name: "Face pull en polea"
  instructions:
    - "De cara a una polea alta con una cuerda o dos asas acopladas, tira del peso directamente hacia la cara, separando las manos al hacerlo. Mantén los brazos paralelos al suelo."
Farmers_Walk:
  name: "Paseo del granjero"
  instructions:
    - "Hay varios implementos que se pueden usar para el paseo del granjero. También se puede realizar con mancuernas pesadas o barras cortas si no dispones de ellos. Empieza de pie entre los implementos."
    - "Tras agarrar las asas, levántalas empujando con los talones, manteniendo la espalda recta y la cabeza alta."
    - "Camina dando pasos cortos y rápidos, y no olvides respirar. Avanza una distancia determinada, normalmente de unos 15-30 m, lo más rápido posible."
Fast_Skipping:
  name: "Skipping rápido"
  instructions:
    - "Empieza en una posición relajada con una pierna ligeramente adelantada. Esta es la posición inicial."
    - "Haz skipping ejecutando un patrón de paso y salto de derecha-derecha-paso a izquierda-izquierda-paso, y así sucesivamente, alternando."
    - "Realiza skippings rápidos manteniendo un contacto cercano con el suelo y reduciendo el tiempo en el aire, moviéndote lo más rápido posible."
Finger_Curls:
  name: "Curl de dedos con barra"
  instructions:
    - "Sujeta una barra con ambas manos y las palmas hacia arriba; las manos separadas aproximadamente a la anchura de los hombros."
    - "Coloca los pies planos en el suelo, a una distancia ligeramente mayor que la anchura de los hombros. Esta es la posición inicial."
    - "Baja la barra todo lo posible extendiendo los dedos. Dejando que la barra ruede por las manos, atrápala con la última articulación de los dedos."
    - "Ahora sube la barra todo lo alto posible cerrando las manos mientras espiras. Mantén la contracción arriba."
Flat_Bench_Cable_Flyes:
  name: "Apertura en polea en banco plano"
  instructions:
    - "Coloca un banco plano entre dos poleas bajas de modo que, cuando estés tumbado en él, el pecho quede alineado con las poleas."
    - "Túmbate en el banco y mantén los pies en el suelo."
    - "Pide a alguien que te pase las asas en cada mano. Agarrarás cada asa individual con agarre supino."
    - "Extiende los brazos a los lados con una ligera flexión de los codos. Consejo: mantendrás esta flexión constante durante todo el movimiento. Los brazos deben estar paralelos al suelo. Esta es la posición inicial."
    - "Ahora empieza a levantar los brazos en un movimiento semicircular directamente delante de ti, juntando las poleas hasta que ambas manos se encuentren en la parte superior del movimiento. Aprieta el pecho mientras realizas este movimiento y espira durante el mismo. Además, mantén la contracción un segundo arriba. Consejo: si se hace correctamente, en la posición superior de este movimiento los brazos deben estar perpendiculares al torso y al suelo, tocándose sobre el pecho."
    - "Vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Flat_Bench_Leg_Pull-In:
  name: "Recogida de piernas en banco plano"
  instructions:
    - "Túmbate en una esterilla de ejercicio o en un banco plano con las piernas fuera del extremo."
    - "Coloca las manos bajo los glúteos con las palmas hacia abajo, o a los lados agarrándote al banco (o con las palmas hacia abajo a los lados si estás en una esterilla). Además, extiende las piernas rectas. Esta es la posición inicial."
    - "Flexiona las rodillas y lleva la parte superior de los muslos hacia el abdomen mientras espiras. Continúa este movimiento hasta que las rodillas estén cerca del pecho. Mantén la posición contraída un segundo."
    - "Mientras inspiras, vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Flat_Bench_Lying_Leg_Raise:
  name: "Elevación de piernas tumbado en banco plano"
  instructions:
    - "Túmbate con la espalda plana en un banco y las piernas extendidas delante de ti, fuera del extremo."
    - "Coloca las manos bajo los glúteos con las palmas hacia abajo, o a los lados agarrándote al banco. Esta es la posición inicial."
    - "Manteniendo las piernas extendidas, lo más rectas posible con las rodillas ligeramente flexionadas pero bloqueadas, eleva las piernas hasta que formen un ángulo de 90 grados con el suelo. Espira mientras realizas esta parte del movimiento y mantén la contracción arriba durante un segundo."
    - "Ahora, mientras inspiras, baja lentamente las piernas a la posición inicial."
Flexor_Incline_Dumbbell_Curls:
  name: "Curl flexor con mancuernas en banco inclinado"
  instructions:
    - "Sujeta la mancuerna hacia el lado más alejado de ti para que haya más peso en el lado más cercano a ti. (Esto se puede hacer con buen efecto en todos los ejercicios de bíceps con mancuernas). Ahora haz un curl normal con mancuernas en banco inclinado, pero mantén las muñecas lo más atrás posible para neutralizar cualquier tensión que se les aplique."
    - "Siéntate en un banco inclinado a 45 grados sujetando una mancuerna en cada mano."
    - "Deja que los brazos cuelguen a los lados, con los codos pegados, y gira las palmas de las manos hacia delante con los pulgares apuntando en dirección contraria al cuerpo. Consejo: mantendrás esta posición de las manos durante todo el movimiento, ya que no debe haber ninguna torsión de las manos al subir. Esta es la posición inicial."
    - "Sube las dos mancuernas a la vez hasta que los bíceps estén totalmente contraídos y espira. Consejo: no balancees los brazos ni uses impulso. Mantén un movimiento controlado en todo momento. Mantén la posición contraída un segundo arriba."
    - "Al inspirar, vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Floor_Glute-Ham_Raise:
  name: "Elevación glúteo-isquio en suelo"
  instructions:
    - "Puedes usar a un compañero para este ejercicio o fijar los pies bajo algo estable."
    - "Empieza de rodillas con la parte superior de las piernas y el torso erguidos. Si usas a un compañero, te sujetará los pies con firmeza para mantenerte en posición. Esta es la posición inicial."
    - "Bájate extendiendo la rodilla, procurando NO flexionar las caderas al ir hacia delante."
    - "Coloca las manos delante de ti al llegar al suelo. Este movimiento es muy difícil y puede que no puedas hacerlo sin ayuda. Usa los brazos para empujar ligeramente contra el suelo y facilitar el regreso a la posición inicial."
Floor_Press:
  name: "Press de suelo con barra"
  instructions:
    - "Ajusta los ganchos en J a la altura adecuada para colocar la barra. Empieza tumbado en el suelo con la cabeza cerca del extremo de un rack de potencia. Manteniendo los omóplatos juntos, saca la barra de los ganchos."
    - "Baja la barra hacia la parte inferior del pecho o la parte superior del estómago, apretando la barra e intentando separarla con las manos mientras lo haces. Asegúrate de mantener los codos pegados durante todo el movimiento. Baja la barra hasta que la parte superior del brazo contacte con el suelo y haz una pausa, evitando cualquier golpe o rebote del peso."
    - "Empuja la barra de nuevo hacia arriba tan rápido como puedas, manteniendo la barra, las muñecas y los codos alineados."
Floor_Press_with_Chains:
  name: "Press de suelo con cadenas"
  instructions:
    - "Ajusta los ganchos en J a la altura adecuada para colocar la barra. Para este ejercicio, coloca las cadenas directamente sobre el extremo de la barra, intentando mantener los extremos alejados de los discos."
    - "Empieza tumbado en el suelo con la cabeza cerca del extremo de un rack de potencia. Manteniendo los omóplatos juntos, saca la barra de los ganchos."
    - "Baja la barra hacia la parte inferior del pecho o la parte superior del estómago, apretando la barra e intentando separarla con las manos mientras lo haces. Asegúrate de mantener los codos pegados durante todo el movimiento. Baja la barra hasta que la parte superior del brazo contacte con el suelo y haz una pausa, evitando cualquier golpe o rebote del peso."
    - "Empuja la barra de nuevo hacia arriba tan rápido como puedas, manteniendo la barra, las muñecas y los codos alineados."
Flutter_Kicks:
  name: "Pataleo en banco"
  instructions:
    - "En un banco plano, túmbate boca abajo con las caderas en el borde del banco, las piernas rectas con las puntas de los pies altas sobre el suelo y los brazos sobre el banco agarrándote al borde delantero."
    - "Aprieta los glúteos y los isquiotibiales y estira las piernas hasta que estén a la altura de las caderas. Esta es la posición inicial."
    - "Empieza el movimiento levantando la pierna izquierda más alto que la derecha."
    - "Luego baja la pierna izquierda mientras levantas la derecha."
    - "Continúa alternando de esta manera (como si hicieras un pataleo en el agua) hasta que hayas hecho el número de repeticiones indicado con cada pierna. Asegúrate de mantener un movimiento controlado en todo momento. Consejo: respirarás con normalidad mientras realizas este movimiento."
Foot-SMR:
  name: "Automasaje de pie con rodillo"
  instructions:
    - "Este ejercicio estira la fascia de los músculos de los pies. Empieza sentado y sin zapatos. Con un rodillo para pies o un objeto similar, como un trozo pequeño de tubo de PVC, coloca el pie contra el rodillo a lo largo del arco del pie. Esta es la posición inicial."
    - "Presiona con firmeza, rodando a lo largo del arco del pie. Mantén de 10 a 30 segundos y luego cambia de pie."
Forward_Drag_with_Press:
  name: "Arrastre hacia delante con press"
  instructions:
    - "Acopla una cadena de dos asas o un accesorio de cuerda al trineo. Debes estar de espaldas al trineo, sujetando un asa en cada mano."
    - "Empieza el movimiento avanzando un paso. Inclinado hacia delante, extiende las piernas y las caderas para moverte, haciendo una pausa en cada paso para extender los codos, empujando las manos hacia delante. Avanza hasta volver a la posición inicial, preparado para empujar."
Frankenstein_Squat:
  name: "Sentadilla Frankenstein"
  instructions:
    - "Este ejercicio técnico te enseña la posición correcta de la barra y de tu cuerpo durante la cargada y la sentadilla frontal."
    - "Coloca la barra en la parte delantera de los hombros, soltando el agarre y extendiendo los brazos delante de ti. Los hombros deben empujarse hacia delante para crear una repisa, y la barra debe estar en contacto con la garganta. Asegúrate de mover solo los omóplatos hacia delante; no redondees la columna torácica."
    - "Haz la sentadilla flexionando rodillas y caderas, sentándote entre las piernas. Mantén el torso erguido, los brazos arriba y los hombros hacia delante, y la barra debe permanecer en su sitio. Baja hasta el fondo de la sentadilla, hasta que los isquiotibiales toquen los gemelos."
    - "Vuelve a la posición erguida empujando con la parte delantera del talón y extendiendo rodillas y caderas."
Freehand_Jump_Squat:
  name: "Sentadilla con salto sin peso"
  instructions:
    - "Cruza los brazos sobre el pecho."
    - "Con la cabeza alta y la espalda recta, coloca los pies a la anchura de los hombros."
    - "Manteniendo la espalda recta y el pecho alto, baja en sentadilla mientras inspiras hasta que la parte superior de los muslos esté paralela al suelo, o más abajo."
    - "Ahora, empujando principalmente con la parte delantera de los pies, salta hacia arriba lo más alto posible, usando los muslos como muelles. Espira durante esta parte del movimiento."
    - "Cuando vuelvas a tocar el suelo, baja inmediatamente en sentadilla y salta de nuevo."
    - "Repite el número de repeticiones indicado."
Frog_Hops:
  name: "Saltos de rana"
  instructions:
    - "Ponte de pie con las manos detrás de la cabeza y baja en sentadilla manteniendo el torso erguido y la cabeza alta. Esta es la posición inicial."
    - "Salta hacia delante varios pies, evitando saltar innecesariamente alto. Cuando los pies toquen el suelo, absorbe el impacto con las piernas y salta de nuevo. Repite esta acción 5-10 veces."
Frog_Sit-Ups:
  name: "Abdominales de rana"
  instructions:
    - "Túmbate con la espalda plana en el suelo (o en una esterilla) y las piernas extendidas delante de ti."
    - "Ahora flexiona las rodillas y coloca la parte exterior de los muslos junto al suelo (o la esterilla) mientras juntas las plantas de los pies."
    - "Ahora intenta empujar ambas plantas y acercarlas lo más posible a ti mientras mantienes la parte exterior de los muslos en el suelo (o al menos casi tocándolo). Consejo: en esta posición las piernas deben formar una forma de diamante."
    - "Ahora, cruza los brazos delante de ti tocando los hombros contrarios. Esta es la posición inicial."
    - "Al espirar, aplana la zona lumbar contra el suelo mientras enrollas el torso hacia arriba. Consejo: será como realizar el primer cuarto del movimiento de un abdominal. Mantén la posición superior un segundo."
    - "Al inspirar, baja lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Front_Barbell_Squat:
  name: "Sentadilla frontal con barra"
  instructions:
    - "Este ejercicio se realiza mejor dentro de un rack de sentadillas por seguridad. Para empezar, coloca primero la barra en un soporte que se ajuste a tu altura. Una vez elegida la altura correcta y cargada la barra, lleva los brazos por debajo de la barra manteniendo los codos altos y la parte superior del brazo ligeramente por encima de la paralela al suelo. Apoya la barra sobre la parte superior de los deltoides y cruza los brazos agarrando la barra para tener un control total."
    - "Saca la barra del rack empujando primero con las piernas y enderezando a la vez el torso."
    - "Aléjate del rack y coloca las piernas con una postura media a la anchura de los hombros y las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te hará perder el equilibrio, y mantén también la espalda recta. Esta es la posición inicial. (Nota: para esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas descritas en la sección de posición de los pies)."
    - "Empieza a bajar lentamente la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que el ángulo entre el muslo y la pantorrilla sea ligeramente inferior a 90 grados (que es el punto en el que los muslos quedan por debajo de la paralela al suelo). Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan de la punta de los pies), estás sometiendo la rodilla a un estrés innecesario y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra mientras espiras empujando el suelo principalmente con la parte media del pie mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Front_Barbell_Squat_To_A_Bench:
  name: "Sentadilla frontal con barra a un banco"
  instructions:
    - "Este ejercicio se realiza mejor dentro de un rack de sentadillas por seguridad. Para empezar, coloca primero un banco plano detrás de ti y la barra en un soporte que se ajuste a tu altura. Una vez elegida la altura correcta y cargada la barra, lleva los brazos por debajo de la barra manteniendo los codos altos y la parte superior del brazo ligeramente por encima de la paralela al suelo. Apoya la barra sobre la parte superior de los deltoides y cruza los brazos agarrando la barra para tener un control total."
    - "Saca la barra del rack empujando primero con las piernas y enderezando a la vez el torso."
    - "Aléjate del rack y coloca las piernas con una postura media a la anchura de los hombros y las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te hará perder el equilibrio, y mantén también la espalda recta. Esta es la posición inicial. (Nota: para esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas descritas en la sección de posición de los pies)."
    - "Empieza a bajar lentamente la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que toques el banco con los glúteos. Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan de la punta de los pies), estás sometiendo la rodilla a un estrés innecesario y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra mientras espiras empujando el suelo principalmente con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Front_Box_Jump:
  name: "Salto frontal al cajón"
  instructions:
    - "Empieza con un cajón de altura adecuada a unos 30-60 cm delante de ti. Ponte de pie con los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Haz una sentadilla corta como preparación para el salto, llevando los brazos hacia atrás."
    - "Rebota desde esta posición, extendiendo caderas, rodillas y tobillos para saltar lo más alto posible. Lleva los brazos hacia delante y arriba."
    - "Aterriza sobre el cajón con las rodillas flexionadas, absorbiendo el impacto con las piernas. Puedes saltar del cajón de vuelta al suelo o, preferiblemente, bajar con una pierna cada vez."
Front_Cable_Raise:
  name: "Elevación frontal en polea"
  instructions:
    - "Selecciona el peso en una máquina de polea baja y agarra con la mano izquierda el agarre individual acoplado a la polea baja."
    - "Colócate de espaldas a la polea y deja el brazo recto hacia abajo con el agarre de la polea delante de los muslos con el brazo extendido y las palmas de la mano mirando hacia los muslos. Esta es la posición inicial."
    - "Manteniendo el torso fijo (sin balanceos), levanta el brazo izquierdo hacia delante con una ligera flexión en el codo y las palmas de la mano mirando siempre hacia abajo. Sigue subiendo hasta que el brazo esté ligeramente por encima de la paralela al suelo. Espira mientras ejecutas esta parte del movimiento y haz una pausa de un segundo arriba."
    - "Ahora, mientras inspiras, baja lentamente el brazo a la posición inicial."
    - "Una vez realizadas todas las repeticiones indicadas con este brazo, cambia de brazo y haz el ejercicio con el derecho."
Front_Cone_Hops_or_hurdle_hops:
  name: "Saltos frontales sobre conos (o sobre vallas)"
  instructions:
    - "Coloca una fila de conos u otras barreras pequeñas, separados unos pies entre sí."
    - "Ponte de pie delante del primer cono con los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Empieza saltando con ambos pies sobre el primer cono, balanceando ambos brazos mientras saltas."
    - "Absorbe el impacto del aterrizaje flexionando las rodillas y rebota desde el primer salto saltando sobre el siguiente cono."
    - "Continúa hasta haber saltado todos los conos."
Front_Dumbbell_Raise:
  name: "Elevación frontal con mancuernas"
  instructions:
    - "Coge un par de mancuernas y ponte de pie con el torso recto y las mancuernas delante de los muslos con los brazos extendidos y las palmas de las manos mirando hacia los muslos. Esta es la posición inicial."
    - "Manteniendo el torso fijo (sin balanceos), levanta la mancuerna izquierda hacia delante con una ligera flexión en el codo y las palmas de las manos mirando siempre hacia abajo. Sigue subiendo hasta que el brazo esté ligeramente por encima de la paralela al suelo. Espira mientras ejecutas esta parte del movimiento y haz una pausa de un segundo arriba. Inspira tras la pausa de un segundo."
    - "Ahora baja lentamente la mancuerna a la posición inicial mientras levantas simultáneamente la mancuerna derecha."
    - "Continúa alternando de esta manera hasta que se hayan realizado todas las repeticiones indicadas con cada brazo."
Front_Incline_Dumbbell_Raise:
  name: "Elevación frontal con mancuernas en banco inclinado"
  instructions:
    - "Siéntate en un banco inclinado con la inclinación ajustada entre 30 y 60 grados sujetando una mancuerna en cada mano. Consejo: puedes cambiar el ángulo para trabajar el músculo de forma ligeramente distinta cada vez."
    - "Extiende los brazos rectos delante de ti con las palmas hacia abajo y las mancuernas elevadas unos 2,5 cm por encima de los muslos. Esta es la posición inicial."
    - "Sube lentamente las mancuernas en línea recta hasta que estén ligeramente por encima de los hombros, manteniendo los codos bloqueados. Aprieta arriba un segundo y asegúrate de espirar durante esta parte del movimiento. Consejo: mantén la cabeza apoyada contra el banco y las piernas en el suelo en todo momento."
    - "Baja los brazos a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Front_Leg_Raises:
  name: "Elevaciones frontales de pierna"
  instructions:
    - "Ponte de pie junto a una silla u otro soporte, agarrándote con una mano."
    - "Balancea la pierna hacia delante, manteniéndola recta. Continúa con un balanceo hacia abajo, llevando la pierna hacia atrás todo lo que te permita tu flexibilidad. Repite 5-10 veces y luego cambia de pierna."
Front_Plate_Raise:
  name: "Elevación frontal con disco"
  instructions:
    - "De pie con la espalda recta, sujeta un disco de barra con ambas manos en las posiciones de las 3 y las 9 en punto. Las palmas deben mirarse entre sí y los brazos deben estar extendidos y bloqueados con una ligera flexión en los codos, y el disco debe estar abajo cerca de la cintura, delante de ti, lo más abajo que puedas. Consejo: los brazos permanecerán en esta posición durante todo el ejercicio. Esta es la posición inicial."
    - "Sube lentamente el disco mientras espiras hasta que esté un poco por encima de la altura de los hombros. Mantén la contracción un segundo. Consejo: asegúrate de no balancear el peso ni flexionar los codos. El torso también debe permanecer fijo durante todo el movimiento."
    - "Al inspirar, baja lentamente el disco a la posición inicial."
    - "Repite el número de repeticiones indicado."
Front_Raise_And_Pullover:
  name: "Elevación frontal y pullover con barra"
  instructions:
    - "Túmbate en un banco plano sujetando una barra con agarre prono a una separación de unos 38 cm."
    - "Coloca la barra sobre la parte alta de los muslos, extiende los brazos y bloquéalos manteniendo una ligera flexión en los codos. Esta es la posición inicial."
    - "Ahora sube el peso con un movimiento semicircular y los brazos rectos mientras inspiras. Continúa el mismo movimiento hasta que la barra quede al otro lado, por encima de tu cabeza. (Consejo: la barra recorrerá aproximadamente 180 grados). En ese punto los brazos deben quedar paralelos al suelo, con las palmas de las manos mirando al techo."
    - "Ahora devuelve la barra a la posición inicial invirtiendo el movimiento mientras espiras."
    - "Repite el número de repeticiones indicado."
Front_Squat_Clean_Grip:
  name: "Sentadilla frontal (agarre de cargada)"
  instructions:
    - "Para empezar, coloca la barra en un rack ligeramente por debajo de la altura de los hombros. Apoya la barra sobre los deltoides, presionando contra las clavículas y rozando ligeramente la garganta. Tus manos deben estar en agarre de cargada, tocando la barra solo con los dedos para ayudar a mantenerla en posición."
    - "Saca la barra del rack empujando primero con las piernas y enderezando a la vez el torso. Aléjate del rack y coloca las piernas con una postura media a la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza y los codos arriba en todo momento. Esta es la posición inicial."
    - "Flexiona las rodillas y siéntate entre tus piernas. Continúa hacia abajo hasta que los isquiotibiales toquen las pantorrillas. Mantén las rodillas alineadas con los pies empujándolas hacia fuera de forma consciente con los abductores mientras haces la sentadilla."
    - "Empieza a subir la barra mientras espiras, empujando el suelo principalmente con el talón o la parte media del pie, mientras estiras de nuevo las piernas y vuelves a la posición inicial."
Front_Squats_With_Two_Kettlebells:
  name: "Sentadilla frontal con dos kettlebells"
  instructions:
    - "Lleva dos kettlebells a los hombros con una cargada. Hazlo extendiendo las piernas y las caderas mientras tiras de las kettlebells hacia los hombros. Rota las muñecas a la vez."
    - "Mirando siempre al frente, baja en sentadilla tanto como puedas y haz una pausa abajo. Al bajar, empuja las rodillas hacia fuera. Debes bajar entre tus piernas, con el torso erguido y la cabeza y el pecho arriba."
    - "Sube de nuevo empujando con los talones y repite."
Front_Two-Dumbbell_Raise:
  name: "Elevación frontal con dos mancuernas"
  instructions:
    - "Coge un par de mancuernas y colócate de pie con el torso recto y las mancuernas delante de los muslos, con los brazos estirados y las palmas de las manos mirando a los muslos. Esta es la posición inicial."
    - "Manteniendo el torso inmóvil (sin balanceo), eleva las mancuernas hacia delante con una ligera flexión de codos y las palmas de las manos siempre mirando hacia abajo. Continúa subiendo hasta que los brazos queden ligeramente por encima de la paralela al suelo. Espira durante esta parte del movimiento y haz una pausa de un segundo arriba."
    - "Mientras inspiras, baja las mancuernas lentamente hasta la posición inicial."
    - "Repite el número de repeticiones indicado."
Full_Range-Of-Motion_Lat_Pulldown:
  name: "Jalón al pecho con rango completo de movimiento"
  instructions:
    - "De pie o sentado en un banco alto, agarra dos asas de estribo unidas a las poleas altas. Agarra con la mano contraria para que los brazos queden cruzados por encima de ti y las palmas miren hacia delante."
    - "Manteniendo el pecho arriba y una ligera curvatura en la zona lumbar, tira de las asas hacia abajo como si hicieras un jalón normal. El recorrido será más bien un arco. Durante el movimiento, gira las manos de modo que en la posición inferior las palmas se miren entre sí en lugar de mirar hacia delante. Vuelve lentamente a la posición inicial y repite."
Gironda_Sternum_Chins:
  name: "Dominadas al esternón de Gironda"
  instructions:
    - "Agarra la barra de dominadas con agarre supino a la anchura de los hombros."
    - "Ahora cuélgate con los brazos totalmente extendidos, saca el pecho e inclínate hacia atrás. Consejo: estarás inclinado hacia atrás durante todo el movimiento. Esta es la posición inicial."
    - "Empieza a tirar de ti hacia la barra con la columna arqueada durante todo el movimiento y la cabeza inclinada hacia atrás, lo más lejos posible de la barra. Espira durante esta parte del movimiento. Consejo: en la parte alta del movimiento, las caderas y las piernas formarán un ángulo de unos 45 grados con el suelo."
    - "Sigue tirando hasta que la clavícula pase la barra y la parte baja del pecho o la zona del esternón la toque. Mantén esa contracción un segundo. Consejo: al completar esta parte del movimiento, la cabeza quedará paralela al suelo."
    - "Empieza a volver lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Glute_Ham_Raise:
  name: "Elevación de glúteos e isquios (glute-ham raise)"
  instructions:
    - "Empieza ajustando la máquina a tu cuerpo. Coloca los pies contra la plataforma, entre los rodillos, mientras te tumbas boca abajo. Las rodillas deben quedar justo detrás de la almohadilla."
    - "Empieza desde la parte baja del movimiento. Mantén la espalda arqueada e inicia el movimiento flexionando las rodillas. Hunde las puntas de los pies en la plataforma mientras lo haces. Mantén el tronco recto y continúa hasta que el cuerpo quede erguido."
    - "Vuelve a la posición inicial, controlando el descenso."
Glute_Kickback:
  name: "Patada de glúteo"
  instructions:
    - "Arrodíllate en el suelo o en una esterilla y flexiona la cintura con los brazos extendidos delante de ti (perpendiculares al torso), para adoptar una posición de flexión apoyado sobre las rodillas pero con los brazos separados a la anchura de los hombros. La cabeza debe mirar al frente y la flexión de las rodillas debe formar un ángulo de 90 grados entre los isquiotibiales y las pantorrillas. Esta es la posición inicial."
    - "Mientras espiras, eleva la pierna derecha hasta que los isquiotibiales queden alineados con la espalda manteniendo el ángulo de 90 grados. Contrae los glúteos durante todo el movimiento y mantén la contracción arriba un segundo. Consejo: al final del movimiento el muslo debe quedar paralelo al suelo y la pantorrilla perpendicular a él."
    - "Vuelve a la posición inicial mientras inspiras y repite ahora con la pierna izquierda."
    - "Continúa alternando las piernas hasta completar todas las repeticiones indicadas."
Goblet_Squat:
  name: "Sentadilla goblet"
  instructions:
    - "De pie, sujeta una kettlebell ligera por los asideros, cerca del pecho. Esta es la posición inicial."
    - "Baja en sentadilla entre tus piernas hasta que los isquiotibiales toquen las pantorrillas. Mantén el pecho y la cabeza arriba y la espalda recta."
    - "En la posición inferior, haz una pausa y usa los codos para empujar las rodillas hacia fuera. Vuelve a la posición inicial y repite durante 10-20 repeticiones."
Good_Morning:
  name: "Buenos días con barra"
  instructions:
    - "Empieza con una barra en un rack a la altura de los hombros. Coloca la barra sobre la parte posterior de los hombros como en una sentadilla de potencia, no sobre la parte superior de los hombros. Mantén la espalda tensa, los omóplatos juntos y las rodillas ligeramente flexionadas. Da un paso atrás para separarte del rack."
    - "Empieza flexionando las caderas, llevándolas hacia atrás mientras te inclinas hasta casi quedar paralelo al suelo. Mantén la espalda arqueada y la columna cervical bien alineada."
    - "Invierte el movimiento extendiendo las caderas con los glúteos y los isquiotibiales. Continúa hasta volver a la posición inicial."
Good_Morning_off_Pins:
  name: "Buenos días con barra desde pines"
  instructions:
    - "Empieza con una barra en un rack a aproximadamente la altura de tu estómago. Inclínate por debajo de la barra y colócala sobre la parte posterior de los hombros como en una sentadilla de potencia, no sobre la parte superior de los hombros. A la altura adecuada, deberías quedar casi paralelo al suelo al inclinarte. Mantén la espalda tensa, los omóplatos juntos y las rodillas ligeramente flexionadas. Mantén la espalda arqueada y la columna cervical bien alineada."
    - "Inicia el movimiento extendiendo las caderas con los glúteos y los isquiotibiales hasta quedar de pie con el peso. Baja lentamente el peso de vuelta a los pines, volviendo a la posición inicial."
Gorilla_Chin_Crunch:
  name: "Dominada con encogimiento (gorila)"
  instructions:
    - "Cuélgate de una barra de dominadas con agarre supino (palmas hacia ti) algo más ancho que los hombros."
    - "Ahora flexiona las rodillas a 90 grados de modo que las pantorrillas queden paralelas al suelo mientras los muslos permanecen perpendiculares a él. Esta es la posición inicial."
    - "Mientras espiras, tira de ti hacia arriba a la vez que encoges las rodillas hasta que queden a la altura del pecho. Dejarás de subir en cuanto tu nariz esté al nivel de la barra. Consejo: cuando llegues a este punto, también debes estar terminando el encogimiento al mismo tiempo."
    - "Empieza a inspirar lentamente mientras vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Groin_and_Back_Stretch:
  name: "Estiramiento de ingle y espalda"
  instructions:
    - "Siéntate en el suelo con las rodillas flexionadas y los pies juntos."
    - "Entrelaza los dedos detrás de la cabeza. Esta es la posición inicial."
    - "Enróllate hacia abajo, llevando los codos hacia la cara interna de los muslos. Tras una breve pausa, vuelve a la posición inicial con la cabeza arriba y la espalda recta. Repite durante 10-20 repeticiones."
Groiners:
  name: "Groiners"
  instructions:
    - "Empieza en posición de flexión en el suelo. Esta es la posición inicial."
    - "Con las dos piernas, salta hacia delante y cae con los pies junto a las manos. Mantén la cabeza alta mientras lo haces."
    - "Vuelve a la posición inicial y repite el movimiento de inmediato, continuando durante 10-20 repeticiones."
Hack_Squat:
  name: "Sentadilla hack"
  instructions:
    - "Apoya la espalda contra el respaldo de la máquina y coloca los hombros bajo las hombreras."
    - "Coloca las piernas en la plataforma con una postura media a la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Consejo: mantén la cabeza arriba en todo momento y la espalda apoyada en el respaldo en todo momento."
    - "Coloca los brazos en las asas laterales de la máquina y desactiva las barras de seguridad (en la mayoría de los diseños se hace moviendo las asas laterales de una posición frontal a una diagonal)."
    - "Ahora estira las piernas sin bloquear las rodillas. Esta es la posición inicial. (Nota: para esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas descritas en la sección de colocación de los pies)."
    - "Empieza a bajar lentamente la plataforma flexionando las rodillas mientras mantienes una postura recta con la cabeza arriba (espalda siempre apoyada en el respaldo). Continúa hacia abajo hasta que el ángulo entre el muslo y las pantorrillas sea ligeramente inferior a 90 grados (que es el punto en el que los muslos quedan por debajo de la paralela al suelo). Inspira durante esta parte del movimiento. Consejo: si has hecho el ejercicio correctamente, la parte frontal de las rodillas debe formar una línea recta imaginaria con los dedos de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan de los dedos de los pies), estás sometiendo la rodilla a un estrés excesivo y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la plataforma mientras espiras, empujando el suelo principalmente con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Hammer_Curls:
  name: "Curl martillo"
  instructions:
    - "De pie, con el torso erguido y una mancuerna en cada mano con los brazos estirados. Los codos deben estar cerca del torso."
    - "Las palmas de las manos deben mirar hacia tu torso. Esta es la posición inicial."
    - "Ahora, manteniendo la parte superior del brazo inmóvil, espira y sube el peso hacia delante contrayendo los bíceps. Continúa subiendo el peso hasta que los bíceps estén totalmente contraídos y la mancuerna quede a la altura del hombro. Mantén la posición contraída un breve instante mientras aprietas los bíceps. Consejo: concéntrate en mantener el codo inmóvil y mover solo el antebrazo."
    - "Tras la breve pausa, inspira y empieza a bajar lentamente las mancuernas hasta la posición inicial."
    - "Repite el número de repeticiones indicado."
Hammer_Grip_Incline_DB_Bench_Press:
  name: "Press inclinado con mancuernas (agarre martillo)"
  instructions:
    - "Túmbate hacia atrás en un banco inclinado con una mancuerna en cada mano sobre los muslos. Las palmas de las manos se mirarán entre sí."
    - "Ayudándote de los muslos para subir las mancuernas, llévalas arriba de una en una para poder sostenerlas a la anchura de los hombros."
    - "Una vez a la anchura de los hombros, mantén las palmas de las manos con agarre neutro (palmas mirándose entre sí). Mantén los codos abiertos con la parte superior de los brazos alineada con los hombros (perpendicular al torso) y los codos flexionados formando un ángulo de 90 grados entre el brazo y el antebrazo. Esta es la posición inicial."
    - "Ahora baja las pesas lentamente hacia los lados mientras inspiras. Mantén el control total de las mancuernas en todo momento."
    - "Mientras espiras, empuja las mancuernas hacia arriba usando los músculos pectorales. Bloquea los brazos en la posición contraída, mantén un segundo y empieza a bajar lentamente. Consejo: debería llevarte al menos el doble de tiempo bajar que subir."
    - "Repite el movimiento el número de repeticiones indicado."
    - "Cuando termines, vuelve a colocar las mancuernas sobre los muslos y luego en el suelo. Esta es la forma más segura de dejar las mancuernas."
Hamstring-SMR:
  name: "Foam roller de isquiotibiales"
  instructions:
    - "Sentado, extiende las piernas sobre un foam roller de modo que quede colocado en la parte posterior de los muslos. Coloca las manos a los lados o detrás de ti para ayudar a sostener tu peso. Esta es la posición inicial."
    - "Con las manos, levanta las caderas del suelo y traslada tu peso sobre el foam roller a una pierna. Relaja los isquiotibiales de la pierna que estás estirando."
    - "Desplázate sobre el foam roller desde por debajo de la cadera hasta por encima de la parte posterior de la rodilla, haciendo pausas de 10-30 segundos en los puntos de tensión. Repite con la otra pierna."
Hamstring_Stretch:
  name: "Estiramiento de isquiotibiales"
  instructions:
    - "Túmbate boca arriba con una pierna extendida hacia arriba, con la cadera a noventa grados. Mantén la otra pierna plana en el suelo."
    - "Pasa un cinturón, una goma elástica o una cuerda por la parte delantera de la planta del pie. Esta es la posición inicial."
    - "Tira del cinturón para crear tensión en las pantorrillas y los isquiotibiales. Mantén este estiramiento durante 10-30 segundos y repite con la otra pierna."
Handstand_Push-Ups:
  name: "Flexiones en pino"
  instructions:
    - "De espaldas a la pared, flexiona la cintura y coloca ambas manos en el suelo a la anchura de los hombros."
    - "Impúlsate hacia arriba contra la pared con los brazos rectos. Tu cuerpo debe quedar boca abajo con los brazos y las piernas totalmente extendidos. Mantén todo el cuerpo lo más recto posible. Consejo: si lo haces por primera vez, pide a alguien que te ayude. Además, procura mantener la cabeza mirando hacia la pared, en lugar de mirar hacia abajo."
    - "Bájate lentamente hacia el suelo mientras inspiras hasta que la cabeza casi toque el suelo. Consejo: es de suma importancia que bajes despacio para evitar lesiones en la cabeza."
    - "Empújate de nuevo hacia arriba lentamente mientras espiras hasta que los codos estén casi bloqueados."
    - "Repite el número de repeticiones indicado."
Hang_Clean:
  name: "Cargada desde colgado"
  instructions:
    - "Empieza con un agarre doble prono o de gancho a la anchura de los hombros, con la barra colgando a la altura de la mitad del muslo. La espalda debe estar recta e inclinada ligeramente hacia delante."
    - "Empieza extendiendo con fuerza las caderas, las rodillas y los tobillos, impulsando el peso hacia arriba. Mientras lo haces, encoge los hombros hacia las orejas."
    - "Recupérate de inmediato empujando con los talones, manteniendo el torso erguido y los codos arriba. Continúa hasta ponerte de pie."
Hang_Clean_-_Below_the_Knees:
  name: "Cargada desde colgado (por debajo de las rodillas)"
  instructions:
    - "Empieza con un agarre doble prono o de gancho a la anchura de los hombros, con la barra colgando justo por debajo de las rodillas. La espalda debe estar recta e inclinada ligeramente hacia delante."
    - "Empieza extendiendo con fuerza las caderas, las rodillas y los tobillos, impulsando el peso hacia arriba. Mientras lo haces, encoge los hombros hacia las orejas. Al alcanzar la extensión completa, pasa al tercer tirón encogiendo los hombros con fuerza y flexionando los brazos con los codos arriba y hacia fuera."
    - "En el punto máximo de extensión, tira de ti hacia abajo con fuerza, rotando los codos por debajo de la barra mientras lo haces. Recibe la barra en posición de sentadilla frontal, cuya profundidad dependerá de la altura de la barra al final del tercer tirón. La barra debe quedar apoyada sobre los hombros protraídos, rozando ligeramente la garganta con las manos relajadas. Continúa descendiendo hasta la posición inferior de la sentadilla, lo que ayudará en la recuperación."
    - "Recupérate de inmediato empujando con los talones, manteniendo el torso erguido y los codos arriba. Continúa hasta ponerte de pie."
Hang_Snatch:
  name: "Arrancada desde colgado"
  instructions:
    - "Empieza con un agarre ancho en la barra, prono o de gancho. Los pies deben estar justo debajo de las caderas y girados hacia fuera. Las rodillas deben estar ligeramente flexionadas y el torso inclinado hacia delante. La columna debe estar totalmente extendida y la cabeza mirando al frente. La barra debe estar a la altura de las caderas. Esta es la posición inicial."
    - "Extiende con fuerza las piernas y las caderas. En el punto máximo de extensión, encoge los hombros y deja que los codos se flexionen hacia los lados."
    - "Mientras llevas los pies a la posición de recepción, tira de ti con fuerza por debajo de la barra mientras la elevas por encima de la cabeza. Recibe la barra con el cuerpo lo más bajo posible y los brazos totalmente extendidos por encima de la cabeza."
    - "Vuelve a ponerte de pie con el peso por encima de la cabeza. A continuación, devuelve el peso al suelo de forma controlada."
Hang_Snatch_-_Below_Knees:
  name: "Arrancada desde colgado (por debajo de las rodillas)"
  instructions:
    - "Empieza con un agarre ancho en la barra, prono o de gancho. Los pies deben estar justo debajo de las caderas y girados hacia fuera. Las rodillas deben estar ligeramente flexionadas y el torso inclinado hacia delante. La columna debe estar totalmente extendida y la cabeza mirando al frente. La barra debe estar justo por debajo de las rodillas. Esta es la posición inicial."
    - "Extiende con fuerza las piernas y las caderas. En el punto máximo de extensión, encoge los hombros y deja que los codos se flexionen hacia los lados."
    - "Mientras llevas los pies a la posición de recepción, tira de ti con fuerza por debajo de la barra mientras la elevas por encima de la cabeza. Recibe la barra con el cuerpo lo más bajo posible y los brazos totalmente extendidos por encima de la cabeza."
    - "Vuelve a ponerte de pie con el peso por encima de la cabeza y, a continuación, devuelve el peso al suelo de forma controlada."
Hanging_Bar_Good_Morning:
  name: "Buenos días con barra suspendida"
  instructions:
    - "Empieza con una barra en un rack a aproximadamente la altura de tu estómago. Suspende la barra con cadenas o correas de suspensión."
    - "Inclínate por debajo de la barra y colócala sobre la parte posterior de los hombros como en una sentadilla de potencia, no sobre los trapecios. A la altura adecuada, deberías quedar casi paralelo al suelo al inclinarte. Mantén la espalda tensa, los omóplatos juntos y las rodillas ligeramente flexionadas. Mantén la espalda arqueada y la columna cervical bien alineada."
    - "Inicia el movimiento extendiendo las caderas con los glúteos y los isquiotibiales hasta quedar de pie con el peso."
    - "Baja lentamente el peso de vuelta a la posición inicial, donde queda sostenido por las cadenas."
Hanging_Leg_Raise:
  name: "Elevación de piernas colgado"
  instructions:
    - "Cuélgate de una barra de dominadas con ambos brazos extendidos por encima de ti, usando un agarre ancho o medio. Las piernas deben quedar rectas hacia abajo y la pelvis ligeramente en retroversión. Esta es la posición inicial."
    - "Eleva las piernas hasta que el torso forme un ángulo de 90 grados con ellas. Espira mientras realizas este movimiento y mantén la contracción durante un segundo aproximadamente."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Hanging_Pike:
  name: "Elevación de piernas en pica colgado"
  instructions:
    - "Cuélgate de una barra de dominadas con las piernas y los pies juntos, con agarre prono (palmas mirando hacia fuera) algo más ancho que los hombros. Consejo: puedes usar muñequeras o straps para facilitar el agarre a la barra."
    - "Ahora flexiona las rodillas a 90 grados y lleva los muslos hacia delante de modo que las pantorrillas queden perpendiculares al suelo mientras los muslos permanecen paralelos a él. Esta es la posición inicial."
    - "Sube las piernas mientras espiras hasta casi tocar la barra con las espinillas. Consejo: intenta estirar las piernas todo lo posible arriba."
    - "Baja las piernas lo más lentamente posible hasta llegar a la posición inicial. Consejo: evita balancearte y usar impulso en todo momento."
    - "Repite el número de repeticiones indicado."
Heaving_Snatch_Balance:
  name: "Heaving snatch balance"
  instructions:
    - "Este ejercicio te ayuda a aprender la arrancada. Empieza sujetando un peso ligero sobre la parte posterior de los hombros. Los pies deben estar ligeramente más separados que la anchura de las caderas y girados hacia fuera, la misma posición que usarías para hacer una sentadilla."
    - "Empieza flexionando ligeramente las rodillas y volviendo a subir de un impulso para descargar brevemente la barra. Introdúcete por debajo de la barra, elevándola por encima de la cabeza mientras desciendes a una sentadilla completa."
    - "Vuelve a ponerte de pie."
Heavy_Bag_Thrust:
  name: "Empuje de saco pesado"
  instructions:
    - "Utiliza un saco pesado para este ejercicio. Colócate erguido junto al saco, con los pies escalonados y bastante separados. Coloca la mano sobre el saco a la altura del pecho aproximadamente. Esta es la posición inicial."
    - "Empieza girando la cintura y empujando el saco hacia delante con la mayor fuerza posible. Realiza este movimiento con rapidez, alejando el saco de tu cuerpo."
    - "Recibe el saco cuando vuelva balanceándose invirtiendo estos pasos."
High_Cable_Curls:
  name: "Curl en polea alta"
  instructions:
    - "Colócate de pie entre un par de poleas altas y agarra un asa con cada mano. Coloca la parte superior de los brazos de modo que queden paralelos al suelo con las palmas de las manos mirando hacia ti. Esta es la posición inicial."
    - "Flexiona los brazos llevando las asas hacia ti hasta que queden junto a las orejas. Asegúrate de contraer los bíceps al hacerlo y de espirar. La parte superior de los brazos debe permanecer inmóvil y solo deben moverse los antebrazos. Mantén un segundo en la posición contraída mientras aprietas los bíceps."
    - "Vuelve lentamente a la posición inicial."
    - "Repite el número de repeticiones indicado."
Hip_Circles_prone:
  name: "Círculos de cadera (en cuadrupedia)"
  instructions:
    - "Colócate a cuatro patas en el suelo. Manteniendo una buena postura, levanta una rodilla flexionada del suelo. Esta es la posición inicial."
    - "Manteniendo la rodilla flexionada, rota el fémur en un arco, intentando dibujar un círculo grande con la rodilla."
    - "Realiza esto lentamente durante varias repeticiones y repite con el otro lado."
Hip_Extension_with_Bands:
  name: "Extensión de cadera con goma elástica"
  instructions:
    - "Fija un extremo de la goma a la parte inferior de un poste y engancha el otro a un tobillo."
    - "De cara al punto de anclaje de la goma, agárrate a la columna para estabilizarte."
    - "Manteniendo la cabeza y el pecho arriba, lleva la pierna con resistencia hacia atrás todo lo que puedas manteniendo la rodilla recta."
    - "Devuelve la pierna a la posición inicial."
Hip_Flexion_with_Band:
  name: "Flexión de cadera con goma elástica"
  instructions:
    - "Fija un extremo de la goma a la parte inferior de un poste y engancha el otro a un tobillo."
    - "Colócate de espaldas al punto de anclaje de la goma."
    - "Manteniendo la cabeza y el pecho arriba, sube la rodilla hasta 90 grados y haz una pausa."
    - "Devuelve la pierna a la posición inicial."
Hip_Lift_with_Band:
  name: "Elevación de cadera con goma elástica"
  instructions:
    - "Tras elegir una goma adecuada, túmbate en el centro del rack, después de fijar la goma a ambos lados de ti. Si tu rack no tiene pines, la goma se puede fijar con mancuernas pesadas u objetos similares, solo asegúrate de que no se muevan."
    - "Ajusta tu posición para que la goma quede justo sobre tus caderas. Flexiona las rodillas y apoya los pies planos en el suelo. Las manos pueden estar en el suelo o sujetando la goma en su sitio."
    - "Manteniendo los hombros en el suelo, empuja con los talones para elevar las caderas, empujando contra la goma lo más alto que puedas."
    - "Haz una pausa en la parte alta del movimiento y vuelve a la posición inicial."
Hug_A_Ball:
  name: "Abrazar un fitball"
  instructions:
    - "Siéntate en el suelo."
    - "Colócate a horcajadas sobre un fitball entre ambas piernas y baja las caderas hacia el suelo."
    - "Abraza el balón con los brazos para sostener tu cuerpo. Ajusta las piernas de modo que los pies queden planos en el suelo y las rodillas alineadas sobre los tobillos. Agarra bien el balón para que no se escape rodando y te haga caer al suelo."
Hug_Knees_To_Chest:
  name: "Abrazar las rodillas al pecho"
  instructions:
    - "Túmbate boca arriba y lleva ambas rodillas al pecho."
    - "Sujeta las piernas con los brazos por debajo de las rodillas, no por encima (eso pondría demasiada presión en las articulaciones de las rodillas)."
    - "Tira lentamente de las rodillas hacia los hombros. Esto también estira los músculos de los glúteos."
Hurdle_Hops:
  name: "Saltos de vallas"
  instructions:
    - "Prepara una fila de vallas u otras barreras pequeñas, colocándolas a aproximadamente un metro de distancia entre sí."
    - "Colócate de pie delante de la primera valla con los pies a la anchura de los hombros. Esta es la posición inicial."
    - "Empieza saltando con ambos pies por encima de la primera valla, balanceando ambos brazos mientras saltas."
    - "Amortigua el impacto de la caída flexionando las rodillas y rebota del primer salto saltando sobre la siguiente valla. Continúa hasta haber saltado todas las vallas."
Hyperextensions_Back_Extensions:
  name: "Hiperextensiones (extensiones de espalda)"
  instructions:
    - "Túmbate boca abajo en un banco de hiperextensiones, metiendo los tobillos de forma segura bajo los rodillos."
    - "Ajusta la almohadilla superior si es posible para que la parte alta de los muslos quede plana sobre la almohadilla ancha, dejando espacio suficiente para flexionar la cintura sin restricciones."
    - "Con el cuerpo recto, cruza los brazos delante de ti (mi preferencia) o detrás de la cabeza. Esta es la posición inicial. Consejo: también puedes sostener un disco delante de ti, bajo los brazos cruzados, para añadir resistencia."
    - "Empieza a inclinarte hacia delante lentamente desde la cintura todo lo que puedas manteniendo la espalda plana. Inspira mientras realizas este movimiento. Sigue avanzando hasta que notes un buen estiramiento en los isquiotibiales y ya no puedas continuar sin redondear la espalda. Consejo: nunca redondees la espalda al hacer este ejercicio. Además, algunas personas pueden llegar más lejos que otras. Lo importante es que llegues hasta donde tu cuerpo te permita sin redondear la espalda."
    - "Sube lentamente el torso hasta la posición inicial mientras inspiras. Consejo: evita la tentación de arquear la espalda más allá de una línea recta. Además, no balancees el torso en ningún momento para proteger la espalda de lesiones."
    - "Repite el número de repeticiones indicado."
Hyperextensions_With_No_Hyperextension_Bench:
  name: "Hiperextensiones sin banco de hiperextensiones"
  instructions:
    - "Con alguien sujetándote las piernas, deslízate hacia abajo hasta el borde de un banco plano hasta que las caderas queden fuera del extremo del banco. Consejo: todo el tronco debe quedar colgando hacia el suelo. Además, estarás en la misma posición que en un banco de hiperextensiones, pero el rango de movimiento será menor debido a la altura del banco plano frente a la del banco de hiperextensiones."
    - "Con el cuerpo recto, cruza los brazos delante de ti (mi preferencia) o detrás de la cabeza. Esta es la posición inicial. Consejo: también puedes sostener un disco delante de ti, bajo los brazos cruzados, para añadir resistencia."
    - "Empieza a inclinarte hacia delante lentamente desde la cintura todo lo que puedas manteniendo la espalda plana. Inspira mientras realizas este movimiento. Sigue avanzando hasta que casi toques el suelo o notes un buen estiramiento en los isquiotibiales (lo que ocurra primero). Consejo: nunca redondees la espalda al hacer este ejercicio."
    - "Sube lentamente el torso hasta la posición inicial mientras espiras. Consejo: evita la tentación de arquear la espalda más allá de una línea recta. Además, no balancees el torso en ningún momento para proteger la espalda de lesiones."
    - "Repite el número de repeticiones indicado."
IT_Band_and_Glute_Stretch:
  name: "Estiramiento de banda iliotibial y glúteo"
  instructions:
    - "Pasa un cinturón, una cuerda o una goma elástica alrededor de uno de tus pies y lleva esa pierna cruzando el cuerpo hacia el lado opuesto, manteniendo la pierna extendida mientras estás tumbado en el suelo. Esta es la posición inicial."
    - "Manteniendo el pie separado del suelo, tira del cinturón, usando la tensión para levantar los dedos de los pies. Mantén durante 10-20 segundos y repite con el otro lado."
Iliotibial_Tract-SMR:
  name: "Foam roller de banda iliotibial"
  instructions:
    - "Túmbate de lado, con la pierna de abajo apoyada sobre un foam roller entre la cadera y la rodilla. La otra pierna puede quedar cruzada delante de ti."
    - "Carga todo el peso que toleres sobre la pierna de abajo; no es necesario que esa pierna esté en contacto con el suelo. Asegúrate de relajar los músculos de la pierna que estás estirando."
    - "Desplaza la pierna sobre el foam roller desde la cadera hasta la rodilla, haciendo pausas de 10-30 segundos en los puntos de tensión. Repite con la pierna contraria."
Inchworm:
  name: "Gusano (inchworm)"
  instructions:
    - "De pie con los pies juntos. Manteniendo las piernas rectas, estírate hacia abajo y coloca las manos en el suelo justo delante de ti. Esta es la posición inicial."
    - "Empieza caminando con las manos hacia delante lentamente, alternando la izquierda y la derecha. Mientras lo haces, flexiona solo la cadera, manteniendo las piernas rectas."
    - "Sigue hasta que tu cuerpo quede paralelo al suelo en posición de flexión."
    - "Ahora, mantén las manos en su sitio y da pasos cortos con los pies, moviéndote solo unos pocos centímetros cada vez."
    - "Continúa caminando hasta que los pies queden junto a las manos, manteniendo las piernas rectas mientras lo haces."
Incline_Barbell_Triceps_Extension:
  name: "Extensión de tríceps con barra en banco inclinado"
  instructions:
    - "Sujeta una barra con agarre prono (palmas hacia abajo) algo más cerrado que la anchura de los hombros."
    - "Túmbate hacia atrás en un banco inclinado ajustado a cualquier ángulo entre 45 y 75 grados."
    - "Lleva la barra por encima de la cabeza con los brazos extendidos y los codos hacia dentro. Los brazos deben quedar alineados con el torso por encima de la cabeza. Esta es la posición inicial."
    - "Ahora baja la barra con un movimiento semicircular por detrás de la cabeza hasta que los antebrazos toquen los bíceps. Inspira mientras realizas este movimiento. Consejo: mantén la parte superior de los brazos inmóvil y cerca de la cabeza en todo momento. Solo deben moverse los antebrazos."
    - "Vuelve a la posición inicial mientras espiras y contraes los tríceps. Mantén la contracción un segundo."
    - "Repite el número de repeticiones indicado."
Incline_Bench_Pull:
  name: "Remo en banco inclinado boca abajo"
  instructions:
    - "Coge una mancuerna en cada mano y túmbate boca abajo en un banco inclinado ajustado a una inclinación de aproximadamente 30 grados."
    - "Deja que los brazos cuelguen a los lados totalmente extendidos, apuntando al suelo."
    - "Gira las muñecas hasta que las manos tengan un agarre pronado (palmas hacia abajo)."
    - "Ahora abre los codos hacia fuera. Esta es la posición inicial."
    - "Mientras espiras, empieza a subir las mancuernas como si hicieras un press de banca invertido. Lo harás flexionando los codos y subiendo la parte superior de los brazos mientras dejas que los antebrazos cuelguen. Continúa este movimiento hasta que la parte superior de los brazos esté al mismo nivel que la espalda. Consejo: los codos saldrán hacia los lados y la parte superior de los brazos y el torso deberían formar la letra \"T\" en la parte alta del movimiento. Mantén la contracción arriba un segundo."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Incline_Cable_Chest_Press:
  name: "Press de pecho inclinado en polea"
  instructions:
    - "Ajusta el peso a una cantidad adecuada y siéntate, agarrando las asas. La parte superior de los brazos debe formar unos 45 grados con el cuerpo, con la cabeza y el pecho arriba. Los codos deben estar flexionados a unos 90 grados. Esta es la posición inicial."
    - "Empieza extendiendo los codos, empujando las asas juntas hacia delante. Mantén los omóplatos retraídos mientras realizas el movimiento."
    - "Tras una pausa en la extensión completa, vuelve a la posición inicial, manteniendo la tensión en los cables."
Incline_Cable_Flye:
  name: "Apertura en polea en banco inclinado"
  instructions:
    - "Para colocarte en la posición inicial, ajusta las poleas a nivel del suelo (el nivel más bajo posible de la máquina, por debajo de tu torso)."
    - "Coloca un banco inclinado (a 45 grados) entre las poleas, selecciona un peso en cada una y agarra un asa con cada mano."
    - "Con un asa en cada mano, túmbate en el banco inclinado y junta las manos con los brazos estirados delante de la cara. Esta es la posición inicial."
    - "Con una ligera flexión de codos (para evitar estrés en el tendón del bíceps), baja los brazos hacia ambos lados en un arco amplio hasta que notes un estiramiento en el pecho. Inspira mientras realizas esta parte del movimiento. Consejo: ten en cuenta que durante todo el movimiento los brazos deben permanecer inmóviles. El movimiento solo debe producirse en la articulación del hombro."
    - "Devuelve los brazos a la posición inicial mientras aprietas los músculos del pecho y espiras. Mantén la posición contraída un segundo. Consejo: asegúrate de usar el mismo arco de movimiento que usaste para bajar los pesos."
    - "Repite el movimiento el número de repeticiones indicado."
Incline_Dumbbell_Bench_With_Palms_Facing_In:
  name: "Press inclinado con mancuernas (palmas hacia dentro)"
  instructions:
    - "Túmbate hacia atrás en un banco inclinado con una mancuerna en cada mano sobre los muslos. Las palmas de las manos se mirarán entre sí."
    - "Ayudándote de los muslos para subir las mancuernas, llévalas arriba de una en una para poder sostenerlas a la anchura de los hombros."
    - "Una vez a la anchura de los hombros, mantén las palmas de las manos con agarre neutro (palmas mirándose entre sí). Mantén los codos abiertos con la parte superior de los brazos alineada con los hombros (perpendicular al torso) y los codos flexionados formando un ángulo de 90 grados entre el brazo y el antebrazo. Esta es la posición inicial."
    - "Ahora baja las pesas lentamente hacia los lados mientras inspiras. Mantén el control total de las mancuernas en todo momento."
    - "Mientras espiras, empuja las mancuernas hacia arriba usando los músculos pectorales. Bloquea los brazos en la posición contraída, mantén un segundo y empieza a bajar lentamente. Consejo: debería llevarte al menos el doble de tiempo bajar que subir."
    - "Repite el movimiento el número de repeticiones indicado."
    - "Cuando termines, vuelve a colocar las mancuernas sobre los muslos y luego en el suelo. Esta es la forma más segura de dejar las mancuernas."
Incline_Dumbbell_Curl:
  name: "Curl con mancuernas en banco inclinado"
  instructions:
    - "Siéntate hacia atrás en un banco inclinado con una mancuerna en cada mano con los brazos estirados. Mantén los codos cerca del torso y gira las palmas de las manos hasta que miren hacia delante. Esta es la posición inicial."
    - "Manteniendo inmóvil la parte superior del brazo, sube las pesas hacia delante contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y las mancuernas queden a la altura de los hombros. Mantén la posición contraída un segundo."
    - "Empieza a llevar lentamente las mancuernas de vuelta a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Incline_Dumbbell_Flyes:
  name: "Apertura con mancuernas en banco inclinado"
  instructions:
    - "Sujeta una mancuerna en cada mano y túmbate en un banco inclinado ajustado a un ángulo de inclinación de no más de 30 grados."
    - "Extiende los brazos por encima de ti con una ligera flexión en los codos."
    - "Ahora gira las muñecas de modo que las palmas de las manos te miren. Consejo: los dedos meñiques deben quedar juntos. Esta es la posición inicial."
    - "Mientras inspiras, empieza a bajar lentamente los brazos hacia los lados manteniéndolos extendidos y rotando las muñecas hasta que las palmas de las manos se miren entre sí. Consejo: al final del movimiento los brazos estarán a tus lados con las palmas mirando al techo."
    - "Mientras espiras, empieza a subir las mancuernas de vuelta a la posición inicial invirtiendo el movimiento y rotando las manos de modo que los dedos meñiques vuelvan a quedar juntos. Consejo: ten en cuenta que el movimiento solo se produce en la articulación del hombro y en la muñeca. No hay movimiento en la articulación del codo."
    - "Repite el número de repeticiones indicado."
Incline_Dumbbell_Flyes_-_With_A_Twist:
  name: "Apertura con mancuernas en banco inclinado (con giro)"
  instructions:
    - "Sujeta una mancuerna en cada mano y túmbate en un banco inclinado ajustado a un ángulo de inclinación de no más de 30 grados."
    - "Extiende los brazos por encima de ti con una ligera flexión en los codos."
    - "Ahora gira las muñecas de modo que las palmas de las manos te miren. Consejo: los dedos meñiques deben quedar juntos. Esta es la posición inicial."
    - "Mientras inspiras, empieza a bajar lentamente los brazos hacia los lados manteniéndolos extendidos y rotando las muñecas hasta que las palmas de las manos se miren entre sí. Consejo: al final del movimiento los brazos estarán a tus lados con las palmas mirando al techo."
    - "Mientras espiras, empieza a subir las mancuernas de vuelta a la posición inicial invirtiendo el movimiento y rotando las manos de modo que los dedos meñiques vuelvan a quedar juntos. Consejo: ten en cuenta que el movimiento solo se produce en la articulación del hombro y en la muñeca. No hay movimiento en la articulación del codo."
    - "Repite el número de repeticiones indicado."
Incline_Dumbbell_Press:
  name: "Press inclinado con mancuernas"
  instructions:
    - "Túmbate hacia atrás en un banco inclinado con una mancuerna en cada mano sobre los muslos. Las palmas de las manos se mirarán entre sí."
    - "Después, ayudándote de los muslos para empujar las mancuernas hacia arriba, súbelas de una en una para poder sostenerlas a la anchura de los hombros."
    - "Una vez que tengas las mancuernas elevadas a la anchura de los hombros, gira las muñecas hacia delante de modo que las palmas de las manos miren hacia fuera. Esta es la posición inicial."
    - "Asegúrate de mantener el control total de las mancuernas en todo momento. Luego espira y empuja las mancuernas hacia arriba con el pecho."
    - "Bloquea los brazos arriba, mantén un segundo y empieza a bajar el peso lentamente. Consejo: idealmente, bajar los pesos debería llevar aproximadamente el doble de tiempo que subirlos."
    - "Repite el movimiento el número de repeticiones indicado."
    - "Cuando termines, vuelve a colocar las mancuernas sobre los muslos y luego en el suelo. Esta es la forma más segura de soltar las mancuernas."
Incline_Hammer_Curls:
  name: "Curl martillo en banco inclinado"
  instructions:
    - "Siéntate en un banco inclinado con una mancuerna en cada mano. Debes estar firmemente apoyado contra el respaldo con los pies juntos. Deja que las mancuernas cuelguen rectas a tus lados, sujetándolas con agarre neutro. Esta es la posición inicial."
    - "Inicia el movimiento flexionando el codo, intentando mantener inmóvil la parte superior del brazo."
    - "Continúa hasta la parte alta del movimiento y haz una pausa; luego vuelve lentamente a la posición inicial."
Incline_Inner_Biceps_Curl:
  name: "Curl de bíceps interno en banco inclinado"
  instructions:
    - "Sujeta una mancuerna en cada mano y túmbate hacia atrás en un banco inclinado."
    - "Las mancuernas deben quedar colgando a tus lados con los brazos estirados y las palmas mirando hacia fuera. Esta es la posición inicial."
    - "Ahora, mientras espiras, sube el peso hacia fuera y hacia arriba manteniendo los antebrazos en línea con los deltoides laterales. Continúa el curl hasta que las mancuernas queden a la altura de los hombros y a los lados de los deltoides. Consejo: el final del movimiento debería parecerse a una pose de doble bíceps."
    - "Tras una contracción de un segundo en la parte alta del movimiento, empieza a inspirar y baja lentamente las pesas de vuelta a la posición inicial por el mismo recorrido que usaste para subirlas."
    - "Repite el número de repeticiones indicado."
Incline_Push-Up:
  name: "Flexión inclinada"
  instructions:
    - "Colócate de pie frente a un banco o una plataforma elevada resistente. Coloca las manos en el borde del banco o la plataforma, algo más anchas que los hombros."
    - "Coloca los pies hacia atrás, alejados del banco o la plataforma, con los brazos y el cuerpo rectos. Los brazos deben quedar perpendiculares al cuerpo. Manteniendo el cuerpo recto, baja el pecho hasta el borde del cajón o la plataforma flexionando los brazos."
    - "Empuja el cuerpo hacia arriba hasta extender los brazos. Repite."
Incline_Push-Up_Close-Grip:
  name: "Flexión inclinada (agarre cerrado)"
  instructions:
    - "Colócate de pie frente a la barra de un multipower o una plataforma elevada resistente a una altura adecuada."
    - "Coloca las manos juntas en la barra."
    - "Coloca los pies hacia atrás, alejados de la barra, con los brazos y el cuerpo rectos. Esta es la posición inicial."
    - "Manteniendo el cuerpo recto, baja el pecho hasta la barra flexionando los brazos."
    - "Vuelve a la posición inicial extendiendo los codos y empujándote hacia arriba."
Incline_Push-Up_Depth_Jump:
  name: "Flexión inclinada con salto de profundidad"
  instructions:
    - "Para este ejercicio necesitarás un cajón de unos 30 cm de altura y dos colchonetas gruesas o steps de aeróbic."
    - "Coloca los steps justo por fuera de los hombros y apoya los pies sobre el cajón de modo que quedes en posición de flexión inclinada, con las manos justo por dentro de los steps. Esta es la posición inicial."
    - "Empieza flexionando los codos para bajar el cuerpo, invirtiendo rápidamente el movimiento para despegarte del suelo con un empuje. Al despegarte, lleva las manos sobre los steps, flexionando los codos para amortiguar el impacto."
    - "Repite el movimiento para volver a la posición inicial."
Incline_Push-Up_Medium:
  name: "Flexión inclinada (agarre medio)"
  instructions:
    - "Colócate de pie frente a la barra de un multipower o una plataforma elevada resistente a una altura adecuada."
    - "Coloca las manos en la barra, separadas aproximadamente a la anchura de los hombros."
    - "Coloca los pies hacia atrás, alejados de la barra, con los brazos y el cuerpo rectos. Esta es la posición inicial."
    - "Manteniendo el cuerpo recto, baja el pecho hasta la barra flexionando los brazos."
    - "Vuelve a la posición inicial extendiendo los codos y empujándote hacia arriba."
Incline_Push-Up_Reverse_Grip:
  name: "Flexión inclinada (agarre supino)"
  instructions:
    - "Colócate de pie frente a la barra de un multipower o una plataforma elevada resistente a una altura adecuada."
    - "Coloca las manos en la barra con las palmas hacia arriba, separadas aproximadamente a la anchura de los hombros."
    - "Coloca los pies hacia atrás, alejados de la barra, con los brazos y el cuerpo rectos. Esta es la posición inicial."
    - "Manteniendo el cuerpo recto, baja el pecho hasta la barra flexionando los brazos."
    - "Vuelve a la posición inicial extendiendo los codos y empujándote hacia arriba."
Incline_Push-Up_Wide:
  name: "Flexión inclinada (agarre ancho)"
  instructions:
    - "Colócate de pie frente a la barra de un multipower o una plataforma elevada resistente a una altura adecuada."
    - "Coloca las manos en la barra, más anchas que los hombros."
    - "Coloca los pies hacia atrás, alejados de la barra, con los brazos y el cuerpo rectos. Los brazos deben quedar perpendiculares al cuerpo. Esta es la posición inicial."
    - "Manteniendo el cuerpo recto, baja el pecho hasta la barra flexionando los brazos."
    - "Vuelve a la posición inicial extendiendo los codos y empujándote hacia arriba."
Intermediate_Groin_Stretch:
  name: "Estiramiento de ingle (nivel intermedio)"
  instructions:
    - "Túmbate boca arriba con las piernas extendidas. Pasa un cinturón, una cuerda o una goma elástica alrededor de uno de tus pies y lleva esa pierna lo más lejos que puedas hacia el lado. Esta es la posición inicial."
    - "Tira suavemente del cinturón para crear tensión en los músculos de la ingle y los isquiotibiales. Mantén durante 10-20 segundos y repite con el otro lado."
Intermediate_Hip_Flexor_and_Quad_Stretch:
  name: "Estiramiento de flexores de cadera y cuádriceps (nivel intermedio)"
  instructions:
    - "Túmbate boca abajo en el suelo, con una cuerda, un cinturón o una goma elástica pasada alrededor de un pie."
    - "Flexiona la rodilla y extiende la cadera de la pierna que vas a estirar, tirando del cinturón con ambas manos. La rodilla y la cadera deben separarse del suelo, creando tensión en los flexores de cadera y los cuádriceps. Mantén el estiramiento durante 10-20 segundos y repite con la otra pierna."
Internal_Rotation_with_Band:
  name: "Rotación interna con goma elástica"
  instructions:
    - "Enrolla la goma alrededor de un poste. La goma debe quedar a la misma altura que tu codo. Colócate con el lado derecho hacia la goma, a unos 60 cm de distancia."
    - "Agarra el extremo de la goma con la mano derecha y mantén el codo firmemente pegado al costado. Recomendamos sujetar una almohadilla o un foam roller con el codo para mantenerlo firmemente en posición."
    - "Con la parte superior del brazo en posición, el codo debe estar flexionado a 90 grados con la mano alejándose del torso. Esta es la posición inicial."
    - "Ejecuta el movimiento rotando el brazo con un gesto de derecha, manteniendo el codo en su sitio."
    - "Continúa hasta donde puedas, haz una pausa y vuelve a la posición inicial."
Inverted_Row:
  name: "Remo invertido"
  instructions:
    - "Coloca una barra en un rack a aproximadamente la altura de la cintura. También puedes usar un multipower."
    - "Agarra la barra con un agarre más ancho que los hombros y colócate colgando por debajo de la barra. El cuerpo debe estar recto con los talones en el suelo y los brazos totalmente extendidos. Esta es la posición inicial."
    - "Empieza flexionando los codos, llevando el pecho hacia la barra. Retrae los omóplatos mientras realizas el movimiento."
    - "Haz una pausa en la parte alta del movimiento y vuelve a la posición inicial."
    - "Repite el número de repeticiones deseado."
Inverted_Row_with_Straps:
  name: "Remo invertido con correas de suspensión"
  instructions:
    - "Cuelga una cuerda o unas correas de suspensión de un rack u otro objeto estable. Agarra los extremos y colócate en posición supina colgando de las cuerdas. El cuerpo debe estar recto con los talones en el suelo y los brazos totalmente extendidos. Esta es la posición inicial."
    - "Empieza flexionando los codos, llevando el pecho hacia las manos. Retrae los omóplatos mientras realizas el movimiento."
    - "Haz una pausa en la parte alta del movimiento y vuelve a la posición inicial."
    - "Repite el número de repeticiones deseado."
Iron_Cross:
  name: "Cruz de hierro"
  instructions: []
Iron_Crosses_stretch:
  name: "Cruces de hierro (estiramiento)"
  instructions:
    - "Túmbate boca abajo en el suelo, con los brazos extendidos a los lados y las palmas pegadas al suelo. Esta es la posición inicial."
    - "Para empezar, flexiona una rodilla y lleva esa pierna por detrás del cuerpo, intentando tocar el suelo cerca de la mano contraria."
    - "Vuelve rápidamente la pierna a la posición inicial y repite con la otra pierna. Continúa alternando durante 10-20 repeticiones."
Isometric_Chest_Squeezes:
  name: "Presión isométrica de pecho"
  instructions:
    - "Sentado o de pie, flexiona los brazos a 90 grados y junta las palmas de las manos delante del pecho. Consejo: las manos deben estar abiertas con las palmas juntas y los dedos apuntando hacia delante (perpendiculares al torso)."
    - "Empuja ambas manos una contra otra mientras contraes el pecho. Empieza con una tensión lenta y auméntala poco a poco. Sigue respirando con normalidad mientras realizas esta contracción."
    - "Mantén durante el número de segundos indicado."
    - "Ahora suelta la tensión lentamente."
    - "Descansa durante el tiempo indicado y repite."
Isometric_Neck_Exercise_-_Front_And_Back:
  name: "Ejercicio isométrico de cuello (delante y detrás)"
  instructions:
    - "Con la cabeza y el cuello en posición neutra (posición normal con la cabeza erguida mirando al frente), coloca ambas manos en la parte delantera de la cabeza."
    - "Ahora empuja suavemente hacia delante mientras contraes los músculos del cuello pero resistiendo cualquier movimiento de la cabeza. Empieza con una tensión lenta y auméntala poco a poco. Sigue respirando con normalidad mientras realizas esta contracción."
    - "Mantén durante el número de segundos indicado."
    - "Ahora suelta la tensión lentamente."
    - "Descansa durante el tiempo indicado y repite con las manos colocadas en la parte trasera de la cabeza."
Isometric_Neck_Exercise_-_Sides:
  name: "Ejercicio isométrico de cuello (laterales)"
  instructions:
    - "Con la cabeza y el cuello en posición neutra (posición normal con la cabeza erguida mirando al frente), coloca la mano izquierda en el lado izquierdo de la cabeza."
    - "Ahora empuja suavemente hacia la izquierda mientras contraes los músculos izquierdos del cuello pero resistiendo cualquier movimiento de la cabeza. Empieza con una tensión lenta y auméntala poco a poco. Sigue respirando con normalidad mientras realizas esta contracción."
    - "Mantén durante el número de segundos indicado."
    - "Ahora suelta la tensión lentamente."
    - "Descansa durante el tiempo indicado y repite con la mano derecha colocada en el lado derecho de la cabeza."
Isometric_Wipers:
  name: "Limpiaparabrisas isométrico"
  instructions:
    - "Adopta una posición de flexión, apoyando tu peso en las manos y los dedos de los pies mientras mantienes el cuerpo recto. Las manos deben quedar justo por fuera de la anchura de los hombros. Esta es la posición inicial."
    - "Empieza desplazando el peso de tu cuerpo lo máximo posible hacia un lado, dejando que el codo de ese lado se flexione mientras bajas el cuerpo."
    - "Invierte el movimiento extendiendo el brazo flexionado, empujándote hacia arriba y bajando después hacia el otro lado."
    - "Repite el número de repeticiones deseado."
JM_Press:
  name: "Press JM"
  instructions:
    - "Empieza el ejercicio igual que un press de banca con agarre cerrado. Te tumbarás en un banco plano sujetando una barra con los brazos estirados (totalmente extendidos) y los codos hacia dentro. Sin embargo, en lugar de tener los brazos perpendiculares al torso, asegúrate de que la barra quede en línea directa por encima de la parte alta del pecho. Esta es la posición inicial."
    - "Ahora, partiendo de una posición totalmente extendida, baja la barra como si hicieras una extensión de tríceps tumbado. Inspira mientras realizas este movimiento. Cuando llegues a la mitad del recorrido, deja que la barra ruede hacia atrás unos 2,5 cm moviendo la parte superior de los brazos hacia las piernas hasta que queden perpendiculares al torso. Consejo: mantén constante la flexión de los codos mientras llevas los brazos hacia delante."
    - "Mientras espiras, empuja la barra de vuelta hacia arriba usando los tríceps para realizar un press de banca con agarre cerrado."
    - "Ahora vuelve a la posición inicial y empieza de nuevo."
    - "Repite el número de repeticiones indicado."
Jackknife_Sit-Up:
  name: "Abdominal en navaja"
  instructions:
    - "Túmbate boca arriba en el suelo (o en una esterilla) con los brazos extendidos hacia atrás por detrás de la cabeza y las piernas también extendidas. Esta es la posición inicial."
    - "Mientras espiras, flexiona la cintura y a la vez eleva las piernas y los brazos para que se encuentren en posición de navaja. Consejo: las piernas deben estar extendidas y elevadas a un ángulo de aproximadamente 35-45 grados respecto al suelo, y los brazos deben estar extendidos y paralelos a las piernas. La parte superior del torso debe quedar despegada del suelo."
    - "Mientras inspiras, baja los brazos y las piernas de vuelta a la posición inicial."
    - "Repite el número de repeticiones indicado."
Janda_Sit-Up:
  name: "Abdominal Janda"
  instructions:
    - "Colócate en el suelo en la posición básica de abdominal: rodillas a un ángulo de noventa grados con los pies planos en el suelo y los brazos cruzados sobre el pecho o a los lados. Esta es la posición inicial."
    - "Mientras aprietas con fuerza los glúteos y los isquiotibiales, llena los pulmones de aire y, en un ascenso lento (a un ritmo de tres a seis segundos), espira lentamente. Consejo: es importante apretar los glúteos y los isquiotibiales, ya que esto provocará que los flexores de cadera se inactiven en un proceso llamado inhibición recíproca, que básicamente significa que los músculos opuestos a los contraídos se relajarán."
    - "Mientras inspiras, vuelve lentamente de forma controlada a la posición inicial."
    - "Repite el número de repeticiones indicado."
Jefferson_Squats:
  name: "Sentadilla Jefferson"
  instructions:
    - "Coloca una barra en el suelo."
    - "Colócate de pie en el centro de la barra, a lo largo de ella."
    - "Agáchate flexionando las rodillas y manteniendo la espalda recta, y agarra la parte delantera de la barra con la mano derecha. La palma debe quedar hacia dentro (agarre neutro) mirando hacia el lado izquierdo."
    - "Agarra la parte trasera de la barra con la mano izquierda. La palma de la mano debe quedar en agarre neutro (palmas mirando hacia el lado derecho). Consejo: asegúrate de que el agarre sea uniforme en la barra. El torso debe quedar justo en el centro de la barra y la distancia entre el torso y la mano derecha (que debe estar delante) debe ser la misma que la distancia entre el torso y la mano izquierda (que debe estar detrás)."
    - "Ahora ponte de pie con el peso. Consejo: los pies deben estar a la anchura de los hombros y las puntas ligeramente hacia fuera."
    - "Baja en sentadilla flexionando las rodillas y manteniendo la espalda recta hasta que la parte alta de los muslos quede paralela al suelo. Consejo: mantén la espalda lo más vertical posible respecto al suelo y la cabeza arriba. Recuerda también no dejar que las rodillas sobrepasen los dedos de los pies. Inspira durante esta parte del movimiento."
    - "Ahora impúlsate de vuelta a la posición inicial empujando con los pies. Consejo: mantén la barra colgando con los brazos estirados y los codos bloqueados con una ligera flexión. Los brazos solo sirven de ganchos. Evita levantar nada con ellos. Haz el trabajo con los muslos, no con los brazos."
Jerk_Balance:
  name: "Jerk balance"
  instructions:
    - "Este ejercicio te ayuda a aprender a impulsarte lo bastante bajo durante el envión y corrige a quienes se desplazan hacia atrás durante el movimiento. Empieza con la barra apoyada en la posición de envión, con los hombros hacia delante, el torso erguido y los pies ligeramente separados en tijera."
    - "Inicia el movimiento como en un envión normal, flexionando las rodillas manteniendo el torso vertical y empujando hacia arriba con fuerza, usando el impulso y no los brazos para elevar el peso."
    - "Mantén el pie trasero en su sitio, usándolo para impulsar el cuerpo hacia delante hasta una tijera completa mientras haces el envión. Recupérate poniéndote de pie con el peso por encima de la cabeza."
Jerk_Dip_Squat:
  name: "Dip de envión"
  instructions:
    - "Este movimiento fortalece la fase de dip del envión. Empieza con la barra apoyada en la posición de envión, con los hombros hacia delante para crear una repisa y la barra rozando ligeramente la garganta. Los pies deben estar justo debajo de las caderas, girados hacia fuera según te resulte cómodo."
    - "Manteniendo el torso vertical, baja flexionando las rodillas, dejando que se desplacen hacia delante y sin llevar las caderas hacia atrás. El dip no debe ser excesivo. Devuelve el peso a la posición inicial empujando con fuerza a través de los pies."
Jogging_Treadmill:
  name: "Trote en cinta"
  instructions:
    - "Para empezar, sube a la cinta y selecciona la opción deseada en el menú. La mayoría de las cintas tienen un ajuste manual, o puedes seleccionar un programa para correr. Normalmente puedes introducir tu edad y tu peso para estimar la cantidad de calorías quemadas durante el ejercicio. La inclinación se puede ajustar para cambiar la intensidad del entrenamiento."
    - "Las cintas ofrecen comodidad, beneficios cardiovasculares y normalmente tienen menos impacto que trotar al aire libre. Una persona de unos 68 kg quemará casi 250 calorías trotando durante 30 minutos, frente a más de 450 calorías corriendo. Mantén una postura correcta mientras trotas y agárrate a las barras solo cuando sea necesario, por ejemplo al bajar de la cinta o al comprobar tu frecuencia cardíaca."
Keg_Load:
  name: "Carga de barriles"
  instructions:
    - "Para cargar los barriles, coloca el número deseado a cierta distancia de la plataforma de carga, normalmente entre 9 y 15 m."
    - "Empieza agarrando el asa cercana del primer barril, inclinándolo sobre un lado para agarrar el borde opuesto de la base del barril. Levanta el barril hasta el pecho."
    - "Cuanto más alto puedas colocar el barril, más rápido deberías poder moverte hasta la plataforma. Normalmente no se permite apoyarlo en el hombro. Asegúrate de mantener un agarre firme del barril. Muévete lo más rápido posible hasta la plataforma y cárgalo, extendiendo las caderas, las rodillas y los tobillos para subirlo lo más alto posible."
    - "Vuelve a la posición inicial para recoger el siguiente barril y repite hasta completar la prueba."
Kettlebell_Arnold_Press:
  name: "Press Arnold con kettlebell"
  instructions:
    - "Lleva una kettlebell al hombro con una cargada. Hazlo extendiendo las piernas y las caderas mientras subes la kettlebell hacia el hombro. La palma debe mirar hacia dentro."
    - "Mirando al frente, empuja la kettlebell hacia fuera y por encima de la cabeza, rotando la muñeca de modo que la palma mire hacia delante en la parte alta del movimiento."
    - "Devuelve la kettlebell a la posición inicial, con la palma mirando hacia dentro."
Kettlebell_Dead_Clean:
  name: "Cargada desde el suelo con kettlebell"
  instructions:
    - "Coloca la kettlebell entre los pies. Para adoptar la posición inicial, lleva los glúteos hacia atrás y mira al frente."
    - "Lleva la kettlebell al hombro con una cargada. Hazlo extendiendo las piernas y las caderas mientras subes la kettlebell hacia el hombro. La muñeca debe rotar mientras lo haces."
    - "Baja la kettlebell, manteniendo los isquiotibiales cargados mediante la espalda recta y los glúteos hacia atrás."
Kettlebell_Figure_8:
  name: "Ochos con kettlebell"
  instructions:
    - "Coloca una kettlebell entre las piernas y adopta una postura más ancha que los hombros. Inclínate llevando los glúteos hacia atrás y manteniendo la espalda plana."
    - "Coge una kettlebell y pásala a la otra mano entre las piernas. La mano que recibe debe llegar desde detrás de las piernas. Ve de un lado a otro durante varias repeticiones."
Kettlebell_Halo:
  name: "Halo con kettlebell"
  instructions:
    - "De pie y erguido, con los pies separados a la anchura de las caderas. Sujeta una kettlebell boca abajo por los asideros, con la bola por encima de las manos y cerca del pecho. Tensa los abdominales y aprieta los glúteos para que las costillas se mantengan abajo. Esta es la posición inicial."
    - "Manteniendo los codos cerca de la cabeza, sube la kettlebell pasando junto a una oreja y rodeando la parte posterior de la cabeza."
    - "Continúa el círculo pasando junto a la oreja contraria y vuelve a bajar hasta la posición inicial delante del pecho, dejando que la bola pase cerca de tu cuerpo en todo momento."
    - "Completa el número indicado de círculos en una dirección y luego repite el mismo número en la dirección contraria."
    - "Muévete despacio y mantén inmóviles la cabeza, las caderas y la zona lumbar. Si la zona lumbar se arquea o la bola se aleja mucho de la cabeza, usa un peso más ligero."
Kettlebell_Halo_With_Overhead_Extension:
  name: "Halo con kettlebell y extensión por encima de la cabeza"
  instructions:
    - "De pie y erguido, con los pies separados a la anchura de las caderas. Sujeta una kettlebell boca abajo por los asideros, con la bola por encima de las manos y cerca del pecho. Tensa los abdominales y aprieta los glúteos para que las costillas se mantengan abajo. Esta es la posición inicial."
    - "Manteniendo los codos cerca de la cabeza, sube la kettlebell pasando junto a una oreja y rodéala hasta que quede detrás de la cabeza. Haz una pausa aquí."
    - "Desde esta posición, extiende los codos para empujar la kettlebell hacia arriba, por encima de la cabeza, hasta que los brazos estén rectos, manteniendo la parte superior de los brazos pegada a la cabeza."
    - "Flexiona los codos para bajar la kettlebell de vuelta a la posición de pausa detrás de la cabeza, de forma controlada."
    - "Continúa el círculo pasando junto a la oreja contraria y vuelve a bajar hasta la posición inicial delante del pecho para completar una repetición."
    - "Alterna la dirección del círculo en cada repetición. Mantén inmóviles la cabeza, las caderas y la zona lumbar durante todo el ejercicio; si la zona lumbar se arquea o no puedes alcanzar la posición por encima de la cabeza sin inclinarte hacia atrás, usa un peso más ligero o realiza el halo y la extensión como ejercicios separados."
Kettlebell_Hang_Clean:
  name: "Cargada desde colgado con kettlebell"
  instructions:
    - "Coloca la kettlebell entre los pies. Para adoptar la posición inicial, lleva los glúteos hacia atrás y mira al frente."
    - "Lleva la kettlebell al hombro con una cargada. Hazlo extendiendo las piernas y las caderas mientras subes la kettlebell hacia el hombro. La muñeca debe rotar mientras lo haces."
    - "Baja la kettlebell hasta una posición colgante entre las piernas manteniendo los isquiotibiales cargados. Mantén la cabeza arriba en todo momento."
Kettlebell_One-Legged_Deadlift:
  name: "Peso muerto a una pierna con kettlebell"
  instructions:
    - "Sujeta una kettlebell por el asa con una mano. Colócate sobre una pierna, la del mismo lado de la mano que sujeta la kettlebell."
    - "Manteniendo esa rodilla ligeramente flexionada, realiza un peso muerto con piernas rígidas flexionando la cadera y extendiendo la pierna libre hacia atrás para mantener el equilibrio."
    - "Continúa bajando la kettlebell hasta quedar paralelo al suelo y luego vuelve a la posición erguida."
Kettlebell_Overhead_Triceps_Extension:
  name: "Extensión de tríceps por encima de la cabeza con kettlebell"
  instructions:
    - "De pie con los pies separados a la anchura de las caderas, sujeta una kettlebell por los asideros con ambas manos. Empújala por encima de la cabeza hasta que los brazos estén extendidos, con la bola colgando detrás de las manos."
    - "Tensa los abdominales y mantén la parte superior de los brazos vertical y cerca de la cabeza. Esta es la posición inicial."
    - "Flexiona los codos para bajar la kettlebell por detrás de la cabeza, llegando hasta donde te permita la movilidad de los hombros sin que los codos se abran hacia fuera."
    - "Extiende los codos para empujar la kettlebell de vuelta a la posición inicial, manteniendo inmóvil la parte superior de los brazos durante todo el movimiento."
    - "Mantén las costillas abajo y evita arquear la zona lumbar al extender."
Kettlebell_Pass_Between_The_Legs:
  name: "Pase de kettlebell entre las piernas"
  instructions:
    - "Coloca una kettlebell entre las piernas y adopta una postura cómoda. Inclínate llevando los glúteos hacia atrás y manteniendo la espalda plana."
    - "Coge una kettlebell y pásala a la otra mano entre las piernas, trazando una \"W\". Ve de un lado a otro durante varias repeticiones."
Kettlebell_Pirate_Ships:
  name: "Barcos piratas con kettlebell"
  instructions:
    - "Con una postura ancha, sujeta una kettlebell con ambas manos. Deja que cuelgue a la altura de la cintura con los brazos extendidos. Esta es la posición inicial."
    - "Inicia el movimiento girando hacia un lado, balanceando la kettlebell hasta la altura de la cabeza. Haz una breve pausa en la parte alta del movimiento."
    - "Deja caer la bola mientras giras hacia el lado contrario, elevando de nuevo la kettlebell hasta la altura de la cabeza."
    - "Repite el número de repeticiones deseado."
Kettlebell_Pistol_Squat:
  name: "Sentadilla pistol con kettlebell"
  instructions:
    - "Coge una kettlebell con las dos manos y sujétala por los asideros. Mantén una pierna levantada del suelo y baja en sentadilla sobre la otra."
    - "Baja en sentadilla flexionando la rodilla y echando las caderas hacia atrás, sujetando la kettlebell delante de ti."
    - "Mantén la posición inferior un segundo y luego invierte el movimiento, empujando con el talón y manteniendo la cabeza y el pecho arriba."
    - "Vuelve a bajar y repite."
Kettlebell_Seated_Press:
  name: "Press sentado con kettlebell"
  instructions:
    - "Siéntate en el suelo y abre las piernas cómodamente."
    - "Lleva una kettlebell al hombro con una cargada."
    - "Empuja la kettlebell hacia arriba y hacia fuera hasta bloquearla por encima de la cabeza. Vuelve a la posición inicial."
Kettlebell_Seesaw_Press:
  name: "Press alterno con kettlebells"
  instructions:
    - "Lleva dos kettlebells a los hombros con una cargada."
    - "Empuja una kettlebell hacia arriba."
    - "Baja la kettlebell e inmediatamente empuja la otra. Asegúrate de hacer el mismo número de repeticiones con ambos lados."
Kettlebell_Sumo_High_Pull:
  name: "Tirón alto sumo con kettlebell"
  instructions:
    - "Coloca una kettlebell en el suelo entre los pies. Coloca los pies en una postura ancha y agarra la kettlebell con las dos manos. Lleva las caderas hacia atrás tanto como sea posible, con las rodillas flexionadas. Mantén el pecho y la cabeza arriba. Esta es la posición inicial."
    - "Empieza extendiendo las caderas y las rodillas, tirando a la vez de la kettlebell hacia los hombros y subiendo los codos mientras lo haces. Invierte el movimiento para volver a la posición inicial."
Kettlebell_Thruster:
  name: "Thruster con kettlebells"
  instructions:
    - "Lleva dos kettlebells a los hombros con una cargada. Hazlo extendiendo las piernas y las caderas mientras tiras de las kettlebells hacia los hombros. Rota las muñecas a la vez. Esta es la posición inicial."
    - "Empieza la sentadilla flexionando las caderas y las rodillas, bajando las caderas entre las piernas. Mantén la espalda recta y erguida mientras desciendes tanto como puedas."
    - "Abajo, invierte la dirección y sube de la sentadilla extendiendo las rodillas y las caderas, empujando con los talones. Mientras lo haces, empuja ambas kettlebells por encima de la cabeza extendiendo los brazos hacia arriba, usando el impulso de la sentadilla para ayudar a subir los pesos."
    - "Al empezar la siguiente repetición, devuelve los pesos a los hombros."
Kettlebell_Turkish_Get-Up_Lunge_style:
  name: "Levantamiento turco con kettlebell (estilo zancada)"
  instructions:
    - "Túmbate boca arriba en el suelo y empuja una kettlebell hasta la posición alta extendiendo el codo. Flexiona la rodilla del mismo lado que la kettlebell."
    - "Manteniendo la kettlebell bloqueada en todo momento, gira hacia el lado contrario y usa el brazo que no trabaja para ayudarte a avanzar hasta la posición de zancada. Con la mano libre, empújate hasta quedar sentado y luego pasa a una rodilla."
    - "Mirando hacia la kettlebell, ponte de pie lentamente. Invierte el movimiento hasta la posición inicial y repite."
Kettlebell_Turkish_Get-Up_Squat_style:
  name: "Levantamiento turco con kettlebell (estilo sentadilla)"
  instructions:
    - "Túmbate boca arriba en el suelo y empuja una kettlebell hasta la posición alta extendiendo el codo. Flexiona la rodilla del mismo lado que la kettlebell."
    - "Manteniendo la kettlebell bloqueada en todo momento, gira hacia el lado contrario y usa el brazo que no trabaja para ayudarte a avanzar hasta la posición de zancada."
    - "Con la mano libre, empújate hasta quedar sentado y luego progresa hasta ponerte de pie. Mirando hacia la kettlebell, ponte de pie lentamente. Invierte el movimiento hasta la posición inicial y repite."
Kettlebell_Windmill:
  name: "Molino con kettlebell"
  instructions:
    - "Coloca una kettlebell delante de tu pie adelantado y llévala por encima de la cabeza con una cargada y un press con el brazo contrario. Lleva la kettlebell al hombro extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia los hombros. Rota la muñeca mientras lo haces, de modo que la palma mire hacia delante. Empújala por encima de la cabeza extendiendo el codo."
    - "Manteniendo la kettlebell bloqueada en todo momento, saca los glúteos en dirección a la kettlebell bloqueada. Gira los pies hacia fuera en un ángulo de cuarenta y cinco grados respecto al brazo de la kettlebell bloqueada. Flexionando la cadera hacia un lado y sacando los glúteos, inclínate lentamente hasta poder tocar el suelo con la mano libre. Mantén los ojos en la kettlebell que sostienes sobre la cabeza en todo momento."
    - "Haz una pausa de un segundo tras llegar al suelo e invierte el movimiento hasta la posición inicial."
Kipping_Muscle_Up:
  name: "Muscle up con kipping"
  instructions:
    - "Agarra las anillas con agarre falso, con la base de las palmas sobre las anillas."
    - "Comienza con un movimiento balanceando ligeramente las piernas hacia atrás."
    - "Contrarresta ese movimiento llevando las piernas hacia delante y arriba, echando la barbilla y el pecho hacia atrás y tirando de ti mismo hacia arriba con ambos brazos. Al llegar a la posición alta de la dominada, lleva las anillas hacia las axilas mientras giras los hombros hacia delante, dejando que los codos vayan rectos hacia atrás. Esto te coloca en la posición correcta para continuar con la fase de fondo del movimiento."
    - "Manteniendo el control y la estabilidad, extiende los codos para completar el movimiento."
    - "Ten cuidado al bajar al suelo."
Knee_Across_The_Body:
  name: "Rodilla cruzada sobre el cuerpo"
  instructions:
    - "Túmbate en el suelo con la pierna derecha estirada. Flexiona la pierna izquierda y bájala cruzando sobre el cuerpo, manteniendo la rodilla hacia el suelo con la mano derecha. (La rodilla no necesita tocar el suelo si estás tenso)."
    - "Coloca el brazo izquierdo cómodamente a tu lado y gira la cabeza hacia la izquierda. Imagina que tienes un peso atado al coxis. Deja que el coxis caiga hacia el suelo mientras el pecho se estira en la dirección opuesta para estirar la zona lumbar. Cambia de lado."
Knee_Circles:
  name: "Círculos de rodillas"
  instructions:
    - "De pie, con las piernas juntas y las manos a la altura de la cintura."
    - "Ahora mueve las rodillas en círculos mientras respiras con normalidad."
    - "Repite el número de repeticiones indicado."
Knee_Hip_Raise_On_Parallel_Bars:
  name: "Elevación de rodillas/cadera en paralelas"
  instructions:
    - "Colócate en el banco de elevación vertical de piernas de modo que los antebrazos descansen sobre las almohadillas junto al torso y sujeta las asas. Los brazos estarán flexionados en un ángulo de 90 grados."
    - "El torso debe estar recto, con la zona lumbar pegada a la almohadilla de la máquina y las piernas extendidas apuntando hacia el suelo. Esta es la posición inicial."
    - "Ahora, mientras sueltas el aire, sube las piernas manteniéndolas extendidas. Continúa el movimiento hasta que las piernas estén aproximadamente paralelas al suelo y mantén la contracción durante un segundo. Consejo: no uses impulso ni balanceo al realizar este ejercicio."
    - "Vuelve despacio a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Knee_Tuck_Jump:
  name: "Salto con rodillas al pecho"
  instructions:
    - "Comienza de pie en una posición cómoda con las rodillas ligeramente flexionadas. Mantén las manos frente a ti, con las palmas hacia abajo y las yemas de los dedos juntas a la altura del pecho. Esta es la posición inicial."
    - "Baja rápidamente a un cuarto de sentadilla y salta de inmediato de forma explosiva hacia arriba. Lleva las rodillas hacia el pecho intentando tocar las palmas de las manos con ellas."
    - "Salta lo más alto que puedas, subiendo las rodillas, y asegura una buena caída volviendo a extender las piernas y absorbiendo el impacto dejando que las rodillas se vuelvan a flexionar."
Kneeling_Arm_Drill:
  name: "Ejercicio de braceo de rodillas"
  instructions:
    - "Este ejercicio ayuda a aumentar la eficiencia del braceo durante la carrera. Comienza de rodillas, con el pie izquierdo delante y la rodilla derecha en el suelo. Aplica presión a través del talón delantero para mantener activados los glúteos y los isquiotibiales."
    - "Empieza bloqueando los brazos con balanceos largos, como un péndulo. Cierra el ángulo de los brazos, bloqueando con ellos como lo harías al trotar, avanzando hasta una carrera y finalmente un esprint."
    - "En cuanto las manos pasen la cadera, acelera las manos hacia delante durante el movimiento de esprint para moverlas lo más rápido posible."
    - "Cambia de rodilla y repite."
Kneeling_Cable_Crunch_With_Alternating_Oblique_Twists:
  name: "Encogimiento abdominal de rodillas en polea con giros oblicuos alternos"
  instructions:
    - "Conecta una cuerda a una polea alta y coloca una esterilla en el suelo frente a ella."
    - "Agarra la cuerda con ambas manos y ponte de rodillas a unos 60 cm de la torre."
    - "Coloca la cuerda detrás de la cabeza con las manos junto a las orejas."
    - "Manteniendo las manos en el mismo sitio, contrae los abdominales y tira de la cuerda hacia abajo en un movimiento de encogimiento hasta que los codos lleguen a las rodillas."
    - "Haz una breve pausa abajo y sube de forma lenta y controlada hasta la posición inicial."
    - "Repite el mismo movimiento hacia abajo hasta la mitad del recorrido; en ese momento empieza a rotar uno de los codos hacia la rodilla contraria."
    - "De nuevo, haz una breve pausa abajo y sube de forma lenta y controlada hasta la posición inicial."
    - "Repite el mismo movimiento que antes, pero alternando con el otro codo hacia la rodilla contraria."
    - "Continúa esta serie de movimientos hasta el fallo."
Kneeling_Cable_Triceps_Extension:
  name: "Extensión de tríceps en polea de rodillas"
  instructions:
    - "Coloca un banco de lado frente a una máquina de polea alta."
    - "Sujeta por encima de la cabeza una barra recta con las manos separadas unos 15 cm y las palmas hacia abajo."
    - "Colócate de espaldas a la máquina y ponte de rodillas."
    - "Apoya la cabeza y la parte posterior de los brazos sobre el banco. Los codos deben estar flexionados con los antebrazos apuntando hacia la polea alta. Esta es la posición inicial."
    - "Manteniendo en todo momento los brazos cerca de la cabeza y los codos hacia dentro, empuja la barra hacia fuera en un movimiento semicircular hasta que los codos queden bloqueados y los brazos estén paralelos al suelo. Contrae el tríceps con fuerza y mantén esta posición durante un segundo. Suelta el aire mientras realizas este movimiento."
    - "Vuelve despacio a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Kneeling_Forearm_Stretch:
  name: "Estiramiento de antebrazos de rodillas"
  instructions:
    - "Comienza de rodillas sobre una esterilla con las palmas planas y los dedos apuntando hacia atrás, hacia las rodillas."
    - "Inclínate despacio hacia atrás manteniendo las palmas planas en el suelo hasta que notes un estiramiento en las muñecas y los antebrazos. Mantén durante 20-30 segundos."
Kneeling_High_Pulley_Row:
  name: "Remo en polea alta de rodillas"
  instructions:
    - "Selecciona el peso adecuado en una polea situada por encima de tu cabeza. Engancha una cuerda a la polea y ponte de rodillas a unos 60 cm de distancia, sujetando la cuerda frente a ti con ambos brazos extendidos. Esta es la posición inicial."
    - "Inicia el movimiento flexionando los codos y retrayendo por completo los hombros, llevando la cuerda hacia la parte alta del pecho con los codos hacia fuera."
    - "Tras una breve pausa, vuelve despacio a la posición inicial."
Kneeling_Hip_Flexor:
  name: "Estiramiento de flexores de cadera de rodillas"
  instructions:
    - "Ponte de rodillas sobre una esterilla y adelanta la rodilla derecha de modo que la planta del pie quede en el suelo, y extiende la pierna izquierda hacia atrás de modo que el empeine quede en el suelo."
    - "Desplaza el peso hacia delante hasta que notes un estiramiento en la cadera. Mantén durante 15 segundos y repite con el otro lado."
Kneeling_Jump_Squat:
  name: "Sentadilla con salto desde rodillas"
  instructions:
    - "Comienza de rodillas en el suelo con una barra apoyada sobre la parte posterior de los hombros, o puedes usar tu propio peso corporal para este ejercicio. Se puede hacer dentro de una jaula de potencia para facilitar sacar la barra del soporte."
    - "Siéntate hacia atrás con las caderas hasta que los glúteos toquen los pies, manteniendo la cabeza y el pecho altos."
    - "Sube con fuerza explosiva con las caderas, generando potencia suficiente para aterrizar con los pies planos en el suelo."
    - "Continúa con la sentadilla empujando a través de los talones y extendiendo las rodillas hasta ponerte de pie."
Kneeling_Single-Arm_High_Pulley_Row:
  name: "Remo a un brazo en polea alta de rodillas"
  instructions:
    - "Engancha una única asa a una polea alta y selecciona el peso."
    - "Ponte de rodillas frente a la torre de poleas, tomando el agarre de la polea con una mano con el brazo extendido. Esta es la posición inicial."
    - "Empezando con la palma hacia delante, tira del peso hacia el torso flexionando el codo y retrayendo la escápula. Mientras lo haces, rota la muñeca de modo que al terminar el movimiento la palma quede mirando hacia ti."
    - "Tras una breve pausa, vuelve a la posición inicial."
Kneeling_Squat:
  name: "Sentadilla de rodillas"
  instructions:
    - "Ajusta la barra a la altura adecuada en una jaula de potencia. Ponte de rodillas detrás de la barra; puede ser útil colocar una esterilla para proteger las rodillas. Colócate debajo de la barra, apoyándola sobre la parte posterior de los hombros. Las escápulas deben estar retraídas y la barra bien apretada contra la espalda. Saca el peso del soporte."
    - "Con la cabeza mirando al frente, siéntate hacia atrás con los glúteos hasta tocar las pantorrillas."
    - "Invierte el movimiento, devolviendo el torso a una posición erguida."
Landmine_180s:
  name: "Landmine 180"
  instructions:
    - "Coloca una barra en un landmine o ánclala firmemente en una esquina. Carga la barra con un peso adecuado."
    - "Levanta la barra del suelo y llévala a la altura de los hombros con ambas manos y los brazos extendidos frente a ti. Adopta una postura amplia. Esta es la posición inicial."
    - "Realiza el movimiento rotando el tronco y las caderas mientras balanceas el peso hasta bajarlo por completo hacia un lado. Mantén los brazos extendidos durante todo el ejercicio."
    - "Invierte el movimiento para balancear el peso por completo hacia el lado opuesto."
    - "Continúa alternando el movimiento hasta completar la serie."
Landmine_Linear_Jammer:
  name: "Jammer lineal con landmine"
  instructions:
    - "Coloca una barra en un landmine o, si no tienes uno, ánclala firmemente en una esquina. Carga la barra con un peso adecuado y coloca el accesorio de asa en la barra."
    - "Levanta la barra del suelo y lleva las asas a los hombros. Esta es la posición inicial."
    - "En una postura atlética, haz una sentadilla flexionando las caderas y llevándolas hacia atrás, manteniendo los brazos flexionados."
    - "Invierte el movimiento extendiendo con potencia las caderas, las rodillas y los tobillos, extendiendo también los codos para estirar los brazos. Este movimiento debe hacerse de forma explosiva, saliendo de la sentadilla hasta la extensión completa con la máxima potencia posible."
    - "Vuelve a la posición inicial."
Lateral_Bound:
  name: "Zancada lateral saltada"
  instructions:
    - "Adopta una posición de media sentadilla orientado a 90 grados de tu dirección de desplazamiento. Esta es la posición inicial."
    - "Deja que la pierna delantera haga un contramovimiento hacia dentro mientras desplazas el peso a la pierna exterior."
    - "Impúlsate de inmediato y extiéndete, intentando saltar lateralmente lo más lejos posible."
    - "Al aterrizar, impúlsate de inmediato en la dirección opuesta, volviendo a tu posición inicial."
    - "Continúa de un lado a otro durante varias repeticiones."
Lateral_Box_Jump:
  name: "Salto lateral al cajón"
  instructions:
    - "Adopta una posición cómoda de pie, con un cajón bajo colocado a tu lado. Esta es la posición inicial."
    - "Baja rápidamente a un cuarto de sentadilla para iniciar el reflejo de estiramiento e invierte de inmediato la dirección para saltar hacia arriba y hacia el lado."
    - "Sube las rodillas lo suficiente para asegurar que los pies pasen con holgura sobre el cajón."
    - "Aterriza en el centro del cajón, usando las piernas para absorber el impacto."
    - "Salta con cuidado hacia abajo al otro lado del cajón y continúa de un lado a otro durante varias repeticiones."
Lateral_Cone_Hops:
  name: "Saltos laterales sobre conos"
  instructions:
    - "Coloca varios conos en fila separados por varios pies (aproximadamente un metro)."
    - "Colócate junto al extremo de los conos, orientado a 90 grados de la dirección de desplazamiento. Esta es la posición inicial."
    - "Inicia el salto flexionando las rodillas para activar el reflejo de estiramiento e invierte de inmediato la dirección para impulsarte del suelo, saltando hacia arriba y hacia el lado por encima del cono."
    - "Usa las piernas para absorber el impacto al aterrizar y rebota hacia el siguiente salto, avanzando a lo largo de la fila de conos."
Lateral_Raise_-_With_Bands:
  name: "Elevación lateral con gomas elásticas"
  instructions:
    - "Para empezar, colócate de pie sobre una goma elástica de modo que la tensión comience con los brazos estirados. Agarra las asas con un agarre prono (palmas hacia los muslos) algo más estrecho que la anchura de los hombros. Las asas deben apoyarse a los lados de los muslos. Los brazos deben estar extendidos con una ligera flexión en los codos y la espalda recta. Esta es la posición inicial."
    - "Usa la parte lateral de los hombros para elevar las asas hacia los lados mientras sueltas el aire. Continúa elevando las asas hasta que estén ligeramente por encima del paralelo. Consejo: al elevar las asas, inclina ligeramente la mano como si estuvieras vertiendo agua y mantén los brazos extendidos. Además, mantén el torso inmóvil y haz una pausa de un segundo en la parte alta del movimiento."
    - "Baja las asas despacio hasta la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Latissimus_Dorsi-SMR:
  name: "Liberación miofascial del dorsal ancho (foam roller)"
  instructions:
    - "Tumbado en el suelo, coloca un foam roller bajo la espalda y hacia un lado, justo detrás de la axila. Esta es la posición inicial."
    - "Mantén el brazo del lado que estás estirando detrás y hacia el lado de ti mientras desplazas el peso sobre los dorsales, manteniendo la parte superior del cuerpo despegada del suelo. Mantén durante 10-30 segundos y cambia de lado."
Leg-Over_Floor_Press:
  name: "Press en el suelo con pierna cruzada"
  instructions:
    - "Túmbate en el suelo con una kettlebell sobre el pecho, sujetándola por el asa. Cruza la pierna del lado que trabaja sobre la pierna del lado que no trabaja. El brazo libre puede extenderse hacia el lado para apoyo."
    - "Presiona la kettlebell hasta la extensión completa."
    - "Baja el peso hasta que el codo toque el suelo, manteniendo la kettlebell por encima del codo. Repite el número de repeticiones deseado."
Leg-Up_Hamstring_Stretch:
  name: "Estiramiento de isquiotibiales con pierna elevada"
  instructions:
    - "Túmbate boca arriba, flexiona una rodilla y apoya ese pie plano en el suelo para estabilizar la columna."
    - "Extiende la otra pierna en el aire. Si estás tenso, no podrás estirarla del todo. No pasa nada. Extiende la rodilla de modo que la planta del pie elevado mire al techo (o lo más cerca que puedas)."
    - "Estira despacio las piernas todo lo posible y luego tira de la pierna hacia la nariz. Cambia de lado."
Leg_Extensions:
  name: "Extensión de cuádriceps"
  instructions:
    - "Para este ejercicio necesitarás una máquina de extensión de cuádriceps. Primero elige el peso y siéntate en la máquina con las piernas bajo la almohadilla (con los pies apuntando hacia delante) y las manos sujetando las barras laterales. Esta es la posición inicial. Consejo: tendrás que ajustar la almohadilla para que quede sobre la parte inferior de la pierna (justo por encima de los pies). Además, asegúrate de que las piernas formen un ángulo de 90 grados entre la parte inferior y superior de la pierna. Si el ángulo es menor de 90 grados, significa que la rodilla está por delante de los dedos de los pies, lo que genera una tensión excesiva en la articulación de la rodilla. Si la máquina está diseñada así, busca otra máquina o asegúrate, al empezar a ejecutar el ejercicio, de dejar de bajar cuando alcances el ángulo de 90 grados."
    - "Usando los cuádriceps, extiende las piernas al máximo mientras sueltas el aire. Asegúrate de que el resto del cuerpo permanezca inmóvil en el asiento. Haz una pausa de un segundo en la posición contraída."
    - "Baja despacio el peso a la posición original mientras inspiras, asegurándote de no pasar del límite del ángulo de 90 grados."
    - "Repite el número de repeticiones indicado."
Leg_Lift:
  name: "Elevación de pierna"
  instructions:
    - "De pie y erguido, con ambos pies juntos a aproximadamente la anchura de los hombros, agárrate a una superficie firme, como los laterales de una jaula de sentadillas o el respaldo de una silla, para sujetarte y mantener el equilibrio."
    - "Con o sin tobillera lastrada, eleva una pierna hacia atrás como si hicieras un curl femoral pero de pie, manteniendo la otra pierna recta. Suelta el aire mientras realizas este movimiento."
    - "Baja despacio la pierna elevada hasta el suelo mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "Repite el movimiento con la pierna contraria."
Leg_Press:
  name: "Prensa de piernas"
  instructions:
    - "En una máquina de prensa de piernas, siéntate y coloca las piernas sobre la plataforma justo frente a ti con una postura media (a la anchura de los hombros). (Nota: para esta explicación usaremos la postura media descrita, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas descritas en la sección de posición de los pies)."
    - "Baja las barras de seguridad que sujetan la plataforma con peso y empuja la plataforma hacia arriba hasta que las piernas queden completamente extendidas frente a ti. Consejo: asegúrate de no bloquear las rodillas. El torso y las piernas deben formar un ángulo perfecto de 90 grados. Esta es la posición inicial."
    - "Mientras inspiras, baja despacio la plataforma hasta que la parte superior e inferior de las piernas formen un ángulo de 90 grados."
    - "Empujando principalmente con los talones y usando los cuádriceps, vuelve a la posición inicial mientras sueltas el aire."
    - "Repite el número de repeticiones indicado y asegúrate de bloquear correctamente los pasadores de seguridad al terminar. No querrás que la plataforma, totalmente cargada, te caiga encima."
Leg_Pull-In:
  name: "Recogida de piernas"
  instructions:
    - "Túmbate sobre una esterilla con las piernas extendidas y las manos con las palmas hacia abajo a tu lado o bajo los glúteos. Consejo: yo prefiero las manos a mi lado. Esta es la posición inicial."
    - "Flexiona las rodillas y lleva la parte superior de los muslos hacia el abdomen mientras sueltas el aire. Continúa el movimiento hasta que las rodillas estén aproximadamente a la altura del pecho. Contrae los abdominales mientras ejecutas este movimiento y mantén durante un segundo arriba. Consejo: durante el movimiento, la parte inferior de las piernas (gemelos) debe permanecer siempre paralela al suelo."
    - "Vuelve a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Leverage_Chest_Press:
  name: "Press de pecho en máquina de palanca"
  instructions:
    - "Carga un peso adecuado en los pasadores y ajusta el asiento a tu altura. Las asas deben estar cerca de la parte inferior o media de los pectorales al comenzar el movimiento."
    - "El pecho y la cabeza deben estar erguidos y las escápulas retraídas. Esta es la posición inicial."
    - "Empuja las asas hacia delante extendiendo los codos."
    - "Tras una breve pausa arriba, devuelve el peso justo por encima de la posición inicial, manteniendo la tensión en los músculos al no apoyar el peso en los topes hasta terminar la serie."
Leverage_Deadlift:
  name: "Peso muerto en máquina de palanca"
  instructions:
    - "Carga los pasadores con un peso adecuado. Colócate justo entre las asas. Agarra las asas inferiores con un agarre cómodo y luego baja las caderas mientras tomas aire. Mira al frente con la cabeza y mantén el pecho alto. Esta es la posición inicial."
    - "Devuelve el peso a la posición inicial."
Leverage_Decline_Chest_Press:
  name: "Press de pecho declinado en máquina de palanca"
  instructions:
    - "Carga un peso adecuado en los pasadores y ajusta el asiento a tu altura. Las asas deben estar cerca de la parte inferior de los pectorales al comenzar el movimiento. El pecho y la cabeza deben estar erguidos y las escápulas retraídas. Esta es la posición inicial."
    - "Empuja las asas hacia delante extendiendo los codos."
    - "Tras una breve pausa arriba, devuelve el peso justo por encima de la posición inicial, manteniendo la tensión en los músculos al no apoyar el peso en los topes hasta terminar la serie."
Leverage_High_Row:
  name: "Remo alto en máquina de palanca"
  instructions:
    - "Carga un peso adecuado en los pasadores y ajusta la altura del asiento de modo que apenas llegues a las asas situadas sobre ti. Ajusta la almohadilla de las rodillas para ayudarte a mantenerte abajo. Agarra las asas con agarre prono. Esta es la posición inicial."
    - "Tira de las asas hacia el torso, retrayendo las escápulas mientras flexionas los codos."
    - "Haz una pausa en la parte baja del movimiento y luego devuelve despacio las asas a la posición inicial."
    - "Si haces varias repeticiones, evita devolver el peso por completo a los topes para mantener la tensión en los músculos trabajados."
Leverage_Incline_Chest_Press:
  name: "Press de pecho inclinado en máquina de palanca"
  instructions:
    - "Carga un peso adecuado en los pasadores y ajusta el asiento a tu altura. Las asas deben estar cerca de la parte superior de los pectorales al comenzar el movimiento. El pecho y la cabeza deben estar erguidos y las escápulas retraídas. Esta es la posición inicial."
    - "Empuja las asas hacia delante extendiendo los codos."
    - "Tras una breve pausa arriba, devuelve el peso justo por encima de la posición inicial, manteniendo la tensión en los músculos al no apoyar el peso en los topes hasta terminar la serie."
Leverage_Iso_Row:
  name: "Remo unilateral en máquina de palanca"
  instructions:
    - "Carga un peso adecuado en los pasadores y ajusta la altura del asiento de modo que las asas queden a la altura del pecho. Agarra las asas con agarre neutro o prono. Esta es la posición inicial."
    - "Tira de las asas hacia el torso, retrayendo las escápulas mientras flexionas los codos."
    - "Haz una pausa en la parte baja del movimiento y luego devuelve despacio las asas a la posición inicial. Si haces varias repeticiones, evita devolver el peso por completo a los topes para mantener la tensión en los músculos trabajados."
Leverage_Shoulder_Press:
  name: "Press de hombros en máquina de palanca"
  instructions:
    - "Carga un peso adecuado en los pasadores y ajusta el asiento a tu altura. Las asas deben estar cerca de la parte superior de los hombros al comenzar el movimiento. El pecho y la cabeza deben estar erguidos y las asas sujetas con agarre prono. Esta es la posición inicial."
    - "Empuja las asas hacia arriba extendiendo los codos."
    - "Tras una breve pausa arriba, devuelve el peso justo por encima de la posición inicial, manteniendo la tensión en los músculos al no apoyar el peso en los topes hasta terminar la serie."
Leverage_Shrug:
  name: "Encogimiento de hombros en máquina de palanca"
  instructions:
    - "Carga los pasadores con un peso adecuado. Colócate justo entre las asas."
    - "Agarra las asas superiores con un agarre cómodo y luego baja las caderas mientras tomas aire. Mira al frente con la cabeza y mantén el pecho alto."
    - "Empuja contra el suelo con los talones, extendiendo las caderas y las rodillas hasta ponerte de pie. Mantén los brazos rectos durante todo el movimiento, terminando con los hombros hacia atrás. Esta es la posición inicial."
    - "Eleva el peso encogiendo los hombros hacia las orejas, moviéndote recto hacia arriba y hacia abajo."
    - "Haz una pausa en la parte alta del movimiento y luego devuelve el peso a la posición inicial."
Linear_3-Part_Start_Technique:
  name: "Técnica de salida lineal en 3 fases"
  instructions:
    - "Este ejercicio te ayuda a acelerar lo más rápido posible hasta un esprint desde parado. Resulta útil usar una línea como punto de salida. Comienza con los dos pies en la línea. Coloca el pie izquierdo con la punta junto al tobillo derecho. Coloca el pie derecho unos 10-15 cm por detrás del izquierdo."
    - "Coloca la mano derecha sobre la línea y luego acerca la nariz a la rodilla izquierda."
    - "Agáchate mientras te inclinas hacia delante, con la cabeza más baja que las caderas y el peso cargado sobre la pierna izquierda. Esta es la posición inicial."
    - "Lleva la mano izquierda hacia arriba de modo que quede paralela al suelo, apuntando hacia atrás, y sal de forma explosiva cuando estés listo."
Linear_Acceleration_Wall_Drill:
  name: "Ejercicio de aceleración lineal contra la pared"
  instructions:
    - "Inclínate unos 45 grados contra una pared. Los pies deben estar juntos y los glúteos contraídos."
    - "Comienza levantando rápidamente la rodilla derecha, haciendo una pausa y luego llevándola recta hacia abajo contra el suelo."
    - "Cambia de pierna, subiendo la rodilla contraria y luego atacando el suelo recto hacia abajo."
    - "Repite una vez más con la pierna derecha y, en cuanto el pie derecho toque el suelo, golpea el suelo rápidamente alternando izquierda y derecha lo más rápido que puedas."
Linear_Depth_Jump:
  name: "Salto en profundidad lineal"
  instructions:
    - "Necesitarás dos cajones o bancos separados unos pies entre sí. Comienza de pie sobre un cajón mirando hacia la otra plataforma."
    - "Para iniciar el movimiento, déjate caer suavemente al suelo entre las plataformas, permitiendo que las rodillas y las caderas se flexionen."
    - "Invierte el movimiento de forma explosiva, extendiendo las caderas, las rodillas y los tobillos para saltar sobre la otra plataforma."
    - "Aterriza con suavidad, absorbiendo el impacto con las piernas."
Log_Lift:
  name: "Log lift"
  instructions:
    - "Comienza de pie con el tronco frente a ti. Agarra las asas y empieza a subir el tronco en cargada. Mientras estás inclinado para iniciar la cargada, intenta subir el tronco lo más alto posible, llevándolo hacia el pecho. Extiende las caderas y las rodillas para subirlo y completar la cargada."
    - "Echa la cabeza hacia atrás y mira hacia arriba, creando una repisa en el pecho sobre la que apoyar el tronco. Comienza el press flexionando ligeramente las rodillas y revirtiendo el movimiento. Este push press generará impulso para que el tronco empiece a moverse en vertical. Continúa extendiendo los codos para empujar el tronco por encima de la cabeza. No hay reglas estrictas de técnica, así que usa las que te resulten más eficientes. Mientras se empuja el tronco, asegúrate de pasar la cabeza hacia delante en cada repetición, mirando al frente."
    - "Repite tantas veces como sea posible. Intenta controlar el descenso del tronco al devolverlo al suelo."
London_Bridges:
  name: "London bridges"
  instructions:
    - "Ata una cuerda de escalada a una viga alta o travesaño. Debajo, asegúrate de que la barra del multipower esté bloqueada con los seguros y no pueda moverse. Como alternativa, también se puede utilizar un cajón seguro."
    - "Colócate de pie sobre la barra, usando la cuerda para mantener el equilibrio. Esta es la posición inicial."
    - "Manteniendo el cuerpo recto, inclínate hacia atrás y baja el cuerpo avanzando despacio mano sobre mano por la cuerda. Continúa hasta quedar perpendicular al suelo."
    - "Manteniendo el cuerpo recto, invierte el movimiento, volviendo mano sobre mano a la posición inicial."
Looking_At_Ceiling:
  name: "Mirar al techo"
  instructions:
    - "Ponte de rodillas en el suelo, sujetando los talones con ambas manos."
    - "Eleva los glúteos hacia arriba y hacia delante mientras llevas la cabeza hacia atrás para mirar al techo, de modo que la espalda forme un arco."
Low_Cable_Crossover:
  name: "Cruce de poleas bajas"
  instructions:
    - "Para colocarte en la posición inicial, coloca las poleas en la posición baja, selecciona la resistencia a utilizar y agarra un asa con cada mano."
    - "Da un paso adelante, ganando tensión en las poleas. Las palmas deben mirar hacia delante, las manos por debajo de la cintura y los brazos rectos. Esta es la posición inicial."
    - "Con una ligera flexión en los brazos, lleva las manos hacia arriba y hacia la línea media del cuerpo. Las manos deben juntarse frente al pecho, con las palmas hacia arriba."
    - "Devuelve los brazos a la posición inicial tras una breve pausa."
Low_Cable_Triceps_Extension:
  name: "Extensión de tríceps en polea baja"
  instructions:
    - "Selecciona el peso deseado y túmbate boca arriba en el banco de una máquina de remo sentado que tenga una cuerda enganchada. La cabeza debe apuntar hacia el accesorio."
    - "Agarra los extremos de la cuerda por fuera con las palmas enfrentadas (agarre neutro)."
    - "Coloca los codos de modo que estén flexionados en un ángulo de 90 grados y la parte superior de los brazos perpendicular (ángulo de 90 grados) al torso. Consejo: mantén los codos hacia dentro y asegúrate de que la parte superior de los brazos apunte al techo mientras los antebrazos apuntan hacia la polea situada sobre tu cabeza. Esta es la posición inicial."
    - "Mientras sueltas el aire, extiende los antebrazos hasta que estén rectos y verticales. La parte superior de los brazos y los codos permanecen inmóviles durante todo el movimiento. Solo deben moverse los antebrazos. Contrae el tríceps con fuerza durante un segundo."
    - "Mientras inspiras, vuelve despacio a la posición inicial."
    - "Repite el número de repeticiones indicado."
Low_Pulley_Row_To_Neck:
  name: "Remo en polea baja al cuello"
  instructions:
    - "Siéntate en una máquina de remo en polea baja con un accesorio de cuerda."
    - "Agarra los extremos de la cuerda con las palmas hacia abajo y siéntate con la espalda recta y las rodillas ligeramente flexionadas. Consejo: mantén la espalda casi completamente vertical y los brazos totalmente extendidos frente a ti. Esta es la posición inicial."
    - "Manteniendo el torso inmóvil, eleva los codos y empieza a flexionarlos mientras tiras de la cuerda hacia el cuello soltando el aire. Durante todo el movimiento la parte superior de los brazos debe permanecer paralela al suelo. Consejo: continúa este movimiento hasta que las manos estén casi junto a las orejas (los antebrazos no estarán paralelos al suelo al final del movimiento, ya que estarán angulados un poco hacia arriba) y los codos estén hacia fuera, alejados de los costados."
    - "Tras mantener un segundo aproximadamente en la posición contraída, vuelve despacio a la posición inicial mientras inspiras. Consejo: de nuevo, en ninguna parte del movimiento debe moverse el torso."
    - "Repite el número de repeticiones indicado."
Lower_Back-SMR:
  name: "Liberación miofascial lumbar (foam roller)"
  instructions:
    - "Sentado, coloca un foam roller bajo la zona lumbar. Cruza los brazos frente a ti y protrae los hombros. Esta es la posición inicial."
    - "Eleva las caderas del suelo e inclínate hacia atrás, manteniendo el peso sobre la zona lumbar. Ahora desplaza ligeramente el peso hacia un lado, manteniéndolo fuera de la columna y sobre los músculos a un lado de ella. Rueda sobre la zona lumbar, manteniendo los puntos de tensión durante 10-30 segundos. Repite en el otro lado."
Lower_Back_Curl:
  name: "Curl lumbar"
  instructions:
    - "Túmbate boca abajo con los brazos extendidos hacia los lados. Esta es la posición inicial."
    - "Usando los músculos de la zona lumbar, extiende la columna levantando el pecho del suelo. No uses los brazos para empujarte hacia arriba. Mantén la cabeza alta durante el movimiento. Repite 10-20 repeticiones."
Lunge_Pass_Through:
  name: "Zancada con paso de kettlebell"
  instructions:
    - "De pie con el torso erguido, sujeta una kettlebell con la mano derecha. Esta es la posición inicial."
    - "Da un paso adelante con el pie izquierdo y baja la parte superior del cuerpo flexionando la cadera y la rodilla, manteniendo el torso erguido. Baja la rodilla trasera hasta que casi toque el suelo."
    - "Durante la zancada, pasa la kettlebell por debajo de la pierna delantera a la mano contraria."
    - "Empujando con el talón del pie, vuelve a la posición inicial."
    - "Repite el movimiento el número de repeticiones indicado, alternando las piernas."
Lunge_Sprint:
  name: "Zancada con salto alterno"
  instructions:
    - "Ajusta una barra en un multipower a una altura adecuada. Colócate bajo la barra, apoyándola sobre la parte posterior de los hombros. Saca la barra del soporte y luego separa los pies, llevando un pie hacia delante y otro hacia atrás. Esta es la posición inicial."
    - "Baja la rodilla trasera casi hasta el suelo, flexionando las rodillas y bajando las caderas al hacerlo."
    - "En la parte baja del descenso, invierte de inmediato la dirección. Empuja de forma explosiva con el talón del pie delantero con una presión ligera del pie trasero. Salta hacia arriba e invierte la posición de las piernas."
    - "Repite el número de repeticiones indicado."
Lying_Bent_Leg_Groin:
  name: "Estiramiento de ingle tumbado con piernas flexionadas"
  instructions:
    - "Túmbate boca arriba con las rodillas flexionadas y las plantas de los pies juntas. Pide a tu compañero que sujete tus rodillas. Esta es la posición inicial."
    - "Intenta juntar las rodillas apretando, mientras tu compañero impide que se produzca cualquier movimiento."
    - "Tras 10-20 segundos, relaja los músculos mientras tu compañero empuja suavemente tus rodillas hacia el suelo. Asegúrate de avisar a tu ayudante cuando el estiramiento sea suficiente para evitar lesiones o estiramientos excesivos."
Lying_Cable_Curl:
  name: "Curl en polea tumbado"
  instructions:
    - "Agarra con ambas manos una barra recta o una barra Z enganchada a la polea baja, con agarre supino (palmas hacia arriba) a la anchura de los hombros."
    - "Túmbate boca arriba sobre una esterilla frente a la pila de pesas, con los pies apoyados en el bastidor de la máquina de poleas y las piernas rectas."
    - "Con los brazos extendidos y los codos cerca del cuerpo, flexiona ligeramente los brazos. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos inmóvil y los codos cerca del cuerpo, sube la barra despacio hacia el pecho mientras sueltas el aire y aprietas los bíceps."
    - "Tras apretar un segundo en la parte alta del movimiento, vuelve despacio a la posición inicial."
    - "Repite el número de repeticiones indicado."
Lying_Cambered_Barbell_Row:
  name: "Remo tumbado con barra curvada"
  instructions:
    - "Coloca una barra curvada debajo de un banco."
    - "Túmbate boca abajo en el banco y agarra la barra con agarre prono (palmas hacia abajo) más ancho que los hombros. Esta es la posición inicial."
    - "Mientras sueltas el aire, sube la barra remando manteniendo los codos cerca del cuerpo, hasta el pecho si quieres trabajar la zona media-alta de la espalda, o hasta el estómago si tu objetivo es trabajar los dorsales."
    - "Tras mantener un segundo arriba, baja despacio a la posición inicial mientras inspiras."
Lying_Close-Grip_Bar_Curl_On_High_Pulley:
  name: "Curl con barra tumbado en polea alta (agarre cerrado)"
  instructions:
    - "Coloca un banco plano frente a una polea alta o una máquina de jalón al pecho."
    - "Sujeta la barra recta con agarre supino (palmas hacia arriba) aproximadamente a la anchura de los hombros."
    - "Túmbate boca arriba con la cabeza por encima del extremo del banco."
    - "Ahora extiende los brazos rectos por encima de los hombros. El torso y los brazos deben formar un ángulo de 90 grados y los codos deben estar hacia dentro. Esta es la posición inicial."
    - "Mientras sueltas el aire, baja la barra en un movimiento semicircular hasta que toque la barbilla. Aprieta los bíceps durante un segundo en la posición contraída superior. Consejo: al ejecutar este movimiento solo deben moverse los antebrazos. En ningún momento deben moverse los brazos. Deben permanecer perpendiculares durante todo el movimiento."
    - "Vuelve despacio a la posición inicial."
    - "Repite el número de repeticiones indicado."
Lying_Close-Grip_Barbell_Triceps_Extension_Behind_The_Head:
  name: "Extensión de tríceps tumbado con barra tras la cabeza (agarre cerrado)"
  instructions:
    - "Sujetando una barra o una barra Z con agarre prono (palmas hacia delante), túmbate boca arriba en un banco plano con la cabeza cerca del extremo del banco. Consejo: si usas una barra recta, agárrala a la anchura de los hombros; si usas una barra Z, agárrala por las asas interiores."
    - "Extiende los brazos frente a ti y lleva despacio la barra hacia atrás en un movimiento semicircular (manteniendo los brazos extendidos) hasta una posición sobre la cabeza. Al final de este paso los brazos deben estar por encima de la cabeza y paralelos al suelo. Esta es la posición inicial. Consejo: mantén los codos hacia dentro en todo momento."
    - "Mientras inspiras, baja la barra flexionando los codos y manteniendo inmóvil la parte superior del brazo. Sigue bajando la barra hasta que los antebrazos queden perpendiculares al suelo."
    - "Mientras sueltas el aire, devuelve la barra a la posición inicial empujándola hacia arriba en un movimiento semicircular hasta que los antebrazos también estén paralelos al suelo. Contrae el tríceps con fuerza en la parte alta del movimiento durante un segundo. Consejo: de nuevo, solo deben moverse los antebrazos. La parte superior de los brazos debe permanecer inmóvil en todo momento."
    - "Repite el número de repeticiones indicado."
Lying_Close-Grip_Barbell_Triceps_Press_To_Chin:
  name: "Press de tríceps tumbado con barra a la barbilla (agarre cerrado)"
  instructions:
    - "Sujetando una barra o una barra Z con agarre prono (palmas hacia delante), túmbate boca arriba en un banco plano con la cabeza fuera del extremo del banco. Consejo: si usas una barra recta, agárrala a la anchura de los hombros; si usas una barra Z, agárrala por las asas interiores."
    - "Extiende los brazos frente a ti mientras sujetas la barra sobre el pecho. Los brazos deben ser perpendiculares al torso (ángulo de 90 grados). Esta es la posición inicial."
    - "Mientras inspiras, baja la barra en un movimiento semicircular flexionando los codos y manteniendo inmóvil la parte superior del brazo y los codos hacia dentro. Sigue bajando la barra hasta que toque ligeramente la barbilla."
    - "Mientras sueltas el aire, devuelve la barra a la posición inicial empujándola hacia arriba en un movimiento semicircular. Contrae el tríceps con fuerza en la parte alta del movimiento durante un segundo. Consejo: de nuevo, solo deben moverse los antebrazos. La parte superior de los brazos debe permanecer inmóvil en todo momento."
    - "Repite el número de repeticiones indicado."
Lying_Crossover:
  name: "Estiramiento cruzado tumbado"
  instructions:
    - "Túmbate boca arriba con las piernas extendidas."
    - "Cruza una pierna sobre el cuerpo con la rodilla flexionada, intentando tocar el suelo con la rodilla. Tu compañero debe arrodillarse a tu lado, sujetando tu hombro contra el suelo con una mano y controlando la pierna cruzada con la otra. Esta es la posición inicial."
    - "Intenta levantar la rodilla flexionada del suelo mientras tu compañero impide cualquier movimiento real."
    - "Tras 10-20 segundos, relaja la pierna mientras tu compañero presiona suavemente la rodilla hacia el suelo. Repite con el otro lado."
Lying_Dumbbell_Tricep_Extension:
  name: "Extensión de tríceps tumbado con mancuernas"
  instructions:
    - "Túmbate en un banco plano sujetando dos mancuernas justo frente a ti. Los brazos deben estar completamente extendidos formando un ángulo de 90 grados con el torso y con el suelo. Las palmas deben mirar hacia dentro y los codos deben estar pegados. Esta es la posición inicial."
    - "Mientras inspiras y mantienes inmóvil la parte superior de los brazos con los codos hacia dentro, baja despacio el peso hasta que las mancuernas estén cerca de las orejas."
    - "En ese punto, manteniendo los codos hacia dentro y la parte superior de los brazos inmóvil, usa los tríceps para subir el peso de vuelta a la posición inicial mientras sueltas el aire."
    - "Repite el número de repeticiones indicado."
Lying_Face_Down_Plate_Neck_Resistance:
  name: "Resistencia de cuello con disco tumbado boca abajo"
  instructions:
    - "Túmbate boca abajo con todo el cuerpo recto sobre un banco plano mientras sujetas un disco detrás de la cabeza. Consejo: tendrás que colocarte de modo que los hombros queden ligeramente por encima del extremo del banco para que la parte superior del pecho, el cuello y la cara queden fuera del banco. Esta es la posición inicial."
    - "Manteniendo el disco bien sujeto sobre la parte posterior de la cabeza, baja despacio la cabeza (como diciendo \"sí\") mientras inspiras."
    - "Sube la cabeza de vuelta a la posición inicial en un movimiento semicircular mientras sueltas el aire. Mantén la contracción durante un segundo."
    - "Repite el número de repeticiones indicado."
Lying_Face_Up_Plate_Neck_Resistance:
  name: "Resistencia de cuello con disco tumbado boca arriba"
  instructions:
    - "Túmbate boca arriba con todo el cuerpo recto sobre un banco plano mientras sujetas un disco sobre la frente. Consejo: tendrás que colocarte de modo que los hombros queden ligeramente por encima del extremo del banco para que los trapecios, el cuello y la cabeza queden fuera del banco. Esta es la posición inicial."
    - "Manteniendo el disco bien sujeto sobre la frente, baja despacio la cabeza hacia atrás en un movimiento semicircular mientras inspiras."
    - "Sube la cabeza de vuelta a la posición inicial en un movimiento semicircular mientras sueltas el aire. Mantén la contracción durante un segundo."
    - "Repite el número de repeticiones indicado."
Lying_Glute:
  name: "Estiramiento de glúteo tumbado"
  instructions:
    - "Túmbate boca arriba con tu compañero arrodillado a tu lado."
    - "Flexiona la cadera de una pierna, levantándola del suelo. Rota la pierna de modo que el pie quede sobre la cadera contraria, con la parte inferior de la pierna perpendicular a tu cuerpo. Tu compañero debe sujetar la rodilla y el tobillo en su sitio. Esta es la posición inicial."
    - "Intenta empujar la pierna hacia tu compañero, que debe impedir cualquier movimiento real de la pierna."
    - "Tras 10-20 segundos, relájate por completo mientras tu compañero empuja suavemente el tobillo y la rodilla hacia tu pecho. Asegúrate de avisar a tu ayudante cuando el estiramiento sea suficiente para evitar lesiones o estiramientos excesivos."
Lying_Hamstring:
  name: "Estiramiento de isquiotibiales tumbado"
  instructions:
    - "Túmbate boca arriba con las piernas extendidas. Tu compañero debe estar arrodillado a tu lado. Sube una pierna hacia el techo y pide a tu compañero que sujete el tobillo. Tu compañero puede usar el hombro para sostener tu pierna si es necesario. Esta es la posición inicial."
    - "Con tu compañero sujetando la pierna en su sitio, intenta flexionar la rodilla, contrayendo los isquiotibiales durante 10-20 segundos."
    - "Luego relaja la pierna, permitiendo que tu compañero empuje suavemente la pierna hacia tu cabeza. Asegúrate de avisar a tu ayudante cuando el estiramiento sea suficiente para evitar lesiones o estiramientos excesivos. Cambia de lado al terminar."
Lying_High_Bench_Barbell_Curl:
  name: "Curl con barra tumbado en banco alto"
  instructions:
    - "Túmbate boca abajo en un banco plano alto sujetando una barra con agarre supino (palmas hacia arriba). Consejo: si usas una barra recta, agárrala a la anchura de los hombros; si usas una barra Z, agárrala por las asas interiores. La parte superior del cuerpo debe colocarse de modo que la parte alta del pecho sobresalga del extremo del banco y la barra cuelgue frente a ti con los brazos extendidos y perpendiculares al suelo. Esta es la posición inicial."
    - "Manteniendo los codos hacia dentro y la parte superior de los brazos inmóvil, sube el peso en un movimiento semicircular mientras contraes los bíceps y sueltas el aire. Mantén un segundo en la parte alta del movimiento."
    - "Mientras inspiras, vuelve despacio a la posición inicial. Consejo: mantén el control total del peso en todo momento y evita cualquier balanceo. Recuerda, solo deben moverse los antebrazos durante todo el movimiento."
    - "Repite el número de repeticiones indicado."
Lying_Leg_Curls:
  name: "Curl femoral tumbado"
  instructions:
    - "Ajusta la palanca de la máquina a tu altura y túmbate boca abajo en la máquina de curl femoral con la almohadilla de la palanca en la parte posterior de las piernas (unos pocos centímetros por debajo de los gemelos). Consejo: usa preferiblemente una máquina de curl femoral inclinada en lugar de plana, ya que una posición inclinada es más favorable para el reclutamiento de los isquiotibiales."
    - "Manteniendo el torso plano sobre el banco, asegúrate de que las piernas estén completamente estiradas y agarra las asas laterales de la máquina. Coloca las puntas de los pies rectas (o puedes usar cualquiera de las otras dos posturas descritas en la sección de posición de los pies). Esta es la posición inicial."
    - "Mientras sueltas el aire, flexiona las piernas hacia arriba tanto como puedas sin levantar la parte superior de las piernas de la almohadilla. Una vez alcances la posición de contracción completa, mantenla un segundo."
    - "Mientras inspiras, devuelve las piernas a la posición inicial. Repite el número de repeticiones indicado."
Lying_Machine_Squat:
  name: "Sentadilla en máquina tumbado"
  instructions:
    - "Ajusta la máquina de piernas a una altura que te permita meterte dentro con las rodillas flexionadas y los muslos ligeramente por debajo del paralelo."
    - "Una vez seleccionado el peso, colócate dentro de la máquina boca arriba con las rodillas flexionadas y los muslos ligeramente por debajo del paralelo con la plataforma. Asegúrate de que las rodillas no sobrepasen la punta de los pies. El ángulo entre los isquiotibiales y las pantorrillas debe ser ligeramente inferior a 90 grados (ya que tu posición inicial requiere empezar ligeramente por debajo del paralelo). La espalda y la cabeza deben descansar sobre la máquina mientras los hombros están presionados bajo las hombreras."
    - "Coloca las manos en las asas y coloca los pies ligeramente hacia fuera a la anchura de los hombros. Esta es la posición inicial."
    - "Empujando con la parte delantera de los pies mientras sueltas el aire, estira todo el cuerpo mientras aprietas los cuádriceps. Mantén la posición contraída durante un segundo. Consejo: como empiezas por debajo del paralelo, puedes optar por ayudarte con las manos empujando sobre los muslos solo en la primera repetición."
    - "Baja despacio en sentadilla mientras inspiras, pero en lugar de bajar hasta la posición inicial, detente cuando los muslos estén paralelos a la plataforma. El ángulo entre los isquiotibiales y las pantorrillas debe ser de 90 grados."
    - "Repite el número de repeticiones indicado."
Lying_One-Arm_Lateral_Raise:
  name: "Elevación lateral a un brazo tumbado"
  instructions:
    - "Sujetando una mancuerna en una mano, túmbate con el pecho hacia abajo en un banco plano. La otra mano puede usarse para agarrarte a la pata del banco y mantener la estabilidad."
    - "Coloca la palma de la mano que sujeta la mancuerna en posición neutra (palma hacia el torso) mientras mantienes el brazo extendido con el codo ligeramente flexionado. Esta es la posición inicial."
    - "Ahora sube el brazo con la mancuerna hacia el lado hasta que el codo esté a la altura del hombro y el brazo esté aproximadamente paralelo al suelo mientras sueltas el aire. Consejo: mantén el brazo perpendicular al torso y extendido durante todo el movimiento. Además, mantén la contracción arriba durante un segundo."
    - "Baja despacio la mancuerna a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Lying_Prone_Quadriceps:
  name: "Estiramiento de cuádriceps tumbado boca abajo"
  instructions:
    - "Túmbate boca abajo en el suelo con tu compañero arrodillado a tu lado. Flexiona una rodilla y levanta esa pierna del suelo, intentando tocar los glúteos con el pie. Tu compañero debe sujetar la rodilla y el tobillo. Esta es la posición inicial."
    - "Intenta extender la rodilla mientras tu compañero impide cualquier movimiento real."
    - "Tras 10-20 segundos, relaja los músculos mientras tu compañero empuja suavemente el pie hacia los glúteos, estirando más los cuádriceps y los flexores de cadera."
    - "Tras 10-20 segundos, cambia de lado."
Lying_Rear_Delt_Raise:
  name: "Pájaro tumbado"
  instructions:
    - "Sujetando una mancuerna en cada mano, túmbate con el pecho hacia abajo en un banco plano."
    - "Coloca las palmas de las manos en posición neutra (palmas hacia el torso) mientras mantienes los brazos extendidos con los codos ligeramente flexionados. Esta es la posición inicial."
    - "Ahora sube los brazos hacia los lados hasta que los codos estén a la altura de los hombros y los brazos estén aproximadamente paralelos al suelo mientras sueltas el aire. Consejo: mantén los brazos perpendiculares al torso y extendidos durante todo el movimiento. Además, mantén la contracción arriba durante un segundo."
    - "Baja despacio las mancuernas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado y luego cambia al otro brazo."
Lying_Supine_Dumbbell_Curl:
  name: "Curl con mancuernas tumbado boca arriba"
  instructions:
    - "Túmbate boca arriba en un banco plano sujetando una mancuerna en cada mano sobre los muslos."
    - "Lleva las mancuernas a los lados con los brazos extendidos y las palmas de las manos hacia los muslos (agarre neutro)."
    - "Manteniendo los brazos cerca del torso y los codos hacia dentro, baja despacio los brazos (manteniéndolos extendidos con una ligera flexión en los codos) tan abajo hacia el suelo como puedas. Una vez que no puedas bajar más, bloquea la parte superior de los brazos en esa posición. Esta es la posición inicial."
    - "Mientras sueltas el aire, empieza a subir despacio los pesos mientras giras simultáneamente las muñecas de modo que las palmas de las manos miren hacia arriba. Continúa subiendo el peso hasta que los bíceps estén completamente contraídos y aprieta con fuerza en la posición superior durante un segundo. Consejo: solo deben moverse los antebrazos. La parte superior de los brazos debe permanecer inmóvil y los codos deben mantenerse hacia dentro durante todo el movimiento."
    - "Vuelve a la posición inicial muy despacio."
Lying_T-Bar_Row:
  name: "Remo en barra T tumbado"
  instructions:
    - "Carga la máquina de remo en barra T con el peso deseado y ajusta la altura de las piernas de modo que la parte alta del pecho quede en la parte superior de la almohadilla. Consejo: en algunas máquinas lo único que puedes hacer es subirte al escalón adecuado que te permita estar a una altura en la que la parte alta del pecho quede en la parte superior de la almohadilla."
    - "Túmbate boca abajo sobre la almohadilla y agarra las asas. Puedes usar un agarre con las palmas hacia abajo, hacia arriba o hacia dentro, según la parte de la espalda que quieras enfatizar."
    - "Levanta la barra del soporte y extiende los brazos frente a ti. Esta es la posición inicial."
    - "Mientras sueltas el aire, tira despacio del peso hacia arriba y aprieta la espalda en la parte alta del movimiento. Consejo: mantén la parte superior de los brazos lo más cerca posible del torso durante todo el movimiento para activar mejor los músculos de la espalda. Además, no levantes el cuerpo de la almohadilla en ningún momento y evita usar los bíceps para levantar el peso."
    - "Tras una contracción de un segundo en la parte alta del movimiento, mientras inspiras, vuelve despacio a la posición inicial."
    - "Repite el número de repeticiones indicado."
Lying_Triceps_Press:
  name: "Press de tríceps tumbado (rompecráneos)"
  instructions:
    - "Túmbate en un banco plano con una barra Z (mi preferencia) o una barra recta colocada en el suelo detrás de la cabeza y los pies en el suelo."
    - "Agarra la barra detrás de ti con un agarre prono medio y súbela frente a ti con los brazos extendidos. Consejo: los brazos deben ser perpendiculares al torso y al suelo. Los codos deben estar pegados. Esta es la posición inicial."
    - "Mientras inspiras, baja despacio el peso hasta que la barra toque ligeramente la frente, manteniendo inmóvil la parte superior de los brazos y los codos."
    - "En ese punto, usa los tríceps para subir el peso de vuelta a la posición inicial mientras sueltas el aire."
    - "Repite el número de repeticiones indicado."
Machine_Bench_Press:
  name: "Press de pecho en máquina"
  instructions:
    - "Siéntate en la máquina de press de pecho y selecciona el peso."
    - "Pisa la palanca que incorpora la máquina, ya que te ayudará a llevar las asas hacia delante para que puedas agarrarlas y extender completamente los brazos."
    - "Agarra las asas con las palmas hacia abajo y eleva los codos de modo que la parte superior de los brazos quede paralela al suelo, a los lados del torso. Consejo: los antebrazos apuntarán hacia delante al agarrar las asas. Una vez que lleves las asas hacia delante y extiendas los brazos, estarás en la posición inicial."
    - "Ahora lleva las asas hacia ti mientras inspiras."
    - "Empuja las asas alejándolas de ti mientras contraes los pectorales y sueltas el aire. Mantén la contracción durante un segundo antes de volver a la posición inicial."
    - "Repite el número de repeticiones indicado."
    - "Al terminar, pisa de nuevo la palanca y devuelve despacio las asas a su lugar original."
Machine_Bicep_Curl:
  name: "Curl de bíceps en máquina"
  instructions:
    - "Ajusta el asiento a la altura adecuada y selecciona el peso. Apoya la parte superior de los brazos contra las almohadillas y agarra las asas. Esta es la posición inicial."
    - "Realiza el movimiento flexionando el codo, llevando el antebrazo hacia la parte superior del brazo."
    - "Haz una pausa en la parte alta del movimiento y luego devuelve despacio el peso a la posición inicial."
    - "Evita devolver el peso por completo a los topes hasta terminar la serie para mantener la tensión en los músculos trabajados."
Machine_Preacher_Curls:
  name: "Curl predicador en máquina"
  instructions:
    - "Siéntate en la máquina de curl predicador y selecciona el peso."
    - "Coloca la parte posterior de la parte superior de los brazos (los tríceps) sobre la almohadilla predicador y agarra las asas con agarre supino (palmas hacia arriba). Consejo: asegúrate de que, al colocar los brazos en la almohadilla, mantengas los codos hacia dentro. Esta es la posición inicial."
    - "Ahora sube las asas mientras sueltas el aire y contraes los bíceps. En la parte alta de la posición asegúrate de mantener la contracción durante un segundo. Consejo: solo deben moverse los antebrazos. La parte superior de los brazos debe permanecer inmóvil y apoyada en la almohadilla en todo momento."
    - "Baja despacio las asas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Machine_Shoulder_Military_Press:
  name: "Press militar en máquina"
  instructions:
    - "Siéntate en la máquina de press de hombros y selecciona el peso."
    - "Agarra las asas a los lados mientras mantienes los codos flexionados y alineados con el torso. Esta es la posición inicial."
    - "Ahora sube las asas mientras sueltas el aire y extiendes completamente los brazos. En la parte alta de la posición asegúrate de mantener la contracción durante un segundo."
    - "Baja despacio las asas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Machine_Triceps_Extension:
  name: "Extensión de tríceps en máquina"
  instructions:
    - "Ajusta el asiento a la altura adecuada y selecciona el peso. Apoya la parte superior de los brazos contra las almohadillas y agarra las asas. Esta es la posición inicial."
    - "Realiza el movimiento extendiendo el codo, alejando el antebrazo de la parte superior del brazo."
    - "Haz una pausa al completar el movimiento y luego devuelve despacio el peso a la posición inicial."
    - "Evita devolver el peso por completo a los topes hasta terminar la serie para mantener la tensión en los músculos trabajados."
Medicine_Ball_Chest_Pass:
  name: "Pase de pecho con balón medicinal"
  instructions:
    - "Necesitarás un compañero para este ejercicio. Si no lo tienes, este movimiento se puede realizar contra una pared."
    - "Comienza frente a tu compañero sujetando el balón medicinal a la altura del torso con ambas manos."
    - "Lleva el balón al pecho e invierte el movimiento extendiendo los codos. Para aplicaciones deportivas, puedes dar un paso al lanzar."
    - "Tu compañero debe atrapar el balón y lanzártelo de vuelta."
    - "Recibe el lanzamiento con ambas manos a la altura del pecho."
Medicine_Ball_Full_Twist:
  name: "Giro completo con balón medicinal"
  instructions:
    - "Para este ejercicio necesitarás un balón medicinal y un compañero. Colócate de espaldas a tu compañero, separados unos 60-90 cm. Esta es la posición inicial."
    - "Sujeta el balón frente al tronco. Abre las caderas y gira los hombros al mismo tiempo que tu compañero."
    - "Para una rotación completa, tú y tu compañero debéis girar en la misma dirección, por ejemplo, en sentido antihorario."
    - "Pasa el balón a tu compañero, y ahora ambos podéis girar en la dirección opuesta para repetir el procedimiento."
Medicine_Ball_Scoop_Throw:
  name: "Lanzamiento de balón medicinal en cuchara"
  instructions:
    - "Adopta una postura de media sentadilla con un balón medicinal en las manos. Los brazos deben colgar de modo que el balón quede cerca de los pies."
    - "Comienza empujando las caderas hacia delante mientras extiendes las piernas, saltando hacia arriba."
    - "Mientras lo haces, lleva los brazos hacia arriba y por encima de la cabeza, manteniéndolos extendidos, soltando el balón en el punto máximo del movimiento. El objetivo es lanzar el balón la mayor distancia posible detrás de ti."
Middle_Back_Shrug:
  name: "Encogimiento de espalda media"
  instructions:
    - "Túmbate boca abajo en un banco inclinado sujetando una mancuerna en cada mano. Los brazos deben estar completamente extendidos, colgando y apuntando hacia el suelo. Las palmas de las manos deben mirarse entre sí. Esta es la posición inicial."
    - "Mientras sueltas el aire, junta las escápulas y mantén la contracción durante un segundo completo. Consejo: este movimiento es como la acción inversa de un abrazo, o como intentar hacer elevaciones laterales posteriores como si no tuvieras brazos."
    - "Mientras inspiras, vuelve a la posición inicial."
    - "Repite el número de repeticiones indicado."
Middle_Back_Stretch:
  name: "Estiramiento de espalda media"
  instructions:
    - "Colócate de pie con los pies separados a la anchura de los hombros y las manos en las caderas."
    - "Gira la cintura hasta que notes un estiramiento. Mantén durante 10 a 15 segundos y luego gira hacia el otro lado."
Mixed_Grip_Chin:
  name: "Dominada con agarre mixto"
  instructions:
    - "Con una separación de unos 2,5 cm más ancha que los hombros, agarra una barra de dominadas con la palma de una mano hacia delante y la palma de la otra mano hacia ti. Esta es la posición inicial."
    - "Ahora empieza a subir mientras sueltas el aire. Consejo: con el brazo que tiene la palma hacia arriba, concéntrate en usar los músculos de la espalda para realizar el movimiento. El codo de ese brazo debe permanecer cerca del torso. Con el otro brazo, que tiene la palma hacia delante, los codos estarán separados pero alineados con el torso. Te concentrarás en usar los dorsales para subir el cuerpo."
    - "Tras una contracción de un segundo arriba, empieza a bajar despacio mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "En la serie siguiente, cambia los agarres; es decir, si tenías la mano derecha con la palma hacia ti y la izquierda con la palma hacia delante, en la siguiente serie tendrás la palma hacia delante en la mano derecha y hacia ti en la izquierda."
Monster_Walk:
  name: "Monster walk"
  instructions:
    - "Coloca una goma elástica alrededor de ambos tobillos y otra alrededor de ambas rodillas. Debe haber suficiente tensión como para que estén tensas cuando los pies estén separados a la anchura de los hombros."
    - "Para empezar, da pasos cortos hacia delante alternando el pie izquierdo y el derecho."
    - "Tras varios pasos, haz justo lo contrario y camina hacia atrás hasta donde empezaste."
Mountain_Climbers:
  name: "Escaladores"
  instructions:
    - "Comienza en posición de flexión, con el peso apoyado en las manos y las puntas de los pies. Flexionando la rodilla y la cadera, lleva una pierna hacia delante hasta que la rodilla esté aproximadamente bajo la cadera. Esta es la posición inicial."
    - "Invierte de forma explosiva las posiciones de las piernas, extendiendo la pierna flexionada hasta que quede recta y apoyada en la punta del pie, y llevando el otro pie hacia delante con la cadera y la rodilla flexionadas. Repite de forma alterna durante 20-30 segundos."
Moving_Claw_Series:
  name: "Serie de garra en movimiento"
  instructions:
    - "Este movimiento ayuda a preparar tu técnica de carrera para destacar en el esprint. Mientras corres, asegúrate de flexionar la rodilla, intentando patear los glúteos al extender la cadera."
    - "Recarga el cuádriceps mientras la pierna vuelve hacia delante, atacando el suelo en el siguiente paso."
    - "Asegúrate de que, mientras corres, bloqueas con los brazos, golpeando hacia delante en un movimiento rápido de 1-2."
Muscle_Snatch:
  name: "Muscle snatch"
  instructions:
    - "Comienza con una barra cargada sujeta a la altura de la mitad del muslo con un agarre ancho. Los pies deben estar justo debajo de las caderas, con las puntas giradas hacia fuera según sea necesario. Baja las caderas, con el pecho alto y la cabeza mirando al frente. Los hombros deben estar justo por delante de la barra. Esta es la posición inicial."
    - "Comienza el tirón empujando con la parte delantera de los talones, subiendo la barra. Pasa al segundo tirón extendiendo las caderas, las rodillas y los tobillos, subiendo la barra lo más rápido posible. La barra debe estar cerca del cuerpo."
    - "Continúa subiendo la barra hasta la posición por encima de la cabeza, sin volver a flexionar las rodillas."
Muscle_Up:
  name: "Muscle up"
  instructions:
    - "Agarra las anillas con agarre falso, con la base de las palmas sobre las anillas. Inicia una dominada tirando de los codos hacia los costados, flexionando los codos."
    - "Al llegar a la posición alta de la dominada, lleva las anillas hacia las axilas mientras giras los hombros hacia delante, dejando que los codos vayan rectos hacia atrás. Esto te coloca en la posición correcta para continuar con la fase de fondo del movimiento."
    - "Manteniendo el control y la estabilidad, extiende los codos para completar el movimiento."
    - "Ten cuidado al bajar al suelo."
Narrow_Stance_Hack_Squats:
  name: "Sentadilla hack con postura estrecha"
  instructions:
    - "Apoya la espalda contra la almohadilla trasera de la máquina y coloca los hombros bajo las hombreras."
    - "Coloca las piernas en la plataforma con una postura estrecha, menor que la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Los pies deben estar separados unos 7,5 cm o menos. Consejo: mantén la cabeza alta en todo momento y mantén también la espalda sobre la almohadilla en todo momento."
    - "Coloca los brazos en las asas laterales de la máquina y desengancha las barras de seguridad (lo que en la mayoría de los diseños se hace moviendo las asas laterales de una posición frontal a una diagonal)."
    - "Ahora estira las piernas sin bloquear las rodillas. Esta es la posición inicial."
    - "Empieza a bajar despacio la unidad flexionando las rodillas mientras mantienes una postura recta con la cabeza alta (espalda sobre la almohadilla en todo momento). Continúa bajando hasta que el ángulo entre la parte superior de la pierna y las pantorrillas sea ligeramente menor de 90 grados (que es el punto en el que la parte superior de las piernas queda por debajo del paralelo con el suelo). Inspira mientras realizas esta parte del movimiento."
    - "Empieza a subir la unidad mientras sueltas el aire empujando el suelo principalmente con los talones mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Narrow_Stance_Leg_Press:
  name: "Prensa de piernas con postura estrecha"
  instructions:
    - "En una máquina de prensa de piernas, siéntate y coloca las piernas sobre la plataforma justo frente a ti con una postura estrecha, menor que la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Los pies deben estar separados unos 7,5 cm o menos. Consejo: mantén la cabeza alta en todo momento y mantén también la espalda sobre la almohadilla en todo momento."
    - "Baja las barras de seguridad que sujetan la plataforma con peso y empuja la plataforma hacia arriba hasta que las piernas queden completamente extendidas frente a ti. Consejo: asegúrate de no bloquear las rodillas. El torso y las piernas deben formar un ángulo perfecto de 90 grados. Esta es la posición inicial."
    - "Mientras inspiras, baja despacio la plataforma hasta que la parte superior e inferior de las piernas formen un ángulo de 90 grados."
    - "Empujando principalmente con los talones y usando los cuádriceps, vuelve a la posición inicial mientras sueltas el aire."
    - "Repite el número de repeticiones indicado y asegúrate de bloquear correctamente los pasadores de seguridad al terminar. No querrás que la plataforma, totalmente cargada, te caiga encima."
Narrow_Stance_Squats:
  name: "Sentadilla con postura estrecha"
  instructions:
    - "Este ejercicio se realiza mejor dentro de una jaula de sentadillas por seguridad. Para empezar, coloca primero la barra en un soporte que se ajuste a tu altura. Una vez elegida la altura correcta y cargada la barra, métete bajo la barra y apoya sobre ella la parte posterior de los hombros (ligeramente por debajo del cuello)."
    - "Sujeta la barra con ambos brazos a cada lado y levántala del soporte empujando primero con las piernas y enderezando al mismo tiempo el torso."
    - "Aléjate del soporte y coloca las piernas con una postura estrecha, menor que la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Los pies deben estar separados unos 7,5-15 cm. Mantén la cabeza alta en todo momento (mirar hacia abajo te desequilibrará) y mantén la espalda recta. Esta es la posición inicial. (Nota: para esta explicación usaremos la postura media descrita, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas explicadas en la sección de posturas de los pies)."
    - "Empieza a bajar despacio la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que el ángulo entre la parte superior de la pierna y las pantorrillas sea ligeramente menor de 90 grados (que es el punto en el que la parte superior de las piernas queda por debajo del paralelo con el suelo). Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con los dedos de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si sobrepasan los dedos de los pies), entonces estás sometiendo la rodilla a una tensión excesiva y el ejercicio se ha realizado de forma incorrecta."
    - "Empieza a subir la barra mientras sueltas el aire empujando el suelo principalmente con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Natural_Glute_Ham_Raise:
  name: "Elevación glúteo-isquio natural"
  instructions:
    - "Usando el soporte para las piernas de una máquina de jalón al pecho o de un banco predicador, colócate de modo que los tobillos queden bajo las almohadillas, las rodillas sobre el asiento y estés de espaldas a la máquina. Debes estar erguido y mantener una buena postura."
    - "Esta es la posición inicial. Bájate de forma controlada hasta que las rodillas estén casi completamente rectas."
    - "Manteniendo el control, vuelve a subir hasta la posición inicial."
    - "Si no puedes completar una repetición, usa una goma elástica, un compañero o impúlsate con un cajón para ayudarte a completar la repetición."
Neck-SMR:
  name: "Liberación miofascial del cuello"
  instructions:
    - "Usando un rodillo muscular o un rodillo de cocina, coloca el rodillo detrás de la cabeza y contra el cuello. Asegúrate de no colocar el rodillo directamente contra la columna, sino girado ligeramente para que el rodillo presione los músculos a ambos lados de la columna. Esta es la posición inicial."
    - "Empezando por la parte alta del cuello, rueda despacio por los músculos del cuello, haciendo pausas en los puntos de tensión durante 10-30 segundos."
Neck_Press:
  name: "Press de banca al cuello"
  instructions:
    - "Túmbate boca arriba en un banco plano. Usando un agarre de anchura media (un agarre que crea un ángulo de 90 grados en la mitad del movimiento entre los antebrazos y la parte superior de los brazos), levanta la barra del soporte y sujétala recta sobre el cuello con los brazos bloqueados. Esta es la posición inicial."
    - "Mientras inspiras, baja despacio hasta que sientas la barra en el cuello."
    - "Tras una pausa de un segundo, devuelve la barra a la posición inicial mientras sueltas el aire y empujas la barra con los músculos del pecho. Bloquea los brazos y aprieta el pecho en la posición contraída, mantén un segundo y luego empieza a bajar de nuevo despacio. Consejo: bajar debe llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, coloca la barra de nuevo en el soporte."
Oblique_Crunches:
  name: "Encogimiento abdominal oblicuo"
  instructions:
    - "Túmbate boca arriba en el suelo con la zona lumbar pegada al suelo. Para este ejercicio, tendrás que colocar una mano junto a la cabeza y la otra a un lado apoyada en el suelo."
    - "Asegúrate de que los pies estén elevados y apoyados sobre una superficie plana."
    - "Ahora levanta el hombro del lado de la mano que toca la cabeza."
    - "Simplemente eleva el hombro y el cuerpo hacia arriba hasta tocar la rodilla. Por ejemplo, si tienes la mano derecha junto a la cabeza, debes elevar el cuerpo hacia arriba hasta que el codo derecho toque la rodilla izquierda. La misma variación puede aplicarse a la inversa, usando el codo izquierdo para tocar la rodilla derecha."
    - "Después de que la rodilla toque el codo, baja el cuerpo hasta llegar a la posición inicial."
    - "Recuerda inspirar durante la parte excéntrica (de bajada) del ejercicio y soltar el aire durante la parte concéntrica (de subida) del ejercicio."
    - "Continúa alternando de esta manera hasta completar todas las repeticiones recomendadas para cada lado."
Oblique_Crunches_-_On_The_Floor:
  name: "Encogimiento abdominal oblicuo en el suelo"
  instructions:
    - "Empieza tumbado sobre el lado derecho con las piernas una encima de la otra. Asegúrate de que las rodillas estén un poco flexionadas."
    - "Coloca la mano izquierda detrás de la cabeza."
    - "Una vez en esta posición, empieza subiendo el codo izquierdo como harías en un encogimiento abdominal normal, salvo que esta vez el énfasis principal está en los oblicuos."
    - "Sube todo lo que puedas, mantén la contracción durante un segundo y luego baja despacio a la posición inicial."
    - "Recuerda inspirar durante la parte excéntrica (de bajada) del ejercicio y soltar el aire durante la parte concéntrica (de elevación) del ejercicio."
Olympic_Squat:
  name: "Sentadilla olímpica"
  instructions:
    - "Comienza con una barra apoyada sobre la parte superior de los trapecios. El pecho debe estar alto y la cabeza mirando al frente. Adopta una postura a la anchura de las caderas con los pies girados hacia fuera según sea necesario."
    - "Desciende flexionando las rodillas, evitando en lo posible llevar las caderas hacia atrás. Esto requiere que las rodillas avancen; asegúrate de que permanezcan alineadas con los pies. El objetivo es mantener el torso lo más erguido posible. Continúa hasta abajo, manteniendo el peso en la parte delantera del talón."
    - "En el momento en que la parte superior de las piernas contacte con la inferior, invierte el movimiento, empujando el peso hacia arriba."
On-Your-Back_Quad_Stretch:
  name: "Estiramiento de cuádriceps tumbado boca arriba"
  instructions:
    - "Túmbate en un banco plano o en un escalón y deja colgar una pierna y un brazo por el lateral."
    - "Flexiona la rodilla y sujeta el empeine. Al hacerlo, ten cuidado de no arquear la zona lumbar."
    - "Lleva el ombligo hacia la columna para mantenerte en posición neutra. Presiona el pie hacia abajo y contra la mano. Para añadir el estiramiento de cadera, eleva hacia el techo la cadera de la pierna que estás sujetando."
    - "Cambia de lado."
On_Your_Side_Quad_Stretch:
  name: "Estiramiento de cuádriceps tumbado de lado"
  instructions:
    - "Empieza tumbado sobre el lado derecho, con la rodilla derecha flexionada en un ángulo de 90 grados apoyada en el suelo frente a ti (esto estabiliza el torso)."
    - "Flexiona la rodilla izquierda hacia atrás y sujeta el pie izquierdo con la mano izquierda. Para estirar el flexor de cadera, empuja la cadera izquierda hacia delante mientras empujas el pie izquierdo hacia atrás contra la mano. Cambia de lado."
One-Arm_Dumbbell_Row:
  name: "Remo con mancuerna a una mano"
  instructions:
    - "Elige un banco plano y coloca una mancuerna a cada lado."
    - "Apoya la rodilla derecha en el extremo del banco, inclina el torso hacia delante desde la cintura hasta que la parte superior del cuerpo quede paralela al suelo y apoya la mano derecha en el otro extremo del banco como soporte."
    - "Con la mano izquierda, coge la mancuerna del suelo y sostén el peso manteniendo la zona lumbar recta. La palma de la mano debe mirar hacia el torso. Esta es la posición inicial."
    - "Tira del peso en línea recta hacia el lateral del pecho, manteniendo el brazo pegado al costado y el torso inmóvil. Espira mientras realizas este paso. Consejo: concéntrate en apretar los músculos de la espalda al llegar a la posición de máxima contracción. Asegúrate también de que la fuerza la hacen los músculos de la espalda y no los brazos. Por último, la parte superior del torso debe permanecer inmóvil y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sostener la mancuerna, así que no intentes subirla tirando con los antebrazos."
    - "Baja el peso en línea recta hasta la posición inicial. Inspira mientras realizas este paso."
    - "Repite el movimiento el número de repeticiones indicado."
    - "Cambia de lado y repite con el otro brazo."
One-Arm_Flat_Bench_Dumbbell_Flye:
  name: "Apertura con mancuerna a una mano en banco plano"
  instructions:
    - "Túmbate en un banco plano con una mancuerna en una mano apoyada sobre el muslo. La palma de la mano que sostiene la mancuerna debe estar en agarre neutro."
    - "Ayudándote de los muslos para subir la mancuerna, llévala hasta sostenerla delante de ti con el brazo que trabaja completamente extendido. Recuerda mantener el agarre neutro en este ejercicio. La mano que no trabaja debe sujetar el banco plano a un lado para tener mejor apoyo. Esta es la posición inicial."
    - "El brazo con el peso debe tener una ligera flexión en el codo para evitar tensión en el tendón del bíceps. Empieza bajando el brazo con el peso en un arco amplio hacia fuera hasta que notes un estiramiento en el pecho. Inspira mientras realizas esta parte del movimiento. Consejo: ten en cuenta que durante todo el movimiento el brazo que trabaja debe permanecer inmóvil; el movimiento solo debe producirse en la articulación del hombro."
    - "Devuelve el brazo que trabaja a la posición inicial mientras aprietas los músculos del pecho y espiras. Consejo: asegúrate de usar el mismo arco de movimiento que has usado para bajar el peso."
    - "Mantén un segundo en la posición de contracción y repite el movimiento el número de repeticiones prescrito."
    - "Cambia de brazo y repite el ejercicio."
One-Arm_High-Pulley_Cable_Side_Bends:
  name: "Inclinación lateral en polea alta a una mano"
  instructions:
    - "Conecta una empuñadura estándar a una torre. Sube la polea a la posición más alta."
    - "Colócate de lado respecto a la polea. Con una mano, estírate hacia arriba y agarra la empuñadura con agarre supino."
    - "Tira de la polea hacia abajo hasta que el codo toque tu costado y la empuñadura quede junto al hombro."
    - "Coloca los pies separados a la anchura de las caderas. Apoya la mano libre en la cadera para ayudarte a notar el punto de pivote."
    - "Mantén el brazo en posición estática. Contrae el oblicuo para bajar el peso en un encogimiento lateral."
    - "Cuando alcances la máxima contracción, suelta el peso lentamente hasta la posición inicial. La pila de pesas nunca debe quedar apoyada en reposo. El objetivo es mantener tensión constante durante la serie."
    - "Repite hasta el fallo."
    - "Después, reposiciónate y repite la misma serie de movimientos en el lado contrario."
One-Arm_Incline_Lateral_Raise:
  name: "Elevación lateral a una mano en banco inclinado"
  instructions:
    - "Túmbate de lado en un banco inclinado con una mancuerna en la mano. Asegúrate de que el hombro esté apoyado contra el banco inclinado y de que el brazo esté cruzado sobre el cuerpo con la palma a la altura del ombligo."
    - "Sostén una mancuerna con el brazo de arriba manteniéndolo extendido delante de ti, paralelo al suelo. Esta es la posición inicial."
    - "Manteniendo la mancuerna paralela al suelo en todo momento, realiza una elevación lateral. El brazo debe subir en línea recta hasta apuntar al techo. Consejo: espira mientras realizas este movimiento. Mantén la mancuerna en esa posición y nota la contracción en los hombros durante un segundo."
    - "Mientras inspiras, baja el peso cruzando el cuerpo hasta la posición inicial."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cambia de brazo y repite el movimiento."
One-Arm_Kettlebell_Clean:
  name: "Cargada con kettlebell a una mano"
  instructions:
    - "Coloca una kettlebell entre los pies. Al agacharte para cogerla, lleva los glúteos hacia atrás y mantén la mirada al frente."
    - "Lleva la kettlebell hasta los hombros extendiendo las piernas y las caderas mientras subes la kettlebell hacia el hombro. La muñeca debe rotar al hacerlo."
    - "Devuelve el peso a la posición inicial."
One-Arm_Kettlebell_Clean_and_Jerk:
  name: "Cargada y envión con kettlebell a una mano"
  instructions:
    - "Sujeta una kettlebell por el asa."
    - "Lleva la kettlebell hasta el hombro extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia el hombro. Rota la muñeca al hacerlo, de modo que la palma quede mirando hacia delante."
    - "Realiza un dip flexionando las rodillas y manteniendo el torso erguido."
    - "Invierte la dirección de inmediato, empujando con los talones, saltando en esencia para generar impulso. Mientras lo haces, presiona la kettlebell por encima de la cabeza hasta el bloqueo extendiendo los brazos, aprovechando el impulso del cuerpo para mover el peso."
    - "Recibe el peso por encima de la cabeza volviendo a una posición de sentadilla bajo el peso."
    - "Manteniendo el peso por encima de la cabeza, vuelve a la posición de pie. Baja el peso al suelo para realizar la siguiente repetición."
One-Arm_Kettlebell_Floor_Press:
  name: "Press de suelo con kettlebell a una mano"
  instructions:
    - "Túmbate en el suelo sujetando una kettlebell con una mano, con la parte superior del brazo apoyada en el suelo. La palma debe mirar hacia dentro."
    - "Empuja la kettlebell en línea recta hacia el techo, rotando la muñeca."
    - "Baja la kettlebell de nuevo a la posición inicial y repite."
One-Arm_Kettlebell_Jerk:
  name: "Envión con kettlebell a una mano"
  instructions:
    - "Sujeta una kettlebell por el asa. Lleva la kettlebell hasta el hombro extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia el hombro. Rota la muñeca al hacerlo, de modo que la palma quede mirando hacia delante. Esta es la posición inicial."
    - "Realiza un dip flexionando las rodillas y manteniendo el torso erguido."
    - "Invierte la dirección de inmediato, empujando con los talones, saltando en esencia para generar impulso. Mientras lo haces, presiona la kettlebell por encima de la cabeza hasta el bloqueo extendiendo los brazos, aprovechando el impulso del cuerpo para mover el peso. Recibe el peso por encima de la cabeza volviendo a una posición de sentadilla bajo el peso. Manteniendo el peso por encima de la cabeza, vuelve a la posición de pie."
    - "Baja el peso para realizar la siguiente repetición."
One-Arm_Kettlebell_Military_Press_To_The_Side:
  name: "Press militar con kettlebell a una mano hacia el lateral"
  instructions:
    - "Lleva una kettlebell hasta el hombro. Hazlo extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia el hombro. Rota la muñeca al hacerlo, de modo que la palma quede mirando hacia dentro. Esta es la posición inicial."
    - "Mira la kettlebell y presiónala hacia arriba y hacia fuera hasta bloquearla por encima de la cabeza."
    - "Baja la kettlebell de nuevo al hombro de forma controlada y repite. Asegúrate de contraer con fuerza el dorsal, los glúteos y el abdomen para obtener más estabilidad y fuerza."
One-Arm_Kettlebell_Para_Press:
  name: "Para press con kettlebell a una mano"
  instructions:
    - "Lleva una kettlebell hasta el hombro. Hazlo extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia el hombro. Rota la muñeca al hacerlo, de modo que la palma quede mirando hacia delante. Esta es la posición inicial."
    - "Sujeta la kettlebell con el codo hacia el lateral y presiónala hacia arriba y hacia fuera hasta bloquearla por encima de la cabeza."
    - "Baja la kettlebell de nuevo al hombro de forma controlada y repite. Asegúrate de contraer con fuerza el dorsal, los glúteos y el abdomen para obtener más estabilidad y fuerza."
One-Arm_Kettlebell_Push_Press:
  name: "Push press con kettlebell a una mano"
  instructions:
    - "Sujeta una kettlebell por el asa. Lleva la kettlebell hasta el hombro extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia el hombro. Rota la muñeca al hacerlo, de modo que la palma quede mirando hacia delante. Esta es la posición inicial."
    - "Realiza un dip flexionando las rodillas y manteniendo el torso erguido."
    - "Invierte la dirección de inmediato, empujando con los talones, saltando en esencia para generar impulso. Mientras lo haces, presiona la kettlebell por encima de la cabeza hasta el bloqueo extendiendo los brazos, aprovechando el impulso del cuerpo para mover el peso. Baja el peso para realizar la siguiente repetición."
One-Arm_Kettlebell_Row:
  name: "Remo con kettlebell a una mano"
  instructions:
    - "Coloca una kettlebell delante de los pies. Flexiona ligeramente las rodillas y saca los glúteos hacia atrás todo lo que puedas al inclinarte para adoptar la posición inicial. Agarra la kettlebell y tira de ella hacia el estómago, retrayendo la escápula y flexionando el codo. Mantén la espalda recta. Baja y repite."
One-Arm_Kettlebell_Snatch:
  name: "Arrancada con kettlebell a una mano"
  instructions:
    - "Coloca una kettlebell entre los pies. Flexiona las rodillas y lleva los glúteos hacia atrás para adoptar la posición inicial correcta."
    - "Mira al frente y balancea la kettlebell hacia atrás, entre las piernas."
    - "Invierte la dirección de inmediato y empuja con las caderas y las rodillas, acelerando la kettlebell hacia arriba. Cuando la kettlebell llegue a la altura del hombro, rota la mano y empuja en línea recta hacia arriba, aprovechando el impulso para recibir el peso bloqueado por encima de la cabeza."
One-Arm_Kettlebell_Split_Jerk:
  name: "Envión con tijera con kettlebell a una mano"
  instructions:
    - "Sujeta una kettlebell por el asa. Lleva la kettlebell hasta el hombro extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia el hombro. Rota la muñeca al hacerlo, de modo que la palma quede mirando hacia delante. Esta es la posición inicial."
    - "Realiza un dip flexionando las rodillas y manteniendo el torso erguido."
    - "Invierte la dirección de inmediato, empujando con los talones, saltando en esencia para generar impulso. Mientras lo haces, presiona la kettlebell por encima de la cabeza hasta el bloqueo extendiendo los brazos, aprovechando el impulso del cuerpo para mover el peso."
    - "Recibe el peso por encima de la cabeza volviendo a una posición de sentadilla bajo el peso, colocando una pierna delante y otra detrás."
    - "Manteniendo el peso por encima de la cabeza, vuelve a la posición de pie y junta los pies. Baja el peso para realizar la siguiente repetición."
One-Arm_Kettlebell_Split_Snatch:
  name: "Arrancada con tijera con kettlebell a una mano"
  instructions:
    - "Sujeta una kettlebell con una mano por el asa."
    - "Baja en sentadilla hacia el suelo y luego invierte el movimiento, extendiendo las caderas, las rodillas y por último los tobillos, para subir la kettlebell por encima de la cabeza."
    - "Tras extender completamente el cuerpo, desciende a una posición de zancada para recibir el peso por encima de la cabeza, con una pierna delante y otra detrás. Asegúrate de empujar con las caderas y bloquear la kettlebell por encima de la cabeza en un único movimiento ininterrumpido."
    - "Vuelve a la posición de pie, sosteniendo el peso por encima de la cabeza, y junta los pies. Baja el peso para volver a la posición inicial."
One-Arm_Kettlebell_Swings:
  name: "Swing con kettlebell a una mano"
  instructions: []
One-Arm_Long_Bar_Row:
  name: "Remo con barra larga a una mano"
  instructions:
    - "Coloca una barra en un landmine o en una esquina para que no se mueva. Carga un peso adecuado en tu extremo."
    - "Colócate junto a la barra y agárrala con una mano cerca del collarín. Con la ayuda de las caderas y las piernas, ponte de pie."
    - "Adopta una postura con las rodillas flexionadas, las caderas hacia atrás y el pecho alto. El brazo debe estar extendido. Esta es la posición inicial."
    - "Tira del peso hacia el costado retrayendo el hombro y flexionando el codo. No des tirones con el peso ni hagas trampas durante el movimiento."
    - "Tras una breve pausa, vuelve a la posición inicial."
One-Arm_Medicine_Ball_Slam:
  name: "Lanzamiento de balón medicinal contra el suelo a una mano"
  instructions:
    - "Empieza de pie, con una postura atlética con un pie adelantado. Sujeta un balón medicinal con una mano, del mismo lado que la pierna de atrás. Esta es la posición inicial."
    - "Empieza llevando el brazo hacia atrás y subiendo el balón medicinal por encima de la cabeza. Mientras lo haces, extiende las caderas, las rodillas y los tobillos para cargar el lanzamiento."
    - "En el punto de máxima extensión, flexiona los hombros, la columna y las caderas para lanzar el balón con fuerza contra el suelo, justo delante de ti."
    - "Atrapa el balón en el bote y continúa durante el número de repeticiones deseado."
One-Arm_Open_Palm_Kettlebell_Clean:
  name: "Cargada con kettlebell a una mano con palma abierta"
  instructions:
    - "Coloca una kettlebell entre los pies."
    - "Agarra el asa con una mano y sube la kettlebell rápidamente; deja que gire para que la bola de la kettlebell caiga en la palma de la mano."
    - "Lanza la kettlebell hacia delante y atrapa el asa con una mano."
    - "Lleva la kettlebell al suelo y repite. Asegúrate de trabajar ambos brazos."
One-Arm_Overhead_Kettlebell_Squats:
  name: "Sentadilla con kettlebell por encima de la cabeza a una mano"
  instructions:
    - "Realiza una cargada y un press de una kettlebell con un brazo. Lleva la kettlebell hasta el hombro extendiendo las piernas y las caderas mientras tiras de la kettlebell hacia el hombro. Rota la muñeca al hacerlo. Presiona el peso por encima de la cabeza extendiendo el codo. Esta es la posición inicial."
    - "Mirando al frente y manteniendo la kettlebell bloqueada sobre ti, flexiona las rodillas y las caderas y baja el torso entre las piernas, manteniendo la cabeza y el pecho altos."
    - "Haz una pausa de un segundo en la posición inferior antes de subir de nuevo, empujando con los talones."
One-Arm_Side_Deadlift:
  name: "Peso muerto lateral a una mano"
  instructions:
    - "Colócate de lado junto a una barra, cerca de su centro. Flexiona las rodillas y baja el cuerpo hasta que puedas alcanzar la barra."
    - "Agarra la barra como si cogieras un maletín (con las palmas hacia ti, ya que la barra está de lado). Puede que necesites muñequeras si usas bastante peso. Esta es la posición inicial."
    - "Usa las piernas para ayudarte a levantar la barra mientras espiras. Los brazos deben extenderse por completo al subir la barra hasta quedar de pie."
    - "Baja la barra lentamente mientras inspiras. Consejo: asegúrate de flexionar las rodillas al bajar el peso para evitar cualquier lesión."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo y repite el movimiento."
One-Arm_Side_Laterals:
  name: "Elevación lateral a una mano"
  instructions:
    - "Elige una mancuerna y sujétala con una mano. La mano que no trabaja debe agarrarse a algo estable, como un banco inclinado. Inclínate hacia el brazo que trabaja y alejándote de la mano que sujeta el banco inclinado, ya que así mantendrás el equilibrio."
    - "Ponte de pie con el torso recto y la mancuerna a un lado, con el brazo estirado y la palma de la mano mirando hacia ti. Esta es la posición inicial."
    - "Manteniendo el torso inmóvil (sin balanceos), sube la mancuerna hacia el lateral con una ligera flexión del codo y la mano ligeramente inclinada hacia delante, como si vertieras agua en un vaso. Sigue subiendo hasta que el brazo quede paralelo al suelo. Espira al realizar este movimiento y haz una pausa de un segundo arriba."
    - "Baja la mancuerna lentamente hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo y repite el ejercicio."
One-Legged_Cable_Kickback:
  name: "Patada de glúteo en polea a una pierna"
  instructions:
    - "Engancha una tobillera de cuero a una polea baja y sujétala al tobillo."
    - "Colócate de cara a la pila de pesas a una distancia de unos 60 cm, agarrándote a la estructura de acero para apoyarte."
    - "Manteniendo las rodillas y las caderas ligeramente flexionadas y el abdomen apretado, contrae los glúteos para \"patear\" lentamente hacia atrás con la pierna que trabaja, en un arco semicircular, tan alto como puedas con comodidad, mientras espiras. Consejo: en la extensión completa, aprieta los glúteos durante un segundo para conseguir una contracción máxima."
    - "Ahora lleva lentamente la pierna que trabaja hacia delante, resistiendo la tracción de la polea hasta llegar a la posición inicial."
    - "Repite el número de repeticiones indicado."
    - "Cambia de pierna y repite el movimiento en el otro lado."
One_Arm_Against_Wall:
  name: "Estiramiento de dorsal con un brazo contra la pared"
  instructions:
    - "De pie, apoya un brazo flexionado contra una pared o el marco de una puerta."
    - "Inclínate lentamente hacia tu brazo hasta que notes un estiramiento en los dorsales."
One_Arm_Chin-Up:
  name: "Dominada supina a una mano"
  instructions:
    - "Para este ejercicio, empieza colocando una toalla alrededor de una barra de dominadas."
    - "Agarra la barra de dominadas con la palma mirando hacia ti. Una mano agarrará la barra y la otra agarrará la toalla."
    - "Echa el torso hacia atrás unos 30 grados, creando una curvatura en la zona lumbar y sacando el pecho. Esta es la posición inicial."
    - "Sube el torso hasta que la barra toque la parte superior del pecho, llevando los hombros y la parte superior de los brazos hacia abajo y hacia atrás. Espira mientras realizas esta parte del movimiento. Consejo: concéntrate en apretar los músculos de la espalda al llegar a la posición de máxima contracción. La parte superior del torso debe permanecer inmóvil mientras se desplaza en el espacio y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo en la posición de contracción, empieza a inspirar y baja lentamente el torso hasta la posición inicial, cuando los brazos estén completamente extendidos y los dorsales completamente estirados."
    - "Repite este movimiento el número de repeticiones prescrito."
    - "Cambia de brazo y repite el movimiento."
One_Arm_Dumbbell_Bench_Press:
  name: "Press de banca con mancuerna a una mano"
  instructions:
    - "Túmbate en un banco plano con una mancuerna en una mano sobre el muslo."
    - "Ayudándote del muslo para subir la mancuerna, llévala hasta sostenerla delante de ti a la anchura de los hombros. Usa la mano con la que no levantas para ayudarte a colocar bien la mancuerna sobre ti."
    - "Una vez a la anchura de los hombros, rota la muñeca hacia delante de modo que la palma de la mano mire en dirección contraria a ti. Esta es la posición inicial."
    - "Baja el peso lentamente hacia el costado mientras inspiras. Mantén el control total de la mancuerna en todo momento. Consejo: usa la mano con la que no levantas para ayudar a mantener el equilibrio de la mancuerna, ya que al principio puede costarte un poco. Usa la mano que no trabaja solo si es necesario; si no, déjala apoyada a un lado."
    - "Mientras espiras, empuja la mancuerna hacia arriba usando los músculos pectorales. Bloquea los brazos en la posición de contracción, aprieta el pecho, mantén un segundo y empieza a bajar lentamente. Consejo: la bajada debe durar al menos el doble que la subida."
    - "Repite el movimiento el número de repeticiones prescrito en tu programa de entrenamiento."
    - "Cambia de brazo y repite el movimiento."
One_Arm_Dumbbell_Preacher_Curl:
  name: "Curl predicador con mancuerna a una mano"
  instructions:
    - "Agarra una mancuerna con el brazo derecho y apoya la parte superior del brazo sobre el banco predicador o el banco inclinado. La mancuerna debe sostenerse a la altura del hombro. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente la mancuerna hasta que la parte superior del brazo quede extendida y el bíceps completamente estirado."
    - "Mientras espiras, usa el bíceps para subir el peso hasta que el bíceps esté completamente contraído y la mancuerna quede a la altura del hombro. Recuerda de nuevo que, para asegurar la contracción completa, debes subir el dedo meñique más alto que el pulgar."
    - "Aprieta el bíceps con fuerza durante un segundo en la posición de contracción y repite el número de repeticiones indicado."
    - "Cambia de brazo y repite el movimiento."
One_Arm_Floor_Press:
  name: "Press de suelo a una mano"
  instructions:
    - "Túmbate sobre una superficie plana con la espalda apoyada en el suelo o en una esterilla. Asegúrate de que las rodillas estén flexionadas."
    - "Pide a un compañero que te pase la barra a una mano. Al empezar, el brazo debe estar casi completamente extendido, como en la posición inicial del press de banca con barra. Sin embargo, esta vez el agarre será neutro (palmas hacia el torso)."
    - "Asegúrate de que la mano con la que no levantas el peso esté colocada a tu lado."
    - "Empieza el ejercicio bajando la barra hasta que el codo toque el suelo. Asegúrate de inspirar, ya que esta es la fase excéntrica (la parte de bajada del ejercicio)."
    - "Después, empieza a subir la barra de nuevo hasta la posición inicial original. Recuerda espirar durante la fase concéntrica (la parte de subida del ejercicio)."
    - "Repite hasta completar las repeticiones indicadas."
    - "Cambia de brazo y repite el movimiento."
One_Arm_Lat_Pulldown:
  name: "Jalón al pecho a una mano"
  instructions:
    - "Selecciona un peso adecuado y ajusta el rodillo para las rodillas para que te mantenga abajo. Agarra la empuñadura con agarre prono. Esta es la posición inicial."
    - "Tira de la empuñadura hacia abajo, apretando el codo contra el costado mientras lo flexionas."
    - "Haz una pausa en la parte inferior del movimiento y luego devuelve lentamente la empuñadura a la posición inicial."
    - "Si haces varias repeticiones, evita devolver el peso por completo para mantener la tensión en los músculos que trabajan."
One_Arm_Pronated_Dumbbell_Triceps_Extension:
  name: "Extensión de tríceps con mancuerna a una mano (agarre prono)"
  instructions:
    - "Túmbate en un banco plano sosteniendo una mancuerna con el brazo estirado. El brazo debe quedar perpendicular al cuerpo. La palma de la mano debe mirar hacia los pies, ya que este ejercicio requiere un agarre prono."
    - "Coloca la mano que no trabaja sobre el bíceps como apoyo."
    - "Empieza a bajar lentamente la mancuerna mientras inspiras."
    - "Después, empieza a subir la mancuerna mientras contraes el tríceps. Recuerda espirar durante la fase concéntrica (la parte de subida del ejercicio)."
    - "Repite hasta completar las repeticiones de tu serie."
    - "Cambia de brazo y repite el movimiento."
One_Arm_Supinated_Dumbbell_Triceps_Extension:
  name: "Extensión de tríceps con mancuerna a una mano (agarre supino)"
  instructions:
    - "Túmbate en un banco plano sosteniendo una mancuerna con el brazo estirado. El brazo debe quedar perpendicular al cuerpo. La palma de la mano debe mirar hacia la cara, ya que este ejercicio requiere un agarre supino."
    - "Coloca la mano que no trabaja sobre el bíceps como apoyo."
    - "Empieza a bajar lentamente la mancuerna mientras inspiras."
    - "Después, empieza a subir la mancuerna mientras contraes el tríceps. Recuerda espirar durante la fase concéntrica (la parte de subida del ejercicio)."
    - "Repite hasta completar las repeticiones de tu serie."
    - "Cambia de brazo y repite el movimiento."
    - "Cambia de brazo otra vez y repite el movimiento."
One_Half_Locust:
  name: "Media langosta"
  instructions:
    - "Túmbate boca abajo en el suelo."
    - "Coloca la mano izquierda bajo el hueso de la cadera izquierda para proteger la cadera y el hueso púbico."
    - "Flexiona la rodilla derecha para poder sujetar el pie con la mano derecha."
    - "Levanta el pie en el aire y, a la vez, despega los hombros del suelo. Esto también estira el flexor de la cadera derecha, el pecho y los hombros. Cambia de lado. Si no te molesta la espalda, puedes probar con ambos brazos y piernas a la vez."
One_Handed_Hang:
  name: "Colgado a una mano"
  instructions:
    - "Agarra una barra de dominadas con una mano, con agarre prono. Mantén los pies en el suelo o sobre un escalón. Deja que la mayor parte de tu peso cuelgue de esa mano, manteniendo los pies en el suelo. Mantén durante 10-20 segundos y cambia de lado."
One_Knee_To_Chest:
  name: "Una rodilla al pecho"
  instructions:
    - "Empieza tumbado en el suelo."
    - "Estira una pierna y lleva la otra rodilla al pecho. Sujétala por debajo de la articulación de la rodilla para proteger la rótula."
    - "Tira suavemente de esa rodilla hacia la nariz."
    - "Cambia de lado. Esto estira los glúteos y la zona lumbar de la pierna flexionada y el flexor de la cadera de la pierna estirada."
One_Leg_Barbell_Squat:
  name: "Sentadilla con barra a una pierna"
  instructions:
    - "Empieza de pie a unos 60-90 cm delante de un banco plano, de espaldas a él. Ten una barra delante de ti en el suelo. Consejo: los pies deben estar separados a la anchura de los hombros."
    - "Flexiona las rodillas y usa un agarre prono con las manos más separadas que la anchura de los hombros para subir la barra hasta que puedas apoyarla en el pecho."
    - "Después, sube la barra por encima de la cabeza y apóyala en la base del cuello. Lleva un pie hacia atrás de modo que la punta quede apoyada en el banco plano. El otro pie debe permanecer inmóvil delante de ti. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te hará perder el equilibrio, y mantén también la espalda recta. Consejo: asegúrate de que la espalda esté recta y el pecho sacado mientras realizas este ejercicio."
    - "Mientras inspiras, baja lentamente la pierna hasta que el muslo quede paralelo al suelo. En este punto, la rodilla debe quedar por encima de los dedos de los pies. El pecho debe quedar justo sobre la mitad del muslo."
    - "Guiando el movimiento con el pecho y las caderas y contrayendo el cuádriceps, sube de nuevo hasta la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
    - "Cambia de pierna y repite el movimiento."
Open_Palm_Kettlebell_Clean:
  name: "Cargada con kettlebell con palma abierta"
  instructions:
    - "Coloca una kettlebell entre los pies. Haz la cargada de la kettlebell extendiendo las piernas y las caderas mientras la subes hacia los hombros."
    - "Suelta la kettlebell cuando suba y deja que gire para que la bola de la kettlebell caiga en las palmas de las manos."
    - "Suelta la kettlebell hacia delante y atrapa el asa con ambas manos. Baja la kettlebell a la posición inicial y repite."
Otis-Up:
  name: "Otis-up"
  instructions:
    - "Fija los pies y échate hacia atrás en el suelo. Las rodillas deben estar flexionadas. Sujeta un peso con ambas manos contra el pecho. Esta es la posición inicial."
    - "Inicia el movimiento flexionando las caderas y la columna para despegar el torso del suelo."
    - "Mientras subes, empuja el peso hacia arriba de modo que quede por encima de la cabeza en la parte alta del movimiento."
    - "Devuelve el peso al pecho mientras inviertes el movimiento del abdominal, procurando no bajar del todo hasta el suelo."
Overhead_Cable_Curl:
  name: "Curl en polea con brazos en alto"
  instructions:
    - "Para empezar, selecciona un peso cómodo en cada lado de la máquina de poleas. Nota: asegúrate de que el peso seleccionado sea el mismo en ambos lados."
    - "Ahora ajusta la altura de las poleas de cada lado y asegúrate de que estén colocadas por encima de la altura de tus hombros."
    - "Colócate en el centro, entre ambos lados, y usa un agarre supino (palmas hacia el techo) para agarrar cada empuñadura. Los brazos deben estar completamente extendidos y paralelos al suelo, con los pies separados a la anchura de los hombros. El cuerpo debe estar alineado con las empuñaduras. Esta es la posición inicial."
    - "Mientras espiras, aprieta lentamente los bíceps de cada lado hasta que los antebrazos y los bíceps se toquen."
    - "Mientras inspiras, devuelve los antebrazos a la posición inicial. Nota: todo tu cuerpo permanece inmóvil durante este ejercicio excepto los antebrazos."
    - "Repite el número de repeticiones indicado en tu programa."
Overhead_Lat:
  name: "Estiramiento de dorsal con brazo en alto (con compañero)"
  instructions:
    - "Siéntate erguido en el suelo con tu compañero detrás de ti. Levanta un brazo recto hacia arriba y flexiona el codo, intentando tocarte la espalda con la mano. Tu compañero debe sujetarte el tríceps y la muñeca. Esta es la posición inicial."
    - "Intenta llevar la parte superior del brazo hacia tu costado mientras tu compañero te impide hacerlo."
    - "Tras 10-20 segundos, relaja el brazo y deja que tu compañero estire más el dorsal aplicando una presión suave sobre el tríceps. Mantén durante 10-20 segundos y cambia de lado."
Overhead_Slam:
  name: "Lanzamiento de balón medicinal contra el suelo por encima de la cabeza"
  instructions:
    - "Sujeta un balón medicinal con ambas manos y ponte de pie con los pies a la anchura de los hombros. Esta es la posición inicial."
    - "Inicia el contramovimiento subiendo el balón por encima de la cabeza y extendiendo completamente el cuerpo."
    - "Invierte el movimiento, lanzando el balón contra el suelo justo delante de ti con toda la fuerza que puedas."
    - "Recibe el balón con ambas manos en el bote y repite el movimiento."
Overhead_Squat:
  name: "Sentadilla overhead"
  instructions:
    - "Empieza con una barra delante de ti en el suelo. Los pies deben estar más separados que la anchura de los hombros."
    - "Flexiona las rodillas y usa un agarre prono (palmas hacia ti) para agarrar la barra. Las manos deben estar más separadas que la anchura de los hombros antes de levantar. Una vez colocado, sube la barra hasta que puedas apoyarla en el pecho."
    - "Lleva la barra por encima y ligeramente por detrás de la cabeza y asegúrate de que los brazos estén completamente extendidos. Mantén la cabeza alta en todo momento y la espalda recta. Retrae las escápulas. Esta es la posición inicial."
    - "Baja el peso lentamente flexionando las rodillas hasta que los muslos queden paralelos al suelo mientras inspiras. Consejo: mantén la espalda recta mientras realizas este ejercicio para evitar lesiones y los brazos deben permanecer extendidos y por encima de la cabeza en todo momento."
    - "Ahora usa los pies y las piernas para ayudarte a subir el peso de nuevo hasta la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Overhead_Stretch:
  name: "Estiramiento con brazos en alto"
  instructions:
    - "De pie y con la espalda recta, entrelaza los dedos y abre las palmas hacia el techo. Mantén los hombros bajos mientras extiendes los brazos hacia arriba."
    - "Para estirar todo el torso, lleva el coxis hacia abajo y estabiliza el torso mientras lo haces. Estira los músculos tanto de la parte delantera como de la trasera del torso."
Overhead_Triceps:
  name: "Estiramiento de tríceps con brazo en alto (con compañero)"
  instructions:
    - "Siéntate erguido en el suelo con tu compañero detrás de ti. Levanta un brazo recto hacia arriba y flexiona el codo, intentando tocarte la espalda con la mano. Tu compañero debe sujetarte el codo y la muñeca. Esta es la posición inicial."
    - "Intenta extender el brazo recto hacia arriba mientras tu compañero te impide hacerlo."
    - "Tras 10-20 segundos, relaja el brazo y deja que tu compañero estire más el tríceps aplicando una presión suave sobre la muñeca. Mantén durante 10-20 segundos y cambia de lado."
Pallof_Press:
  name: "Press Pallof"
  instructions:
    - "Conecta una empuñadura estándar a una torre y, si es posible, coloca la polea a la altura del hombro. Si no, una polea baja servirá."
    - "De lado a la polea, agarra la empuñadura con ambas manos y aléjate de la torre. Debes quedar aproximadamente a un brazo de distancia de la polea, con la tensión del peso en el cable."
    - "Con los pies separados a la anchura de las caderas y las rodillas ligeramente flexionadas, sujeta el agarre de la polea a la altura del centro del pecho. Esta es la posición inicial."
    - "Empuja el agarre alejándolo del pecho, extendiendo completamente ambos brazos. El core debe estar apretado y activado."
    - "Mantén la repetición durante varios segundos antes de volver a la posición inicial."
    - "Al terminar la serie, repite mirando en la dirección contraria."
Pallof_Press_With_Rotation:
  name: "Press Pallof con rotación"
  instructions:
    - "Conecta una empuñadura estándar a una torre y coloca la polea a la altura del hombro."
    - "De lado a la polea, agarra la empuñadura con una mano y aléjate de la torre. Debes quedar aproximadamente a un brazo de distancia de la polea, con la tensión del peso en el cable. Alinea el brazo extendido con el cable."
    - "Con los pies separados a la anchura de las caderas, tira de la polea hacia el pecho y agarra la empuñadura con la otra mano. Ahora ambas manos deben estar en la empuñadura."
    - "De frente, empuja el agarre alejándolo del pecho. El core debe estar apretado y activado."
    - "Manteniendo las caderas rectas, gira el torso alejándote de la polea hasta completar un cuarto de giro."
    - "Mantén la postura rígida y los brazos rectos. Vuelve a la posición neutra de forma lenta y controlada. Los brazos deben quedar extendidos delante de ti."
    - "Con la tensión lateral todavía activando el core, lleva las manos al pecho e inmediatamente empuja hacia fuera hasta la posición completamente extendida. Esto constituye una repetición."
    - "Repite hasta el fallo."
    - "Después, reposiciónate y repite la misma serie de movimientos en el lado contrario."
Palms-Down_Dumbbell_Wrist_Curl_Over_A_Bench:
  name: "Curl de muñeca con mancuernas sobre banco (palmas hacia abajo)"
  instructions:
    - "Empieza colocando dos mancuernas a un lado de un banco plano."
    - "Arrodíllate sobre ambas rodillas de modo que quedes de cara al banco plano."
    - "Agarra ambas mancuernas con un agarre prono (palmas hacia abajo) y súbelas de modo que los antebrazos queden apoyados contra el banco plano. Las muñecas deben quedar colgando por el borde."
    - "Empieza flexionando las muñecas hacia arriba y espirando."
    - "Baja lentamente las muñecas hasta la posición inicial mientras inspiras."
    - "Los antebrazos deben permanecer inmóviles, ya que la muñeca es lo único que necesita moverse para realizar este ejercicio."
    - "Repite el número de repeticiones indicado."
Palms-Down_Wrist_Curl_Over_A_Bench:
  name: "Curl de muñeca con barra sobre banco (palmas hacia abajo)"
  instructions:
    - "Empieza colocando una barra a un lado de un banco plano."
    - "Arrodíllate sobre ambas rodillas de modo que quedes de cara al banco plano."
    - "Agarra la barra con un agarre prono (palmas hacia abajo) y súbela de modo que los antebrazos queden apoyados contra el banco plano. Las muñecas deben quedar colgando por el borde."
    - "Empieza flexionando las muñecas hacia arriba y espirando."
    - "Baja lentamente las muñecas hasta la posición inicial mientras inspiras."
    - "Los antebrazos deben permanecer inmóviles, ya que la muñeca es lo único que necesita moverse para realizar este ejercicio."
    - "Repite el número de repeticiones indicado."
Palms-Up_Barbell_Wrist_Curl_Over_A_Bench:
  name: "Curl de muñeca con barra sobre banco (palmas hacia arriba)"
  instructions:
    - "Empieza colocando una barra a un lado de un banco plano."
    - "Arrodíllate sobre ambas rodillas de modo que quedes de cara al banco plano."
    - "Agarra la barra con un agarre supino (palmas hacia arriba) y súbela de modo que los antebrazos queden apoyados contra el banco plano. Las muñecas deben quedar colgando por el borde."
    - "Empieza flexionando las muñecas hacia arriba y espirando."
    - "Baja lentamente las muñecas hasta la posición inicial mientras inspiras."
    - "Los antebrazos deben permanecer inmóviles, ya que la muñeca es lo único que necesita moverse para realizar este ejercicio."
    - "Repite el número de repeticiones indicado."
Palms-Up_Dumbbell_Wrist_Curl_Over_A_Bench:
  name: "Curl de muñeca con mancuernas sobre banco (palmas hacia arriba)"
  instructions:
    - "Empieza colocando dos mancuernas a un lado de un banco plano."
    - "Arrodíllate sobre ambas rodillas de modo que quedes de cara al banco plano."
    - "Agarra ambas mancuernas con un agarre supino (palmas hacia arriba) y súbelas de modo que los antebrazos queden apoyados contra el banco plano. Las muñecas deben quedar colgando por el borde."
    - "Empieza flexionando las muñecas hacia arriba y espirando."
    - "Baja lentamente las muñecas hasta la posición inicial mientras inspiras. Asegúrate de inspirar durante esta parte del ejercicio."
    - "Los antebrazos deben permanecer inmóviles, ya que la muñeca es lo único que necesita moverse para realizar este ejercicio."
    - "Repite el número de repeticiones indicado."
Parallel_Bar_Dip:
  name: "Fondos en paralelas"
  instructions:
    - "Colócate entre unas barras paralelas. Pon una mano en cada barra y da un pequeño salto para ayudarte a adoptar la posición inicial con los brazos bloqueados."
    - "Empieza flexionando los codos y bajando el cuerpo hasta que los brazos pasen de los 90 grados. Evita balancearte y mantén una buena postura durante todo el descenso."
    - "Invierte el movimiento extendiendo los codos y empujándote de nuevo hasta la posición inicial."
    - "Repite el número de repeticiones deseado."
Pelvic_Tilt_Into_Bridge:
  name: "Inclinación pélvica a puente"
  instructions:
    - "Túmbate con los pies en el suelo y los talones justo debajo de las rodillas."
    - "Levanta solo el coxis hacia el techo para estirar la zona lumbar. (Todavía no levantes toda la columna.) Mete el estómago hacia dentro."
    - "Para pasar al puente, levanta toda la columna excepto el cuello."
Peroneals-SMR:
  name: "Foam roller de peroneos"
  instructions:
    - "Túmbate de lado, apoyando tu peso en el antebrazo y en un foam roller colocado en la parte exterior de la pierna inferior. La pierna de arriba puede estar sobre la inferior o puedes cruzarla por delante."
    - "Levanta las caderas del suelo y empieza a rodar desde debajo de la rodilla hasta por encima del tobillo por el lateral de la pierna, haciendo pausas en los puntos de tensión durante 10-30 segundos. Repite con la otra pierna."
Peroneals_Stretch:
  name: "Estiramiento de peroneos"
  instructions:
    - "Sentado, pasa un cinturón, una cuerda o una goma elástica alrededor de un pie. Esta es la posición inicial."
    - "Con la pierna extendida y el talón despegado del suelo, tira del cinturón para que el pie quede en inversión, con el borde interno del pie yendo hacia ti. Mantén durante 10-20 segundos y cambia de lado."
Physioball_Hip_Bridge:
  name: "Puente de caderas con fitball"
  instructions:
    - "Túmbate sobre un balón de modo que la parte superior de la espalda quede apoyada en el balón y las caderas sin apoyo. Ambos pies deben estar planos en el suelo, separados a la anchura de las caderas o más. Esta es la posición inicial."
    - "Empieza extendiendo las caderas con los glúteos y los isquiotibiales, subiendo las caderas al hacer el puente."
    - "Haz una pausa en la parte alta del movimiento y vuelve a la posición inicial."
Pin_Presses:
  name: "Press de banca con pines"
  instructions:
    - "El press con pines elimina la fase excéntrica del press de banca, desarrollando la fuerza de arranque. También permite entrenar un rango de movimiento deseado."
    - "El banco debe colocarse en una jaula de potencia. Coloca los pines en el punto deseado de tu rango de movimiento, ya sea solo el bloqueo o a un dedo del pecho. La barra debe llevarse a los pines y prepararse para el levantamiento."
    - "Empieza tumbándote en el banco, con la barra justo encima del punto de contacto de tu press de banca habitual. Mete los pies por debajo de ti y arquea la espalda. Usando la barra para ayudarte a sostener tu peso, despega los hombros del banco y retráelos, apretando las escápulas. Usa los pies para clavar los trapecios en el banco. Mantén esta posición corporal firme durante todo el movimiento."
    - "Puedes usar un agarre estándar de press de banca o a la anchura de los hombros para centrarte en el tríceps. La barra, la muñeca y el codo deben mantenerse alineados en todo momento. Concéntrate en apretar la barra e intentar partirla."
    - "Empuja la barra hacia arriba con toda la fuerza posible. Los codos deben mantenerse pegados hasta el bloqueo."
    - "Devuelve la barra a los pines, haciendo una pausa antes de empezar la siguiente repetición."
Piriformis-SMR:
  name: "Foam roller de piriforme"
  instructions:
    - "Siéntate con los glúteos sobre un foam roller. Flexiona las rodillas y luego cruza una pierna de modo que el tobillo quede sobre la rodilla. Esta es la posición inicial."
    - "Desplaza tu peso hacia el lado de la pierna cruzada, rodando sobre los glúteos hasta que notes tensión en la parte alta del glúteo. Puedes ayudarte del estiramiento usando una mano para tirar de la rodilla flexionada hacia el pecho. Mantén esta posición durante 10-30 segundos y cambia de lado."
Plank:
  name: "Plancha"
  instructions:
    - "Colócate en posición prona en el suelo, apoyando tu peso en las puntas de los pies y los antebrazos. Los brazos están flexionados y justo debajo del hombro."
    - "Mantén el cuerpo recto en todo momento y aguanta esta posición el mayor tiempo posible. Para aumentar la dificultad, se puede levantar un brazo o una pierna."
Plate_Pinch:
  name: "Pinza con discos"
  instructions:
    - "Coge dos discos de borde ancho y júntalos con los lados lisos hacia fuera."
    - "Usa los dedos para agarrar la parte exterior del disco y el pulgar para el otro lado, sujetando así ambos discos juntos. Esta es la posición inicial."
    - "Aprieta el disco con los dedos y el pulgar. Mantén esta posición el mayor tiempo que puedas."
    - "Repite el número de series indicado en tu programa."
    - "Cambia de brazo y repite los movimientos."
Plate_Twist:
  name: "Giro con disco"
  instructions:
    - "Túmbate en el suelo o en una esterilla con las piernas completamente extendidas y la parte superior del cuerpo erguida. Agarra el disco por los lados con ambas manos delante del abdomen con los brazos ligeramente flexionados."
    - "Cruza lentamente las piernas a la altura de los tobillos y levántalas del suelo. Las rodillas también deben estar ligeramente flexionadas. Nota: echa la parte superior del cuerpo ligeramente hacia atrás para ayudarte a mantener el equilibrio al realizar este ejercicio. Esta es la posición inicial."
    - "Lleva el disco hacia el lado izquierdo y toca el suelo con él. Espira mientras realizas ese movimiento."
    - "Vuelve a la posición inicial mientras inspiras y luego repite el movimiento, esta vez hacia el lado derecho del cuerpo. Consejo: usa un movimiento lento y controlado en todo momento. Los tirones pueden lesionar la espalda."
    - "Repite el número de repeticiones indicado."
Platform_Hamstring_Slides:
  name: "Deslizamientos de isquiotibiales en plataforma"
  instructions:
    - "Para este movimiento se necesita un suelo de madera o similar. Túmbate boca arriba con las piernas extendidas. Coloca una toalla de gimnasio o un peso ligero bajo el talón. Esta es la posición inicial."
    - "Empieza el movimiento flexionando la rodilla, manteniendo la otra pierna recta."
    - "Sigue acercando el talón hacia ti, deslizándolo por el suelo."
    - "En la flexión completa de rodilla, invierte el movimiento para volver a la posición inicial."
Plie_Dumbbell_Squat:
  name: "Sentadilla plié con mancuerna"
  instructions:
    - "Sujeta una mancuerna por la base con ambas manos y ponte de pie. Separa las piernas más que la anchura de los hombros con las rodillas ligeramente flexionadas."
    - "Las puntas de los pies deben mirar hacia fuera. Nota: los brazos deben permanecer inmóviles mientras realizas el ejercicio. Esta es la posición inicial."
    - "Flexiona lentamente las rodillas y baja hasta que los muslos queden paralelos al suelo. Asegúrate de inspirar, ya que esta es la parte excéntrica del ejercicio."
    - "Empuja principalmente con el talón del pie para volver a la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Plyo_Kettlebell_Pushups:
  name: "Flexiones pliométricas con kettlebell"
  instructions:
    - "Coloca una kettlebell en el suelo. Colócate en posición de flexión, sobre las puntas de los pies con una mano en el suelo y otra sujetando la kettlebell, con los codos extendidos. Esta es la posición inicial."
    - "Empieza bajando todo lo que puedas, manteniendo la espalda recta."
    - "Invierte la dirección de forma rápida y explosiva, empujándote hasta el otro lado de la kettlebell, cambiando de mano al hacerlo. Continúa el movimiento descendiendo y repitiéndolo de un lado a otro."
Plyo_Push-up:
  name: "Flexión pliométrica"
  instructions:
    - "Adopta una posición prona en el suelo, apoyando tu peso en las manos y las puntas de los pies."
    - "Los brazos deben estar completamente extendidos con las manos a la anchura de los hombros aproximadamente. Mantén el cuerpo recto durante todo el movimiento. Esta es la posición inicial."
    - "Desciende flexionando los codos, bajando el pecho hacia el suelo."
    - "Abajo, invierte el movimiento empujándote hacia arriba mediante la extensión de los codos lo más rápido posible. Intenta empujar la parte superior del cuerpo hasta que las manos despeguen del suelo."
    - "Vuelve a la posición inicial y repite el ejercicio."
    - "Para aumentar la dificultad, añade palmadas al movimiento mientras estás en el aire."
Posterior_Tibialis_Stretch:
  name: "Estiramiento del tibial posterior"
  instructions:
    - "Sentado, pasa un cinturón, una cuerda o una goma elástica alrededor de un pie. Esta es la posición inicial."
    - "Con la pierna extendida y el talón despegado del suelo, tira del cinturón para que el pie quede en eversión, con el borde externo del pie yendo hacia ti. Mantén durante 10-20 segundos y cambia de lado."
Power_Clean:
  name: "Cargada de potencia"
  instructions:
    - "Ponte de pie con los pies ligeramente más separados que la anchura de los hombros y las puntas ligeramente hacia fuera."
    - "Baja en sentadilla y agarra la barra con un agarre cerrado y prono. Las manos deben estar ligeramente más separadas que la anchura de los hombros, por fuera de las rodillas, con los codos completamente extendidos."
    - "Coloca la barra a unos 2,5 cm delante de las espinillas y sobre la parte anterior de los pies."
    - "La espalda debe estar plana o ligeramente arqueada, el pecho alto y hacia fuera y las escápulas retraídas."
    - "Mantén la cabeza en posición neutra (alineada con la columna vertebral, sin inclinar ni girar) con la mirada al frente. Inspira durante esta fase."
    - "Levanta la barra del suelo extendiendo con fuerza las caderas y las rodillas mientras espiras. Consejo: la parte superior del torso debe mantener el mismo ángulo. No te inclines por la cintura todavía y no dejes que las caderas suban antes que los hombros (esto tendría el efecto de empujar los glúteos hacia arriba y estirar los isquiotibiales)."
    - "Mantén los codos completamente extendidos con la cabeza en posición neutra y los hombros por encima de la barra."
    - "Mientras la barra sube, mantenla lo más cerca posible de las espinillas."
    - "Cuando la barra pase las rodillas, empuja las caderas hacia delante y flexiona ligeramente las rodillas para evitar bloquearlas. Consejo: en este punto los muslos deben estar contra la barra."
    - "Mantén la espalda plana o ligeramente arqueada, los codos completamente extendidos y la cabeza neutra. Consejo: contendrás la respiración hasta la siguiente fase."
    - "Inspira y luego extiende con fuerza y rapidez las caderas y las rodillas y ponte de puntillas."
    - "Mantén la barra lo más cerca posible del cuerpo. Consejo: la espalda debe estar plana con los codos apuntando hacia los lados y la cabeza en posición neutra. Mantén también los hombros sobre la barra y los brazos rectos el mayor tiempo posible."
    - "Cuando las articulaciones del tren inferior estén completamente extendidas, encoge los hombros hacia arriba con rapidez sin flexionar todavía los codos. Espira durante esta parte del movimiento."
    - "Cuando los hombros alcancen su máxima elevación, flexiona los codos para empezar a tirar de tu cuerpo por debajo de la barra."
    - "Continúa tirando de los brazos tan alto y durante tanto tiempo como sea posible. Consejo: debido a la naturaleza explosiva de esta fase, el torso estará erguido o con la espalda arqueada, la cabeza ligeramente echada hacia atrás y los pies pueden perder contacto con el suelo."
    - "Cuando el tren inferior se haya extendido por completo y la barra alcance casi su altura máxima, métete por debajo de la barra y rota los brazos alrededor y por debajo de la barra."
    - "A la vez, flexiona las caderas y las rodillas hasta una posición de cuarto de sentadilla."
    - "Una vez que los brazos estén bajo la barra, inspira y luego sube los codos para colocar la parte superior de los brazos paralela al suelo. Apoya la barra sobre la parte delantera de las clavículas y los músculos delanteros del hombro."
    - "Recibe la barra con el torso erguido y firme, la cabeza en posición neutra y los pies planos. Espira durante este movimiento."
    - "Ponte de pie extendiendo las caderas y las rodillas hasta quedar completamente erguido."
    - "Baja la barra reduciendo gradualmente la tensión muscular de los brazos para permitir un descenso controlado de la barra hasta los muslos. Inspira durante este movimiento."
    - "A la vez, flexiona las caderas y las rodillas para amortiguar el impacto de la barra en los muslos."
    - "Baja en sentadilla con los codos completamente extendidos hasta que la barra toque el suelo."
    - "Empieza de nuevo desde la fase 1 y repite el número de repeticiones indicado."
Power_Clean_from_Blocks:
  name: "Cargada de potencia desde bloques"
  instructions:
    - "Con una barra sobre cajones de la altura deseada, agárrala justo por fuera de las piernas. Baja las caderas con el peso en los talones, la espalda recta, la cabeza mirando al frente, el pecho alto y los hombros justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con los talones y extendiendo las rodillas. El ángulo de la espalda debe mantenerse igual y los brazos deben permanecer rectos. Cuando la barra se acerque a la posición de mitad del muslo, empieza a extender las caderas."
    - "Con un movimiento de salto, acelera extendiendo las caderas, las rodillas y los tobillos, usando la velocidad para subir la barra. No debería hacer falta tirar activamente con los brazos para acelerar el peso. Al final del segundo tirón, el cuerpo debe estar completamente extendido, inclinado ligeramente hacia atrás, con los brazos todavía extendidos."
    - "Cuando se alcance la extensión completa, pasa al tercer tirón encogiendo los hombros con energía y flexionando los brazos con los codos hacia arriba y hacia fuera. En el punto de máxima extensión, métete bajo la barra lo suficiente como para poder apoyarla en los hombros, rotando los codos por debajo de la barra al hacerlo. La barra debe apoyarse en los hombros protraídos, rozando ligeramente la garganta con las manos relajadas."
    - "Recupérate de inmediato empujando con los talones, manteniendo el torso erguido y los codos arriba. Continúa hasta ponerte de pie y completa la repetición devolviendo el peso a los cajones."
Power_Jerk:
  name: "Envión de potencia"
  instructions:
    - "De pie con el peso apoyado en la parte delantera de los hombros, empieza con el dip. Con los pies justo debajo de las caderas, flexiona las rodillas sin llevar las caderas hacia atrás. Baja solo un poco e invierte la dirección con la mayor potencia posible."
    - "Empuja con los talones para generar la mayor velocidad y fuerza posibles y asegúrate de apartar la cabeza cuando la barra salga de los hombros."
    - "En este momento, cuando los pies dejan el suelo, deben colocarse en la posición de recepción lo más rápido posible. En el breve instante en que los pies no empujan activamente contra la plataforma, el esfuerzo del atleta por subir la barra los empujará hacia abajo. Los pies deben moverse a una postura ligeramente más ancha, con las rodillas parcialmente flexionadas."
    - "Recibe la barra con los brazos bloqueados por encima de la cabeza."
    - "Vuelve a la posición de pie."
Power_Partials:
  name: "Elevaciones laterales parciales"
  instructions:
    - "Ponte de pie con el torso erguido y una mancuerna en cada mano sostenida con los brazos estirados. Los codos deben estar cerca del torso."
    - "Las palmas de las manos deben mirar hacia el torso. Los pies deben estar separados aproximadamente a la anchura de los hombros. Esta es la posición inicial."
    - "Manteniendo los brazos rectos y el torso inmóvil, sube las pesas hacia los lados hasta que estén aproximadamente a la altura de los hombros mientras espiras."
    - "Nota la contracción durante un segundo y empieza a bajar las pesas de nuevo hasta la posición inicial mientras inspiras. Consejo: mantén las palmas hacia abajo con el dedo meñique ligeramente más alto mientras subes y bajas las pesas, ya que así concentrarás la tensión principalmente en los hombros."
    - "Repite el número de repeticiones indicado."
Power_Snatch:
  name: "Arrancada de potencia"
  instructions:
    - "Empieza con una barra cargada en el suelo. La barra debe estar cerca o tocando las espinillas y se debe usar un agarre ancho. Los pies deben estar justo debajo de las caderas, con las puntas hacia fuera según sea necesario. Baja las caderas, con el pecho alto y la cabeza mirando al frente. Los hombros deben estar justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con la parte delantera de los talones, levantando la barra del suelo. El ángulo de la espalda debe mantenerse igual hasta que la barra pase las rodillas."
    - "Pasa al segundo tirón extendiendo las caderas, las rodillas y los tobillos, subiendo la barra lo más rápido posible. La barra debe estar cerca del cuerpo. En el punto de máxima extensión, encoge los hombros y deja que los codos se flexionen hacia los lados."
    - "Al mover los pies a la posición de recepción, una posición ligeramente más ancha, métete por debajo de la barra mientras subes la barra por encima de la cabeza. La barra debe recibirse en una sentadilla parcial. Continúa subiendo la barra hasta la posición por encima de la cabeza, recibiéndola bloqueada sobre la cabeza."
    - "Vuelve a la posición de pie con el peso por encima de la cabeza."
Power_Snatch_from_Blocks:
  name: "Arrancada de potencia desde bloques"
  instructions:
    - "Empieza con una barra cargada sobre cajones o soportes de la altura deseada. Se debe usar un agarre ancho. Los pies deben estar justo debajo de las caderas, con las puntas hacia fuera según sea necesario. Baja las caderas, con el pecho alto y la cabeza mirando al frente. Los hombros deben estar justo por delante de la barra, con los codos apuntando hacia fuera. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con la parte delantera de los talones, levantando la barra de los cajones."
    - "Pasa al segundo tirón extendiendo las caderas, las rodillas y los tobillos, subiendo la barra lo más rápido posible. La barra debe estar cerca del cuerpo. En el punto de máxima extensión, encoge los hombros y deja que los codos se flexionen hacia los lados."
    - "Al mover los pies a la posición de recepción, métete por debajo de la barra con fuerza mientras subes la barra por encima de la cabeza. Los pies deben moverse justo por fuera de las caderas, con las puntas hacia fuera según sea necesario. Recibe la barra por encima de una sentadilla completa y con los brazos completamente extendidos por encima de la cabeza."
    - "Manteniendo la barra alineada sobre la parte delantera de los talones, con la cabeza y el pecho altos, empuja con los talones para pasar a la posición de pie. Devuelve el peso a los cajones con cuidado."
Power_Stairs:
  name: "Power stairs"
  instructions:
    - "En las power stairs, los implementos se suben por una escalera. Con fines de entrenamiento, se pueden realizar con un neumático o un cajón."
    - "Empieza cogiendo el implemento con ambas manos. Separa bien los pies, con la cabeza y el pecho altos. Empuja contra el suelo con los talones, extendiendo las rodillas y las caderas para levantar el peso del suelo."
    - "Al inclinarte hacia atrás, intenta lanzar el peso sobre la escalera, cuyos peldaños suelen tener unos 40-45 cm de altura. Puedes usar las piernas para ayudar a empujar el peso sobre el escalón."
    - "Repite durante 3-5 repeticiones y continúa con un peso mayor, moviéndote lo más rápido posible."
Preacher_Curl:
  name: "Curl predicador"
  instructions:
    - "Para realizar este movimiento necesitarás un banco predicador y una barra Z. Agarra la barra Z por el agarre interior cercano (lo preferible es que alguien te pase la barra o cógela del soporte delantero que tienen la mayoría de los bancos predicador). Las palmas de las manos deben mirar hacia delante y deben quedar ligeramente inclinadas hacia dentro debido a la forma de la barra."
    - "Con la parte superior de los brazos apoyada contra el cojín del banco predicador y el pecho contra él, sujeta la barra Z a la altura de los hombros. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente la barra hasta que la parte superior del brazo quede extendida y el bíceps completamente estirado."
    - "Mientras espiras, usa el bíceps para subir el peso hasta que el bíceps esté completamente contraído y la barra quede a la altura de los hombros. Aprieta el bíceps con fuerza y mantén esta posición durante un segundo."
    - "Repite el número de repeticiones indicado."
Preacher_Hammer_Dumbbell_Curl:
  name: "Curl martillo predicador con mancuernas"
  instructions:
    - "Apoya la parte superior de ambos brazos sobre el banco predicador mientras sujetas una mancuerna en cada mano con las palmas enfrentadas (agarre neutro)."
    - "Mientras inspiras, baja lentamente las mancuernas hasta que la parte superior del brazo quede extendida y el bíceps completamente estirado."
    - "Mientras espiras, usa el bíceps para subir el peso hasta que el bíceps esté completamente contraído y las mancuernas queden a la altura de los hombros."
    - "Aprieta el bíceps con fuerza durante un segundo en la posición de contracción y repite el número de repeticiones indicado."
Press_Sit-Up:
  name: "Abdominal con press de barra"
  instructions:
    - "Para empezar, túmbate en un banco con una barra apoyada sobre el pecho. Coloca las piernas de modo que queden sujetas en la extensión del banco de abdominales. Esta es la posición inicial."
    - "Mientras inspiras, aprieta los abdominales y los glúteos. A la vez, flexiona el torso como al hacer un abdominal y empuja la barra hasta una posición por encima de la cabeza mientras espiras. Consejo: usa los brazos para empujar la barra hacia fuera mientras realizas este ejercicio sin dejar de centrarte en los músculos abdominales."
    - "Baja la parte superior del cuerpo hasta la posición inicial mientras llevas la barra de nuevo hacia el torso. Recuerda inspirar mientras bajas el cuerpo."
    - "Repite el número de repeticiones indicado."
Prone_Manual_Hamstring:
  name: "Curl femoral manual en prono"
  instructions:
    - "Necesitarás un compañero para este ejercicio. Túmbate boca abajo con las piernas rectas. Tu ayudante colocará la mano sobre tu talón."
    - "Para empezar, flexiona la rodilla para subir la pierna. Tu compañero debe ofrecer resistencia, empezando suave y aumentando la presión a medida que se completa el movimiento. Comunícate con tu compañero para controlar los niveles de resistencia adecuados."
    - "Haz una pausa arriba y devuelve la pierna a la posición inicial mientras tu compañero ofrece resistencia en la dirección contraria."
Prowler_Sprint:
  name: "Sprint con trineo Prowler"
  instructions:
    - "Coloca tu trineo sobre una superficie adecuada, cargado con un peso apropiado. El trineo debe ofrecer suficiente resistencia como para requerir esfuerzo, pero no tanta como para frenarte de forma significativa."
    - "Puedes usar las empuñaduras altas o las bajas para este ejercicio. Coloca las manos en las empuñaduras con los brazos extendidos, inclinándote sobre el implemento."
    - "Con buena postura, empuja contra el suelo con pasos cortos y alternos. Muévete lo más rápido que puedas durante una distancia corta."
Pull_Through:
  name: "Pull through en polea"
  instructions:
    - "Empieza de pie a aproximadamente un metro delante de una polea baja con una cuerda o empuñadura. Colócate de espaldas a la máquina, con el cable entre las piernas y los pies bien separados."
    - "Empieza el movimiento llevando los brazos entre las piernas lo más lejos posible, flexionando por las caderas. Mantén las rodillas ligeramente flexionadas. Manteniendo los brazos rectos, extiende la cadera para ponerte completamente de pie. Evita tirar hacia arriba con los hombros; todo el movimiento debe originarse en las caderas."
Pullups:
  name: "Dominadas"
  instructions:
    - "Agarra la barra de dominadas con las palmas hacia delante usando el agarre prescrito. Nota sobre los agarres: para un agarre ancho, las manos deben estar separadas a una distancia mayor que la anchura de los hombros. Para un agarre medio, las manos deben estar separadas a una distancia igual a la anchura de los hombros y para un agarre cerrado a una distancia menor que la anchura de los hombros."
    - "Con ambos brazos extendidos delante de ti sujetando la barra con la anchura de agarre elegida, echa el torso hacia atrás unos 30 grados, creando una curvatura en la zona lumbar y sacando el pecho. Esta es la posición inicial."
    - "Sube el torso hasta que la barra toque la parte superior del pecho, llevando los hombros y la parte superior de los brazos hacia abajo y hacia atrás. Espira mientras realizas esta parte del movimiento. Consejo: concéntrate en apretar los músculos de la espalda al llegar a la posición de máxima contracción. La parte superior del torso debe permanecer inmóvil mientras se desplaza en el espacio y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo en la posición de contracción, empieza a inspirar y baja lentamente el torso hasta la posición inicial, cuando los brazos estén completamente extendidos y los dorsales completamente estirados."
    - "Repite este movimiento el número de repeticiones prescrito."
Push-Up_Wide:
  name: "Flexión con agarre ancho"
  instructions:
    - "Con las manos muy separadas, apoya el cuerpo en las puntas de los pies y las manos en posición de plancha. Los codos deben estar extendidos y el cuerpo recto. No dejes que las caderas se hundan. Esta es la posición inicial."
    - "Para empezar, deja que los codos se flexionen, bajando el pecho hacia el suelo mientras inspiras."
    - "Usando los músculos pectorales, empuja la parte superior del cuerpo de nuevo hasta la posición inicial extendiendo los codos. Espira mientras realizas este paso."
    - "Tras hacer una pausa en la posición de contracción, repite el movimiento el número de repeticiones prescrito."
Push-Ups_-_Close_Triceps_Position:
  name: "Flexiones con agarre cerrado (tríceps)"
  instructions:
    - "Túmbate boca abajo en el suelo y coloca las manos más juntas que la anchura de los hombros, en posición de manos cerradas. Asegúrate de mantener el torso elevado con los brazos extendidos."
    - "Baja hasta que el pecho casi toque el suelo mientras inspiras."
    - "Usando los tríceps y parte de los pectorales, empuja la parte superior del cuerpo de nuevo hasta la posición inicial y aprieta el pecho. Espira mientras realizas este paso."
    - "Tras una pausa de un segundo en la posición de contracción, repite el movimiento el número de repeticiones prescrito."
Push-Ups_With_Feet_Elevated:
  name: "Flexiones con pies elevados"
  instructions:
    - "Túmbate boca abajo en el suelo y coloca las manos separadas unos 90 cm entre sí, manteniendo el torso elevado con los brazos extendidos."
    - "Coloca las puntas de los pies sobre un banco plano. Esto permitirá que tu cuerpo quede elevado. Nota: cuanto más alto esté el banco plano, mayor es la resistencia del ejercicio."
    - "Baja hasta que el pecho casi toque el suelo mientras inspiras."
    - "Usando los músculos pectorales, empuja la parte superior del cuerpo de nuevo hasta la posición inicial y aprieta el pecho. Espira mientras realizas este paso."
    - "Tras una pausa de un segundo en la posición de contracción, repite el movimiento el número de repeticiones prescrito."
Push-Ups_With_Feet_On_An_Exercise_Ball:
  name: "Flexiones con pies sobre fitball"
  instructions:
    - "Túmbate boca abajo en el suelo y coloca las manos separadas unos 90 cm entre sí, manteniendo el torso elevado con los brazos extendidos."
    - "Coloca las puntas de los pies sobre una fitball. Esto permitirá que tu cuerpo quede elevado."
    - "Baja hasta que el pecho casi toque el suelo mientras inspiras."
    - "Usando los músculos pectorales, empuja la parte superior del cuerpo de nuevo hasta la posición inicial y aprieta el pecho. Espira mientras realizas este paso."
    - "Tras una pausa de un segundo en la posición de contracción, repite el movimiento el número de repeticiones prescrito."
Push_Press_-_Behind_the_Neck:
  name: "Push press tras nuca"
  instructions:
    - "De pie con el peso apoyado en la parte trasera de los hombros, empieza con el dip. Con los pies justo debajo de las caderas, flexiona las rodillas sin llevar las caderas hacia atrás. Baja solo un poco e invierte la dirección con la mayor potencia posible. Empuja con los talones para generar la mayor velocidad y fuerza posibles, moviendo la barra en una trayectoria vertical."
    - "Aprovechando el impulso generado, termina de empujar el peso por encima de la cabeza extendiendo los brazos."
    - "Vuelve a la posición inicial, usando las piernas para absorber el impacto."
Push_Up_to_Side_Plank:
  name: "Flexión a plancha lateral"
  instructions:
    - "Colócate en posición de flexión sobre las puntas de los pies con las manos justo por fuera de la anchura de los hombros."
    - "Realiza una flexión dejando que los codos se flexionen. Mientras bajas, mantén el cuerpo recto."
    - "Haz una flexión y, al subir, desplaza tu peso al lado izquierdo del cuerpo y gira hacia ese lado mientras llevas el brazo derecho hacia el techo en una plancha lateral."
    - "Baja el brazo de nuevo al suelo para hacer otra flexión y luego gira hacia el otro lado."
    - "Repite la serie, alternando cada lado, durante 10 o más repeticiones."
Pushups:
  name: "Flexiones"
  instructions:
    - "Túmbate boca abajo en el suelo y coloca las manos separadas unos 90 cm mientras mantienes el torso elevado con los brazos extendidos."
    - "A continuación, baja hasta que el pecho casi toque el suelo mientras inspiras."
    - "Ahora espira y empuja la parte superior del cuerpo de nuevo hasta la posición inicial mientras aprietas el pecho."
    - "Tras una breve pausa en la posición de contracción arriba, puedes empezar a bajar de nuevo tantas repeticiones como necesites."
Pushups_Close_and_Wide_Hand_Positions:
  name: "Flexiones (agarre cerrado y ancho)"
  instructions:
    - "Túmbate boca abajo en el suelo con el cuerpo recto y las puntas de los pies en el suelo, con las manos más separadas que la anchura de los hombros para la posición de manos anchas y más juntas que la anchura de los hombros para la posición de manos cerradas. Asegúrate de mantener el torso elevado con los brazos extendidos."
    - "Baja hasta que el pecho casi toque el suelo mientras inspiras."
    - "Usando los músculos pectorales, empuja la parte superior del cuerpo de nuevo hasta la posición inicial y aprieta el pecho. Espira mientras realizas este paso."
    - "Tras una pausa de un segundo en la posición de contracción, repite el movimiento el número de repeticiones prescrito."
Pyramid:
  name: "Pirámide con fitball"
  instructions:
    - "Empieza rodando el torso hacia delante sobre el balón de modo que las caderas queden encima del balón y se conviertan en el punto más alto de tu cuerpo."
    - "Apoya las manos y los pies en el suelo. Los brazos y las piernas pueden estar ligeramente flexionados o rectos, según el tamaño del balón, tu flexibilidad y la longitud de tus extremidades. Esto también ayuda a desarrollar la fuerza estabilizadora en el torso y los hombros."
Quad_Stretch:
  name: "Estiramiento de cuádriceps"
  instructions:
    - "Túmbate de lado. Pasa un cinturón, una cuerda o una goma elástica alrededor del pie de arriba. Flexiona la rodilla y extiende la cadera, intentando tocarte el glúteo con el pie y sujetando el cinturón con las manos. Esta es la posición inicial."
    - "Con el cinturón sujeto por encima del hombro o por encima de la cabeza, tira suavemente para aumentar el estiramiento en el cuádriceps. Mantén durante 10-20 segundos y cambia de lado."
Quadriceps-SMR:
  name: "Foam roller de cuádriceps"
  instructions:
    - "Túmbate boca abajo en el suelo con tu peso apoyado en las manos o los antebrazos. Coloca un foam roller bajo una pierna, en el cuádriceps, y mantén el pie despegado del suelo. Procura relajar la pierna todo lo posible. Esta es la posición inicial."
    - "Desplazando todo el peso que toleres hacia la pierna que se va a estirar, rueda sobre el foam roller desde por encima de la rodilla hasta por debajo de la cadera, manteniendo los puntos de tensión durante 10-30 segundos. Cambia de lado."
Quick_Leap:
  name: "Salto rápido al cajón"
  instructions:
    - "Necesitarás un cajón para este ejercicio."
    - "Empieza de cara al cajón, de pie a unos 30-60 cm de su borde."
    - "Usando las caderas, salta sobre el cajón, aterrizando con ambas piernas. Asegúrate de aterrizar con las piernas flexionadas y los pies planos."
    - "Nada más aterrizar, extiende completamente todo el cuerpo y lanza los brazos por encima de la cabeza para salir disparado del cajón. Usa las piernas para absorber el impacto del aterrizaje."
Rack_Delivery:
  name: "Rack delivery"
  instructions:
    - "Este ejercicio técnico enseña a llevar la barra a la posición de rack sobre los hombros. Empieza sujetando una barra en la posición de espantapájaros, con la parte superior de los brazos paralela al suelo y los antebrazos colgando hacia abajo. Usa un agarre de gancho, con los dedos envolviendo los pulgares."
    - "Empieza rotando los codos alrededor de la barra, llevando la barra hacia los hombros. A medida que los codos avanzan, relaja el agarre. Los hombros deben estar protraídos, formando una repisa para la barra, que debe rozar ligeramente la garganta."
    - "Es importante que la barra permanezca cerca del cuerpo en todo momento, ya que con una carga mayor cualquier distancia provocará un choque no deseado. A medida que el movimiento se vuelva más fluido, se pueden aumentar la velocidad y la carga antes de progresar más."
Rack_Pull_with_Bands:
  name: "Peso muerto desde rack con gomas elásticas"
  instructions:
    - "Prepárate en una jaula de potencia con la barra sobre los pines. Los pines deben colocarse en el punto deseado: justo por debajo de las rodillas, justo por encima o a mitad del muslo. Engancha las gomas elásticas a la base de la jaula o asegúralas con mancuernas. Engancha el otro extremo a la barra. Puede que necesites estrangular las gomas para dar tensión."
    - "Colócate contra la barra en la posición correcta de peso muerto. Los pies deben estar bajo las caderas, el agarre a la anchura de los hombros, la espalda arqueada y las caderas hacia atrás para activar los isquiotibiales. Como el peso suele ser elevado, puedes usar un agarre mixto, un agarre de gancho o usar correas para ayudarte a sujetar el peso."
    - "Con la cabeza mirando al frente, extiende las caderas y las rodillas, subiendo el peso hacia arriba y hacia atrás hasta el bloqueo. Asegúrate de llevar los hombros hacia atrás al completar el movimiento. Devuelve el peso a los pines y repite."
Rack_Pulls:
  name: "Peso muerto desde rack"
  instructions:
    - "Prepárate en una jaula de potencia con la barra sobre los pines. Los pines deben colocarse en el punto deseado: justo por debajo de las rodillas, justo por encima o a mitad del muslo. Colócate contra la barra en la posición correcta de peso muerto. Los pies deben estar bajo las caderas, el agarre a la anchura de los hombros, la espalda arqueada y las caderas hacia atrás para activar los isquiotibiales. Como el peso suele ser elevado, puedes usar un agarre mixto, un agarre de gancho o usar correas para ayudarte a sujetar el peso."
    - "Con la cabeza mirando al frente, extiende las caderas y las rodillas, subiendo el peso hacia arriba y hacia atrás hasta el bloqueo. Asegúrate de llevar los hombros hacia atrás al completar el movimiento."
    - "Devuelve el peso a los pines y repite."
Rear_Leg_Raises:
  name: "Elevación de pierna hacia atrás"
  instructions:
    - "Colócate a cuatro patas sobre una esterilla. La cabeza debe mirar al frente y la flexión de las rodillas debe crear un ángulo de 90 grados entre los isquiotibiales y las pantorrillas. Esta es la posición inicial."
    - "Extiende una pierna hacia arriba y hacia atrás. La rodilla y la cadera deben extenderse a la vez. Repite durante 5-10 repeticiones y luego cambia de lado."
Recumbent_Bike:
  name: "Bicicleta reclinada"
  instructions:
    - "Para empezar, siéntate en la bicicleta y ajusta el asiento a tu altura."
    - "Selecciona la opción deseada en el menú. Puede que tengas que empezar a pedalear para encenderla. Puedes usar el ajuste manual o seleccionar un programa. Normalmente puedes introducir tu edad y peso para estimar las calorías quemadas durante el ejercicio. El nivel de resistencia se puede cambiar durante el entrenamiento. Las empuñaduras se pueden usar para controlar tu frecuencia cardíaca y ayudarte a mantener una intensidad adecuada."
    - "Las bicicletas reclinadas ofrecen comodidad, beneficios cardiovasculares y tienen menos impacto que otras actividades. Una persona de unos 68 kg quemará unas 230 calorías pedaleando a un ritmo moderado durante 30 minutos, frente a 450 calorías o más corriendo."
Return_Push_from_Stance:
  name: "Pase de vuelta desde posición de salida"
  instructions:
    - "Necesitarás un compañero para este ejercicio."
    - "Empieza en una postura atlética de 2 o 3 apoyos."
    - "A la señal, muévete a una posición para recibir el pase de tu compañero."
    - "Atrapa el balón medicinal con ambas manos y devuélveselo de inmediato a tu compañero."
    - "Puedes modificar este ejercicio corriendo diferentes rutas."
Reverse_Barbell_Curl:
  name: "Curl inverso con barra"
  instructions:
    - "De pie, con el torso erguido, sujeta una barra a la anchura de los hombros con los codos pegados al torso. Las palmas de las manos deben mirar hacia abajo (agarre prono). Esta es la posición inicial."
    - "Manteniendo los brazos fijos, sube el peso contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y la barra esté a la altura de los hombros. Mantén la contracción un segundo mientras aprietas el músculo."
    - "Baja lentamente la barra a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Reverse_Barbell_Preacher_Curls:
  name: "Curl inverso en banco predicador con barra"
  instructions:
    - "Coge una barra Z con agarre prono (palmas hacia abajo) a la anchura de los hombros."
    - "Apoya la parte superior de ambos brazos sobre el banco predicador con los brazos extendidos. Esta es la posición inicial."
    - "Al espirar, usa los bíceps para subir el peso hasta que estén totalmente contraídos y la barra esté a la altura de los hombros. Aprieta con fuerza los bíceps durante un segundo en la posición contraída."
    - "Al inspirar, baja lentamente la barra hasta que la parte superior de los brazos quede extendida y los bíceps totalmente estirados."
    - "Repite el número de repeticiones indicado."
Reverse_Cable_Curl:
  name: "Curl inverso en polea"
  instructions:
    - "De pie, con el torso erguido, sujeta un agarre de barra enganchado a una polea baja con agarre prono (palmas hacia abajo) a la anchura de los hombros. Asegúrate también de mantener los codos pegados al torso. Esta es la posición inicial."
    - "Manteniendo los brazos fijos, sube el peso contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y la barra esté a la altura de los hombros. Mantén la contracción un segundo mientras aprietas el músculo."
    - "Baja lentamente la barra a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Reverse_Crunch:
  name: "Encogimiento abdominal inverso"
  instructions:
    - "Túmbate en el suelo con las piernas totalmente extendidas y los brazos a los lados del torso con las palmas en el suelo. Los brazos deben permanecer fijos durante todo el ejercicio."
    - "Sube las piernas de modo que los muslos queden perpendiculares al suelo y los pies juntos y paralelos al suelo. Esta es la posición inicial."
    - "Mientras inspiras, lleva las piernas hacia el torso al tiempo que giras la pelvis hacia atrás y levantas las caderas del suelo. Al final del movimiento las rodillas tocarán el pecho."
    - "Mantén la contracción un segundo y vuelve a llevar las piernas a la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Reverse_Flyes:
  name: "Pájaro con mancuernas"
  instructions:
    - "Para empezar, túmbate boca abajo en un banco inclinado con el pecho y el estómago apoyados en el respaldo. Sujeta una mancuerna en cada mano con las palmas enfrentadas (agarre neutro)."
    - "Extiende los brazos frente a ti de modo que queden perpendiculares a la inclinación del banco. Las piernas deben permanecer fijas, presionando con la parte delantera de los pies. Esta es la posición inicial."
    - "Manteniendo una ligera flexión de los codos, lleva las pesas hacia fuera y alejándolas entre sí (hacia los lados) en un movimiento en arco mientras espiras. Consejo: intenta juntar los omóplatos para sacar el máximo partido al ejercicio."
    - "Los brazos deben elevarse hasta quedar paralelos al suelo."
    - "Siente la contracción y baja lentamente las pesas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Reverse_Flyes_With_External_Rotation:
  name: "Pájaro con rotación externa"
  instructions:
    - "Para empezar, túmbate boca abajo en un banco inclinado a 30 grados con el pecho y el estómago apoyados en el respaldo."
    - "Sujeta una mancuerna en cada mano con las palmas mirando al suelo. Los brazos deben estar frente a ti, perpendiculares a la inclinación del banco. Consejo: los codos deben estar ligeramente flexionados. Las piernas deben permanecer fijas, presionando con la parte delantera de los pies (los talones no deben tocar el suelo). Esta es la posición inicial."
    - "Manteniendo una ligera flexión de los codos, lleva las pesas hacia fuera y alejándolas entre sí en un movimiento en arco mientras espiras."
    - "Al levantar el peso, las muñecas deben rotar externamente 90 grados, de modo que pases de un agarre prono (palmas hacia abajo) a un agarre neutro (palmas enfrentadas). Consejo: intenta juntar los omóplatos para sacar el máximo partido al ejercicio."
    - "Los brazos deben elevarse hasta quedar a la altura de la cabeza."
    - "Siente la contracción y baja lentamente las pesas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Reverse_Grip_Bent-Over_Rows:
  name: "Remo inclinado con barra (agarre supino)"
  instructions:
    - "Ponte de pie, erguido, sujetando una barra con agarre supino (palmas hacia arriba)."
    - "Flexiona ligeramente las rodillas e inclina el torso hacia delante, flexionando la cintura y manteniendo la espalda recta hasta que quede casi paralela al suelo. Consejo: asegúrate de mantener la cabeza alta. La barra debe colgar justo delante de ti, con los brazos perpendiculares al suelo y al torso. Esta es la posición inicial."
    - "Manteniendo el torso fijo, levanta la barra mientras espiras, con los codos pegados al cuerpo y sin hacer ninguna fuerza con el antebrazo aparte de sujetar el peso. En la posición superior de contracción, aprieta los músculos de la espalda y mantén un segundo."
    - "Baja lentamente el peso de nuevo a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Reverse_Grip_Triceps_Pushdown:
  name: "Extensión de tríceps en polea con agarre supino"
  instructions:
    - "Empieza colocando un agarre de barra (recta o Z) en una polea alta."
    - "De cara al agarre, sujétalo con las palmas hacia arriba (agarre supino) a la anchura de los hombros. Baja la barra usando los dorsales hasta que los brazos queden totalmente extendidos a los lados. Consejo: los codos deben estar pegados a los costados y los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Sube lentamente el agarre mientras inspiras hasta alinearlo con el pecho. Solo deben moverse los antebrazos; los codos y la parte superior de los brazos deben permanecer fijos a los lados en todo momento."
    - "Después empieza a bajar la barra de la polea a la posición inicial mientras espiras y contraes con fuerza los tríceps."
    - "Repite el número de repeticiones indicado."
Reverse_Hyperextension:
  name: "Hiperextensión inversa"
  instructions:
    - "Coloca los pies entre las almohadillas tras cargar un peso adecuado. Túmbate sobre la almohadilla superior, dejando que las caderas cuelguen por detrás, y agarra las asas para mantener la posición."
    - "Para empezar el movimiento, flexiona las caderas llevando las piernas hacia delante."
    - "Invierte el movimiento extendiendo las caderas y lanzando las piernas hacia atrás. Es muy importante no hiperextender la cadera en este movimiento y detenerse antes del rango completo de movimiento."
    - "Vuelve flexionando de nuevo la cadera y llevando el carro hacia delante tanto como puedas."
    - "Repite el número de repeticiones deseado."
Reverse_Machine_Flyes:
  name: "Pájaro en máquina"
  instructions:
    - "Ajusta las asas de modo que queden totalmente hacia atrás. Selecciona un peso adecuado y ajusta la altura del asiento para que las asas queden a la altura de los hombros. Agarra las asas con las manos mirando hacia dentro. Esta es la posición inicial."
    - "En un movimiento semicircular, lleva las manos hacia los lados y hacia atrás, contrayendo los deltoides posteriores."
    - "Mantén los brazos ligeramente flexionados durante todo el movimiento, de modo que todo el movimiento se produzca en la articulación del hombro."
    - "Haz una pausa en la parte posterior del movimiento y vuelve lentamente con el peso a la posición inicial."
Reverse_Plate_Curls:
  name: "Curl inverso con disco"
  instructions:
    - "Empieza de pie, erguido, con un disco sujeto con ambas manos y los brazos totalmente extendidos. Usa un agarre prono (palmas hacia abajo) y asegúrate de que los dedos agarren el lado rugoso del disco mientras el pulgar agarra el lado liso. Nota: para obtener mejores resultados, agarra el disco en las posiciones de las 11:00 y las 13:00 horas."
    - "Los pies deben estar separados a la anchura de los hombros y el disco debe quedar cerca de la zona de la ingle. Esta es la posición inicial."
    - "Sube lentamente el disco manteniendo los codos pegados y la parte superior de los brazos fija hasta que los bíceps y los antebrazos se toquen, mientras espiras. En este punto el disco debe quedar alineado con el torso."
    - "Siente la contracción durante un segundo y empieza a bajar el peso a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Reverse_Triceps_Bench_Press:
  name: "Press de banca inverso para tríceps"
  instructions:
    - "Túmbate en un banco plano. Con un agarre cerrado y supino (aproximadamente a la anchura de los hombros), levanta la barra del soporte y sujétala recta sobre ti, con los brazos bloqueados, extendidos frente a ti y perpendiculares al suelo. Esta es la posición inicial."
    - "Al inspirar, baja lentamente hasta notar la barra en la parte media del pecho. Consejo: a diferencia de un press de banca normal, mantén los codos pegados al torso en todo momento para maximizar la implicación de los tríceps."
    - "Tras una pausa de un segundo, devuelve la barra a la posición inicial mientras espiras y empujas la barra con los tríceps. Bloquea los brazos en la posición contraída, mantén un segundo y empieza a bajar de nuevo lentamente. Consejo: la bajada debe durar al menos el doble que la subida."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, coloca la barra de nuevo en el soporte."
Rhomboids-SMR:
  name: "Liberación miofascial de romboides"
  instructions:
    - "Túmbate boca arriba en el suelo. Coloca un foam roller debajo de la parte superior de la espalda y cruza los brazos frente a ti, protrayendo los hombros. Esta es la posición inicial."
    - "Levanta las caderas del suelo, cargando el peso sobre el foam roller. Desplaza el peso hacia un lado cada vez, rodando sobre la zona media y superior de la espalda. Haz una pausa de 10 a 30 segundos en los puntos de tensión."
Rickshaw_Carry:
  name: "Paseo del granjero con rickshaw"
  instructions:
    - "Coloca el armazón en el punto de partida y cárgalo con el peso adecuado. De pie en el centro del armazón, empieza agarrando las asas y empujando con los talones para levantarlo. Asegúrate de mantener el pecho y la cabeza altos y la espalda recta."
    - "Empieza a caminar de inmediato a paso ligero, con pasos rápidos y controlados. Mantén el pecho alto y la cabeza al frente, y asegúrate de seguir respirando. Baja el armazón al suelo cuando llegues al punto final."
Ring_Dips:
  name: "Fondos en anillas"
  instructions:
    - "Agarra una anilla con cada mano y da un pequeño salto para ayudarte a llegar a la posición inicial con los brazos bloqueados."
    - "Empieza flexionando los codos y bajando el cuerpo hasta que los brazos superen los 90 grados. Evita balancearte y mantén una buena postura durante todo el descenso."
    - "Invierte el movimiento extendiendo los codos y empujándote de nuevo hasta la posición inicial."
    - "Repite el número de repeticiones deseado."
Rocket_Jump:
  name: "Salto cohete"
  instructions:
    - "Empieza en una postura relajada con los pies separados a la anchura de los hombros y los brazos pegados al cuerpo."
    - "Para iniciar el movimiento, haz una sentadilla hasta la mitad y vuelve a subir explosivamente tan alto como puedas."
    - "Extiende por completo todo el cuerpo, estirándote hacia arriba tanto como puedas. Al aterrizar, absorbe el impacto con las piernas."
Rocking_Standing_Calf_Raise:
  name: "Elevación de gemelos de pie con balanceo"
  instructions:
    - "Este ejercicio es mejor realizarlo dentro de una jaula de sentadillas por seguridad. Para empezar, coloca primero la barra en un soporte que se ajuste a tu altura. Una vez elegida la altura correcta y cargada la barra, métete debajo de ella y colócala sobre la parte posterior de los hombros (ligeramente por debajo del cuello)."
    - "Sujeta la barra con ambos brazos a cada lado y sácala del soporte empujando primero con las piernas y enderezando el torso al mismo tiempo."
    - "Aléjate del soporte y coloca las piernas en una posición media, a la anchura de los hombros, con las puntas ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te hará perder el equilibrio. Mantén también la espalda recta y las rodillas con una ligera flexión, nunca bloqueadas. Esta es la posición inicial."
    - "Sube los talones mientras espiras, extendiendo los tobillos tan alto como puedas y contrayendo los gemelos. Asegúrate de mantener la rodilla fija en todo momento. No debe haber flexión (aparte de la ligera flexión inicial que creamos al colocarnos) en ningún momento. Mantén la posición contraída un segundo antes de empezar a bajar."
    - "Vuelve lentamente a la posición inicial mientras inspiras, bajando los talones y flexionando los tobillos hasta que los gemelos queden estirados."
    - "Ahora levanta las puntas de los pies contrayendo los músculos tibiales de la parte delantera de la pierna mientras espiras."
    - "Mantén un segundo y bájalas de nuevo mientras inspiras."
    - "Repite el número de repeticiones indicado."
Rocky_Pull-Ups_Pulldowns:
  name: "Dominadas Rocky / jalón Rocky"
  instructions:
    - "Agarra la barra de dominadas con las palmas hacia delante y un agarre ancho."
    - "Con ambos brazos extendidos frente a ti sujetando la barra a la anchura de agarre elegida, inclina el torso hacia atrás unos 30 grados creando una curvatura en la zona lumbar y sacando el pecho. Esta es la posición inicial."
    - "Sube el torso hasta que la barra toque la parte superior del pecho llevando los hombros y la parte superior de los brazos hacia abajo y atrás. Espira durante esta parte del movimiento. Consejo: concéntrate en apretar los músculos de la espalda al llegar a la posición de contracción completa. La parte superior del torso debe permanecer fija mientras se desplaza en el espacio y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo en la posición contraída, empieza a inspirar y baja lentamente el torso a la posición inicial, hasta que los brazos estén totalmente extendidos y los dorsales totalmente estirados."
    - "Ahora repite los mismos movimientos descritos antes, salvo que esta vez el torso permanecerá recto al subir y la barra tocará la nuca en lugar de la parte superior del pecho. Consejo: usa la cabeza para inclinarte ligeramente hacia delante, ya que te ayudará a ejecutar correctamente esta parte del ejercicio."
    - "Una vez que hayas bajado a la posición inicial, repite el ejercicio el número de repeticiones prescrito en tu programa."
Romanian_Deadlift:
  name: "Peso muerto rumano"
  instructions:
    - "Coloca una barra en el suelo frente a ti y agárrala con agarre prono (palmas hacia abajo) un poco más ancho que la anchura de los hombros. Consejo: dependiendo del peso utilizado, puede que necesites muñequeras y también una plataforma elevada para permitir un mayor rango de movimiento."
    - "Flexiona ligeramente las rodillas y mantén las espinillas verticales, las caderas hacia atrás y la espalda recta. Esta es la posición inicial."
    - "Manteniendo la espalda y los brazos completamente rectos en todo momento, usa las caderas para levantar la barra mientras espiras. Consejo: el movimiento no debe ser rápido, sino constante y controlado."
    - "Una vez que estés completamente erguido, baja la barra empujando las caderas hacia atrás y flexionando solo ligeramente las rodillas, a diferencia de cuando haces una sentadilla. Consejo: toma aire profundamente al inicio del movimiento y mantén el pecho alto. Mantén el aire mientras bajas y espira al completar el movimiento."
    - "Repite el número de repeticiones indicado."
Romanian_Deadlift_from_Deficit:
  name: "Peso muerto rumano con déficit"
  instructions:
    - "Empieza de pie sujetando una barra con los brazos estirados frente a ti. Puedes ponerte sobre una plataforma elevada para aumentar el rango de movimiento."
    - "Empieza flexionando ligeramente las rodillas y después flexiona la cadera, llevando el glúteo hacia atrás tanto como puedas y bajando el torso hasta donde te permita la flexibilidad. La espalda debe permanecer en extensión absoluta en todo momento y la barra debe mantenerse en contacto con las piernas. Si se hace correctamente, debe notarse una fuerte tensión en los isquiotibiales."
    - "Invierte el movimiento para volver a la posición inicial."
Rope_Climb:
  name: "Trepa de cuerda"
  instructions:
    - "Agarra la cuerda con ambas manos por encima de la cabeza. Tira de la cuerda hacia abajo mientras das un pequeño salto."
    - "Enrolla la cuerda alrededor de una pierna, usando los pies para pinzar la cuerda. Estírate hacia arriba tanto como puedas con los brazos, agarrando la cuerda con fuerza."
    - "Suelta la cuerda con los pies mientras te impulsas hacia arriba con los brazos, llevando las rodillas hacia el pecho."
    - "Vuelve a sujetar la cuerda con los pies y después ponte de pie para tomar otro agarre alto de la cuerda. Continúa hasta llegar a lo alto de la cuerda."
    - "Para bajar, afloja el agarre de los pies sobre la cuerda mientras te deslizas hacia abajo con un movimiento de mano sobre mano."
Rope_Crunch:
  name: "Encogimiento abdominal con cuerda"
  instructions:
    - "Arrodíllate a 30-60 cm frente a una polea con una cuerda enganchada."
    - "Tras seleccionar un peso adecuado, agarra la cuerda con ambas manos llevándolas por encima de la cabeza. El torso debe estar erguido en la posición inicial."
    - "Para empezar, flexiona la columna intentando llevar la caja torácica hacia las piernas mientras tiras de la polea hacia abajo."
    - "Haz una pausa en la parte inferior del movimiento y después vuelve lentamente a la posición inicial."
    - "Se pueden hacer con giros o hacia un lado para trabajar los oblicuos."
Rope_Jumping:
  name: "Saltar a la comba"
  instructions:
    - "Sujeta un extremo de la cuerda en cada mano. Coloca la cuerda detrás de ti en el suelo. Levanta los brazos y gira la cuerda por encima de la cabeza llevándola hacia delante. Cuando llegue al suelo, salta por encima. Encuentra un ritmo de giro cómodo que puedas mantener. Se pueden usar distintas velocidades y técnicas para introducir variación."
    - "Saltar a la comba es emocionante, desafía la coordinación y requiere mucha energía. Una persona de unos 68 kg quemará unas 350 calorías saltando a la comba durante 30 minutos, frente a más de 450 calorías corriendo."
Rope_Straight-Arm_Pulldown:
  name: "Pullover en polea con cuerda y brazos rectos"
  instructions:
    - "Engancha una cuerda a una polea alta y selecciona el peso. Colócate a unos 60 cm de la polea con los pies escalonados y coge la cuerda con ambas manos. Inclínate hacia delante desde la cadera, manteniendo la espalda recta, con los brazos extendidos hacia arriba frente a ti. Esta es la posición inicial."
    - "Manteniendo los brazos rectos, extiende el hombro para llevar la cuerda hacia abajo hasta los muslos."
    - "Haz una pausa en la parte inferior del movimiento, apretando los dorsales."
    - "Vuelve a la posición inicial sin dejar que el peso descanse por completo sobre la pila."
Round_The_World_Shoulder_Stretch:
  name: "Estiramiento de hombros alrededor del mundo"
  instructions:
    - "De pie, erguido, con las piernas juntas, sujeta una barra ligera o un palo de escoba."
    - "Sujeta la barra por detrás de las caderas con un agarre más ancho que la anchura de los hombros. Las palmas deben mirar hacia abajo y los pulgares hacia fuera."
    - "Levanta lentamente los brazos por detrás de la cabeza. No fuerces si cuesta levantarlos más."
Rowing_Stationary:
  name: "Remo en máquina estática"
  instructions:
    - "Para empezar, siéntate en la máquina de remo. Asegúrate de que los talones descansen cómodamente contra la base de los pedales y de que las correas estén bien sujetas. Selecciona el programa que quieras usar, si procede. Siéntate erguido e inclínate hacia delante desde las caderas."
    - "Hay tres fases de movimiento al usar una máquina de remo. La primera fase es cuando te desplazas hacia delante en la máquina. Las rodillas están flexionadas y pegadas al pecho. La parte superior del cuerpo se inclina ligeramente hacia delante manteniendo una buena postura. A continuación, empuja contra los pedales y extiende las piernas mientras llevas las manos a la zona abdominal superior, juntando los hombros hacia atrás. Para evitar forzar la espalda, usa principalmente los músculos de las piernas y las caderas."
    - "La fase de recuperación consiste simplemente en estirar los brazos, flexionar las rodillas y llevar el cuerpo hacia delante de nuevo mientras vuelves a la primera fase."
Runners_Stretch:
  name: "Estiramiento del corredor"
  instructions:
    - "Lo más fácil para adoptar este estiramiento es empezar de pie, llevar una pierna hacia atrás y bajar lentamente el torso hacia el suelo."
    - "Mantén el talón delantero en el suelo (si se levanta, lleva la otra pierna más hacia atrás)."
    - "Coloca las manos a ambos lados de la pierna delantera. Para sacar más partido al estiramiento, empuja el glúteo hacia el techo y después bájalo gradualmente hacia el suelo. Estirarás el flexor de la cadera de la pierna trasera y los isquiotibiales y el glúteo de la delantera."
Running_Treadmill:
  name: "Correr en cinta"
  instructions:
    - "Para empezar, súbete a la cinta y selecciona la opción deseada en el menú. La mayoría de las cintas tienen un modo manual, o puedes seleccionar un programa para correr. Normalmente puedes introducir tu edad y tu peso para estimar las calorías quemadas durante el ejercicio. Se puede ajustar la inclinación para cambiar la intensidad del entrenamiento."
    - "Las cintas ofrecen comodidad, beneficios cardiovasculares y normalmente tienen menos impacto que correr al aire libre. Una persona de unos 68 kg quemará más de 450 calorías corriendo a unos 13 km/h durante 30 minutos. Mantén una postura correcta mientras corres y agárrate a las barras solo cuando sea necesario, por ejemplo al bajarte o al comprobar la frecuencia cardiaca."
Russian_Twist:
  name: "Giro ruso"
  instructions:
    - "Túmbate en el suelo colocando los pies bajo algo que no se mueva o haciendo que un compañero te los sujete. Las piernas deben estar flexionadas por las rodillas."
    - "Eleva la parte superior del cuerpo de modo que forme una V imaginaria con los muslos. Los brazos deben estar totalmente extendidos frente a ti, perpendiculares al torso, con las manos entrelazadas. Esta es la posición inicial."
    - "Gira el torso hacia el lado derecho hasta que los brazos queden paralelos al suelo mientras espiras."
    - "Mantén la contracción un segundo y vuelve a la posición inicial mientras espiras. Ahora pasa al lado opuesto realizando la misma técnica que aplicaste en el lado derecho."
    - "Repite el número de repeticiones indicado."
Sandbag_Load:
  name: "Carga de sacos de arena"
  instructions:
    - "Para cargar sacos de arena u otros objetos, empieza con los objetos colocados a cierta distancia de la plataforma de carga, normalmente unos 15 m."
    - "Empieza levantando el saco de arena. Los sacos de arena son extremadamente incómodos y la forma de levantarlos puede variar según el saco utilizado. Rodéalo con los brazos tanto como puedas, extendiendo caderas y rodillas para subirlo alto. Normalmente no se permite cargarlo al hombro."
    - "Muévete lo más rápido posible hasta la plataforma y cárgalo, extendiendo caderas, rodillas y tobillos para subirlo lo más alto posible. Colócalo sobre la plataforma asegurándote de que no se caiga."
    - "Vuelve a la posición inicial para recoger el siguiente saco de arena y repite hasta completar la prueba."
Scapular_Pull-Up:
  name: "Dominada escapular"
  instructions:
    - "Agarra una barra de dominadas con agarre prono."
    - "Desde una posición colgada, elévate unos centímetros sin usar los brazos. Hazlo deprimiendo la cintura escapular en un movimiento de encogimiento inverso."
    - "Haz una pausa al completar el movimiento y después vuelve lentamente a la posición inicial antes de realizar más repeticiones."
Scissor_Kick:
  name: "Patada de tijera"
  instructions:
    - "Para empezar, túmbate con la espalda pegada al suelo o sobre una esterilla (opcional). Los brazos deben estar totalmente extendidos a los lados con las palmas hacia abajo. Nota: los brazos deben permanecer fijos todo el tiempo."
    - "Con una ligera flexión de las rodillas, levanta las piernas de modo que los talones queden a unos 15 cm del suelo. Esta es la posición inicial."
    - "Ahora levanta la pierna izquierda hasta un ángulo de unos 45 grados mientras bajas la pierna derecha hasta que el talón quede a unos 5-8 cm del suelo."
    - "Cambia el movimiento subiendo la pierna derecha y bajando la izquierda. Recuerda respirar mientras realizas este ejercicio."
    - "Repite el número de repeticiones indicado."
Scissors_Jump:
  name: "Salto de tijera"
  instructions:
    - "Adopta una posición de zancada con un pie por delante y la rodilla flexionada, y la rodilla trasera casi tocando el suelo."
    - "Asegúrate de que la rodilla delantera quede sobre la línea media del pie. Extendiendo ambas piernas, salta lo más alto posible, balanceando los brazos para ganar impulso."
    - "Mientras saltas lo más alto que puedas, cambia la posición de las piernas, llevando la pierna delantera atrás y la trasera delante."
    - "Al aterrizar, absorbe el impacto con las piernas adoptando la posición de zancada, y repite."
Seated_Band_Hamstring_Curl:
  name: "Curl femoral sentado con goma elástica"
  instructions:
    - "Fija una goma elástica cerca del suelo y coloca un banco a unos 60 cm de ella."
    - "Siéntate en el banco y sujeta la goma por detrás de los tobillos, empezando con las piernas rectas. Esta es la posición inicial."
    - "Flexiona las rodillas llevando los pies hacia el banco. Puede que necesites inclinarte ligeramente hacia atrás para evitar que los pies golpeen el suelo."
    - "Haz una pausa al completar el movimiento y después vuelve lentamente a la posición inicial."
Seated_Barbell_Military_Press:
  name: "Press militar sentado con barra"
  instructions:
    - "Siéntate en un banco de press militar con una barra detrás de la cabeza y pide a un ayudante que te la dé (así es mejor para el manguito rotador) o cógela tú mismo con cuidado con agarre prono (palmas hacia delante). Consejo: el agarre debe ser más ancho que la anchura de los hombros y debe formar un ángulo de 90 grados entre el antebrazo y la parte superior del brazo cuando la barra baja."
    - "Una vez que hayas cogido la barra con la anchura de agarre correcta, levántala por encima de la cabeza bloqueando los brazos. Mantén aproximadamente a la altura de los hombros y ligeramente por delante de la cabeza. Esta es la posición inicial."
    - "Baja lentamente la barra hasta la clavícula mientras inspiras."
    - "Sube la barra de nuevo a la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Seated_Barbell_Twist:
  name: "Giro sentado con barra"
  instructions:
    - "Empieza sentándote en el extremo de un banco plano con una barra colocada sobre los muslos. Los pies deben estar separados a la anchura de los hombros."
    - "Agarra la barra con las palmas hacia abajo y asegúrate de que las manos estén separadas más que la anchura de los hombros. Empieza a levantar la barra por encima de la cabeza hasta que los brazos queden totalmente extendidos."
    - "Ahora baja la barra por detrás de la cabeza hasta que descanse sobre la base del cuello. Esta es la posición inicial."
    - "Manteniendo los pies y la cabeza fijos, mueve la cintura de lado a lado de modo que notes la contracción en los oblicuos. Mueve solo de lado a lado hasta donde te permita la cintura. Estirar o moverte demasiado puede provocar una lesión. Consejo: usa un movimiento lento y controlado."
    - "Recuerda espirar al girar el cuerpo hacia el lado e inspirar al volver a la posición inicial."
    - "Repite el número de repeticiones indicado."
Seated_Bent-Over_One-Arm_Dumbbell_Triceps_Extension:
  name: "Extensión de tríceps a una mano inclinado y sentado con mancuerna"
  instructions:
    - "Siéntate en el extremo de un banco plano con una mancuerna en una mano usando un agarre neutro (palma de la mano mirando hacia ti)."
    - "Flexiona ligeramente las rodillas e inclina el torso hacia delante, flexionando la cintura y manteniendo la espalda recta hasta que quede casi paralela al suelo. Asegúrate de mantener la cabeza alta."
    - "La parte superior del brazo con la mancuerna debe estar pegada al torso y alineada con él (elevada hasta quedar paralela al suelo, mientras el antebrazo apunta hacia el suelo y la mano sujeta el peso). Consejo: debe haber un ángulo de 90 grados entre el antebrazo y la parte superior del brazo. Esta es la posición inicial."
    - "Manteniendo fija la parte superior del brazo, usa el tríceps para levantar el peso mientras espiras hasta que el antebrazo quede paralelo al suelo y todo el brazo esté extendido. Como en muchos otros ejercicios de brazos, solo se mueve el antebrazo."
    - "Tras una contracción de un segundo arriba, baja lentamente la mancuerna a la posición inicial mientras inspiras."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cambia de brazo y repite el ejercicio."
Seated_Bent-Over_Rear_Delt_Raise:
  name: "Elevación posterior de deltoides inclinado y sentado"
  instructions:
    - "Coloca un par de mancuernas mirando hacia delante frente a un banco plano."
    - "Siéntate en el extremo del banco con las piernas juntas y las mancuernas detrás de las pantorrillas."
    - "Inclínate por la cintura manteniendo la espalda recta para coger las mancuernas. Las palmas de las manos deben mirarse entre sí al cogerlas. Esta es la posición inicial."
    - "Manteniendo el torso inclinado hacia delante y fijo, y los brazos ligeramente flexionados por los codos, levanta las mancuernas en línea recta hacia los lados hasta que ambos brazos queden paralelos al suelo. Espira mientras levantas las pesas. (Nota: evita balancear el torso o llevar los brazos hacia atrás en lugar de hacia el lado.)"
    - "Tras una contracción de un segundo arriba, baja lentamente las mancuernas a la posición inicial."
    - "Repite el número de repeticiones indicado."
Seated_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension:
  name: "Extensión de tríceps a dos manos inclinado y sentado con mancuernas"
  instructions:
    - "Siéntate en el extremo de un banco plano con una mancuerna en cada mano usando un agarre neutro (palmas de las manos mirando hacia ti)."
    - "Flexiona ligeramente las rodillas e inclina el torso hacia delante, flexionando la cintura y manteniendo la espalda recta hasta que quede casi paralela al suelo. Asegúrate de mantener la cabeza alta."
    - "La parte superior de los brazos con las mancuernas debe estar pegada al torso y alineada con él (elevada hasta quedar paralela al suelo, mientras los antebrazos apuntan hacia el suelo y las manos sujetan las pesas). Consejo: debe haber un ángulo de 90 grados entre los antebrazos y la parte superior de los brazos. Esta es la posición inicial."
    - "Manteniendo fija la parte superior de los brazos, usa los tríceps para levantar el peso mientras espiras hasta que los antebrazos queden paralelos al suelo y todo el brazo esté extendido. Como en muchos otros ejercicios de brazos, solo se mueve el antebrazo."
    - "Tras una contracción de un segundo arriba, baja lentamente las mancuernas a la posición inicial mientras inspiras."
    - "Repite el movimiento el número de repeticiones prescrito."
Seated_Biceps:
  name: "Estiramiento de bíceps sentado"
  instructions:
    - "Siéntate en el suelo con las rodillas flexionadas y tu compañero de pie detrás de ti. Extiende los brazos rectos hacia atrás con las palmas enfrentadas. Tu compañero te sujetará las muñecas. Esta es la posición inicial."
    - "Intenta flexionar los codos mientras tu compañero impide cualquier movimiento real."
    - "Tras 10-20 segundos, relaja los brazos mientras tu compañero tira suavemente de tus muñecas hacia arriba para estirar los bíceps. Asegúrate de avisar a tu compañero cuando el estiramiento sea el adecuado para evitar lesiones o estiramientos excesivos."
Seated_Cable_Rows:
  name: "Remo sentado en polea"
  instructions:
    - "Para este ejercicio necesitarás acceso a una máquina de remo con polea baja y un agarre en V. Nota: el agarre en V te permitirá tener un agarre neutro con las palmas de las manos enfrentadas. Para llegar a la posición inicial, siéntate primero en la máquina y coloca los pies en la plataforma delantera o en el travesaño previsto, asegurándote de que las rodillas estén ligeramente flexionadas y no bloqueadas."
    - "Inclínate hacia delante manteniendo la alineación natural de la espalda y agarra las asas del agarre en V."
    - "Con los brazos extendidos, tira hacia atrás hasta que el torso forme un ángulo de 90 grados con las piernas. La espalda debe estar ligeramente arqueada y el pecho sacado. Deberías notar un buen estiramiento en los dorsales mientras sujetas la barra frente a ti. Esta es la posición inicial."
    - "Manteniendo el torso fijo, tira de las asas hacia el torso manteniendo los brazos pegados a él hasta tocar los abdominales. Espira mientras realizas ese movimiento. En ese punto deberías estar apretando con fuerza los músculos de la espalda. Mantén esa contracción un segundo y vuelve lentamente a la posición original mientras inspiras."
    - "Repite el número de repeticiones indicado."
Seated_Cable_Shoulder_Press:
  name: "Press de hombros sentado en polea"
  instructions:
    - "Ajusta el peso a una cantidad adecuada y siéntate, agarrando las asas. La parte superior de los brazos debe formar unos 90 grados con el cuerpo, con la cabeza y el pecho altos. Los codos también deben estar flexionados unos 90 grados. Esta es la posición inicial."
    - "Empieza extendiendo los codos y juntando las asas por encima de la cabeza."
    - "Tras una pausa arriba, vuelve a llevar las asas a la posición inicial. Asegúrate de mantener la tensión en los cables."
    - "También puedes realizar este movimiento con la espalda separada del respaldo y alternando las manos."
Seated_Calf_Raise:
  name: "Elevación de gemelos sentado"
  instructions:
    - "Siéntate en la máquina y coloca las puntas de los pies en la parte inferior de la plataforma, con los talones fuera. Elige la posición de las puntas que prefieras (hacia delante, hacia dentro o hacia fuera) según lo indicado al principio de este capítulo."
    - "Coloca la parte inferior de los muslos bajo la almohadilla de la palanca, que deberá ajustarse según la altura de tus muslos. Ahora coloca las manos sobre la almohadilla de la palanca para evitar que se deslice hacia delante."
    - "Levanta ligeramente la palanca empujando con los talones hacia arriba y suelta la barra de seguridad. Esta es la posición inicial."
    - "Baja lentamente los talones flexionando los tobillos hasta que los gemelos queden totalmente estirados. Inspira mientras realizas este movimiento."
    - "Sube los talones extendiendo los tobillos tan alto como puedas mientras contraes los gemelos y espiras. Mantén la contracción superior un segundo."
    - "Repite el número de repeticiones indicado."
Seated_Calf_Stretch:
  name: "Estiramiento de gemelos sentado"
  instructions:
    - "Siéntate erguido sobre una esterilla."
    - "Flexiona una rodilla y apoya ese pie en el suelo para estabilizar el torso."
    - "Estira la otra pierna y flexiona el tobillo."
    - "Usando una goma elástica, una toalla o la mano si llegas, tira de los dedos de los pies hacia ti. Mantén de 10 a 20 segundos y cambia de lado."
Seated_Close-Grip_Concentration_Barbell_Curl:
  name: "Curl de concentración sentado con barra y agarre cerrado"
  instructions:
    - "Siéntate en un banco plano con una barra o barra Z delante de ti, entre las piernas. Las piernas deben estar abiertas, con las rodillas flexionadas y los pies en el suelo."
    - "Usa los brazos para coger la barra y apoya la parte posterior de la parte superior de los brazos sobre la cara interna de los muslos (a unos 9 cm de la parte delantera de la rodilla). Para este ejercicio se necesita un agarre supino más cerrado que la anchura de los hombros. Consejo: el brazo debe estar extendido y la barra por encima del suelo. Esta es la posición inicial."
    - "Manteniendo fija la parte superior de los brazos, sube el peso hacia delante contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y las mancuernas estén a la altura de los hombros. Mantén la contracción un segundo mientras aprietas los bíceps."
    - "Baja lentamente la barra a la posición inicial mientras inspiras. Consejo: evita los balanceos en todo momento."
    - "Repite el número de repeticiones indicado."
Seated_Dumbbell_Curl:
  name: "Curl con mancuernas sentado"
  instructions:
    - "Siéntate en un banco plano con una mancuerna en cada mano, sujetas con los brazos estirados. Los codos deben estar pegados al torso."
    - "Gira las palmas de las manos de modo que miren hacia el torso. Esta es la posición inicial."
    - "Manteniendo fija la parte superior del brazo, sube las pesas y empieza a girar las muñecas cuando las mancuernas pasen los muslos, de modo que las palmas de las manos miren hacia delante al final del movimiento. Asegúrate de contraer los bíceps mientras espiras y de que solo se muevan los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y las mancuernas estén a la altura de los hombros. Mantén la contracción un segundo mientras aprietas los bíceps."
    - "Baja lentamente las mancuernas a la posición inicial mientras inspiras y giras las muñecas de nuevo hasta un agarre neutro."
    - "Repite el número de repeticiones indicado."
Seated_Dumbbell_Inner_Biceps_Curl:
  name: "Curl de bíceps interno con mancuernas sentado"
  instructions:
    - "Siéntate en el extremo de un banco plano con una mancuerna en cada mano, sujetas con los brazos estirados. Los codos deben estar pegados al torso."
    - "Gira las palmas de las manos de modo que miren hacia dentro en posición neutra. Esta es la posición inicial."
    - "Manteniendo fija la parte superior de los brazos, sube las mancuernas hacia fuera y hacia arriba, girando las palmas hacia fuera al levantar y manteniendo los antebrazos alineados con los deltoides externos. Consejos:"
    - "Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y las mancuernas estén a la altura de los hombros. Mantén la contracción un segundo mientras aprietas los bíceps."
    - "Baja lentamente las mancuernas a la posición inicial mientras inspiras. Recuerda girar los brazos al bajar las mancuernas para volver a un agarre neutro."
    - "Repite el número de repeticiones indicado."
Seated_Dumbbell_Palms-Down_Wrist_Curl:
  name: "Curl de muñeca con mancuernas sentado (palmas hacia abajo)"
  instructions:
    - "Empieza colocando dos mancuernas en el suelo frente a un banco plano."
    - "Siéntate en el borde del banco plano con las piernas separadas aproximadamente a la anchura de los hombros. Asegúrate de mantener los pies en el suelo."
    - "Usa los brazos para coger ambas mancuernas y súbelas de modo que los antebrazos descansen sobre los muslos con las palmas de las manos hacia abajo. Las muñecas deben colgar fuera del borde de los muslos."
    - "Empieza flexionando las muñecas hacia arriba mientras espiras."
    - "Baja lentamente las muñecas a la posición inicial mientras inspiras. Asegúrate de inspirar durante esta parte del ejercicio. Consejo: los antebrazos deben permanecer fijos, ya que la muñeca es el único movimiento necesario para realizar este ejercicio."
    - "Repite el número de repeticiones indicado."
    - "Cuando termines, simplemente baja las mancuernas al suelo."
Seated_Dumbbell_Palms-Up_Wrist_Curl:
  name: "Curl de muñeca con mancuernas sentado (palmas hacia arriba)"
  instructions:
    - "Empieza colocando dos mancuernas en el suelo frente a un banco plano."
    - "Siéntate en el borde del banco plano con las piernas separadas aproximadamente a la anchura de los hombros. Asegúrate de mantener los pies en el suelo."
    - "Usa los brazos para coger ambas mancuernas y súbelas de modo que los antebrazos descansen sobre los muslos con las palmas de las manos hacia arriba. Las muñecas deben colgar fuera del borde de los muslos."
    - "Empieza flexionando las muñecas hacia arriba mientras espiras."
    - "Baja lentamente las muñecas a la posición inicial mientras inspiras. Asegúrate de inspirar durante esta parte del ejercicio. Consejo: los antebrazos deben permanecer fijos, ya que la muñeca es el único movimiento necesario para realizar este ejercicio."
    - "Repite el número de repeticiones indicado."
    - "Cuando termines, simplemente baja las mancuernas al suelo."
Seated_Dumbbell_Press:
  name: "Press con mancuernas sentado"
  instructions:
    - "Coge un par de mancuernas y siéntate en un banco de press militar o en un banco multiusos con respaldo, colocando las mancuernas en vertical sobre los muslos."
    - "Sube las mancuernas de una en una usando los muslos para llevarlas a la altura de los hombros a cada lado."
    - "Gira las muñecas de modo que las palmas de las manos miren hacia delante. Esta es la posición inicial."
    - "Al espirar, empuja las mancuernas hacia arriba hasta que se toquen en lo alto."
    - "Tras una pausa de un segundo, baja lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Seated_Flat_Bench_Leg_Pull-In:
  name: "Encogimiento de piernas sentado en banco plano"
  instructions:
    - "Siéntate en un banco con las piernas estiradas frente a ti, ligeramente por debajo de la paralela, y los brazos agarrados a los lados del banco. El torso debe estar inclinado hacia atrás unos 45 grados respecto al banco. Esta es la posición inicial."
    - "Lleva las rodillas hacia ti mientras acercas el torso a ellas al mismo tiempo. Espira mientras realizas este movimiento."
    - "Tras una pausa de un segundo, vuelve a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Seated_Floor_Hamstring_Stretch:
  name: "Estiramiento de isquiotibiales sentado en el suelo"
  instructions:
    - "Siéntate en una esterilla con la pierna derecha extendida frente a ti y la pierna izquierda flexionada con el pie contra la cara interna del muslo derecho."
    - "Inclínate hacia delante desde las caderas y estira la mano hacia el tobillo hasta notar un estiramiento en los isquiotibiales. Mantén 15 segundos y repite con el otro lado."
Seated_Front_Deltoid:
  name: "Estiramiento de deltoides anterior sentado"
  instructions:
    - "Siéntate erguido en el suelo con las piernas flexionadas y tu compañero de pie detrás de ti. Extiende los brazos rectos hacia los lados, con las palmas mirando al suelo. Intenta llevarlos tan atrás como puedas mientras tu ayudante te sujeta las muñecas. Esta es la posición inicial."
    - "Manteniendo los codos rectos, intenta llevar los brazos hacia delante, mientras tu compañero te sujeta suavemente para evitar cualquier movimiento real durante 10-20 segundos."
    - "Ahora relaja los músculos y deja que tu compañero aumente suavemente el estiramiento en los hombros y el pecho. Mantén de 10 a 20 segundos."
Seated_Glute:
  name: "Estiramiento de glúteo sentado"
  instructions:
    - "Sentado con las rodillas flexionadas, cruza un tobillo sobre la rodilla opuesta. Tu compañero se pondrá de pie detrás de ti. Ahora inclínate hacia delante mientras tu compañero te sujeta los hombros con las manos. Esta es la posición inicial."
    - "Intenta empujar el torso hacia atrás durante 10-20 segundos, mientras tu compañero impide cualquier movimiento real del torso."
    - "Ahora relaja los músculos mientras tu compañero aumenta el estiramiento empujando suavemente tu torso hacia delante durante 10-20 segundos."
Seated_Good_Mornings:
  name: "Buenos días sentado"
  instructions:
    - "Coloca un cajón en una jaula de potencia. Los topes deben estar a una altura adecuada. Empieza metiéndote bajo la barra y colocándola sobre la parte posterior de los hombros, no sobre los trapecios. Junta los omóplatos y rota los codos hacia delante, intentando doblar la barra sobre los hombros."
    - "Saca la barra del soporte, creando un arco firme en la zona lumbar. Mantén la cabeza mirando al frente. Con la espalda, los hombros y el core firmes, empuja las rodillas y el glúteo hacia fuera y empieza el descenso. Siéntate hacia atrás con las caderas hasta que quedes sentado en el cajón. Esta es la posición inicial."
    - "Manteniendo la barra firme, inclínate hacia delante desde las caderas tanto como puedas. Si colocas los topes a la altura de lo que sería la paralela, no solo tienes un seguro si fallas, sino que sabes cuándo parar."
    - "Haz una pausa justo encima de los topes e invierte el movimiento hasta que el torso esté erguido."
Seated_Hamstring:
  name: "Estiramiento de isquiotibiales sentado"
  instructions:
    - "Sentado con las piernas extendidas, haz que tu compañero se ponga de pie detrás de ti. Ahora inclínate hacia delante mientras tu compañero te sujeta los hombros con las manos. Esta es la posición inicial."
    - "Intenta empujar el torso hacia atrás durante 10-20 segundos, mientras tu compañero impide cualquier movimiento real del torso."
    - "Ahora relaja los músculos mientras tu compañero aumenta el estiramiento empujando suavemente tu torso hacia delante durante 10-20 segundos."
Seated_Hamstring_and_Calf_Stretch:
  name: "Estiramiento sentado de isquiotibiales y gemelos"
  instructions:
    - "Pasa un cinturón, una cuerda o una goma elástica alrededor de un pie. Siéntate con ambas piernas extendidas. Esta es la posición inicial."
    - "Inclinándote ligeramente hacia delante, tira del cinturón para llevar hacia atrás los dedos del pie. Mantén esta posición de 10 a 20 segundos y repite con la otra pierna."
Seated_Head_Harness_Neck_Resistance:
  name: "Resistencia de cuello sentado con arnés de cabeza"
  instructions:
    - "Coloca una correa de cuello en el suelo, en el extremo de un banco plano. Una vez seleccionados los pesos, siéntate en el extremo del banco plano con los pies separados más que la anchura de los hombros. Las puntas de los pies deben apuntar hacia fuera."
    - "Mueve lentamente el torso hacia delante hasta que quede casi paralelo al suelo. Con ambas manos, coloca firmemente la correa de cuello alrededor de la cabeza. Consejo: asegúrate de que los pesos sigan apoyados en el suelo para evitar cualquier tensión en el cuello. Ahora agarra el peso con ambas manos mientras elevas el torso de nuevo hasta que quede casi perpendicular al suelo. Nota: la cabeza y el torso deben estar ligeramente inclinados hacia delante para realizar este ejercicio."
    - "Ahora coloca ambas manos sobre las rodillas. Esta es la posición inicial."
    - "Baja lentamente el cuello hasta que la barbilla toque la parte superior del pecho mientras inspiras."
    - "Mientras espiras, devuelve el cuello a la posición inicial."
    - "Repite el número de repeticiones indicado."
Seated_Leg_Curl:
  name: "Curl femoral sentado"
  instructions:
    - "Ajusta la palanca de la máquina a tu altura y siéntate en la máquina con la espalda contra el respaldo."
    - "Coloca la parte posterior de la parte inferior de la pierna sobre la palanca acolchada (unos centímetros por debajo de los gemelos) y fija la almohadilla sobre los muslos, justo por encima de las rodillas. Después agarra las asas laterales de la máquina mientras estiras las puntas de los pies (o también puedes usar cualquiera de las otras dos posiciones) y asegúrate de que las piernas estén totalmente rectas frente a ti. Esta es la posición inicial."
    - "Al espirar, tira de la palanca de la máquina tanto como puedas hacia la parte posterior de los muslos flexionando las rodillas. Mantén el torso fijo en todo momento. Mantén la posición contraída un segundo."
    - "Vuelve lentamente a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Seated_Leg_Tucks:
  name: "Encogimiento de piernas sentado"
  instructions:
    - "Siéntate en un banco con las piernas estiradas frente a ti, ligeramente por debajo de la paralela, y los brazos agarrados a los lados del banco. El torso debe estar inclinado hacia atrás unos 45 grados respecto al banco. Esta es la posición inicial."
    - "Lleva las rodillas hacia ti mientras acercas el torso a ellas al mismo tiempo. Espira mientras realizas este movimiento."
    - "Tras una pausa de un segundo, vuelve a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Seated_One-Arm_Dumbbell_Palms-Down_Wrist_Curl:
  name: "Curl de muñeca a una mano con mancuerna sentado (palma hacia abajo)"
  instructions:
    - "Siéntate en un banco plano con una mancuerna en la mano derecha."
    - "Coloca los pies planos en el suelo, a una distancia ligeramente mayor que la anchura de los hombros."
    - "Inclínate hacia delante y apoya el antebrazo derecho sobre la parte superior del muslo derecho con la palma hacia abajo. Consejo: asegúrate de que la parte posterior de la muñeca quede sobre las rodillas. Esta es la posición inicial."
    - "Baja la mancuerna tanto como puedas manteniendo un agarre firme. Inspira mientras realizas este movimiento."
    - "Ahora sube la mancuerna tan alto como puedas contrayendo los antebrazos mientras espiras. Mantén la contracción un segundo antes de volver a bajar. Consejo: el único movimiento debe producirse en la muñeca."
    - "Realiza el número de repeticiones indicado, cambia de brazo y repite el movimiento."
Seated_One-Arm_Dumbbell_Palms-Up_Wrist_Curl:
  name: "Curl de muñeca a una mano con mancuerna sentado (palma hacia arriba)"
  instructions:
    - "Siéntate en un banco plano con una mancuerna en la mano derecha."
    - "Coloca los pies planos en el suelo, a una distancia ligeramente mayor que la anchura de los hombros."
    - "Inclínate hacia delante y apoya el antebrazo derecho sobre la parte superior del muslo derecho con la palma hacia arriba. Consejo: asegúrate de que la parte delantera de la muñeca quede sobre las rodillas. Esta es la posición inicial."
    - "Baja la mancuerna tanto como puedas manteniendo un agarre firme. Inspira mientras realizas este movimiento."
    - "Ahora sube la mancuerna tan alto como puedas contrayendo los antebrazos mientras espiras. Mantén la contracción un segundo antes de volver a bajar. Consejo: el único movimiento debe producirse en la muñeca."
    - "Realiza el número de repeticiones indicado, cambia de brazo y repite el movimiento."
Seated_One-arm_Cable_Pulley_Rows:
  name: "Remo sentado a una mano en polea"
  instructions:
    - "Para llegar a la posición inicial, siéntate primero en la máquina y coloca los pies en la plataforma delantera o en el travesaño previsto, asegurándote de que las rodillas estén ligeramente flexionadas y no bloqueadas."
    - "Inclínate hacia delante manteniendo la alineación natural de la espalda y agarra el agarre de una sola asa con el brazo izquierdo usando un agarre prono (palma hacia abajo)."
    - "Con el brazo extendido, tira hacia atrás hasta que el torso forme un ángulo de 90 grados con las piernas. La espalda debe estar ligeramente arqueada y el pecho sacado. Deberías notar un buen estiramiento en el dorsal mientras sujetas la barra frente a ti. El brazo derecho puede mantenerse junto a la cintura. Esta es la posición inicial."
    - "Manteniendo el torso fijo, tira del asa hacia el torso manteniendo los brazos pegados a él mientras giras la muñeca, de modo que cuando la mano llegue a los abdominales esté en posición neutra (palma mirando al torso). Espira mientras realizas ese movimiento. En ese punto deberías estar apretando con fuerza los músculos de la espalda."
    - "Mantén esa contracción un segundo y vuelve lentamente a la posición original mientras inspiras. Consejo: recuerda girar la muñeca al volver a la posición inicial para que las palmas vuelvan a mirar hacia abajo."
    - "Repite el número de repeticiones indicado y después realiza el mismo movimiento con la mano derecha."
Seated_Overhead_Stretch:
  name: "Estiramiento sentado con brazo sobre la cabeza"
  instructions:
    - "Siéntate erguido sobre una esterilla."
    - "Junta las plantas de los pies, con los pies a 15-20 cm delante de las caderas."
    - "Coloca una mano en el suelo a tu lado y la otra mano detrás de la cabeza."
    - "Levanta el codo hacia el techo mientras inclinas el torso hacia el otro lado. Mantén de 10 a 20 segundos y cambia de lado."
Seated_Palm-Up_Barbell_Wrist_Curl:
  name: "Curl de muñeca con barra sentado (palmas hacia arriba)"
  instructions:
    - "Sujeta una barra con ambas manos y las palmas hacia arriba; manos separadas aproximadamente a la anchura de los hombros."
    - "Coloca los pies planos en el suelo, a una distancia ligeramente mayor que la anchura de los hombros."
    - "Inclínate hacia delante y apoya los antebrazos sobre la parte superior de los muslos con las palmas hacia arriba. Consejo: asegúrate de que la parte delantera de las muñecas quede sobre las rodillas. Esta es la posición inicial."
    - "Baja la barra tanto como puedas mientras inspiras y mantienes un agarre firme."
    - "Ahora sube la barra tan alto como puedas flexionando los antebrazos mientras espiras. Mantén la contracción arriba un segundo y Consejo: solo debe moverse la muñeca."
Seated_Palms-Down_Barbell_Wrist_Curl:
  name: "Curl de muñeca con barra sentado (palmas hacia abajo)"
  instructions:
    - "Sujeta una barra con ambas manos y las palmas hacia abajo; manos separadas aproximadamente a la anchura de los hombros."
    - "Coloca los pies planos en el suelo, a una distancia ligeramente mayor que la anchura de los hombros."
    - "Inclínate hacia delante y apoya los antebrazos sobre la parte superior de los muslos con las palmas hacia abajo. Consejo: asegúrate de que la parte posterior de las muñecas quede sobre las rodillas. Esta es la posición inicial."
    - "Baja la barra tanto como puedas mientras inspiras y mantienes un agarre firme."
    - "Ahora sube la barra tan alto como puedas flexionando los antebrazos mientras espiras. Mantén la contracción arriba un segundo y Consejo: solo debe moverse la muñeca."
Seated_Side_Lateral_Raise:
  name: "Elevación lateral sentado"
  instructions:
    - "Coge un par de mancuernas y siéntate en el extremo de un banco plano con los pies firmes en el suelo. Sujeta las mancuernas con las palmas mirando hacia dentro y los brazos estirados hacia abajo a los lados. Esta es la posición inicial."
    - "Manteniendo el torso fijo (sin balanceos), levanta las mancuernas hacia los lados con una ligera flexión del codo y las manos ligeramente inclinadas hacia delante, como si vertieras agua en un vaso. Continúa subiendo hasta que los brazos queden paralelos al suelo. Espira mientras ejecutas este movimiento y haz una pausa de un segundo arriba."
    - "Baja lentamente las mancuernas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Seated_Triceps_Press:
  name: "Press de tríceps sentado"
  instructions:
    - "Siéntate en un banco con respaldo y agarra una mancuerna con ambas manos, sujetándola por encima de la cabeza con los brazos estirados. Consejo: es mejor que alguien te la pase, sobre todo si es muy pesada. La resistencia debe descansar sobre las palmas de las manos con los pulgares rodeándola. La palma de la mano debe mirar hacia dentro. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos cerca de la cabeza (codos hacia dentro) y perpendicular al suelo, baja la resistencia en un movimiento semicircular por detrás de la cabeza hasta que los antebrazos toquen los bíceps. Consejo: la parte superior de los brazos debe permanecer fija y solo deben moverse los antebrazos. Inspira mientras realizas este paso."
    - "Vuelve a la posición inicial usando los tríceps para subir la mancuerna. Espira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
Seated_Two-Arm_Palms-Up_Low-Pulley_Wrist_Curl:
  name: "Curl de muñeca a dos manos en polea baja sentado (palmas hacia arriba)"
  instructions:
    - "Coloca un banco frente a una máquina de polea baja que tenga una barra o un agarre de barra Z."
    - "Aleja el banco lo suficiente para que, al llevar el asa a la parte superior de los muslos, se cree tensión en el cable por el movimiento de la pila de pesas."
    - "Ahora sujeta el asa con ambas manos, palmas hacia arriba, con un agarre a la anchura de los hombros."
    - "Da un paso atrás y siéntate en el banco con los pies separados aproximadamente a la anchura de los hombros, firmes en el suelo."
    - "Inclínate hacia delante y apoya los antebrazos sobre los muslos con la parte posterior de las muñecas sobre las rodillas. Esta es la posición inicial."
    - "Baja la barra tanto como puedas, mientras inspiras y mantienes un agarre firme."
    - "Ahora sube la barra tan alto como puedas mientras contraes los antebrazos. Consejo: solo debe moverse la muñeca, no los antebrazos."
    - "Tras una contracción de un segundo arriba, vuelve a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
See-Saw_Press_Alternating_Side_Press:
  name: "Press de balancín (press lateral alterno)"
  instructions:
    - "Coge una mancuerna con cada mano y ponte de pie, erguido."
    - "Sube las mancuernas hasta la altura del pecho/hombros y después gira las muñecas de modo que las palmas de las manos miren hacia ti, como si te prepararas para hacer un press Arnold. Esta es la posición inicial."
    - "Ahora empieza a extender el brazo izquierdo por encima de la cabeza mientras giras la muñeca para que la palma de la mano mire hacia delante al subir. Los codos también deben abrirse al levantar el peso. Al mismo tiempo, te inclinarás desde la cadera hacia el lado opuesto. Consejo: si realizas el ejercicio correctamente, debe parecer que intentas alcanzar algo por encima de la cabeza en el lado derecho de tu cuerpo, pero con el brazo izquierdo. Espira mientras realizas este movimiento."
    - "Una vez que llegues a la posición superior, inspira. Después, con el peso totalmente extendido por encima de la cabeza y el cuerpo inclinado hacia tu lado derecho, empieza el movimiento hacia el lado izquierdo."
    - "Repite el número de repeticiones indicado."
Shotgun_Row:
  name: "Remo shotgun"
  instructions:
    - "Engancha un asa individual a una polea baja."
    - "Tras seleccionar el peso correcto, colócate a unos 60 cm con una posición de piernas muy abiertas y en tijera. El brazo debe estar extendido y el hombro hacia delante. Esta es la posición inicial."
    - "Realiza el movimiento retrayendo el hombro y flexionando el codo. Al tirar, supina la muñeca, girando la palma hacia arriba mientras avanzas."
    - "Tras una breve pausa, vuelve a la posición inicial."
Shoulder_Circles:
  name: "Círculos de hombros"
  instructions:
    - "Con los hombros relajados y los brazos descansando sueltos a los lados (o en el regazo si estás sentado), haz rodar suavemente los hombros hacia delante, arriba, atrás y abajo."
    - "Invierte la dirección. Puedes hacer este ejercicio alternando los hombros o ambos a la vez."
Shoulder_Press_-_With_Bands:
  name: "Press de hombros con gomas elásticas"
  instructions:
    - "Para empezar, ponte de pie sobre una goma elástica de modo que la tensión comience con los brazos estirados. Agarra las asas y súbelas de modo que las manos queden a la altura de los hombros a cada lado."
    - "Gira las muñecas de modo que las palmas de las manos miren hacia delante. Los codos deben estar flexionados, con la parte superior de los brazos y los antebrazos alineados con el torso. Esta es la posición inicial."
    - "Al espirar, sube las asas hasta que los brazos queden totalmente extendidos por encima de la cabeza."
Shoulder_Raise:
  name: "Elevación de hombros"
  instructions:
    - "Relaja los brazos a los lados y sube los hombros hacia las orejas, y después bájalos de nuevo."
Shoulder_Stretch:
  name: "Estiramiento de hombros"
  instructions:
    - "Lleva el brazo izquierdo cruzado por delante del cuerpo y mantenlo recto."
Side-Lying_Floor_Stretch:
  name: "Estiramiento tumbado de lado en el suelo"
  instructions:
    - "Túmbate primero sobre tu lado izquierdo, flexionando la rodilla izquierda frente a ti para estabilizar el torso (usa también los abdominales para mantenerte erguido)."
    - "Estira la pierna derecha y apoya el pie derecho en el suelo detrás del izquierdo. Estira el brazo derecho por encima de la cabeza y tira suavemente de la muñeca derecha para estirar todo el lado derecho del cuerpo. Cambia de lado."
Side_Bridge:
  name: "Puente lateral"
  instructions: []
Side_Hop-Sprint:
  name: "Salto lateral y sprint"
  instructions:
    - "Colócate a un lado de un cono o una valla."
    - "Empieza este ejercicio saltando lateralmente sobre el obstáculo y rebotando al aterrizar para saltar de vuelta al punto de partida."
    - "Salta el número de repeticiones prescrito lo más rápido posible y termina este ejercicio haciendo un sprint corto al aterrizar el último salto."
Side_Jackknife:
  name: "Navaja lateral"
  instructions: []
Side_Lateral_Raise:
  name: "Elevación lateral"
  instructions:
    - "Coge un par de mancuernas y ponte de pie con el torso recto y las mancuernas a los lados, con los brazos estirados y las palmas de las manos mirando hacia ti. Esta es la posición inicial."
    - "Manteniendo el torso fijo (sin balanceos), levanta las mancuernas hacia los lados con una ligera flexión del codo y las manos ligeramente inclinadas hacia delante, como si vertieras agua en un vaso. Continúa subiendo hasta que los brazos queden paralelos al suelo. Espira mientras ejecutas este movimiento y haz una pausa de un segundo arriba."
    - "Baja lentamente las mancuernas a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Side_Laterals_to_Front_Raise:
  name: "Elevación lateral a elevación frontal"
  instructions:
    - "De pie, sujeta un par de mancuernas a los lados. Esta es la posición inicial."
    - "Manteniendo los codos ligeramente flexionados, sube las pesas directamente frente a ti hasta la altura de los hombros, evitando cualquier balanceo o trampa."
    - "En la parte superior del ejercicio, lleva las pesas hacia fuera frente a ti, manteniendo los brazos extendidos."
    - "Baja las pesas con un movimiento controlado."
    - "En la siguiente repetición, sube las pesas frente a ti hasta la altura de los hombros antes de llevarlas lateralmente hacia los costados."
    - "Baja las pesas a la posición inicial."
Side_Leg_Raises:
  name: "Elevaciones laterales de pierna"
  instructions:
    - "Ponte junto a una silla, a la que puedes agarrarte como apoyo. Apóyate sobre una pierna. Esta es la posición inicial."
    - "Manteniendo la pierna recta, súbela hacia el lado tan lejos como puedas y déjala caer de nuevo, permitiendo que cruce la pierna opuesta."
    - "Repite este movimiento de balanceo de 5 a 10 veces, aumentando el rango de movimiento a medida que lo haces."
Side_Lying_Groin_Stretch:
  name: "Estiramiento de ingle tumbado de lado"
  instructions:
    - "Empieza tumbándote sobre el lado derecho y flexiona la rodilla derecha frente a ti para estabilizar el torso."
    - "Apoya la cabeza en la mano derecha o en el hombro. Levanta la pierna izquierda y sujétala por detrás de la rodilla (más fácil) o por el pie (más difícil)."
    - "Lleva la rodilla izquierda hacia el hombro izquierdo y a la vez presiona el pie o la rodilla hacia el suelo. Para intensificar este estiramiento, estira la pierna izquierda. Cambia de lado."
Side_Neck_Stretch:
  name: "Estiramiento lateral de cuello"
  instructions:
    - "Empieza con los hombros relajados e inclina suavemente la cabeza hacia el hombro."
    - "Ayuda al estiramiento con un suave tirón en el lateral de la cabeza."
Side_Standing_Long_Jump:
  name: "Salto de longitud lateral desde parado"
  instructions:
    - "Empieza de pie con los pies separados a la anchura de las caderas en una postura atlética. La cabeza y el pecho deben estar altos, con las rodillas y las caderas ligeramente flexionadas. Esta es la posición inicial."
    - "Inclinándote hacia la derecha, extiende caderas, rodillas y tobillos para saltar en el aire. Usa los brazos para guiar el movimiento, saltando tan lejos como puedas hacia tu derecha."
    - "Aterriza mirando en la misma dirección con los pies separados a la anchura de las caderas, absorbiendo el impacto con la parte inferior del cuerpo."
Side_To_Side_Chins:
  name: "Dominadas de lado a lado"
  instructions:
    - "Agarra la barra de dominadas con las palmas hacia delante y un agarre ancho."
    - "Con ambos brazos extendidos frente a ti sujetando la barra con un agarre ancho, inclina el torso hacia atrás unos 30 grados creando una curvatura en la zona lumbar y sacando el pecho. Esta es la posición inicial."
    - "Sube el torso inclinándote hacia el lado izquierdo hasta que la barra casi toque la parte superior del pecho, llevando los hombros y la parte superior de los brazos hacia abajo y atrás. Espira durante esta parte del movimiento. Consejo: concéntrate en apretar los músculos de la espalda al llegar a la posición de contracción completa. La parte superior del torso debe permanecer fija mientras se desplaza en el espacio (sin balanceos) y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo de contracción, inspira mientras vuelves a la posición inicial."
    - "Ahora sube el torso inclinándote hacia el lado derecho hasta que la barra casi toque la parte superior del pecho, llevando los hombros y la parte superior de los brazos hacia abajo y atrás. Espira durante esta parte del movimiento. Consejo: concéntrate en apretar los músculos de la espalda al llegar a la posición de contracción completa. La parte superior del torso debe permanecer fija mientras se desplaza en el espacio y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo de contracción, inspira mientras vuelves a la posición inicial."
    - "Repite los pasos 3-6 hasta que hayas realizado el número de repeticiones prescrito para cada lado."
Side_Wrist_Pull:
  name: "Tirón lateral de muñeca"
  instructions:
    - "Este estiramiento funciona mejor de pie. Cruza el brazo izquierdo sobre la línea media del cuerpo y sujeta la muñeca izquierda con la mano derecha a la altura de las caderas. Empieza el estiramiento con el brazo izquierdo flexionado."
    - "Estira lentamente, tira y súbelo hasta la altura de los hombros, como se muestra en la imagen. Siente cómo este estiramiento se origina en la espalda, no en los hombros, y no tires con demasiada fuerza de la articulación del hombro. Cambia de lado."
Side_to_Side_Box_Shuffle:
  name: "Desplazamiento lateral sobre cajón"
  instructions:
    - "Colócate a un lado del cajón con el pie izquierdo apoyado en el centro."
    - "Para empezar, salta por encima hacia el otro lado del cajón, aterrizando con el pie derecho sobre el cajón y el pie izquierdo en el suelo. Balancea los brazos para ayudarte en el movimiento."
    - "Continúa desplazándote de un lado a otro del cajón."
Single-Arm_Cable_Crossover:
  name: "Cruce de poleas a un brazo"
  instructions:
    - "Empieza llevando las poleas a la posición alta, selecciona la resistencia que vayas a usar y coge un asa con cada mano."
    - "Da un paso adelante frente a ambas poleas con los brazos extendidos frente a ti, juntando las manos. La cabeza y el pecho deben estar altos mientras te inclinas hacia delante, con los pies en tijera. Esta es la posición inicial."
    - "Manteniendo el brazo izquierdo en su sitio, deja que el brazo derecho se extienda hacia el lado, manteniendo una ligera flexión en el codo. El brazo derecho debe quedar perpendicular al cuerpo, aproximadamente a la altura de los hombros."
    - "Devuelve el brazo a la posición inicial llevando la mano de nuevo hacia la línea media del cuerpo."
    - "Mantén un segundo en la posición inicial y repite el movimiento en el lado opuesto. Continúa alternando de un lado a otro el número de repeticiones prescrito."
Single-Arm_Linear_Jammer:
  name: "Jammer lineal a un brazo"
  instructions:
    - "Coloca una barra en un landmine o fíjala firmemente en una esquina. Carga la barra con un peso adecuado."
    - "Levanta la barra del suelo, llevándola a los hombros con una o ambas manos. Adopta una posición de piernas abierta. Esta es la posición inicial."
    - "Realiza el movimiento extendiendo el codo y empujando el peso hacia arriba. Muévete de forma explosiva, extendiendo por completo caderas y rodillas para generar la máxima fuerza."
    - "Vuelve a la posición inicial."
Single-Arm_Push-Up:
  name: "Flexión a un brazo"
  instructions:
    - "Empieza tumbado boca abajo en el suelo. Colócate en una posición apoyando tu peso sobre las puntas de los pies y un brazo. El brazo de trabajo debe estar colocado justo debajo del hombro, totalmente extendido. Las piernas deben estar extendidas y, para este movimiento, puede que necesites una base más amplia, colocando los pies más separados que en una flexión normal."
    - "Mantén una buena postura y coloca la mano libre detrás de la espalda. Esta es la posición inicial."
    - "Bájate dejando que el codo se flexione hasta tocar el suelo."
    - "Desciende lentamente e invierte la dirección extendiendo el brazo para volver a la posición inicial."
Single-Cone_Sprint_Drill:
  name: "Ejercicio de sprint con un cono"
  instructions:
    - "Este ejercicio enseña rapidez de pies. Necesitas un solo cono. Empieza de pie junto al cono con un brazo hacia atrás y otro hacia delante."
    - "Mueve los pies lo más rápido posible, usando los brazos como equilibrio. Rodea el cono, mantén las rodillas altas, con una acción de pies violenta."
    - "Descansa tras tres vueltas alrededor del cono."
Single-Leg_High_Box_Squat:
  name: "Sentadilla a una pierna en cajón alto"
  instructions:
    - "Coloca un cajón en una jaula. Fija una goma elástica o una cuerda en su sitio por encima del cajón."
    - "De pie frente a él, sube al cajón hasta quedar completamente de pie, dejando la otra pierna sin apoyo. Agárrate a la goma elástica para mantener el equilibrio."
    - "Continúa subiendo y bajando con la misma pierna antes de cambiar al lado opuesto."
Single-Leg_Hop_Progression:
  name: "Progresión de saltos a una pierna"
  instructions:
    - "Coloca una línea de conos frente a ti. Adopta una posición de pie relajada, en equilibrio sobre una pierna. Levanta la rodilla de la pierna contraria. Esta es la posición inicial."
    - "Salta hacia delante, saltando y aterrizando con la misma pierna sobre el cono."
    - "Usa un salto con contramovimiento para saltar de cono en cono."
    - "Al final, da la vuelta y regresa con la otra pierna."
Single-Leg_Lateral_Hop:
  name: "Salto lateral a una pierna"
  instructions:
    - "Colócate a un lado de un cono o una valla. Para llegar a la posición inicial, apóyate sobre una pierna con la rodilla ligeramente flexionada."
    - "Para empezar, realiza un contrasalto para saltar lateralmente sobre el cono."
    - "Aterriza sobre la pierna de salto e inmediatamente rebota saltando de vuelta a la posición inicial."
    - "Continúa saltando de un lado a otro."
Single-Leg_Leg_Extension:
  name: "Extensión de cuádriceps a una pierna"
  instructions:
    - "Siéntate en la máquina y ajústala para quedar bien colocado. La almohadilla debe quedar contra la parte inferior de la espinilla, pero sin tocar el tobillo. Ajusta el asiento para que el punto de pivote quede alineado con la rodilla. Selecciona un peso adecuado a tus capacidades."
    - "Manteniendo una buena postura, extiende completamente una pierna, haciendo una pausa en la parte superior del movimiento."
    - "Vuelve a la posición inicial sin dejar que el peso se detenga, manteniendo la tensión en el músculo."
    - "Repite el número de repeticiones deseado."
Single-Leg_Stride_Jump:
  name: "Salto con zancada a una pierna"
  instructions:
    - "Colócate de lado junto a un cajón con el pie interior encima, cerca del borde."
    - "Empieza balanceando los brazos hacia arriba mientras empujas con la pierna que está sobre el cajón, saltando lo más alto posible. Intenta subir con fuerza la rodilla contraria."
    - "Aterriza en la misma posición inicial, usando la pierna interior para amortiguar el impacto."
Single_Dumbbell_Raise:
  name: "Elevación con una mancuerna"
  instructions:
    - "Con las piernas abiertas, sujeta una mancuerna con ambas manos, agarrando la cabeza de la mancuerna en lugar del mango. Los brazos deben estar extendidos y colgando a la altura de la cintura. Esta es la posición inicial."
    - "Eleva el peso hasta por encima del nivel de los hombros, manteniendo los brazos extendidos. El torso y las caderas deben permanecer inmóviles durante todo el movimiento."
    - "Vuelve a la posición inicial y repite el número de repeticiones indicado."
Single_Leg_Butt_Kick:
  name: "Talón al glúteo a una pierna"
  instructions:
    - "Empieza de pie sobre una pierna, con la rodilla de la otra flexionada y elevada. Esta es la posición inicial."
    - "Con un salto con contramovimiento, despégate hacia arriba extendiendo la cadera, la rodilla y el tobillo de la pierna de apoyo."
    - "Flexiona la rodilla de inmediato e intenta tocarte el glúteo con el talón de la pierna que salta."
    - "Devuelve la pierna a una posición parcialmente flexionada bajo las caderas y aterriza. La pierna contraria debe mantenerse más o menos en la misma posición durante todo el ejercicio."
Single_Leg_Glute_Bridge:
  name: "Puente de glúteos a una pierna"
  instructions:
    - "Túmbate en el suelo con los pies apoyados y las rodillas flexionadas."
    - "Levanta una pierna del suelo, llevando la rodilla hacia el pecho. Esta es la posición inicial."
    - "Ejecuta el movimiento empujando con el talón, extendiendo la cadera hacia arriba y elevando los glúteos del suelo."
    - "Extiende todo lo posible, haz una pausa y vuelve a la posición inicial."
Single_Leg_Push-off:
  name: "Impulso a una pierna"
  instructions:
    - "Ponte de pie en el suelo con un pie apoyado en el cajón y el talón cerca del borde."
    - "Impúlsate con el pie que está sobre el cajón, intentando ganar la mayor altura posible mediante la extensión de la cadera y la rodilla."
    - "Aterriza con el mismo pie sobre el cajón, devolviendo el otro pie a la posición inicial."
Sit-Up:
  name: "Abdominal"
  instructions:
    - "Túmbate en el suelo colocando los pies bajo algo que no se mueva o haciendo que un compañero te los sujete. Las piernas deben estar flexionadas por las rodillas."
    - "Coloca las manos detrás de la cabeza y entrelaza los dedos. Esta es la posición inicial."
    - "Eleva la parte superior del cuerpo de modo que forme una V imaginaria con los muslos. Espira al realizar esta parte del ejercicio."
    - "Cuando sientas la contracción durante un segundo, baja la parte superior del cuerpo hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Sit_Squats:
  name: "Sentadilla parcial"
  instructions:
    - "Colócate de pie con los pies a la anchura de los hombros. Esta es la posición inicial."
    - "Empieza el movimiento flexionando las rodillas y las caderas, echando las caderas hacia atrás."
    - "Continúa hasta bajar una parte del recorrido, sin llegar al paralelo, e invierte el movimiento rápidamente hasta volver a la posición inicial. Repite de 5 a 10 repeticiones."
Skating:
  name: "Patinaje"
  instructions:
    - "El patinaje sobre ruedas es una actividad divertida que puede ser eficaz para mejorar la condición cardiorrespiratoria y la resistencia muscular. Requiere un buen equilibrio y coordinación. Es necesario aprender los fundamentos del patinaje, incluidos los giros y la frenada, y usar protecciones para evitar posibles lesiones."
    - "Puedes patinar a un ritmo cómodo durante 30 minutos seguidos. Si quieres un reto cardiovascular, haz patinaje por intervalos: patina rápido dos minutos de cada cinco, aprovechando los tres restantes para recuperarte. Una persona de unos 68 kg suele quemar unas 175 calorías en 30 minutos patinando a un ritmo cómodo, similar a caminar a paso ligero."
Sled_Drag_-_Harness:
  name: "Arrastre de trineo con arnés"
  instructions:
    - "Para empezar, carga el trineo con el peso deseado y engancha la correa de tiro. Puedes tirar con asas, usar un arnés o enganchar la correa a un cinturón de lastre."
    - "Tanto si tiras hacia delante como hacia atrás, inclínate en la dirección del movimiento y avanza extendiendo las caderas y las rodillas."
Sled_Overhead_Backward_Walk:
  name: "Caminar hacia atrás con trineo y brazos sobre la cabeza"
  instructions:
    - "Engancha dos asas a un trineo conectado mediante una cuerda o cadena. Carga el trineo con poco peso."
    - "Colócate de cara al trineo y retrocede hasta que haya algo de tensión en la cuerda. Sujeta las asas justo por encima de la cabeza con los codos extendidos. Esta es la posición inicial."
    - "Camina hacia atrás manteniendo los brazos elevados sobre la cabeza. Evita los movimientos bruscos."
Sled_Overhead_Triceps_Extension:
  name: "Extensión de tríceps sobre la cabeza con trineo"
  instructions:
    - "Engancha dos asas a un trineo con una cadena o cuerda. Carga el trineo con un peso adecuado."
    - "De espaldas al trineo, aléjate hasta que haya tensión en la cuerda. Eleva las manos por encima de la cabeza, manteniéndolas juntas y con las palmas enfrentadas. Los codos deben apuntar hacia arriba y estar flexionados. Esta es la posición inicial."
    - "Extiende el codo para estirar el brazo. Asegúrate de que la parte superior del brazo se mantiene en su sitio para aislar el tríceps."
    - "Al llegar a la extensión completa, da un paso adelante para eliminar la holgura de la cuerda. Puedes mantener los pies escalonados para tener más estabilidad."
Sled_Push:
  name: "Empuje de trineo"
  instructions:
    - "Carga el trineo de empuje con el peso deseado."
    - "Adopta una postura atlética, inclinándote sobre el trineo con los brazos totalmente extendidos y agarrando las asas. Empuja el trineo lo más rápido posible, centrándote en extender las caderas y las rodillas para fortalecer la cadena posterior."
Sled_Reverse_Flye:
  name: "Pájaro con trineo"
  instructions:
    - "Engancha dos asas a un trineo conectado mediante una cuerda o cadena. Carga el trineo con poco peso."
    - "Colócate de cara al trineo y retrocede hasta que haya algo de tensión en la cuerda. Toma ambas asas con los brazos extendidos a la altura de la cintura aproximadamente. Flexiona ligeramente las rodillas y mantén el pecho y la cabeza erguidos. Esta es la posición inicial."
    - "Sin flexionar los codos, tira de las asas hacia arriba y hacia los lados, realizando un pájaro con algo de rotación externa. Las palmas deben mirar hacia delante mientras lo haces."
    - "Vuelve a la posición inicial, dando un par de pasos atrás para eliminar la holgura de la cuerda."
Sled_Row:
  name: "Remo con trineo"
  instructions:
    - "Engancha dos asas a un trineo conectado mediante una cuerda o cadena. Carga el trineo con un peso adecuado. Colócate de cara al trineo y retrocede hasta que haya algo de tensión en la cuerda."
    - "Con un asa en cada mano, flexiona ligeramente las rodillas, mantén la cabeza y el pecho erguidos y empieza con los brazos extendidos."
    - "Para iniciar el movimiento, flexiona los codos mientras juntas las escápulas, tirando del trineo hacia ti."
    - "Da uno o dos pasos hacia atrás para recuperar la tensión en la cuerda y repite."
Sledgehammer_Swings:
  name: "Golpes con mazo"
  instructions:
    - "Necesitarás un neumático y un mazo para este ejercicio. Colócate frente al neumático, a unos 60 cm de distancia, con las piernas escalonadas. Agarra el mazo."
    - "Si eres diestro, la mano izquierda debe estar en la parte inferior del mango y la derecha más cerca de la cabeza."
    - "Al subir el mazo, la mano derecha se desliza hacia la cabeza; al golpear hacia abajo, la mano derecha se desliza hacia abajo para unirse a la izquierda. Golpea el neumático con toda tu fuerza. Controla el rebote del mazo contra el neumático."
    - "Repite del otro lado."
Smith_Incline_Shoulder_Raise:
  name: "Elevación de hombros inclinada en multipower"
  instructions:
    - "Coloca un banco inclinado bajo el multipower. Pon la barra a una altura a la que puedas llegar tumbado con los brazos casi totalmente extendidos. Una vez seleccionado el peso necesario, túmbate en el banco inclinado y asegúrate de que los hombros queden alineados justo bajo la barra."
    - "Con un agarre prono a la anchura de los hombros (palmas hacia delante), saca la barra del soporte y mantenla recta sobre ti con una ligera flexión de codos. Esta es la posición inicial."
    - "Mientras espiras, sube la barra hasta que los brazos queden totalmente extendidos. Nota: la contracción debe notarse en los hombros."
    - "Tras una pausa de un segundo, baja la barra hasta la posición inicial mientras inspiras."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, coloca la barra de nuevo en el soporte."
Smith_Machine_Behind_the_Back_Shrug:
  name: "Encogimiento de hombros por detrás en multipower"
  instructions:
    - "Con la barra a la altura de los muslos, carga un peso adecuado."
    - "Colócate de pie con la barra detrás de ti, toma la barra con un agarre prono a la anchura de los hombros y desengancha el peso. Debes estar erguido, con la cabeza y el pecho arriba y los brazos extendidos. Esta es la posición inicial."
    - "Inicia el movimiento encogiendo los hombros hacia arriba en línea recta. No flexiones los brazos ni las muñecas durante el movimiento."
    - "Tras una breve pausa, devuelve el peso a la posición inicial."
    - "Repite el número de repeticiones deseado antes de accionar los ganchos para colocar el peso en el soporte."
Smith_Machine_Bench_Press:
  name: "Press de banca en multipower"
  instructions:
    - "Coloca un banco plano bajo el multipower. Pon la barra a una altura a la que puedas llegar tumbado con los brazos casi totalmente extendidos. Una vez seleccionado el peso necesario, túmbate en el banco plano. Con un agarre prono más ancho que los hombros, desbloquea la barra del soporte y mantenla recta sobre ti con los brazos bloqueados. Esta es la posición inicial."
    - "Mientras inspiras, baja despacio hasta notar la barra en la parte media del pecho."
    - "Tras una pausa de un segundo, devuelve la barra a la posición inicial mientras espiras y empujas la barra con los músculos del pecho. Bloquea los brazos en la posición de contracción, mantén un segundo y empieza a bajar despacio de nuevo. Consejo: la bajada debe durar al menos el doble que la subida."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, bloquea la barra de nuevo en el soporte."
Smith_Machine_Bent_Over_Row:
  name: "Remo inclinado en multipower"
  instructions:
    - "Coloca la barra del multipower a una altura de unos 5 cm por debajo de las rodillas."
    - "Flexiona ligeramente las rodillas e inclina el torso hacia delante, doblándote por la cintura, manteniendo la espalda recta hasta que quede casi paralela al suelo. Consejo: asegúrate de mantener la cabeza alta."
    - "Ahora agarra la barra con un agarre prono (por encima) y desbloquéala del soporte del multipower. Déjala colgar justo delante de ti, con los brazos extendidos perpendiculares al suelo y al torso. Esta es la posición inicial."
    - "Con el torso inmóvil, sube la barra mientras espiras, manteniendo los codos cerca del cuerpo y sin hacer fuerza con el antebrazo más allá de sujetar el peso. En la posición superior de contracción, aprieta los músculos de la espalda y mantén un segundo."
    - "Baja despacio el peso de nuevo hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Smith_Machine_Calf_Raise:
  name: "Elevación de gemelos en multipower"
  instructions:
    - "Coloca un bloque o un disco bajo la barra del multipower. Ajusta la barra a la posición que mejor se adapte a tu altura. Una vez elegida la altura correcta y cargada la barra, sube a los discos con la parte delantera de los pies y coloca la barra sobre la parte posterior de los hombros."
    - "Agarra la barra con ambas manos mirando hacia delante. Gira la barra para sacarla del soporte. Esta es la posición inicial."
    - "Eleva los talones lo máximo posible empujando con la parte delantera de los pies, contrayendo el gemelo en lo alto del movimiento. Las rodillas deben permanecer extendidas. Mantén la contracción un segundo antes de empezar a bajar."
    - "Vuelve despacio a la posición inicial mientras inspiras y bajas los talones."
    - "Repite el número de repeticiones indicado."
Smith_Machine_Close-Grip_Bench_Press:
  name: "Press de banca en multipower (agarre cerrado)"
  instructions:
    - "Coloca un banco plano bajo el multipower. Pon la barra a una altura a la que puedas llegar tumbado con los brazos casi totalmente extendidos. Una vez seleccionado el peso necesario, túmbate en el banco plano. Con un agarre prono cerrado (palmas hacia delante) a aproximadamente la anchura de los hombros, desbloquea la barra del soporte y mantenla recta sobre ti con los brazos bloqueados. Esta es la posición inicial."
    - "Mientras inspiras, baja despacio hasta notar la barra en la parte media del pecho. Consejo: a diferencia del press de banca normal, mantén los codos pegados al torso en todo momento para maximizar la implicación del tríceps."
    - "Tras una pausa de un segundo, devuelve la barra a la posición inicial mientras espiras y empujas la barra con los tríceps. Bloquea los brazos en la posición de contracción, mantén un segundo y empieza a bajar despacio de nuevo. Consejo: la bajada debe durar al menos el doble que la subida."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, bloquea la barra de nuevo en el soporte."
Smith_Machine_Decline_Press:
  name: "Press declinado en multipower"
  instructions:
    - "Coloca un banco declinado en el soporte de modo que la barra quede sobre tu pecho. Carga un peso adecuado y túmbate en el banco."
    - "Gira la barra para desengancharla del soporte y extiende por completo los brazos. La espalda debe estar ligeramente arqueada y las escápulas retraídas. Esta es la posición inicial."
    - "Empieza el movimiento flexionando los brazos y bajando la barra hasta el pecho."
    - "Haz una breve pausa y luego extiende los brazos para empujar el peso de vuelta a la posición inicial."
    - "Tras completar el número de repeticiones deseado, gira la barra para colocar el peso en el soporte."
Smith_Machine_Hang_Power_Clean:
  name: "Cargada de potencia desde colgado en multipower"
  instructions:
    - "Coloca la barra a la altura de las rodillas y cárgala con un peso adecuado."
    - "Toma la barra con un agarre prono más ancho que los hombros y desengancha la barra de la máquina. Los brazos deben estar totalmente extendidos, con la cabeza y el pecho arriba. Los codos deben apuntar hacia fuera, con los hombros atrás y abajo. Las caderas deben estar atrás, cargando la tensión en los isquiotibiales. Esta es la posición inicial."
    - "Inicia el movimiento extendiendo con fuerza las caderas y las rodillas, acelerando contra la barra. Asegúrate de mantener los brazos rectos durante esta parte del movimiento."
    - "Al llegar a la extensión completa, vuelve a flexionar las caderas y las rodillas para bajar tu posición de recepción."
    - "En este punto, deja que los brazos se flexionen, rotando los codos alrededor de la barra para recibirla sobre los hombros."
    - "Extiende las caderas y las rodillas hasta quedar de pie con la barra apoyada en los hombros para completar el movimiento."
Smith_Machine_Hip_Raise:
  name: "Elevación de cadera en multipower"
  instructions:
    - "Coloca un banco en el soporte y carga la barra con un peso adecuado. Túmbate en el banco, apoyando las plantas de los pies contra la barra. Desbloquea la barra y extiende las piernas. Puede que necesites ayudarte con las manos. Para mayor estabilidad, agarra los lados del multipower. Esta es la posición inicial."
    - "Inicia el movimiento rotando la pelvis y flexionando la columna para elevar las caderas del banco. Mantén una ligera flexión de rodillas durante todo el movimiento."
    - "Tras una breve pausa, vuelve a bajar las caderas al banco."
    - "Repite el número de repeticiones deseado."
Smith_Machine_Incline_Bench_Press:
  name: "Press de banca inclinado en multipower"
  instructions:
    - "Coloca un banco inclinado bajo el multipower. Pon la barra a una altura a la que puedas llegar tumbado con los brazos casi totalmente extendidos. Una vez seleccionado el peso necesario, túmbate en el banco inclinado y asegúrate de que la parte superior del pecho quede alineada con la barra. Con un agarre prono (palmas hacia delante) más ancho que los hombros, desbloquea la barra del soporte y mantenla recta sobre ti con los brazos bloqueados. Esta es la posición inicial."
    - "Mientras inspiras, baja despacio hasta notar la barra en la parte superior del pecho."
    - "Tras una pausa de un segundo, devuelve la barra a la posición inicial mientras espiras y empujas la barra con los músculos del pecho. Bloquea los brazos en la posición de contracción, mantén un segundo y empieza a bajar despacio de nuevo. Consejo: la bajada debe durar al menos el doble que la subida."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cuando termines, coloca la barra de nuevo en el soporte."
Smith_Machine_Leg_Press:
  name: "Prensa de piernas en multipower"
  instructions:
    - "Coloca la barra del multipower a unos 60 cm del suelo. Asegúrate de que descansa sobre los topes de seguridad. Tras cargar la barra con un peso adecuado, túmbate debajo de la barra. Apoya el centro de los pies en la barra, recogiendo las rodillas hacia el pecho. Esta es la posición inicial."
    - "Empieza el movimiento empujando con los pies para subir la barra, extendiendo las caderas y las rodillas. No bloquees las rodillas."
    - "En la parte alta del movimiento, haz una breve pausa antes de volver a la posición inicial."
Smith_Machine_One-Arm_Upright_Row:
  name: "Remo al mentón a un brazo en multipower"
  instructions:
    - "Con la barra a la altura de los muslos, carga un peso adecuado."
    - "Toma la barra con un agarre ancho y desengancha el peso, quitando la mano libre de la barra. El brazo debe estar extendido mientras te mantienes erguido, con la cabeza y el pecho arriba. Esta es la posición inicial."
    - "Empieza el movimiento flexionando el codo, elevando la parte superior del brazo con el codo apuntando hacia fuera. Continúa hasta que la parte superior del brazo quede paralela al suelo."
    - "Tras una breve pausa, devuelve el peso a la posición inicial."
    - "Repite el número de repeticiones deseado antes de accionar los ganchos para colocar el peso en el soporte."
Smith_Machine_Overhead_Shoulder_Press:
  name: "Press militar en multipower"
  instructions:
    - "Para empezar, coloca un banco plano (o, preferiblemente, uno con respaldo) bajo un multipower. Sitúa la barra a una altura tal que, sentado en el banco, tengas que tener los brazos casi totalmente extendidos para alcanzarla."
    - "Una vez que tengas la altura correcta, siéntate ligeramente por detrás de la barra de modo que haya una línea recta imaginaria desde la punta de la nariz hasta la barra. Los pies deben permanecer quietos. Agarra la barra con las palmas hacia delante, desbloquéala y súbela hasta que los brazos queden totalmente extendidos. Esta es la posición inicial."
    - "Empieza a bajar despacio la barra hasta que quede a la altura de la barbilla mientras inspiras."
    - "Después, sube la barra de vuelta a la posición inicial con los hombros mientras espiras."
    - "Repite el número de repeticiones indicado."
Smith_Machine_Pistol_Squat:
  name: "Sentadilla a una pierna (pistol) en multipower"
  instructions:
    - "Para empezar, ajusta primero la barra a la posición que mejor se adapte a tu altura. Colócate bajo ella y apoya la barra sobre la parte posterior de los hombros."
    - "Toma la barra con las manos hacia delante, desbloquéala y sácala del soporte extendiendo las piernas."
    - "Adelanta un pie unos 30 cm por delante de la barra. Extiende la otra pierna al frente, manteniéndola en el aire. Mira siempre al frente y mantén la columna neutra o ligeramente arqueada. Esta es la posición inicial."
    - "Manteniendo una buena postura, desciende flexionando la rodilla y la cadera, bajando hasta donde te permita la flexibilidad."
    - "Haz una breve pausa abajo y luego vuelve a la posición inicial empujando con el talón del pie, extendiendo la rodilla y la cadera."
Smith_Machine_Reverse_Calf_Raises:
  name: "Elevación de gemelos inversa en multipower"
  instructions:
    - "Ajusta la barra del multipower a tu altura y alinea una plataforma elevada justo debajo de la barra."
    - "Colócate sobre la plataforma con los talones apoyados encima y la parte delantera de los pies sobresaliendo. Coloca los dedos de los pies mirando hacia delante, con los pies a la anchura de los hombros."
    - "Ahora coloca los hombros bajo la barra manteniendo la posición de los pies descrita y empuja la barra hacia arriba extendiendo las caderas y las rodillas hasta quedar erguido. Las rodillas deben mantenerse ligeramente flexionadas, nunca bloqueadas. Esta es la posición inicial. Consejo: la barra sobre la espalda es solo para mantener el equilibrio."
    - "Eleva la parte delantera de los pies mientras espiras, extendiendo los dedos lo más alto posible y contrayendo el gemelo. Asegúrate de mantener la rodilla inmóvil en todo momento. No debe haber flexión en ningún momento. Mantén la contracción un segundo antes de empezar a bajar."
    - "Vuelve despacio a la posición inicial mientras inspiras, bajando la parte delantera de los pies y los dedos."
    - "Repite el número de repeticiones indicado."
Smith_Machine_Squat:
  name: "Sentadilla en multipower"
  instructions:
    - "Para empezar, ajusta primero la barra a la altura que mejor se adapte a tu estatura. Una vez elegida la altura correcta y cargada la barra, colócate bajo ella y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre la barra."
    - "Sujeta la barra con ambos brazos a cada lado (palmas hacia delante), desbloquéala y sácala del soporte empujando primero con las piernas y enderezando el torso al mismo tiempo."
    - "Coloca las piernas en una posición media, a la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento y la espalda recta. Esta es la posición inicial. (Nota: para esta explicación usaremos la posición media, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posiciones de pies descritas en la sección de posiciones de pies)."
    - "Empieza a bajar despacio la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa hasta que el ángulo entre el muslo y la pantorrilla sea ligeramente inferior a 90 grados (el punto en el que los muslos quedan por debajo del paralelo con el suelo). Inspira durante esta parte del movimiento. Consejo: si has hecho el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan de las puntas de los pies), estás sometiendo la rodilla a un estrés innecesario y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra mientras espiras, empujando el suelo con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Smith_Machine_Stiff-Legged_Deadlift:
  name: "Peso muerto con piernas rígidas en multipower"
  instructions:
    - "Para empezar, coloca la barra del multipower a una altura aproximadamente a la mitad de los muslos. Una vez elegida la altura correcta y cargada la barra, agárrala con un agarre prono (palmas hacia delante) a la anchura de los hombros. Puede que necesites muñequeras si usas mucho peso."
    - "Levanta la barra extendiendo por completo los brazos mientras mantienes la espalda recta. Colócate con el torso erguido y las piernas separadas a la anchura de los hombros o menos. Las rodillas deben estar ligeramente flexionadas. Esta es la posición inicial."
    - "Manteniendo las rodillas inmóviles, baja la barra por encima de los pies doblándote por la cintura y manteniendo la espalda recta. Sigue avanzando como si fueras a recoger algo del suelo hasta notar un estiramiento en los isquiotibiales. Espira mientras realizas este movimiento."
    - "Empieza a subir el torso de nuevo en cuanto notes el estiramiento de los isquiotibiales, extendiendo las caderas y la cintura hasta volver a la posición inicial. Inspira mientras realizas este movimiento."
    - "Repite el número de repeticiones indicado."
Smith_Machine_Upright_Row:
  name: "Remo al mentón en multipower"
  instructions:
    - "Para empezar, coloca la barra del multipower a una altura aproximadamente a la mitad de los muslos. Una vez elegida la altura correcta y cargada la barra, agárrala con un agarre prono (palmas hacia delante) a la anchura de los hombros. Puede que necesites muñequeras si usas mucho peso."
    - "Levanta la barra y extiende por completo los brazos con la espalda recta. Debe haber una ligera flexión en los codos. Esta es la posición inicial."
    - "Usa la parte lateral de los hombros para subir la barra mientras espiras. La barra debe ir cerca del cuerpo al subir. Continúa subiéndola hasta que casi toque la barbilla. Consejo: los codos deben dirigir el movimiento. Al subir la barra, los codos deben estar siempre más altos que los antebrazos. Además, mantén el torso inmóvil y haz una pausa de un segundo en la parte alta del movimiento."
    - "Baja despacio la barra hasta la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Smith_Single-Leg_Split_Squat:
  name: "Sentadilla búlgara en multipower"
  instructions:
    - "Para empezar, coloca un banco plano a entre 60 y 90 cm detrás del multipower. Después, ajusta la barra a la altura que mejor se adapte a tu estatura. Una vez elegida la altura correcta y cargada la barra, colócate bajo ella y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre la barra."
    - "Sujeta la barra con ambos brazos a cada lado (palmas hacia delante), desbloquéala y sácala del soporte empujando primero con las piernas y enderezando el torso al mismo tiempo."
    - "Coloca las piernas poniendo un pie ligeramente adelantado bajo la barra y extendiendo la otra pierna hacia atrás, apoyando el empeine en el banco. Esta es la posición inicial."
    - "Empieza a bajar despacio la barra flexionando la rodilla mientras mantienes una postura recta con la cabeza alta. Continúa hasta que el ángulo entre el muslo y la pantorrilla sea ligeramente inferior a 90 grados (el punto en el que los muslos quedan por debajo del paralelo con el suelo). Inspira durante esta parte del movimiento. Consejo: si has hecho el ejercicio correctamente, la parte delantera de la rodilla debe formar una línea recta imaginaria con la punta del pie, perpendicular al frente. Si la rodilla sobrepasa esa línea imaginaria (si pasa de la punta del pie), estás sometiendo la rodilla a un estrés innecesario y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra mientras espiras, empujando el suelo principalmente con el talón mientras estiras de nuevo la pierna y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
    - "Cambia de pierna y repite el movimiento."
Snatch:
  name: "Arrancada"
  instructions:
    - "Coloca los pies a la anchura de los hombros con la barra justo encima de la unión entre los dedos y el resto del pie."
    - "Con un agarre prono, flexiona las rodillas y, manteniendo la espalda plana, agarra la barra con un agarre más ancho que los hombros. Baja las caderas y asegúrate de que el cuerpo desciende como si fueras a sentarte en una silla. Esta es la posición inicial."
    - "Empieza a empujar el suelo con los pies como si fuera una plataforma en movimiento y, al mismo tiempo, empieza a levantar la barra manteniéndola cerca de las piernas."
    - "Cuando la barra llegue a la mitad de los muslos, empuja el suelo con las piernas y lleva el cuerpo a la extensión completa con un movimiento explosivo."
    - "Lleva los hombros hacia atrás con un movimiento de encogimiento mientras subes la barra, elevando los codos hacia los lados y manteniéndolos por encima de la barra el mayor tiempo posible."
    - "Ahora, con un movimiento muy rápido pero potente, debes meter el cuerpo bajo la barra cuando esta haya alcanzado un punto lo bastante alto como para controlarla y bajar mientras bloqueas los brazos y sostienes la barra sobre la cabeza adoptando una posición de sentadilla."
    - "Finaliza el movimiento levantándote desde la posición de sentadilla para completar la levantada. Al final, ambos pies deben estar alineados y los brazos totalmente extendidos sosteniendo la barra sobre la cabeza."
Snatch_Balance:
  name: "Snatch balance"
  instructions:
    - "Empieza con los pies en la posición de tirón, la barra apoyada en la parte posterior de los hombros y las manos en un agarre ancho de arrancada."
    - "Impulsa la barra con una flexión brusca y un empuje de las rodillas, y mete el cuerpo bajo la barra con decisión, pasando los pies a la posición de recepción."
    - "Recibe la barra bloqueada sobre la cabeza cerca del fondo de la sentadilla. El torso debe permanecer vertical, bajando las caderas entre las piernas."
    - "Continúa descendiendo hasta la profundidad máxima y vuelve a la posición de pie. Baja el peso con cuidado."
Snatch_Deadlift:
  name: "Peso muerto de arrancada"
  instructions:
    - "El peso muerto de arrancada fortalece el primer tirón de la arrancada. Empieza con un agarre ancho de arrancada con la barra colocada en la plataforma. Los pies deben estar justo bajo las caderas, con las puntas hacia fuera. Baja en sentadilla hasta la barra, manteniendo la espalda en extensión absoluta con la cabeza mirando al frente."
    - "Inicia el movimiento empujando con los talones, elevando las caderas. El ángulo de la espalda debe mantenerse igual hasta que la barra pase las rodillas."
    - "En ese punto, lleva las caderas hacia la barra mientras te echas hacia atrás. Devuelve la barra a la plataforma invirtiendo el movimiento."
Snatch_Pull:
  name: "Tirón de arrancada"
  instructions:
    - "Con una barra en el suelo cerca de las espinillas, toma un agarre ancho de arrancada. Baja las caderas con el peso cargado en los talones, la espalda recta, la cabeza mirando al frente, el pecho arriba y los hombros justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con los talones, extendiendo las rodillas. El ángulo de la espalda debe mantenerse igual y los brazos deben permanecer rectos. Mueve el peso con control hasta pasar las rodillas."
    - "A continuación viene el segundo tirón, la principal fuente de aceleración del tirón. Cuando la barra se acerque a la mitad del muslo, empieza a extender las caderas. Con un movimiento de salto, acelera extendiendo las caderas, las rodillas y los tobillos, usando la velocidad para subir la barra."
    - "No debería ser necesario tirar activamente con los brazos para acelerar el peso; al final del segundo tirón, el cuerpo debe quedar totalmente extendido, inclinado ligeramente hacia atrás. La extensión completa debe ser violenta y brusca, y asegúrate de no prolongarla más de lo necesario."
Snatch_Shrug:
  name: "Encogimiento de hombros de arrancada"
  instructions:
    - "Empieza con un agarre ancho, con la barra colgando a la altura de la mitad del muslo. Puedes usar un agarre hook o prono. La espalda debe estar recta e inclinada ligeramente hacia delante."
    - "Encoge los hombros hacia las orejas. Aunque este ejercicio suele poder cargarse con más peso que una arrancada, evita sobrecargarlo hasta el punto de que la ejecución se vuelva lenta."
Snatch_from_Blocks:
  name: "Arrancada desde bloques"
  instructions:
    - "Empieza con una barra cargada sobre cajones o soportes de la altura deseada. Toma un agarre ancho de la barra. Los pies deben estar justo bajo las caderas, con las puntas hacia fuera según sea necesario. Baja las caderas, con el pecho arriba y la cabeza mirando al frente. Los hombros deben quedar justo por delante de la barra, con los codos apuntando hacia fuera. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con la parte delantera de los talones, elevando la barra de los cajones."
    - "Pasa al segundo tirón extendiendo las caderas, las rodillas y los tobillos, subiendo la barra lo más rápido posible. La barra debe ir cerca del cuerpo. En el pico de la extensión, encoge los hombros y deja que los codos se flexionen hacia los lados."
    - "Mientras llevas los pies a la posición de recepción, tira de ti mismo con fuerza por debajo de la barra mientras elevas la barra sobre la cabeza. Los pies deben moverse justo hasta fuera de las caderas, con las puntas hacia fuera según sea necesario. Recibe la barra con el cuerpo lo más bajo posible y los brazos totalmente extendidos sobre la cabeza."
    - "Manteniendo la barra alineada sobre la parte delantera de los talones y con la cabeza y el pecho arriba, empuja con los talones para ponerte de pie. Devuelve el peso a los cajones con cuidado."
Speed_Band_Overhead_Triceps:
  name: "Extensión de tríceps sobre la cabeza con goma elástica (velocidad)"
  instructions:
    - "Para este ejercicio, ancla una goma elástica al suelo. Nosotros usamos un banco inclinado y anclamos la goma a la base, de pie sobre el banco. Como alternativa, puede hacerse de pie sobre la goma."
    - "Para empezar, lleva la goma detrás de la cabeza, sujetándola con un agarre prono y los codos arriba. Esta es la posición inicial."
    - "Para realizar el movimiento, extiende los codos para estirar los brazos, asegurándote de mantener la parte superior del brazo en su sitio."
    - "Haz una pausa y vuelve a la posición inicial."
Speed_Box_Squat:
  name: "Sentadilla al cajón (velocidad)"
  instructions:
    - "Engancha a la barra gomas elásticas ancladas firmemente cerca del suelo. Puede que tengas que acortar las gomas para conseguir una tensión adecuada."
    - "Usa un cajón de una altura adecuada para este ejercicio. Carga la barra con un peso que siga exigiendo esfuerzo, pero que no sea tan pesado como para comprometer la velocidad. Normalmente será entre el 50 y el 70% de tu una repetición máxima."
    - "Coloca la barra sobre la parte alta de la espalda, con las escápulas retraídas, la espalda arqueada y todo el cuerpo tenso de la cabeza a los pies. Esta es la posición inicial."
    - "Saca la barra del soporte y colócate frente al cajón. Siéntate hacia atrás con las caderas hasta quedar sentado en el cajón, asegurándote de bajar con control y de no desplomarte sobre la superficie."
    - "Haz una breve pausa y sube de forma explosiva desde el cajón, extendiendo las caderas y las rodillas."
Speed_Squats:
  name: "Sentadillas de velocidad"
  instructions:
    - "Este ejercicio se realiza mejor dentro de una jaula de sentadillas por seguridad. Para empezar, ajusta primero la barra en un soporte que se adapte a tu altura. Una vez elegida la altura correcta y cargada la barra, colócate bajo ella y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre la barra."
    - "Sujeta la barra con ambos brazos a cada lado y sácala del soporte empujando primero con las piernas y enderezando el torso al mismo tiempo."
    - "Da un paso atrás para separarte del soporte y coloca las piernas en una posición media, a la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te desequilibrará, y mantén también la espalda recta. Esta es la posición inicial. (Nota: para esta explicación usaremos la posición media, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posiciones de pies descritas en la sección de posiciones de pies)."
    - "Empieza a bajar la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa hasta que el ángulo entre el muslo y la pantorrilla sea ligeramente inferior a 90 grados (el punto en el que los muslos quedan por debajo del paralelo con el suelo). Inspira durante esta parte del movimiento. Consejo: si has hecho el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si pasan de las puntas de los pies), estás sometiendo la rodilla a un estrés innecesario y el ejercicio se ha realizado incorrectamente."
    - "Empieza a subir la barra lo más rápido posible sin usar inercia mientras espiras, empujando el suelo principalmente con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial. Nota: debes realizar estos ejercicios lo más rápido posible, pero sin perder la técnica perfecta y sin usar inercia."
    - "Repite el número de repeticiones indicado."
Spell_Caster:
  name: "Spell caster"
  instructions:
    - "Sujeta una mancuerna en cada mano con agarre prono. Los pies deben estar separados, con las caderas y las rodillas extendidas. Esta es la posición inicial."
    - "Empieza el movimiento llevando ambas mancuernas hacia un lado, junto a la cadera, rotando el torso."
    - "Manteniendo los brazos rectos y las mancuernas paralelas al suelo, rota el torso para balancear los pesos hacia el lado contrario."
    - "Continúa alternando, rotando de un lado a otro hasta completar la serie."
Spider_Crawl:
  name: "Arrastre de araña"
  instructions:
    - "Empieza en posición prona en el suelo. Apoya el peso en las manos y en la punta de los pies, con los pies juntos y el cuerpo recto. Los brazos deben estar flexionados a 90 grados. Esta es la posición inicial."
    - "Inicia el movimiento levantando un pie del suelo. Rota externamente la pierna y lleva la rodilla hacia el codo, lo más adelante posible."
    - "Devuelve esta pierna a la posición inicial y repite con la pierna contraria."
Spider_Curl:
  name: "Curl araña"
  instructions:
    - "Empieza colocando la barra en la parte del banco Scott en la que normalmente te sentarías. Asegúrate de alinear bien la barra para que esté equilibrada y no se caiga."
    - "Ve a la parte frontal del banco Scott (donde normalmente se apoyan los brazos) y colócate tumbado con una inclinación de 45 grados, con el torso y el estómago pegados a la parte frontal del banco."
    - "Asegúrate de que los pies (sobre todo las puntas) estén bien apoyados en el suelo y coloca la parte superior de los brazos sobre el almohadillado de la parte interior del banco."
    - "Usa los brazos para agarrar la barra con un agarre supino (palmas hacia arriba) a aproximadamente la anchura de los hombros o ligeramente más cerrado."
    - "Empieza a subir despacio la barra mientras espiras. Mantén la contracción un segundo mientras aprietas los bíceps."
    - "Empieza a bajar despacio la barra hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Spinal_Stretch:
  name: "Estiramiento de columna"
  instructions:
    - "Siéntate en una silla con la espalda recta y los pies apoyados en el suelo."
    - "Entrelaza los dedos detrás de la cabeza, con los codos hacia fuera y la barbilla hacia abajo."
    - "Gira la parte superior del cuerpo hacia un lado unas 3 veces tan lejos como puedas. Luego inclínate hacia delante y gira el torso para llevar el codo al suelo por el interior de la rodilla."
    - "Vuelve a la posición erguida y repite hacia el otro lado."
Split_Clean:
  name: "Cargada con tijera"
  instructions:
    - "Con una barra en el suelo cerca de las espinillas, toma un agarre prono justo por fuera de las piernas. Baja las caderas con el peso cargado en los talones, la espalda recta, la cabeza mirando al frente, el pecho arriba y los hombros justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con los talones, extendiendo las rodillas. El ángulo de la espalda debe mantenerse igual y los brazos deben permanecer rectos. Mueve el peso con control hasta pasar las rodillas."
    - "A continuación viene el segundo tirón, la principal fuente de aceleración de la cargada. Cuando la barra se acerque a la mitad del muslo, empieza a extender las caderas. Con un movimiento de salto, acelera extendiendo las caderas, las rodillas y los tobillos, usando la velocidad para subir la barra. No debería ser necesario tirar activamente con los brazos para acelerar el peso; al final del segundo tirón, el cuerpo debe quedar totalmente extendido, inclinado ligeramente hacia atrás, con los brazos aún extendidos."
    - "Cuando se alcance la extensión completa, pasa al tercer tirón encogiendo los hombros con fuerza y flexionando los brazos con los codos arriba y hacia fuera. En el pico de la extensión, tira de ti mismo hacia abajo con decisión, rotando los codos bajo la barra mientras lo haces."
    - "Recibe la barra con los pies en tijera, moviendo con decisión un pie hacia delante y otro hacia atrás. La barra debe quedar apoyada sobre los hombros protraídos, rozando ligeramente la garganta con las manos relajadas. Continúa descendiendo hasta la posición más baja, lo que ayudará en la recuperación."
    - "Recupérate de inmediato empujando con los talones, manteniendo el torso erguido y los codos arriba. Junta los pies al ponerte de pie."
Split_Jerk:
  name: "Envión con tijera"
  instructions:
    - "De pie, con el peso apoyado en la parte delantera de los hombros, empieza con la flexión. Con los pies justo bajo las caderas, flexiona las rodillas sin mover las caderas hacia atrás."
    - "Baja solo un poco e invierte la dirección con la mayor potencia posible. Empuja con los talones para generar la máxima velocidad y fuerza posibles, y asegúrate de apartar la cabeza cuando la barra se separe de los hombros. En ese momento, cuando los pies dejan el suelo, deben colocarse en la posición de recepción lo más rápido posible."
    - "En el breve instante en que los pies no empujan activamente contra la plataforma, el esfuerzo del atleta por subir la barra los empujará hacia abajo. Los pies deben moverse a una posición en tijera, un pie delante y otro detrás, con las rodillas parcialmente flexionadas. Recibe la barra con los brazos bloqueados sobre la cabeza."
    - "Vuelve a la posición de pie, juntando los pies."
Split_Jump:
  name: "Salto con zancada"
  instructions:
    - "Adopta una posición de zancada, con un pie adelantado y la rodilla flexionada, y la rodilla trasera casi tocando el suelo."
    - "Asegúrate de que la rodilla delantera quede sobre la línea media del pie."
    - "Extendiendo ambas piernas, salta lo más alto posible, balanceando los brazos para ganar impulso."
    - "Mientras saltas, junta los pies y vuelve a llevarlos a sus posiciones iniciales al aterrizar."
    - "Absorbe el impacto volviendo a la posición inicial."
Split_Snatch:
  name: "Arrancada con tijera"
  instructions:
    - "Empieza con una barra cargada en el suelo. La barra debe estar cerca de las espinillas o tocándolas, y debes tomar un agarre ancho de la barra. Los pies deben estar justo bajo las caderas, con las puntas hacia fuera según sea necesario. Baja las caderas, con el pecho arriba y la cabeza mirando al frente. Los hombros deben quedar justo por delante de la barra. Esta es la posición inicial."
    - "Empieza el primer tirón empujando con la parte delantera de los talones, levantando la barra del suelo. El ángulo de la espalda debe mantenerse igual hasta que la barra pase las rodillas."
    - "Pasa al segundo tirón extendiendo las caderas, las rodillas y los tobillos, subiendo la barra lo más rápido posible. La barra debe ir cerca del cuerpo. En el pico de la extensión, encoge los hombros y deja que los codos se flexionen hacia los lados."
    - "Mientras llevas los pies a la posición de recepción, tira de ti mismo con fuerza por debajo de la barra mientras elevas la barra sobre la cabeza. Los pies deben moverse con decisión a una posición en tijera, un pie delante y otro detrás. Recibe la barra con el cuerpo lo más bajo posible y los brazos totalmente extendidos sobre la cabeza."
    - "Manteniendo la barra alineada sobre la parte delantera de los talones y con la cabeza y el pecho arriba, empuja con los talones para ponerte de pie, juntando los pies."
    - "Devuelve el peso al suelo con cuidado."
Split_Squat_with_Dumbbells:
  name: "Sentadilla dividida con mancuernas"
  instructions:
    - "Colócate en una posición escalonada con el pie trasero elevado y el pie delantero adelantado."
    - "Sujeta una mancuerna en cada mano, dejándolas colgar a los lados. Esta es la posición inicial."
    - "Empieza descendiendo, flexionando la rodilla y la cadera para bajar el cuerpo. Mantén una buena postura durante todo el movimiento. Mantén la rodilla delantera alineada con el pie mientras realizas el ejercicio."
    - "En la parte inferior del movimiento, empuja con el talón para extender la rodilla y la cadera y volver a la posición inicial."
Split_Squats:
  name: "Sentadilla dividida con salto"
  instructions:
    - "Empieza de pie. Salta a una posición de piernas divididas, con una pierna delante y otra detrás, flexionando las rodillas y bajando ligeramente las caderas al hacerlo."
    - "Al descender, invierte la dirección de inmediato, poniéndote de pie y saltando, intercambiando la posición de las piernas. Repite de 5 a 10 veces con cada pierna."
Squat_Jerk:
  name: "Envión con sentadilla"
  instructions:
    - "De pie, con el peso apoyado en la parte delantera de los hombros, empieza con la flexión. Con los pies justo bajo las caderas, flexiona las rodillas sin mover las caderas hacia atrás. Baja solo un poco e invierte la dirección con la mayor potencia posible. Empuja con los talones para generar la máxima velocidad y fuerza posibles, y asegúrate de apartar la cabeza cuando la barra se separe de los hombros."
    - "En ese momento, cuando los pies dejan el suelo, deben colocarse en la posición de recepción lo más rápido posible. En el breve instante en que los pies no empujan activamente contra la plataforma, el esfuerzo del atleta por subir la barra los empujará hacia abajo. Los pies deben moverse con decisión hasta justo fuera de las caderas, con las puntas hacia fuera según sea necesario. Recibe la barra con el cuerpo en sentadilla completa y los brazos totalmente extendidos sobre la cabeza."
    - "Manteniendo la barra alineada sobre la parte delantera de los talones y con la cabeza y el pecho arriba, empuja con los talones para ponerte de pie. Devuelve el peso al suelo con cuidado."
Squat_with_Bands:
  name: "Sentadilla con gomas elásticas"
  instructions:
    - "Coloca las gomas en los extremos de la barra, sujetas a los soportes para gomas, al rack o a mancuernas, de modo que haya una tensión adecuada."
    - "Empieza colocándote bajo la barra y apoyándola sobre la parte posterior de los hombros. Junta las escápulas y rota los codos hacia delante, intentando doblar la barra sobre los hombros. Saca la barra del soporte, creando un arco firme en la zona lumbar, y da un paso atrás hasta colocarte en posición. Separa más los pies para dar más énfasis a la espalda, los glúteos, los aductores y los isquiotibiales. Mantén la cabeza mirando al frente."
    - "Con la espalda, los hombros y el core tensos, empuja las rodillas y los glúteos hacia fuera y empieza el descenso. Échate hacia atrás con las caderas todo lo posible. Idealmente, las espinillas deben quedar perpendiculares al suelo. Una posición más baja de la barra exige una mayor inclinación del torso para mantener la barra sobre los talones. Continúa hasta pasar el paralelo, que se define como el pliegue de la cadera alineado con la parte superior de la rodilla."
    - "Manteniendo el peso en los talones y empujando los pies y las rodillas hacia fuera, sube dirigiendo el movimiento con la cabeza. Continúa subiendo, manteniendo la tensión de la cabeza a los pies, hasta volver a la posición inicial."
Squat_with_Plate_Movers:
  name: "Sentadilla con desplazamiento de disco"
  instructions:
    - "Para empezar, coloca primero la barra en un soporte justo por debajo del nivel de los hombros. Coloca un disco en el suelo a unos 60 cm por detrás del soporte. Una vez cargada la barra, colócate bajo ella y apoya la parte posterior de los hombros sobre la barra."
    - "Sujeta la barra con ambas manos y sácala del soporte empujando primero con las piernas y enderezando el torso al mismo tiempo."
    - "Da un paso atrás para separarte del soporte y adopta una posición ancha con las puntas de los pies ligeramente hacia fuera, con un pie sobre el disco. Mantén la cabeza alta en todo momento. Esta es la posición inicial."
    - "Empieza a bajar despacio la barra flexionando las rodillas y las caderas. Continúa hasta que el ángulo entre el muslo y la pantorrilla sea ligeramente inferior a 90 grados."
    - "Sube la barra mientras espiras, empujando el suelo con los talones mientras extiendes las caderas y las rodillas."
    - "En la parte alta del movimiento, da un paso lateral, juntando los pies al otro lado del disco."
    - "Con el pie interior, empuja el disco deslizándolo por el suelo hasta donde estabas de pie hace un momento."
    - "Coloca el pie interior sobre el disco, adoptando una posición ancha para la siguiente repetición."
Squats_-_With_Bands:
  name: "Sentadillas con gomas elásticas"
  instructions:
    - "Para empezar, asegúrate de que la goma elástica está repartida por igual entre el lado izquierdo y el derecho del cuerpo. Para ello, usa las manos para agarrar ambos lados de la goma y coloca los dos pies en el centro de la goma. Los pies deben estar separados a la anchura de los hombros."
    - "Al sujetar las gomas, deben estar a la misma altura en cada lado. Debes usar un agarre prono (palmas hacia delante) y tener las asas de las gomas junto a la cara en este ejercicio. Esta es la posición inicial."
    - "Empieza despacio a flexionar las rodillas y a bajar las piernas hasta que los muslos queden paralelos al suelo mientras espiras."
    - "Usa el talón de los pies para empujar el cuerpo hacia arriba hasta la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Stairmaster:
  name: "Stairmaster"
  instructions:
    - "Para empezar, súbete al stairmaster y selecciona la opción deseada en el menú. Puedes elegir un ajuste manual o seleccionar un programa. Normalmente puedes introducir tu edad y tu peso para estimar las calorías quemadas durante el ejercicio."
    - "Bombea con las piernas arriba y abajo a un ritmo establecido, empujando los pedales hacia abajo pero sin llegar hasta el suelo. Se recomienda mantener el agarre en las asas para no caerte. Las asas pueden usarse para monitorizar la frecuencia cardiaca y ayudarte a mantener una intensidad adecuada."
    - "Los stairmasters ofrecen comodidad, beneficios cardiovasculares y normalmente tienen menos impacto que correr al aire libre. Suelen ser mucho más duros que otras máquinas de cardio. Una persona de unos 68 kg suele quemar más de 300 calorías en 30 minutos, frente a unas 175 calorías caminando."
Standing_Alternating_Dumbbell_Press:
  name: "Press con mancuernas alterno de pie"
  instructions:
    - "Colócate de pie con una mancuerna en cada mano. Eleva las mancuernas hasta los hombros con las palmas hacia delante y los codos apuntando hacia fuera. Esta es la posición inicial."
    - "Extiende un brazo para empujar la mancuerna en línea recta hacia arriba, manteniendo la otra mano en su sitio. No te inclines ni des tirones al peso durante el movimiento."
    - "Tras una breve pausa, devuelve el peso a la posición inicial."
    - "Repite con el lado contrario, continuando con la alternancia de brazos."
Standing_Barbell_Calf_Raise:
  name: "Elevación de gemelos de pie con barra"
  instructions:
    - "Este ejercicio se realiza mejor dentro de una jaula de sentadillas por seguridad. Para empezar, ajusta primero la barra en un soporte que se adapte a tu altura. Una vez elegida la altura correcta y cargada la barra, colócate bajo ella y apoya la barra sobre la parte posterior de los hombros (ligeramente por debajo del cuello)."
    - "Sujeta la barra con ambos brazos a cada lado y sácala del soporte empujando primero con las piernas y enderezando el torso al mismo tiempo."
    - "Da un paso atrás para separarte del soporte y coloca las piernas en una posición media, a la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te desequilibrará, y mantén también la espalda recta. Las rodillas deben mantenerse ligeramente flexionadas, nunca bloqueadas. Esta es la posición inicial. Consejo: para un mayor rango de movimiento también puedes apoyar la parte delantera de los pies sobre un bloque de madera, pero ten cuidado, ya que esta opción requiere más equilibrio y un bloque resistente."
    - "Eleva los talones mientras espiras, extendiendo los tobillos lo más alto posible y contrayendo el gemelo. Asegúrate de mantener la rodilla inmóvil en todo momento. No debe haber flexión en ningún momento. Mantén la contracción un segundo antes de empezar a bajar."
    - "Vuelve despacio a la posición inicial mientras inspiras, bajando los talones y flexionando los tobillos hasta que los gemelos queden estirados."
    - "Repite el número de repeticiones indicado."
Standing_Barbell_Press_Behind_Neck:
  name: "Press tras nuca con barra de pie"
  instructions:
    - "Este ejercicio se realiza mejor dentro de una jaula de sentadillas para coger la barra con más facilidad. Para empezar, ajusta primero la barra en un soporte que se adapte a tu altura. Una vez elegida la altura correcta y cargada la barra, colócate bajo ella y apoya la parte posterior de los hombros (ligeramente por debajo del cuello) sobre la barra."
    - "Sujeta la barra con ambos brazos a cada lado y sácala del soporte empujando primero con las piernas y enderezando el torso al mismo tiempo."
    - "Da un paso atrás para separarte del soporte y coloca las piernas en una posición media, a la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. La espalda debe mantenerse recta mientras realizas este ejercicio. Esta es la posición inicial."
    - "Eleva la barra sobre la cabeza extendiendo por completo los brazos mientras espiras."
    - "Mantén la contracción un segundo y baja la barra de nuevo hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Standing_Bent-Over_One-Arm_Dumbbell_Triceps_Extension:
  name: "Patada de tríceps con mancuerna a un brazo"
  instructions:
    - "Con una mancuerna en una mano y la palma mirando hacia el torso, flexiona ligeramente las rodillas e inclina el torso hacia delante, doblándote por la cintura, manteniendo la espalda recta hasta que quede casi paralela al suelo. Asegúrate de mantener la cabeza alta."
    - "La parte superior del brazo debe estar cerca del torso y paralela al suelo, mientras que el antebrazo apunta hacia el suelo con la mano sujetando el peso. Consejo: debe haber un ángulo de 90 grados entre el antebrazo y la parte superior del brazo. Esta es la posición inicial."
    - "Manteniendo la parte superior del brazo inmóvil, usa el tríceps para levantar el peso mientras espiras hasta que el antebrazo quede paralelo al suelo y todo el brazo esté extendido. Como en muchos otros ejercicios de brazos, solo se mueve el antebrazo."
    - "Tras una contracción de un segundo arriba, baja despacio la mancuerna hasta la posición inicial mientras inspiras."
    - "Repite el movimiento el número de repeticiones prescrito."
    - "Cambia de brazo y repite el ejercicio."
Standing_Bent-Over_Two-Arm_Dumbbell_Triceps_Extension:
  name: "Patada de tríceps con mancuernas a dos brazos"
  instructions:
    - "Con una mancuerna en cada mano y las palmas mirando hacia el torso, flexiona ligeramente las rodillas e inclina el torso hacia delante, doblándote por la cintura, manteniendo la espalda recta hasta que quede casi paralela al suelo. Asegúrate de mantener la cabeza alta. La parte superior de los brazos debe estar cerca del torso y paralela al suelo, mientras que los antebrazos apuntan hacia el suelo con las manos sujetando los pesos. Consejo: debe haber un ángulo de 90 grados entre los antebrazos y la parte superior del brazo. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos inmóvil, usa los tríceps para levantar los pesos mientras espiras hasta que los antebrazos queden paralelos al suelo y todos los brazos estén extendidos. Como en muchos otros ejercicios de brazos, solo se mueve el antebrazo."
    - "Tras una contracción de un segundo arriba, baja despacio las mancuernas hasta su posición inicial mientras inspiras."
    - "Repite el movimiento el número de repeticiones prescrito."
Standing_Biceps_Cable_Curl:
  name: "Curl de bíceps en polea de pie"
  instructions:
    - "Colócate de pie con el torso erguido sujetando una barra de curl enganchada a una polea baja. Agarra la barra a la anchura de los hombros y mantén los codos cerca del torso. Las palmas de las manos deben mirar hacia arriba (agarre supino). Esta es la posición inicial."
    - "Manteniendo inmóvil la parte superior de los brazos, haz el curl contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y la barra esté a la altura de los hombros. Mantén la contracción un segundo mientras aprietas el músculo."
    - "Empieza a bajar despacio la barra de curl hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Standing_Biceps_Stretch:
  name: "Estiramiento de bíceps de pie"
  instructions:
    - "Entrelaza las manos detrás de la espalda con las palmas juntas, estira los brazos y luego gíralos para que las palmas miren hacia abajo."
    - "Eleva los brazos y mantén la posición hasta notar un estiramiento en los bíceps."
Standing_Bradford_Press:
  name: "Press Bradford de pie"
  instructions:
    - "Coloca una barra cargada a la altura de los hombros en un soporte. Con un agarre prono a la anchura de los hombros, empieza con la barra apoyada en la parte delantera de los hombros. Esta es la posición inicial."
    - "Inicia la levantada extendiendo los codos para empujar la barra sobre la cabeza. Evita bloquear el codo mientras llevas el peso por detrás de la cabeza."
    - "Baja la barra por detrás de la cabeza hasta que el codo forme un ángulo recto."
    - "Vuelve a subir la barra sobre la cabeza extendiendo los codos."
    - "Baja la barra hasta la posición inicial."
    - "Alterna de esta manera hasta completar el número de repeticiones indicado."
Standing_Cable_Chest_Press:
  name: "Press de pecho en polea de pie"
  instructions:
    - "Coloca las dos poleas a la altura del pecho y selecciona un peso adecuado. Colócate a unos 30-60 cm por delante de las poleas, sujetando un agarre en cada mano. Puedes escalonar las piernas para tener mejor estabilidad."
    - "Coloca la parte superior del brazo en un ángulo de 90 grados con las escápulas juntas. Esta es la posición inicial."
    - "Manteniendo inmóvil el resto del cuerpo, extiende los codos para empujar las asas hacia delante, juntándolas delante de ti."
    - "Haz una pausa en la parte alta del movimiento y vuelve a la posición inicial."
Standing_Cable_Lift:
  name: "Elevación en polea de pie"
  instructions:
    - "Conecta una asa estándar a una torre de poleas y baja la polea a la posición más baja."
    - "Con el costado hacia la polea, agarra el asa con una mano y aléjate de la torre. Debes quedar aproximadamente a la distancia de un brazo de la polea, con el peso tensando el cable. El brazo extendido debe quedar alineado con el cable."
    - "Con los pies a la anchura de los hombros, baja en sentadilla y agarra el asa con ambas manos. Los brazos deben seguir totalmente extendidos."
    - "En un solo movimiento, tira del asa hacia arriba y cruzando el cuerpo hasta que los brazos queden totalmente extendidos por encima de la cabeza."
    - "Mantén la espalda recta y los brazos cerca del cuerpo mientras pivotas con el pie trasero y estiras las piernas para conseguir un rango de movimiento completo."
    - "Recoge los brazos y luego el cuerpo. Vuelve a la posición neutra de forma lenta y controlada."
    - "Repite hasta el fallo."
    - "Después, recoloca y repite la misma serie de movimientos en el lado contrario."
Standing_Cable_Wood_Chop:
  name: "Leñador en polea de pie"
  instructions:
    - "Conecta una asa estándar a una torre de poleas y sube la polea a la posición más alta."
    - "Con el costado hacia la polea, agarra el asa con una mano y aléjate de la torre. Debes quedar aproximadamente a la distancia de un brazo de la polea, con el peso tensando el cable. El brazo extendido debe quedar alineado con el cable."
    - "Con los pies a la anchura de los hombros, alcanza hacia arriba con la otra mano y agarra el asa con ambas manos. Los brazos deben seguir totalmente extendidos."
    - "En un solo movimiento, tira del asa hacia abajo y cruzando el cuerpo hasta la rodilla delantera mientras rotas el torso."
    - "Mantén la espalda y los brazos rectos y el core apretado mientras pivotas con el pie trasero y flexionas las rodillas para conseguir un rango de movimiento completo."
    - "Mantén la posición de las piernas y los brazos rectos. Vuelve a la posición neutra de forma lenta y controlada."
    - "Repite hasta el fallo."
    - "Después, recoloca y repite la misma serie de movimientos en el lado contrario."
Standing_Calf_Raises:
  name: "Elevación de gemelos de pie"
  instructions:
    - "Ajusta la palanca acolchada de la máquina de elevación de gemelos a tu altura."
    - "Coloca los hombros bajo las almohadillas y los dedos de los pies mirando hacia delante (o usando cualquiera de las otras dos posiciones descritas al principio del capítulo). La parte delantera de los pies debe estar apoyada en el bloque de gemelos con los talones sobresaliendo. Empuja la palanca hacia arriba extendiendo las caderas y las rodillas hasta quedar erguido. Las rodillas deben mantenerse ligeramente flexionadas, nunca bloqueadas. Los dedos de los pies deben mirar hacia delante, hacia fuera o hacia dentro, como se describe al principio del capítulo. Esta es la posición inicial."
    - "Eleva los talones mientras espiras, extendiendo los tobillos lo más alto posible y contrayendo el gemelo. Asegúrate de mantener la rodilla inmóvil en todo momento. No debe haber flexión en ningún momento. Mantén la contracción un segundo antes de empezar a bajar."
    - "Vuelve despacio a la posición inicial mientras inspiras, bajando los talones y flexionando los tobillos hasta que los gemelos queden estirados."
    - "Repite el número de repeticiones indicado."
Standing_Concentration_Curl:
  name: "Curl concentrado de pie"
  instructions:
    - "Toma una mancuerna con la mano que va a trabajar e inclínate hacia delante. Deja que el brazo que trabaja cuelgue perpendicular al suelo con el codo apuntando hacia fuera. Esta es la posición inicial."
    - "Flexiona el codo para hacer el curl con el peso, manteniendo inmóvil la parte superior del brazo. En la parte alta de la repetición, contrae el bíceps y haz una pausa."
    - "Baja la mancuerna de nuevo hasta la posición inicial."
    - "Repite el movimiento el número de repeticiones prescrito."
Standing_Dumbbell_Calf_Raise:
  name: "Elevación de gemelos de pie con mancuernas"
  instructions:
    - "Colócate de pie con el torso erguido sujetando dos mancuernas en las manos a los lados. Apoya la parte delantera del pie en una tabla de madera firme y estable (de unos 5-7,5 cm de alto) mientras los talones sobresalen y tocan el suelo. Esta es la posición inicial."
    - "Con las puntas de los pies apuntando rectas (para trabajar todas las partes por igual), hacia dentro (para enfatizar la cabeza externa) o hacia fuera (para enfatizar la cabeza interna), eleva los talones del suelo mientras espiras contrayendo los gemelos. Mantén la contracción superior un segundo."
    - "Mientras inspiras, vuelve a la posición inicial bajando despacio los talones."
    - "Repite el número de veces indicado."
Standing_Dumbbell_Press:
  name: "Press de hombros con mancuernas de pie"
  instructions:
    - "De pie, con los pies a la anchura de los hombros, toma una mancuerna en cada mano. Eleva las mancuernas a la altura de la cabeza, con los codos hacia fuera y flexionados unos 90 grados. Esta es la posición inicial."
    - "Manteniendo una técnica estricta, sin impulso de piernas ni inclinarte hacia atrás, extiende los codos para subir las mancuernas juntas directamente sobre la cabeza."
    - "Haz una pausa y devuelve despacio el peso a la posición inicial."
Standing_Dumbbell_Reverse_Curl:
  name: "Curl inverso con mancuernas de pie"
  instructions:
    - "Para empezar, colócate de pie, erguido, con una mancuerna en cada mano con agarre prono (palmas hacia abajo). Los brazos deben estar totalmente extendidos y los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Manteniendo inmóvil la parte superior de los brazos, haz el curl con los pesos contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y las mancuernas estén a la altura de los hombros. Mantén la contracción un segundo mientras aprietas el músculo."
    - "Empieza a bajar despacio las mancuernas hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Standing_Dumbbell_Straight-Arm_Front_Delt_Raise_Above_Head:
  name: "Elevación frontal con mancuernas de pie por encima de la cabeza (brazos rectos)"
  instructions:
    - "Sujeta las mancuernas delante de los muslos, con las palmas mirando hacia los muslos."
    - "Mantén los brazos rectos con una ligera flexión de codos, pero manteniéndolos fijos. Esta es la posición inicial."
    - "Eleva las mancuernas con un movimiento semicircular hasta la extensión total de los brazos sobre la cabeza mientras espiras."
    - "Vuelve despacio a la posición inicial por el mismo camino mientras inspiras."
    - "Repite el número de repeticiones indicado."
Standing_Dumbbell_Triceps_Extension:
  name: "Extensión de tríceps con mancuerna de pie"
  instructions:
    - "Para empezar, colócate de pie sujetando una mancuerna con ambas manos. Los pies deben estar separados aproximadamente a la anchura de los hombros. Usa despacio ambas manos para agarrar la mancuerna y levántala sobre la cabeza hasta que ambos brazos queden totalmente extendidos."
    - "La resistencia debe descansar en las palmas de las manos con los pulgares rodeándola. Las palmas de las manos deben mirar hacia el techo. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos cerca de la cabeza, con los codos hacia dentro y perpendiculares al suelo, baja la resistencia con un movimiento semicircular por detrás de la cabeza hasta que los antebrazos toquen los bíceps. Consejo: la parte superior de los brazos debe permanecer inmóvil y solo deben moverse los antebrazos. Inspira mientras realizas este paso."
    - "Vuelve a la posición inicial usando los tríceps para subir la mancuerna. Espira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
Standing_Dumbbell_Upright_Row:
  name: "Remo al mentón con mancuernas de pie"
  instructions:
    - "Agarra una mancuerna en cada mano con un agarre prono (palmas hacia delante) ligeramente más estrecho que la anchura de los hombros. Las mancuernas deben descansar sobre la parte superior de los muslos. Los brazos deben estar extendidos con una ligera flexión de codos y la espalda recta. Esta es la posición inicial."
    - "Usa la parte lateral de los hombros para subir las mancuernas mientras espiras. Las mancuernas deben ir cerca del cuerpo al subir y los codos deben dirigir el movimiento. Continúa subiéndolas hasta que casi toquen la barbilla. Consejo: los codos deben dirigir el movimiento. Al subir las mancuernas, los codos deben estar siempre más altos que los antebrazos. Además, mantén el torso inmóvil y haz una pausa de un segundo en la parte alta del movimiento."
    - "Baja despacio las mancuernas hasta la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Standing_Elevated_Quad_Stretch:
  name: "Estiramiento de cuádriceps de pie con pie elevado"
  instructions:
    - "Empieza de pie, de espaldas, a unos 60-90 cm de distancia de un banco o escalón."
    - "Levanta una pierna hacia atrás y apoya el pie en el escalón, ya sea sobre el empeine o sobre la parte delantera del pie, lo que te resulte más cómodo."
    - "Mantén la rodilla de apoyo ligeramente flexionada y evita que esa rodilla sobrepase la punta de los pies. Cambia de lado."
Standing_Front_Barbell_Raise_Over_Head:
  name: "Elevación frontal con barra de pie por encima de la cabeza"
  instructions:
    - "Para empezar, colócate de pie, erguido, con una barra en las manos. Debes agarrar la barra con las palmas hacia abajo y con un agarre más estrecho que la anchura de los hombros."
    - "Los pies deben estar separados a la anchura de los hombros. Los codos deben estar ligeramente flexionados. Esta es la posición inicial."
    - "Levanta la barra hasta colocarla justo sobre la cabeza mientras espiras. Asegúrate de mantener los codos ligeramente flexionados en cada repetición."
    - "Cuando notes la contracción, empieza a bajar la barra hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Standing_Gastrocnemius_Calf_Stretch:
  name: "Estiramiento de gemelos de pie"
  instructions:
    - "Coloca el talón derecho sobre un escalón con la rodilla extendida e inclínate hacia delante para agarrar la punta del pie derecho con la mano derecha. La rodilla izquierda debe estar ligeramente flexionada y la espalda recta."
    - "Apoya el peso en la pierna izquierda y coloca la mano izquierda sobre el muslo izquierdo."
    - "Tira de los dedos del pie derecho hacia la rodilla hasta notar un estiramiento en el gemelo."
Standing_Hamstring_and_Calf_Stretch:
  name: "Estiramiento de isquiotibiales y gemelos de pie"
  instructions:
    - "Empieza pasando un cinturón, una goma o una cuerda alrededor de un pie. De pie, coloca ese pie hacia delante."
    - "Flexiona la pierna trasera mientras mantienes recta la delantera. Ahora levanta del suelo los dedos del pie delantero e inclínate hacia delante."
    - "Con el cinturón, tira de la parte superior del pie para aumentar el estiramiento en el gemelo. Mantén de 10 a 20 segundos y repite con el otro pie."
Standing_Hip_Circles:
  name: "Círculos de cadera de pie"
  instructions:
    - "Empieza de pie sobre una pierna, agarrado a un apoyo vertical."
    - "Eleva la rodilla de la pierna libre a 90 grados. Esta es la posición inicial."
    - "Abre la cadera todo lo posible, intentando dibujar un círculo grande con la rodilla."
    - "Realiza este movimiento despacio durante varias repeticiones y repite del otro lado."
Standing_Hip_Flexors:
  name: "Estiramiento de flexores de cadera de pie"
  instructions:
    - "Colócate de pie, erguido con la columna vertical, con el pie izquierdo ligeramente por delante del derecho."
    - "Flexiona ambas rodillas y levanta el talón trasero del suelo mientras empujas la cadera derecha hacia delante. Sin embargo, en esta posición no se consigue un estiramiento profundo y completo, porque es difícil relajar el flexor de la cadera y apoyarse sobre él al mismo tiempo. Cambia de lado."
Standing_Inner-Biceps_Curl:
  name: "Curl de bíceps interno de pie"
  instructions:
    - "Colócate de pie con una mancuerna en cada mano, sujetas con los brazos extendidos. Los codos deben estar cerca del torso. Las piernas deben estar separadas aproximadamente a la anchura de los hombros."
    - "Rota las palmas de las manos para que miren hacia dentro en posición neutra. Esta es la posición inicial."
    - "Manteniendo inmóvil la parte superior de los brazos, haz el curl con los pesos hacia fuera contrayendo los bíceps mientras espiras. La muñeca debe girar de modo que, cuando los pesos estén totalmente elevados, tengas un agarre supino (palmas hacia arriba)."
    - "Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y las mancuernas estén a la altura de los hombros. Consejo: mantén los antebrazos alineados con los deltoides externos."
    - "Mantén la contracción un segundo mientras aprietas los bíceps."
    - "Empieza a bajar despacio las mancuernas hasta la posición inicial mientras inspiras. Recuerda rotar las muñecas al bajar el peso para volver al agarre neutro."
    - "Repite el número de repeticiones indicado."
Standing_Lateral_Stretch:
  name: "Estiramiento lateral de pie"
  instructions:
    - "Adopta una posición ligeramente más ancha que la anchura de las caderas con las rodillas ligeramente flexionadas."
    - "Coloca la mano derecha en la cadera derecha para apoyar la columna."
    - "Eleva el brazo izquierdo en línea vertical y coloca la mano izquierda detrás de la cabeza. Mantenla ahí mientras inclinas el torso hacia la derecha."
    - "Mantén el peso repartido por igual entre ambas piernas (no te apoyes en la cadera izquierda). Cambia de lado."
Standing_Leg_Curl:
  name: "Curl femoral de pie"
  instructions:
    - "Ajusta la palanca de la máquina a tu altura y colócate con el torso inclinado por la cintura hacia delante unos 30-45 grados (ya que una posición inclinada es más favorable para reclutar los isquiotibiales), con la almohadilla de la palanca en la parte posterior de la pierna derecha (unos centímetros por debajo de los gemelos) y la parte delantera de la pierna derecha sobre la almohadilla de la máquina."
    - "Manteniendo el torso inclinado hacia delante, asegúrate de que la pierna esté totalmente estirada y agarra las asas laterales de la máquina. Coloca los dedos de los pies rectos. Esta es la posición inicial."
    - "Mientras espiras, flexiona la pierna derecha hacia arriba todo lo posible sin levantar el muslo de la almohadilla. Una vez alcanzada la posición de contracción total, mantenla un segundo."
    - "Mientras inspiras, devuelve las piernas a la posición inicial. Repite el número de repeticiones indicado."
    - "Realiza ahora el mismo ejercicio con la pierna izquierda."
Standing_Long_Jump:
  name: "Salto de longitud a pies juntos"
  instructions:
    - "Este ejercicio se hace mejor sobre arena u otra superficie de aterrizaje blanda. Asegúrate de poder medir la distancia. Colócate en una posición de sentadilla parcial con los pies a la anchura de los hombros."
    - "Usando un gran balanceo de brazos y un contramovimiento de las piernas, salta hacia delante lo más lejos que puedas."
    - "Intenta aterrizar con los pies por delante de ti, alcanzando lo más lejos posible con las piernas."
    - "Mide la distancia desde el punto de aterrizaje hasta el punto de partida y registra los resultados."
Standing_Low-Pulley_Deltoid_Raise:
  name: "Elevación de deltoides en polea baja de pie"
  instructions:
    - "Empieza colocándote a la derecha de una polea baja de remo. Usa la mano izquierda para cruzar el cuerpo y agarrar una asa individual enganchada a la polea baja con un agarre prono (palmas hacia abajo). Deja el brazo apoyado delante de ti. La mano derecha debe agarrarse a la máquina para tener más apoyo y equilibrio."
    - "Asegúrate de que la espalda esté erguida y los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Empieza a usar la mano izquierda para cruzar el cuerpo hacia fuera hasta que quede elevada a la altura del hombro mientras espiras."
    - "Siente la contracción arriba durante un segundo y empieza a bajar despacio el asa hasta la posición inicial original mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo y repite el ejercicio."
Standing_Low-Pulley_One-Arm_Triceps_Extension:
  name: "Extensión de tríceps a un brazo en polea baja de pie"
  instructions:
    - "Agarra una asa individual con el brazo izquierdo junto a la polea baja. Gírate de espaldas a la máquina manteniendo el asa a un lado del cuerpo con el brazo totalmente extendido. Ahora usa ambas manos para elevar el asa directamente sobre la cabeza con la palma mirando hacia delante. Mantén la parte superior del brazo completamente vertical (perpendicular al suelo) y coloca la mano derecha en el codo izquierdo para ayudar a mantenerlo estable. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos cerca de la cabeza (codos hacia dentro) y perpendicular al suelo, baja la resistencia con un movimiento semicircular por detrás de la cabeza hasta que los antebrazos toquen los bíceps. Consejo: la parte superior de los brazos debe permanecer inmóvil y solo deben moverse los antebrazos. Inspira mientras realizas este paso."
    - "Vuelve a la posición inicial usando los tríceps para subir el asa individual. Espira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo y repite el ejercicio."
Standing_Military_Press:
  name: "Press militar de pie"
  instructions:
    - "Empieza colocando una barra a la altura aproximada del pecho en una jaula de sentadillas. Una vez seleccionados los pesos, agarra la barra con un agarre prono (palmas hacia delante). Asegúrate de agarrar la barra con un agarre más ancho que la anchura de los hombros."
    - "Flexiona ligeramente las rodillas y coloca la barra sobre la clavícula. Levanta la barra manteniéndola apoyada en el pecho. Da un paso atrás y coloca los pies a la anchura de los hombros."
    - "Una vez que cojas la barra con la anchura de agarre correcta, sube la barra por encima de la cabeza bloqueando los brazos. Mantén la barra aproximadamente a la altura de los hombros y ligeramente por delante de la cabeza. Esta es la posición inicial."
    - "Baja despacio la barra hasta la clavícula mientras inspiras."
    - "Sube la barra de nuevo hasta la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Standing_Olympic_Plate_Hand_Squeeze:
  name: "Apretón de disco olímpico con las manos de pie"
  instructions:
    - "Para empezar, colócate de pie, erguido, sujetando un disco por el borde con el brazo extendido en cada mano con agarre neutro (palmas mirando hacia dentro). Los pies deben estar separados a la anchura de los hombros. Esta es la posición inicial."
    - "Baja los discos hasta que los dedos estén casi extendidos pero todavía puedan sujetar el peso. Inspira mientras bajas los discos."
    - "Ahora sube los discos de nuevo hasta la posición inicial mientras espiras cerrando las manos."
    - "Repite el número de repeticiones indicado en tu programa."
Standing_One-Arm_Cable_Curl:
  name: "Curl en polea a un brazo de pie"
  instructions:
    - "Empieza agarrando un asa individual junto a la polea baja. Asegúrate de estar lo bastante lejos de la máquina para que tu brazo soporte el peso."
    - "Asegúrate de que la parte superior del brazo esté inmóvil, perpendicular al suelo, con el codo hacia dentro y la palma hacia delante. El brazo que no trabaja debe agarrarte la cintura. Esto te permitirá mantener el equilibrio."
    - "Empieza a subir despacio el asa individual haciendo el curl mientras mantienes inmóvil la parte superior del brazo hasta que el antebrazo toque el bíceps mientras espiras. Consejo: solo debe moverse el antebrazo."
    - "Mantén la posición de contracción mientras aprietas el bíceps y luego baja el asa individual hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo mientras realizas este ejercicio."
Standing_One-Arm_Dumbbell_Curl_Over_Incline_Bench:
  name: "Curl con mancuerna a un brazo de pie sobre banco inclinado"
  instructions:
    - "Colócate en la parte trasera de un banco inclinado, como si fueras a hacer de ayudante de alguien. Ten una mancuerna en una mano y apóyala sobre el banco inclinado con un agarre supino (palma hacia arriba)."
    - "Coloca la mano que no trabaja en la esquina o el lateral del banco inclinado. El pecho debe estar pegado a la parte superior del banco y los pies bien apoyados en el suelo con las piernas abiertas. Esta es la posición inicial."
    - "Manteniendo inmóvil la parte superior del brazo, haz el curl con la mancuerna hacia arriba contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Continúa el movimiento hasta que los bíceps estén totalmente contraídos y la mancuerna esté a la altura del hombro. Mantén la contracción un segundo."
    - "Empieza a bajar despacio la mancuerna hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo mientras realizas este ejercicio."
Standing_One-Arm_Dumbbell_Triceps_Extension:
  name: "Extensión de tríceps con mancuerna a un brazo de pie"
  instructions:
    - "Para empezar, colócate de pie con una mancuerna sujeta en una mano. Los pies deben estar separados aproximadamente a la anchura de los hombros. Ahora extiende por completo el brazo con la mancuerna sobre la cabeza. Consejo: el dedo meñique de la mano debe mirar hacia el techo y la palma de la mano debe mirar hacia delante. La mancuerna debe quedar sobre la cabeza."
    - "Esta es la posición inicial."
    - "Manteniendo la parte superior del brazo cerca de la cabeza (codo hacia dentro) y perpendicular al suelo, baja la resistencia con un movimiento semicircular por detrás de la cabeza hasta que el antebrazo toque el bíceps. Consejo: la parte superior del brazo debe permanecer inmóvil y solo debe moverse el antebrazo. Inspira mientras realizas este paso."
    - "Vuelve a la posición inicial usando el tríceps para subir la mancuerna. Espira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo y repite el ejercicio."
Standing_Overhead_Barbell_Triceps_Extension:
  name: "Press francés con barra de pie"
  instructions:
    - "Para empezar, colócate de pie sujetando una barra recta o una barra Z con un agarre prono (palmas hacia delante) con las manos más juntas que la anchura de los hombros. Los pies deben estar separados aproximadamente a la anchura de los hombros."
    - "Ahora eleva la barra sobre la cabeza hasta que los brazos queden totalmente extendidos. Mantén los codos hacia dentro. Esta es la posición inicial."
    - "Manteniendo la parte superior de los brazos cerca de la cabeza y los codos hacia dentro, perpendiculares al suelo, baja la resistencia con un movimiento semicircular por detrás de la cabeza hasta que los antebrazos toquen los bíceps. Consejo: la parte superior de los brazos debe permanecer inmóvil y solo deben moverse los antebrazos. Inspira mientras realizas este paso."
    - "Vuelve a la posición inicial usando los tríceps para subir la barra. Espira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
Standing_Palm-In_One-Arm_Dumbbell_Press:
  name: "Press con mancuerna a un brazo de pie (agarre neutro)"
  instructions:
    - "Empieza con una mancuerna en una mano y el brazo totalmente extendido hacia un lado con un agarre neutro. Usa el otro brazo para agarrarte a un banco inclinado y mantener el equilibrio."
    - "Los pies deben estar separados a la anchura de los hombros. Ahora levanta despacio la mancuerna hasta formar un ángulo de 90 grados con el brazo. Nota: el antebrazo debe quedar perpendicular al suelo. Continúa manteniendo un agarre neutro durante todo el ejercicio."
    - "Levanta despacio la mancuerna hasta que el brazo quede totalmente extendido. Esta es la posición inicial."
    - "Mientras inspiras, baja el peso hasta que el brazo vuelva a formar un ángulo de 90 grados."
    - "Siente la contracción un segundo y luego sube el peso de nuevo hacia la posición inicial mientras espiras. Recuerda agarrarte al banco inclinado y colocar los pies para mantener el equilibrio durante el ejercicio."
    - "Repite el número de repeticiones indicado."
    - "Cambia de brazo y repite el ejercicio."
Standing_Palms-In_Dumbbell_Press:
  name: "Press de hombros con mancuernas de pie (agarre neutro)"
  instructions:
    - "Empieza con una mancuerna en cada mano y los brazos totalmente extendidos hacia los lados con agarre neutro. Los pies, separados a la anchura de los hombros. Ahora sube lentamente las mancuernas hasta formar un ángulo de 90 grados con los brazos. Nota: los antebrazos deben quedar perpendiculares al suelo. Esta es la posición inicial."
    - "Mantén el agarre neutro durante todo el ejercicio. Sube lentamente las mancuernas hasta que los brazos queden totalmente extendidos."
    - "Mientras inspiras, baja las pesas hasta que los brazos formen de nuevo un ángulo de 90 grados."
    - "Repite el número de repeticiones indicado."
Standing_Palms-Up_Barbell_Behind_The_Back_Wrist_Curl:
  name: "Curl de muñeca con barra detrás de la espalda de pie"
  instructions:
    - "Empieza de pie, con la espalda recta, sujetando una barra detrás de los glúteos con los brazos extendidos, con agarre prono (las palmas miran hacia atrás, alejándose de los glúteos) y las manos separadas a la anchura de los hombros."
    - "Mira al frente con los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Mientras espiras, eleva lentamente la barra flexionando las muñecas en un movimiento semicircular hacia el techo. Nota: las muñecas deben ser la única parte del cuerpo que se mueva en este ejercicio."
    - "Mantén la contracción un segundo y baja la barra de nuevo a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "Al terminar, baja la barra al rack de sentadillas o al suelo flexionando las rodillas. Consejo: lo más fácil es cogerla de un rack de sentadillas o que un compañero te la pase."
Standing_Pelvic_Tilt:
  name: "Inclinación pélvica de pie"
  instructions:
    - "Empieza con los pies separados a la anchura de las caderas."
    - "Flexiona ligeramente las rodillas para mantenerlas sueltas y elásticas."
    - "Puede que te convenga mover la pelvis hacia delante y hacia atrás varias veces antes de mantener el coxis hacia delante en este estiramiento."
Standing_Rope_Crunch:
  name: "Encogimiento abdominal con cuerda de pie"
  instructions:
    - "Coloca una cuerda en una polea alta y selecciona un peso adecuado."
    - "Colócate de espaldas a la torre de poleas. Coge la cuerda con ambas manos por encima de los hombros, sujetándola a la altura de la parte alta del pecho. Esta es la posición inicial."
    - "Realiza el movimiento flexionando la columna y llevando el peso hacia abajo todo lo que puedas."
    - "Mantén la contracción máxima un instante antes de volver a la posición inicial."
Standing_Soleus_And_Achilles_Stretch:
  name: "Estiramiento de sóleo y tendón de Aquiles de pie"
  instructions:
    - "Colócate de pie con los pies separados a la anchura de las caderas y un pie ligeramente adelantado respecto al otro."
    - "Flexiona ambas rodillas manteniendo el talón de atrás en el suelo. Cambia de lado."
Standing_Toe_Touches:
  name: "Tocar la punta de los pies de pie"
  instructions:
    - "Colócate de pie con algo de espacio delante y detrás de ti."
    - "Inclínate por la cintura, manteniendo las piernas rectas, hasta poder relajarte y dejar el tronco colgando hacia delante. Deja que los brazos y las manos cuelguen de forma natural. Mantén de 10 a 20 segundos."
Standing_Towel_Triceps_Extension:
  name: "Extensión de tríceps con toalla de pie"
  instructions:
    - "Para empezar, ponte de pie con ambos brazos totalmente extendidos por encima de la cabeza, sujetando un extremo de una toalla con las dos manos. Los codos deben estar hacia dentro y los brazos perpendiculares al suelo, con las palmas enfrentadas, y los pies separados a la anchura de los hombros. Esta es la posición inicial."
    - "Ahora avisa a tu compañero para que sujete el otro extremo de la toalla y aplique resistencia. Manteniendo los brazos pegados a la cabeza (codos hacia dentro) y perpendiculares al suelo, baja la resistencia con un movimiento semicircular por detrás de la cabeza hasta que los antebrazos toquen los bíceps. Consejo: la parte superior del brazo debe permanecer quieta y solo deben moverse los antebrazos. Inspira mientras realizas este paso."
    - "Vuelve a la posición inicial usando los tríceps para subir la toalla. Espira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
Standing_Two-Arm_Overhead_Throw:
  name: "Lanzamiento por encima de la cabeza a dos brazos de pie"
  instructions:
    - "Colócate de pie con los pies separados a la anchura de los hombros, sujetando un balón medicinal con ambas manos. Para empezar, lleva el balón profundamente por detrás de la cabeza mientras flexionas ligeramente las rodillas y te inclinas hacia atrás."
    - "Lanza el balón hacia delante con fuerza, flexionando la cadera y usando todo el cuerpo para completar el movimiento."
    - "El balón medicinal se puede lanzar a un compañero o a una pared, recibiéndolo cuando rebote."
Star_Jump:
  name: "Salto de estrella"
  instructions:
    - "Empieza en una postura relajada con los pies separados a la anchura de los hombros y los brazos pegados al cuerpo."
    - "Para iniciar el movimiento, baja en sentadilla hasta la mitad y salta de forma explosiva lo más alto posible. Extiende todo el cuerpo, separando piernas y brazos del cuerpo."
    - "Al aterrizar, junta de nuevo las extremidades y amortigua el impacto con las piernas."
Step-up_with_Knee_Raise:
  name: "Subida al cajón con elevación de rodilla"
  instructions:
    - "Colócate de frente a un cajón o banco de altura adecuada con los pies juntos. Esta es la posición inicial."
    - "Inicia el movimiento subiendo y apoyando el pie izquierdo en la parte superior del banco. Extiende la cadera y la rodilla de la pierna delantera para ponerte de pie sobre el cajón. Al estar sobre el cajón con la pierna izquierda, flexiona la rodilla y la cadera derechas, llevando la rodilla lo más alto que puedas."
    - "Invierte el movimiento para bajar del cajón y repite la secuencia con la otra pierna."
Step_Mill:
  name: "Máquina de escaleras"
  instructions:
    - "Para empezar, sube a la máquina de escaleras y selecciona la opción deseada en el menú. Puedes elegir un ajuste manual o un programa. Normalmente puedes introducir tu edad y peso para estimar las calorías quemadas durante el ejercicio. Ten cuidado para no tropezar al subir los escalones. Se recomienda mantener las manos agarradas a los asideros para no caerte."
    - "Las máquinas de escaleras ofrecen comodidad y beneficios cardiovasculares, y suelen tener menos impacto que correr al aire libre con un gasto calórico similar. Normalmente son mucho más duras que otros aparatos de cardio. Una persona de unos 68 kg suele quemar más de 300 calorías en 30 minutos, frente a unas 175 calorías caminando."
Stiff-Legged_Barbell_Deadlift:
  name: "Peso muerto con piernas rígidas con barra"
  instructions:
    - "Agarra una barra con agarre prono (palmas hacia abajo). Puede que necesites muñequeras si usas mucho peso."
    - "Colócate de pie con el tronco recto y las piernas separadas a la anchura de los hombros o menos. Las rodillas deben estar ligeramente flexionadas. Esta es la posición inicial."
    - "Manteniendo las rodillas quietas, baja la barra por encima de los pies flexionando la cadera y manteniendo la espalda recta. Sigue avanzando como si fueras a recoger algo del suelo hasta notar un estiramiento en los isquiotibiales. Inspira mientras realizas este movimiento."
    - "Empieza a subir de nuevo el tronco hasta quedar recto extendiendo la cadera, hasta volver a la posición inicial. Espira mientras realizas este movimiento."
    - "Repite el número de repeticiones indicado."
Stiff-Legged_Dumbbell_Deadlift:
  name: "Peso muerto con piernas rígidas con mancuernas"
  instructions:
    - "Coge un par de mancuernas y sujétalas a los lados con los brazos extendidos."
    - "Colócate de pie con el tronco recto y las piernas separadas a la anchura de los hombros o menos. Las rodillas deben estar ligeramente flexionadas. Esta es la posición inicial."
    - "Manteniendo las rodillas quietas, baja las mancuernas por encima de los pies flexionando la cintura y manteniendo la espalda recta. Sigue avanzando como si fueras a recoger algo del suelo hasta notar un estiramiento en los isquiotibiales. Espira mientras realizas este movimiento."
    - "Empieza a subir de nuevo el tronco hasta quedar recto extendiendo la cadera y la cintura, hasta volver a la posición inicial. Inspira mientras realizas este movimiento."
    - "Repite el número de repeticiones indicado."
Stiff_Leg_Barbell_Good_Morning:
  name: "Buenos días con barra y piernas rígidas"
  instructions:
    - "Este ejercicio es mejor realizarlo dentro de un rack de sentadillas por seguridad. Para empezar, coloca la barra en un rack que se ajuste a tu altura. Una vez elegida la altura correcta y cargada la barra, métete debajo de ella y apóyala sobre la parte posterior de los hombros (ligeramente por debajo del cuello)."
    - "Sujeta la barra con ambos brazos a cada lado y sácala del rack empujando primero con las piernas y enderezando a la vez el tronco."
    - "Aléjate del rack y coloca las piernas con una postura media, a la anchura de los hombros. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te desequilibrará, y mantén también la espalda recta. Esta es la posición inicial."
    - "Manteniendo las piernas quietas, inclina el tronco hacia delante flexionando la cadera mientras inspiras. Baja el tronco hasta que quede paralelo al suelo."
    - "Empieza a subir la barra mientras espiras, elevando el tronco hasta la posición inicial."
    - "Repite el número de repeticiones indicado."
Stomach_Vacuum:
  name: "Vacío abdominal"
  instructions:
    - "Para empezar, ponte de pie con los pies separados a la anchura de los hombros. Coloca las manos en las caderas. Esta es la posición inicial."
    - "Ahora inspira lentamente todo el aire que puedas y luego empieza a espirar todo lo posible mientras metes el estómago al máximo y mantén esta posición. Intenta visualizar el ombligo tocando la columna."
    - "Una contracción isométrica dura unos 20 segundos. Durante esos 20 segundos, intenta respirar con normalidad. Después inspira y devuelve el estómago a la posición inicial."
    - "Una vez que hayas practicado este ejercicio, intenta realizarlo durante más de 20 segundos. Consejo: puedes ir progresando hasta 40-60 segundos."
    - "Repite el número de series indicado."
Straight-Arm_Dumbbell_Pullover:
  name: "Pullover con mancuerna y brazos rectos"
  instructions:
    - "Coloca una mancuerna en vertical sobre un banco plano."
    - "Asegurándote de que la mancuerna se mantiene bien colocada en el extremo del banco, túmbate perpendicularmente al banco (con el tronco atravesado, formando una cruz) con solo los hombros apoyados en la superficie. La cadera debe quedar por debajo del banco y las piernas flexionadas con los pies firmes en el suelo. La cabeza también quedará fuera del banco."
    - "Agarra la mancuerna con ambas manos y mantenla recta sobre el pecho con los brazos extendidos. Ambas palmas deben presionar la parte inferior de uno de los lados de la mancuerna. Esta es la posición inicial.

      Precaución: asegúrate siempre de que la mancuerna que uses esté bien sujeta. Usar una mancuerna con discos sueltos puede provocar que se desmonte y caiga sobre tu cara."
    - "Manteniendo los brazos rectos, baja el peso lentamente en arco por detrás de la cabeza mientras inspiras hasta notar un estiramiento en el pecho."
    - "En ese punto, devuelve la mancuerna a la posición inicial describiendo el mismo arco con el que la bajaste y espira mientras realizas este movimiento."
    - "Mantén el peso en la posición inicial durante un segundo y repite el movimiento el número de repeticiones prescrito."
Straight-Arm_Pulldown:
  name: "Jalón con brazos rectos"
  instructions:
    - "Empieza agarrando la barra ancha de la polea alta de una máquina de jalón con agarre prono (palmas hacia abajo) más ancho que los hombros. Da dos pasos hacia atrás aproximadamente."
    - "Inclina el tronco hacia delante por la cintura unos 30 grados con los brazos totalmente extendidos frente a ti y una ligera flexión en los codos. Si los brazos no están totalmente extendidos, tienes que retroceder un poco más hasta que lo estén. Una vez que los brazos estén totalmente extendidos y el tronco ligeramente inclinado por la cintura, aprieta los dorsales y estarás listo para empezar."
    - "Manteniendo los brazos rectos, baja la barra contrayendo los dorsales hasta que las manos queden junto a los muslos. Espira mientras realizas este paso."
    - "Manteniendo los brazos rectos, vuelve a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Straight_Bar_Bench_Mid_Rows:
  name: "Remo con barra apoyada en banco (agarre medio)"
  instructions:
    - "Coloca una barra cargada en el extremo de un banco. De pie sobre el banco, detrás de la barra, adopta un agarre prono medio. Mantén la cadera atrás y el pecho alto, con la columna neutra. Esta es la posición inicial."
    - "Lleva la barra hacia el tronco retrayendo las escápulas y flexionando los codos. Realiza un movimiento controlado, sin tirones."
    - "Tras una breve pausa, devuelve lentamente la barra a la posición inicial, asegurándote de bajar del todo."
Straight_Raises_on_Incline_Bench:
  name: "Elevaciones rectas en banco inclinado"
  instructions:
    - "Coloca una barra en el suelo, detrás de la cabecera de un banco inclinado."
    - "Túmbate boca abajo en el banco. Con agarre prono, coge la barra del suelo manteniendo los brazos rectos. Deja que la barra cuelgue hacia abajo. Esta es la posición inicial."
    - "Para empezar, eleva la barra hacia delante de la cabeza manteniendo los brazos extendidos."
    - "Vuelve a la posición inicial."
Stride_Jump_Crossover:
  name: "Salto cruzado sobre cajón"
  instructions:
    - "Colócate al lado de un cajón con el pie interior encima de él, cerca del borde."
    - "Empieza balanceando los brazos hacia arriba mientras empujas con la pierna de arriba, saltando lo más alto posible. Intenta subir con fuerza la rodilla contraria."
    - "Aterriza en la posición opuesta a la de partida, en el lado contrario del cajón. El pie que estaba inicialmente en el cajón estará ahora en el suelo y el otro pie estará en el cajón."
    - "Repite el movimiento, cruzando de nuevo al otro lado."
Sumo_Deadlift:
  name: "Peso muerto sumo"
  instructions:
    - "Empieza con una barra cargada en el suelo. Acércate a ella de modo que la barra quede sobre la mitad de los pies. Los pies deben estar muy separados, cerca de los topes de los discos. Flexiona la cadera para agarrar la barra. Los brazos deben quedar justo debajo de los hombros, por dentro de las piernas, y puedes usar agarre prono, agarre mixto o agarre de gancho. Relaja los hombros, lo que en la práctica alarga tus brazos."
    - "Toma aire y baja la cadera, mirando al frente con la cabeza y con el pecho alto. Empuja contra el suelo, separando los pies, con el peso en la mitad trasera de los pies. Extiende la cadera y las rodillas."
    - "Cuando la barra pase por las rodillas, inclínate hacia atrás y lleva la cadera hacia la barra, juntando las escápulas."
    - "Devuelve el peso al suelo flexionando la cadera y controlando el peso durante el descenso."
Sumo_Deadlift_with_Bands:
  name: "Peso muerto sumo con gomas elásticas"
  instructions:
    - "Para hacer peso muerto con gomas cortas, simplemente pásalas por la barra antes de empezar y métete dentro de ellas para colocarte. Asegúrate de que queden bajo la mitad trasera del pie, justo donde empujas contra el suelo."
    - "Empieza con una barra cargada en el suelo. Acércate a ella de modo que la barra quede sobre la mitad de los pies. Los pies deben estar muy separados, cerca de los topes de los discos. Flexiona la cadera para agarrar la barra. Los brazos deben quedar justo debajo de los hombros, por dentro de las piernas, y puedes usar agarre prono, agarre mixto o agarre de gancho."
    - "Toma aire y baja la cadera, mirando al frente con la cabeza y con el pecho alto. Empuja contra el suelo, separando los pies, con el peso en la mitad trasera de los pies. Extiende la cadera y las rodillas."
    - "Cuando la barra pase por las rodillas, inclínate hacia atrás y lleva la cadera hacia la barra, juntando las escápulas."
    - "Devuelve el peso al suelo flexionando la cadera y controlando el peso durante el descenso."
Superman:
  name: "Superman"
  instructions:
    - "Para empezar, túmbate boca abajo en el suelo o en una esterilla, con el cuerpo recto. Los brazos deben estar totalmente extendidos frente a ti. Esta es la posición inicial."
    - "Eleva a la vez los brazos, las piernas y el pecho del suelo y mantén esta contracción durante 2 segundos. Consejo: aprieta la zona lumbar para sacar el máximo partido a este ejercicio. Recuerda espirar durante este movimiento. Nota: al mantener la posición contraída, debes parecerte a Superman cuando vuela."
    - "Empieza a bajar lentamente los brazos, las piernas y el pecho hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones prescrito en tu programa."
Supine_Chest_Throw:
  name: "Lanzamiento de pecho tumbado"
  instructions:
    - "Este ejercicio es ideal para pases de pecho cuando no tienes compañero o una pared lo bastante resistente. Túmbate en el suelo boca arriba con las rodillas flexionadas."
    - "Empieza con el balón sobre el pecho, sujeto con ambas manos por la parte inferior."
    - "Sube de forma explosiva, extendiendo los codos para lanzar el balón directamente hacia arriba lo más alto posible."
    - "Atrapa el balón con ambas manos cuando baje."
Supine_One-Arm_Overhead_Throw:
  name: "Lanzamiento por encima de la cabeza a un brazo tumbado"
  instructions:
    - "Túmbate en el suelo boca arriba con las rodillas flexionadas. Sujeta el balón con una mano, con el brazo totalmente extendido por detrás de la cabeza. Esta es la posición inicial."
    - "Inicia el movimiento desde el hombro, lanzando el balón directamente hacia delante mientras te incorporas, intentando conseguir la máxima distancia."
    - "El balón se puede lanzar a un compañero o hacerlo rebotar contra una pared."
Supine_Two-Arm_Overhead_Throw:
  name: "Lanzamiento por encima de la cabeza a dos brazos tumbado"
  instructions:
    - "Túmbate en el suelo boca arriba con las rodillas flexionadas."
    - "Sujeta el balón con ambas manos, con los brazos totalmente extendidos por detrás de la cabeza. Esta es la posición inicial."
    - "Inicia el movimiento desde el hombro, lanzando el balón directamente hacia delante mientras te incorporas, intentando conseguir la máxima distancia."
    - "El balón se puede lanzar a un compañero o hacerlo rebotar contra una pared."
Suspended_Fallout:
  name: "Fallout con suspensión"
  instructions:
    - "Ajusta las correas para que las asas queden a una altura adecuada, por debajo de la cintura."
    - "Empieza de pie sujetando las asas. Inclínate sobre las correas, pasando a una posición de flexión inclinada. Esta es la posición inicial."
    - "Manteniendo los brazos rectos, inclínate aún más sobre las correas de suspensión, acercando el cuerpo al suelo y permitiendo que los hombros se extiendan, subiendo los brazos por encima de la cabeza."
    - "Mantén la columna neutra y el resto del cuerpo recto; los hombros deben ser las únicas articulaciones que se muevan."
    - "Haz una pausa en la contracción máxima y vuelve a la posición inicial."
Suspended_Push-Up:
  name: "Flexión con suspensión"
  instructions:
    - "Ancla las correas de suspensión firmemente a la parte superior de un rack u otro objeto."
    - "Inclinándote sobre las correas, coge un asa con cada mano y colócate en posición de plancha de flexión. Debes estar lo más paralelo al suelo que puedas, con los brazos totalmente extendidos y manteniendo una buena postura."
    - "Manteniendo el tronco recto y rígido, desciende lentamente flexionando los codos."
    - "Continúa hasta que los codos superen los 90 grados, haciendo una pausa antes de extender para volver a la posición inicial."
Suspended_Reverse_Crunch:
  name: "Encogimiento abdominal inverso con suspensión"
  instructions:
    - "Fija unas correas de suspensión con las asas colgando a unos 30 cm del suelo. Colócate en posición de plancha de flexión mirando en dirección contraria al rack."
    - "Coloca los pies en las asas. Mantén una postura recta, sin dejar que la cadera se hunda. Esta es la posición inicial."
    - "Inicia el movimiento flexionando las rodillas y las caderas, llevando las rodillas hacia el tronco. Al hacerlo, inclina la pelvis hacia delante (anteversión), permitiendo que la columna se flexione."
    - "En el punto más alto del movimiento controlado, vuelve a la posición inicial."
Suspended_Row:
  name: "Remo con suspensión"
  instructions:
    - "Suspende las correas a la altura del pecho aproximadamente. Coge un asa con cada mano e inclínate hacia atrás. Mantén el cuerpo erguido y la cabeza y el pecho altos. Los brazos deben estar totalmente extendidos. Esta es la posición inicial."
    - "Empieza flexionando los codos para iniciar el movimiento. Protrae las escápulas mientras lo haces."
    - "Al completar el movimiento, haz una pausa y vuelve a la posición inicial."
Suspended_Split_Squat:
  name: "Sentadilla dividida con suspensión"
  instructions:
    - "Suspende las correas de modo que las asas queden a 45-75 cm del suelo."
    - "De espaldas al montaje, coloca el pie trasero en el asa que tienes detrás. Mantén la cabeza mirando al frente y el pecho alto, con la rodilla ligeramente flexionada. Esta es la posición inicial."
    - "Desciende flexionando la rodilla y la cadera, bajando hacia el suelo. Mantén el peso sobre el talón del pie y conserva la postura durante todo el ejercicio."
    - "En la parte baja del movimiento, invierte el movimiento, extendiendo la cadera y la rodilla para volver a la posición inicial."
Svend_Press:
  name: "Press Svend"
  instructions:
    - "Empieza de pie."
    - "Presiona dos discos ligeros uno contra otro con las manos. Mantén los discos juntos cerca del pecho para crear una contracción isométrica en los músculos pectorales. Los dedos deben apuntar hacia delante. Esta es la posición inicial."
    - "Aprieta los discos entre las palmas y extiende los brazos directamente hacia delante con un movimiento controlado."
    - "Haz una pausa en la parte alta del movimiento y vuelve lentamente a la posición inicial."
T-Bar_Row_with_Handle:
  name: "Remo en barra T con asa"
  instructions:
    - "Coloca una barra en un landmine o en una esquina para que no se mueva. Carga un peso adecuado en tu extremo."
    - "Colócate sobre la barra y coloca un asa de remo doble D alrededor de la barra, junto al tope. Usando la cadera y las piernas, ponte de pie."
    - "Adopta una postura ancha con la cadera atrás y el pecho alto. Los brazos deben estar extendidos. Esta es la posición inicial."
    - "Tira del peso hacia la parte alta del abdomen retrayendo las escápulas y flexionando los codos. No des tirones al peso ni hagas trampas durante el movimiento."
    - "Tras una breve pausa, vuelve a la posición inicial."
Tate_Press:
  name: "Press Tate"
  instructions:
    - "Túmbate en un banco plano con una mancuerna en cada mano sobre los muslos. Las palmas de las manos se miran entre sí."
    - "Usando los muslos para ayudarte a subir las mancuernas, súbelas de una en una para sostenerlas frente a ti a la anchura de los hombros. Nota: al sostener las mancuernas frente a ti, asegúrate de que los brazos estén más separados que la anchura de los hombros, con agarre prono (palmas hacia delante). Deja que los codos apunten hacia fuera. Esta es la posición inicial."
    - "Manteniendo los brazos quietos, mueve lentamente las mancuernas hacia dentro y hacia abajo en un movimiento semicircular hasta que toquen la parte alta del pecho mientras inspiras. Mantén el control total de las mancuernas en todo momento y no muevas los brazos ni apoyes las mancuernas en el pecho."
    - "Mientras espiras, sube las mancuernas usando los tríceps y el mismo movimiento semicircular pero a la inversa. Intenta mantener las mancuernas juntas mientras suben. Bloquea los brazos en la posición contraída, mantén un segundo y empieza a bajar de nuevo lentamente. Consejo: bajar debería llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito en tu programa de entrenamiento."
The_Straddle:
  name: "Estiramiento en abertura de piernas"
  instructions:
    - "Empieza sentado, con la espalda erguida. Comienza extendiendo las piernas frente a ti en forma de V."
    - "Con las manos en el suelo, inclínate hacia delante todo lo que puedas. Mantén de 10 a 20 segundos."
Thigh_Abductor:
  name: "Abductores en máquina"
  instructions:
    - "Para empezar, siéntate en la máquina de abductores y selecciona un peso con el que te sientas cómodo. Cuando las piernas estén bien colocadas, agarra las asas de cada lado. Todo el tronco (de la cintura hacia arriba) debe permanecer quieto. Esta es la posición inicial."
    - "Empuja lentamente contra la máquina con las piernas para separarlas mientras espiras."
    - "Siente la contracción durante un segundo y empieza a devolver las piernas a la posición inicial mientras inspiras. Nota: recuerda mantener el tronco quieto para evitar lesiones."
    - "Repite el número de repeticiones indicado."
Thigh_Adductor:
  name: "Aductores en máquina"
  instructions:
    - "Para empezar, siéntate en la máquina de aductores y selecciona un peso con el que te sientas cómodo. Cuando las piernas estén bien colocadas sobre las almohadillas de la máquina, agarra las asas de cada lado. Todo el tronco (de la cintura hacia arriba) debe permanecer quieto. Esta es la posición inicial."
    - "Empuja lentamente contra la máquina con las piernas para juntarlas mientras espiras."
    - "Siente la contracción durante un segundo y empieza a devolver las piernas a la posición inicial mientras inspiras. Nota: recuerda mantener el tronco quieto y evitar movimientos bruscos para evitar lesiones."
    - "Repite el número de repeticiones indicado."
Tire_Flip:
  name: "Volteo de neumático"
  instructions:
    - "Empieza agarrando la parte inferior del neumático por la banda de rodadura y echa los pies un poco hacia atrás. El pecho debe empujar contra el neumático."
    - "Para levantar el neumático, extiende la cadera, las rodillas y los tobillos, empujando contra el neumático y hacia arriba."
    - "Cuando el neumático llegue a un ángulo de 45 grados, da un paso adelante y clava una rodilla en el neumático. Al hacerlo, cambia el agarre a la parte superior del neumático y empújalo hacia delante con toda la fuerza posible para completar el giro. Repite según sea necesario."
Toe_Touchers:
  name: "Tocar la punta de los pies tumbado"
  instructions:
    - "Para empezar, túmbate en el suelo o en una esterilla con la espalda pegada al suelo. Los brazos deben estar a los lados con las palmas hacia abajo."
    - "Las piernas deben estar juntas. Eleva lentamente las piernas en el aire hasta que queden casi perpendiculares al suelo, con una ligera flexión en las rodillas. Los pies deben quedar paralelos al suelo."
    - "Mueve los brazos para que queden totalmente extendidos formando un ángulo de 45 grados con el suelo. Esta es la posición inicial."
    - "Manteniendo la zona lumbar pegada al suelo, eleva lentamente el tronco y usa las manos para intentar tocarte la punta de los pies. Recuerda espirar mientras realizas esta parte del ejercicio."
    - "Empieza a bajar lentamente el tronco y los brazos hasta la posición inicial mientras inspiras. Recuerda mantener los brazos estirados apuntando hacia la punta de los pies."
    - "Repite el número de repeticiones indicado."
Torso_Rotation:
  name: "Rotación de tronco"
  instructions:
    - "Colócate de pie, erguido, sujetando un fitball con ambas manos. Extiende los brazos de modo que el balón quede recto frente a ti. Esta es la posición inicial."
    - "Gira el tronco hacia un lado, manteniendo la vista en el balón mientras te mueves. Ahora gira de vuelta hacia el lado contrario. Repite de 10 a 20 repeticiones."
Trail_Running_Walking:
  name: "Correr o caminar por senderos"
  instructions:
    - "Correr o hacer senderismo por senderos pone la sangre en movimiento y el corazón a latir casi de inmediato. Asegúrate de llevar un buen calzado. Mientras usas los músculos de las pantorrillas y los glúteos para subir una cuesta, las rodillas, las articulaciones y los tobillos absorben la mayor parte del impacto al bajar. Da pasos más cortos al caminar cuesta abajo, mantén las rodillas flexionadas para reducir el impacto y frena para evitar caídas."
    - "Una persona de unos 68 kg puede quemar más de 200 calorías en 30 minutos caminando cuesta arriba, frente a 175 en una superficie llana. Si corre por el sendero, una persona de unos 68 kg puede quemar bastante más de 500 calorías en 30 minutos."
Trap_Bar_Deadlift:
  name: "Peso muerto con barra hexagonal"
  instructions:
    - "Para este ejercicio, carga una barra hexagonal, también conocida como barra trap, con un peso adecuado apoyada en el suelo. Colócate en el centro del aparato y agarra ambas asas."
    - "Baja la cadera, mira al frente con la cabeza y mantén el pecho alto."
    - "Inicia el movimiento empujando con los talones y extiende la cadera y las rodillas. Evita redondear la espalda en todo momento."
    - "Al completar el movimiento, baja el peso de nuevo al suelo con control."
Tricep_Dumbbell_Kickback:
  name: "Patada de tríceps con mancuerna"
  instructions:
    - "Empieza con una mancuerna en cada mano y las palmas mirando hacia el tronco. Mantén la espalda recta con una ligera flexión de rodillas e inclínate hacia delante por la cintura. El tronco debe quedar casi paralelo al suelo. Asegúrate de mantener la cabeza alta. La parte superior de los brazos debe estar cerca del tronco y paralela al suelo. Los antebrazos deben apuntar hacia el suelo mientras sujetas las pesas. Debe formarse un ángulo de 90 grados entre el antebrazo y la parte superior del brazo. Esta es la posición inicial."
    - "Ahora, manteniendo quietos los brazos, espira y usa los tríceps para subir las pesas hasta que el brazo quede totalmente extendido. Concéntrate en mover el antebrazo."
    - "Tras una breve pausa en la contracción máxima, inspira y baja lentamente las mancuernas hasta la posición inicial."
    - "Repite el movimiento el número de repeticiones prescrito."
Tricep_Side_Stretch:
  name: "Estiramiento lateral de tríceps"
  instructions:
    - "Lleva el brazo derecho cruzando el cuerpo por encima del hombro izquierdo, sujetando el codo con la mano izquierda, hasta que notes un estiramiento en el tríceps. Después repite con el otro brazo."
Triceps_Overhead_Extension_with_Rope:
  name: "Extensión de tríceps sobre la cabeza con cuerda"
  instructions:
    - "Coloca una cuerda en una polea baja. Tras seleccionar un peso adecuado, agarra la cuerda con ambas manos y colócate de espaldas a la polea."
    - "Coloca las manos detrás de la cabeza con los codos apuntando hacia arriba. Los codos deben empezar flexionados, y puedes adelantar un pie y inclinarte ligeramente alejándote de la máquina para ganar estabilidad. Esta es la posición inicial."
    - "Para realizar el movimiento, extiende los codos manteniendo el brazo en su sitio, subiendo las manos por encima de la cabeza."
    - "Aprieta los tríceps en la parte alta del movimiento y baja lentamente el peso hasta la posición inicial."
Triceps_Pushdown:
  name: "Extensión de tríceps en polea"
  instructions:
    - "Coloca una barra recta o angulada en una polea alta y agárrala con agarre prono (palmas hacia abajo) a la anchura de los hombros."
    - "De pie, con el tronco recto y una inclinación muy leve hacia delante, pega la parte superior de los brazos al cuerpo y perpendiculares al suelo. Los antebrazos deben apuntar hacia arriba, hacia la polea, mientras sujetan la barra. Esta es la posición inicial."
    - "Usando los tríceps, baja la barra hasta que toque la parte delantera de los muslos y los brazos queden totalmente extendidos, perpendiculares al suelo. La parte superior de los brazos debe permanecer siempre quieta junto al tronco y solo deben moverse los antebrazos. Espira mientras realizas este movimiento."
    - "Tras mantener un segundo en la posición contraída, sube lentamente la barra hasta el punto de partida. Inspira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
Triceps_Pushdown_-_Rope_Attachment:
  name: "Extensión de tríceps en polea con cuerda"
  instructions:
    - "Coloca un agarre de cuerda en una polea alta y agárralo con agarre neutro (palmas enfrentadas)."
    - "De pie, con el tronco recto y una inclinación muy leve hacia delante, pega la parte superior de los brazos al cuerpo y perpendiculares al suelo. Los antebrazos deben apuntar hacia arriba, hacia la polea, mientras sujetan la cuerda con las palmas enfrentadas. Esta es la posición inicial."
    - "Usando los tríceps, baja la cuerda llevando cada extremo hacia el lateral de los muslos. Al final del movimiento, los brazos quedan totalmente extendidos y perpendiculares al suelo. La parte superior de los brazos debe permanecer siempre quieta junto al tronco y solo deben moverse los antebrazos. Espira mientras realizas este movimiento."
    - "Tras mantener un segundo en la posición contraída, sube lentamente la cuerda hasta el punto de partida. Inspira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
Triceps_Pushdown_-_V-Bar_Attachment:
  name: "Extensión de tríceps en polea con barra en V"
  instructions:
    - "Coloca una barra en V en una polea alta y agárrala con agarre prono (palmas hacia abajo) a la anchura de los hombros."
    - "De pie, con el tronco recto y una inclinación muy leve hacia delante, pega la parte superior de los brazos al cuerpo y perpendiculares al suelo. Los antebrazos deben apuntar hacia arriba, hacia la polea, mientras sujetan la barra. Los pulgares deben estar más altos que el meñique. Esta es la posición inicial."
    - "Usando los tríceps, baja la barra hasta que toque la parte delantera de los muslos y los brazos queden totalmente extendidos, perpendiculares al suelo. La parte superior de los brazos debe permanecer siempre quieta junto al tronco y solo deben moverse los antebrazos. Espira mientras realizas este movimiento."
    - "Tras mantener un segundo en la posición contraída, sube lentamente la barra en V hasta el punto de partida. Inspira mientras realizas este paso."
    - "Repite el número de repeticiones indicado."
Triceps_Stretch:
  name: "Estiramiento de tríceps"
  instructions:
    - "Lleva una mano por detrás de la cabeza, agarra el codo y tira suavemente. Mantén de 10 a 20 segundos y cambia de lado."
Tuck_Crunch:
  name: "Encogimiento abdominal con piernas recogidas"
  instructions:
    - "Para empezar, túmbate en el suelo o en una esterilla con la espalda pegada al suelo. Los brazos deben estar a los lados con las palmas hacia abajo."
    - "Las piernas deben estar cruzadas, rodeando un tobillo con el otro. Eleva lentamente las piernas en el aire hasta que los muslos queden perpendiculares al suelo, con una ligera flexión en las rodillas. Nota: las rodillas y los dedos de los pies deben quedar paralelos al suelo, no los muslos."
    - "Separa los brazos del suelo y crúzalos apoyándolos sobre el pecho. Esta es la posición inicial."
    - "Manteniendo la zona lumbar pegada al suelo, eleva lentamente el tronco. Recuerda espirar mientras realizas esta parte del ejercicio."
    - "Empieza a bajar lentamente el tronco hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Two-Arm_Dumbbell_Preacher_Curl:
  name: "Curl predicador con mancuernas a dos brazos"
  instructions:
    - "Coge una mancuerna con cada brazo y apoya la parte superior de los brazos sobre el banco predicador o el banco inclinado. La mancuerna debe sostenerse a la altura de los hombros. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente las mancuernas hasta que la parte superior del brazo quede extendida y el bíceps totalmente estirado."
    - "Mientras espiras, usa el bíceps para subir las pesas hasta que el bíceps esté totalmente contraído y las mancuernas queden a la altura de los hombros."
    - "Aprieta con fuerza el bíceps durante un segundo en la posición contraída y repite el número de repeticiones indicado."
Two-Arm_Kettlebell_Clean:
  name: "Cargada con dos kettlebells"
  instructions:
    - "Coloca dos kettlebells entre los pies. Para adoptar la posición inicial, echa los glúteos hacia atrás y mira al frente."
    - "Lleva las kettlebells a los hombros extendiendo las piernas y la cadera mientras las subes hacia los hombros. Rota las muñecas al hacerlo."
    - "Baja las kettlebells de nuevo a la posición inicial y repite."
Two-Arm_Kettlebell_Jerk:
  name: "Envión con dos kettlebells"
  instructions:
    - "Lleva dos kettlebells a los hombros. Súbelas a los hombros extendiendo las piernas y la cadera mientras las impulsas hacia los hombros. Rota las muñecas al hacerlo, de modo que las palmas miren hacia delante. Baja en sentadilla unos centímetros e invierte el movimiento rápidamente, impulsando ambas kettlebells por encima de la cabeza. Inmediatamente después del impulso inicial, baja de nuevo en sentadilla y colócate bajo las kettlebells. Una vez que las kettlebells estén bloqueadas arriba, ponte erguido para completar el ejercicio."
Two-Arm_Kettlebell_Military_Press:
  name: "Press militar con dos kettlebells"
  instructions:
    - "Lleva dos kettlebells a los hombros. Súbelas a los hombros extendiendo las piernas y la cadera mientras las impulsas hacia los hombros. Rota las muñecas al hacerlo, de modo que las palmas miren hacia delante."
    - "Empuja las kettlebells hacia arriba y hacia fuera. Cuando las kettlebells pasen por la cabeza, inclínate hacia los pesos de modo que las kettlebells queden apoyadas detrás de la cabeza. Asegúrate de contraer los dorsales, los glúteos y el abdomen para ganar estabilidad."
Two-Arm_Kettlebell_Row:
  name: "Remo con dos kettlebells"
  instructions:
    - "Coloca dos kettlebells frente a los pies. Flexiona ligeramente las rodillas y luego saca los glúteos hacia atrás todo lo que puedas al inclinarte para adoptar la posición inicial."
    - "Agarra ambas kettlebells y llévalas hacia el estómago, retrayendo las escápulas y flexionando los codos. Mantén la espalda recta. Baja y repite."
Underhand_Cable_Pulldowns:
  name: "Jalón al pecho en polea con agarre supino"
  instructions:
    - "Siéntate en una máquina de jalón con una barra ancha colocada en la polea alta. Ajusta el rodillo de rodillas de la máquina a tu altura. Estos rodillos evitarán que la resistencia de la barra te levante el cuerpo."
    - "Agarra la barra de jalón con las palmas mirando hacia el tronco (agarre supino). Asegúrate de que las manos queden más juntas que la anchura de los hombros."
    - "Con ambos brazos extendidos frente a ti sujetando la barra a la anchura de agarre elegida, inclina el tronco hacia atrás unos 30 grados creando una curvatura en la zona lumbar y sacando el pecho. Esta es la posición inicial."
    - "Mientras espiras, baja la barra hasta que toque la parte alta del pecho llevando los hombros y la parte superior de los brazos hacia abajo y atrás. Consejo: concéntrate en apretar los músculos de la espalda cuando llegues a la posición de máxima contracción y mantén los codos cerca del cuerpo. La parte alta del tronco debe permanecer quieta mientras llevas la barra hacia ti y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo en la posición contraída, mientras inspiras, devuelve lentamente la barra a la posición inicial, con los brazos totalmente extendidos y los dorsales totalmente estirados."
    - "Repite este movimiento el número de repeticiones prescrito."
Upper_Back-Leg_Grab:
  name: "Estiramiento de espalda alta abrazando las piernas"
  instructions:
    - "Sentado, inclínate hacia delante para abrazar los muslos por debajo con ambos brazos."
    - "Mantén las rodillas juntas y las piernas extendidas mientras bajas el pecho hacia las rodillas. También puedes estirar la espalda media separando la espalda de las rodillas mientras las abrazas."
Upper_Back_Stretch:
  name: "Estiramiento de espalda alta"
  instructions:
    - "Entrelaza los dedos con los pulgares hacia abajo y redondea los hombros mientras estiras las manos hacia delante."
Upright_Barbell_Row:
  name: "Remo al mentón con barra"
  instructions:
    - "Agarra una barra con agarre prono ligeramente más estrecho que la anchura de los hombros. La barra debe descansar sobre la parte alta de los muslos con los brazos extendidos y una ligera flexión en los codos. La espalda también debe estar recta. Esta es la posición inicial."
    - "Ahora espira y usa la parte lateral de los hombros para subir la barra, elevando los codos hacia arriba y hacia los lados. Mantén la barra cerca del cuerpo mientras la subes. Continúa subiendo la barra hasta que casi toque la barbilla. Consejo: los codos deben dirigir el movimiento y estar siempre más altos que los antebrazos. Recuerda mantener el tronco quieto y hacer una pausa de un segundo en la parte alta del movimiento."
    - "Baja lentamente la barra hasta la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Upright_Cable_Row:
  name: "Remo al mentón en polea"
  instructions:
    - "Agarra una barra recta acoplada a una polea baja con agarre prono (palmas hacia los muslos) ligeramente más estrecho que la anchura de los hombros. La barra debe descansar sobre la parte alta de los muslos. Los brazos deben estar extendidos con una ligera flexión en los codos y la espalda recta. Esta es la posición inicial."
    - "Usa la parte lateral de los hombros para subir la barra de la polea mientras espiras. La barra debe estar cerca del cuerpo mientras la subes. Continúa subiéndola hasta que casi toque la barbilla. Consejo: los codos deben dirigir el movimiento. Mientras subes la barra, los codos deben estar siempre más altos que los antebrazos. Además, mantén el tronco quieto y haz una pausa de un segundo en la parte alta del movimiento."
    - "Baja lentamente la barra hasta la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Upright_Row_-_With_Bands:
  name: "Remo al mentón con gomas elásticas"
  instructions:
    - "Para empezar, colócate de pie sobre una goma elástica de modo que la tensión empiece con los brazos extendidos. Agarra las asas con agarre prono (palmas hacia los muslos) ligeramente más estrecho que la anchura de los hombros. Las asas deben descansar sobre la parte alta de los muslos. Los brazos deben estar extendidos con una ligera flexión en los codos y la espalda recta. Esta es la posición inicial."
    - "Usa la parte lateral de los hombros para subir las asas mientras espiras. Las asas deben estar cerca del cuerpo mientras las subes. Continúa subiéndolas hasta que casi toquen la barbilla. Consejo: los codos deben dirigir el movimiento. Mientras subes las asas, los codos deben estar siempre más altos que los antebrazos. Además, mantén el tronco quieto y haz una pausa de un segundo en la parte alta del movimiento."
    - "Baja lentamente las asas hasta la posición inicial. Inspira mientras realizas esta parte del movimiento."
    - "Repite el número de repeticiones indicado."
Upward_Stretch:
  name: "Estiramiento hacia arriba"
  instructions:
    - "Extiende ambas manos rectas por encima de la cabeza, con las palmas juntas."
    - "Empuja lentamente las manos hacia arriba y hacia atrás, manteniendo la espalda recta."
V-Bar_Pulldown:
  name: "Jalón al pecho con barra en V"
  instructions:
    - "Siéntate en una máquina de jalón con una barra en V colocada en la polea alta."
    - "Ajusta el rodillo de rodillas de la máquina a tu altura. Estos rodillos evitarán que la resistencia de la barra te levante el cuerpo."
    - "Agarra la barra en V con las palmas enfrentadas (agarre neutro). Saca el pecho e inclínate ligeramente hacia atrás (unos 30 grados) para activar mejor los dorsales. Esta es la posición inicial."
    - "Usando los dorsales, baja la barra mientras aprietas las escápulas. Continúa hasta que el pecho casi toque la barra en V. Espira mientras realizas este movimiento. Consejo: mantén el tronco quieto durante todo el movimiento."
    - "Tras mantener un segundo en la posición contraída, devuelve lentamente la barra a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones prescrito."
V-Bar_Pullup:
  name: "Dominada con barra en V"
  instructions:
    - "Empieza colocando el centro de la barra en V en el centro de la barra de dominadas (suponiendo que la estación de dominadas que uses no tenga asas de agarre neutro). Las asas de la barra en V deben mirar hacia abajo para que puedas colgarte de la barra de dominadas usando las asas."
    - "Una vez colocada la barra en V de forma segura, agarra la barra por cada lado y cuélgate de ella. Saca el pecho e inclínate ligeramente hacia atrás para activar mejor los dorsales. Esta es la posición inicial."
    - "Usando los dorsales, sube el tronco mientras inclinas ligeramente la cabeza hacia atrás para no golpearte con la barra de dominadas. Continúa hasta que el pecho casi toque la barra en V. Espira mientras realizas este movimiento."
    - "Tras mantener un segundo en la posición contraída, baja lentamente el cuerpo hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones prescrito."
Vertical_Swing:
  name: "Balanceo vertical con mancuerna"
  instructions:
    - "Deja que la mancuerna cuelgue con los brazos extendidos entre las piernas, sujetándola con ambas manos. Mantén la espalda recta y la cabeza alta."
    - "Balancea la mancuerna entre las piernas, flexionando la cadera y doblando ligeramente las rodillas."
    - "Invierte el movimiento con potencia extendiendo la cadera, las rodillas y los tobillos para impulsarte hacia arriba, balanceando la mancuerna por encima de la cabeza."
    - "Al aterrizar, amortigua el impacto con las piernas y acerca la mancuerna al tronco antes de la siguiente repetición."
Walking_Treadmill:
  name: "Caminar en cinta"
  instructions:
    - "Para empezar, sube a la cinta de correr y selecciona la opción deseada en el menú. La mayoría de las cintas tienen un ajuste manual o puedes seleccionar un programa. Normalmente puedes introducir tu edad y peso para estimar las calorías quemadas durante el ejercicio. La inclinación se puede ajustar para cambiar la intensidad del entrenamiento."
    - "Las cintas ofrecen comodidad y beneficios cardiovasculares, y suelen tener menos impacto que caminar al aire libre. Al caminar, debes moverte a un ritmo de moderado a rápido, no a un paso tranquilo. Al ser una actividad de menor intensidad, caminar no quema tantas calorías como otras actividades, pero aun así aporta grandes beneficios. Una persona de unos 68 kg quemará unas 175 calorías caminando a unos 6,5 km/h durante 30 minutos, frente a 450 calorías corriendo al doble de velocidad. Mantén una postura correcta al caminar y agárrate a los asideros solo cuando sea necesario, por ejemplo al bajar de la cinta o al comprobar el pulso."
Weighted_Ball_Hyperextension:
  name: "Hiperextensión en fitball con peso"
  instructions:
    - "Para empezar, túmbate sobre un fitball con el tronco apoyado en el balón y paralelo al suelo. La parte delantera de los pies debe estar apoyada en el suelo para ayudarte a mantener el equilibrio. Coloca un disco bajo la barbilla o detrás del cuello. Esta es la posición inicial."
    - "Eleva lentamente el tronco flexionando por la cintura y la zona lumbar. Recuerda espirar durante este movimiento."
    - "Mantén la contracción en la zona lumbar durante un segundo y baja el tronco hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones prescrito en tu programa."
Weighted_Ball_Side_Bend:
  name: "Flexión lateral en fitball con peso"
  instructions:
    - "Para empezar, túmbate sobre un fitball con el lado izquierdo del tronco (cintura, cadera y hombro) apoyado en el balón."
    - "Los pies deben estar en el suelo con las piernas cruzadas y colgando del balón. Sujeta un disco con la mano derecha justo al lado derecho de la cabeza. Consejo: asegúrate de que el lado liso del disco quede apoyado contra la cabeza."
    - "Coloca el brazo izquierdo cruzado sobre el tronco de modo que la palma quede sobre los oblicuos. Debe haber un ángulo recto entre el antebrazo y la parte superior del brazo izquierdos. Esta es la posición inicial."
    - "Eleva el lateral del tronco flexionando lateralmente por la cintura mientras espiras."
    - "Mantén la contracción un segundo y baja lentamente hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
    - "Cambia de lado y repite el ejercicio."
Weighted_Bench_Dip:
  name: "Fondos en banco con peso"
  instructions:
    - "Para este ejercicio necesitarás colocar un banco detrás de tu espalda y otro frente a ti. Con los bancos perpendiculares al cuerpo, agárrate al borde de uno de ellos con las manos cerca del cuerpo, separadas a la anchura de los hombros. Los brazos deben estar totalmente extendidos."
    - "Las piernas estarán extendidas hacia delante sobre el otro banco. Las piernas deben estar paralelas al suelo y el tronco perpendicular al suelo. Pide a tu compañero que te coloque la mancuerna sobre el regazo. Nota: este ejercicio es mejor realizarlo con un compañero, ya que colocar el peso sobre el regazo puede ser difícil y causar lesiones sin ayuda. Esta es la posición inicial."
    - "Baja lentamente el cuerpo mientras inspiras flexionando los codos hasta descender lo suficiente como para que haya un ángulo ligeramente menor de 90 grados entre la parte superior del brazo y el antebrazo. Consejo: mantén los codos lo más pegados posible durante todo el movimiento. Los antebrazos deben apuntar siempre hacia abajo."
    - "Usando los tríceps para subir de nuevo el tronco, impúlsate hasta la posición inicial mientras espiras."
    - "Repite el número de repeticiones indicado."
Weighted_Crunches:
  name: "Encogimiento abdominal con peso"
  instructions:
    - "Túmbate boca arriba con los pies apoyados en el suelo o descansando sobre un banco con las rodillas flexionadas en un ángulo de 90 grados."
    - "Sujeta un peso sobre el pecho, o puedes mantenerlo extendido sobre el tronco. Esta es la posición inicial."
    - "Ahora espira y empieza a despegar lentamente los hombros del suelo. Los hombros deben subir unos 10 cm del suelo mientras la zona lumbar permanece en el suelo."
    - "En la parte alta del movimiento, contrae los abdominales y mantén una breve pausa."
    - "Después inspira y baja lentamente hasta la posición inicial."
Weighted_Jump_Squat:
  name: "Sentadilla con salto y peso"
  instructions:
    - "Coloca una barra con poco peso sobre la parte posterior de los hombros. También puedes usar un chaleco lastrado, un saco de arena u otro tipo de resistencia para este ejercicio."
    - "El peso debe ser lo bastante ligero como para no frenarte de forma significativa. Los pies deben estar justo fuera de la anchura de los hombros, con la cabeza y el pecho altos. Esta es la posición inicial."
    - "Usando un contramovimiento, baja parcialmente en sentadilla e invierte inmediatamente la dirección para despegar del suelo de forma explosiva, extendiendo la cadera, las rodillas y los tobillos. Mantén una buena postura durante todo el salto."
    - "Al volver al suelo, amortigua el impacto con las piernas."
Weighted_Pull_Ups:
  name: "Dominadas con peso"
  instructions:
    - "Engancha un peso a un cinturón de lastre y asegúralo alrededor de la cintura. Agarra la barra de dominadas con las palmas de las manos mirando hacia delante. Para un agarre medio, las manos deben estar separadas a la anchura de los hombros. Ambos brazos deben estar extendidos frente a ti sujetando la barra con el agarre elegido."
    - "Debes inclinar el tronco hacia atrás unos 30 grados creando una curvatura en la zona lumbar y sacando el pecho. Esta es la posición inicial."
    - "Ahora espira y sube el tronco hasta que la cabeza quede por encima de las manos. Concéntrate en apretar las escápulas hacia atrás y hacia abajo al llegar a la posición superior contraída."
    - "Tras un breve instante en la posición superior contraída, inspira y baja lentamente el tronco hasta la posición inicial con los brazos extendidos y los dorsales totalmente estirados."
Weighted_Sissy_Squat:
  name: "Sentadilla sissy con peso"
  instructions:
    - "De pie, erguido, con los pies a la anchura de los hombros y las puntas elevadas, usa una mano para agarrarte a los montantes de un rack de sentadillas y el brazo contrario para sujetar un disco sobre el pecho. Esta es la posición inicial."
    - "Mientras usas un brazo para sujetarte, flexiona las rodillas y baja lentamente el tronco hacia el suelo llevando la pelvis y las rodillas hacia delante. Inspira mientras bajas y detente cuando la parte superior e inferior de las piernas formen casi un ángulo de 90 grados. Mantén la posición de estiramiento durante un segundo."
    - "Tras ese segundo, usa los músculos de los muslos para subir el tronco de nuevo hasta la posición inicial. Espira mientras subes."
    - "Repite el número de repeticiones indicado."
Weighted_Sit-Ups_-_With_Bands:
  name: "Abdominales con peso y gomas elásticas"
  instructions:
    - "Empieza sujetando las gomas alrededor de la base del banco declinado. Coloca las asas hacia el interior del banco declinado de modo que, al tumbarte, puedas alcanzar ambas."
    - "Coloca las piernas en el soporte del banco declinado hasta que queden aseguradas. Ahora alcanza las gomas elásticas con ambas manos. Usa un agarre prono (palmas hacia delante) para agarrar las asas. Colócalas cerca de la clavícula y rota las muñecas hasta un agarre neutro (palmas hacia el tronco). Nota: los brazos deben permanecer quietos durante todo el ejercicio. Esta es la posición inicial."
    - "Sube el tronco hasta que la parte superior del cuerpo quede perpendicular al suelo mientras espiras. Mantén la contracción un segundo y baja la parte superior del cuerpo hasta la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Weighted_Squat:
  name: "Sentadilla con peso"
  instructions:
    - "Empieza colocando dos bancos planos separados a la anchura de los hombros. Sube encima de ellos y ata el cinturón de lastre alrededor de la cintura con el peso con el que te sientas cómodo. Asegúrate de que las puntas de los pies miren hacia fuera."
    - "Una vez que estés de pie, totalmente erguido, con el peso colgando entre las piernas, coloca los brazos totalmente extendidos a los lados del cuerpo. Esta es la posición inicial."
    - "Empieza flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que el ángulo entre el muslo y las pantorrillas sea ligeramente inferior a 90 grados (que es el punto en el que los muslos quedan por debajo del paralelo con el suelo). Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si sobrepasan las puntas de los pies), estás sometiendo la rodilla a un estrés excesivo y el ejercicio se ha realizado de forma incorrecta."
    - "Empieza a subir el cuerpo empujando el banco plano principalmente con la parte delantera del pie mientras estiras de nuevo las piernas y vuelves a la posición inicial. Espira mientras realizas esta parte del ejercicio."
    - "Repite el número de repeticiones indicado."
Wide-Grip_Barbell_Bench_Press:
  name: "Press de banca con barra (agarre ancho)"
  instructions:
    - "Túmbate en un banco plano con los pies firmes en el suelo. Con un agarre prono ancho (palmas hacia delante), a unos 7,5 cm de la anchura de los hombros (para cada mano), saca la barra del soporte y mantenla recta sobre ti con los brazos bloqueados. La barra quedará perpendicular al tronco y al suelo. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente hasta notar la barra en la parte media del pecho."
    - "Tras una pausa de un segundo, devuelve la barra a la posición inicial mientras espiras y empuja la barra con los músculos del pecho. Bloquea los brazos y aprieta el pecho en la posición contraída, mantén un segundo y empieza a bajar lentamente de nuevo. Consejo: bajar debería llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito."
Wide-Grip_Decline_Barbell_Bench_Press:
  name: "Press de banca declinado con barra (agarre ancho)"
  instructions:
    - "Túmbate en un banco declinado con los pies bien sujetos en la parte delantera del banco. Con un agarre prono ancho (palmas hacia delante), a unos 7,5 cm de la anchura de los hombros (para cada mano), saca la barra del soporte y mantenla recta sobre ti con los brazos bloqueados. La barra quedará perpendicular al tronco y al suelo. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente hasta notar la barra en la parte baja del pecho."
    - "Tras una pausa de un segundo, devuelve la barra a la posición inicial mientras espiras y empuja la barra con los músculos del pecho. Bloquea los brazos y aprieta el pecho en la posición contraída, mantén un segundo y empieza a bajar lentamente de nuevo. Consejo: bajar debería llevar al menos el doble de tiempo que subir."
    - "Repite el movimiento el número de repeticiones prescrito."
Wide-Grip_Decline_Barbell_Pullover:
  name: "Pullover declinado con barra (agarre ancho)"
  instructions:
    - "Túmbate en un banco declinado con ambas piernas bien sujetas. Alcanza la barra por detrás de la cabeza con agarre prono (palmas hacia fuera). Asegúrate de agarrar la barra con una separación mayor que la anchura de los hombros para este ejercicio. Levanta lentamente la barra del suelo usando los brazos."
    - "Cuando estés bien colocado, los brazos deben estar totalmente extendidos y perpendiculares al suelo. Esta es la posición inicial."
    - "Empieza bajando la barra hacia atrás en un movimiento semicircular como si fueras a dejarla en el suelo, pero detente cuando los brazos queden paralelos al suelo. Consejo: mantén los brazos totalmente extendidos en todo momento. El movimiento solo debe producirse en la articulación del hombro. Inspira mientras realizas esta parte del movimiento."
    - "Ahora sube la barra mientras espiras hasta volver a la posición inicial. Recuerda mantener el control total de la barra en todo momento."
    - "Repite el movimiento el número de repeticiones prescrito en tu programa de entrenamiento."
    - "Al terminar la serie, baja lentamente la barra hasta que quede a la altura de la cabeza y suéltala."
Wide-Grip_Lat_Pulldown:
  name: "Jalón al pecho (agarre ancho)"
  instructions:
    - "Siéntate en una máquina de jalón con una barra ancha colocada en la polea alta. Asegúrate de ajustar el rodillo de rodillas de la máquina a tu altura. Estos rodillos evitarán que la resistencia de la barra te levante el cuerpo."
    - "Agarra la barra con las palmas hacia delante usando el agarre prescrito. Nota sobre los agarres: para un agarre ancho, las manos deben estar separadas a una distancia mayor que la anchura de los hombros. Para un agarre medio, las manos deben estar separadas a una distancia igual a la anchura de los hombros y para un agarre cerrado, a una distancia menor que la anchura de los hombros."
    - "Con ambos brazos extendidos frente a ti sujetando la barra a la anchura de agarre elegida, inclina el tronco hacia atrás unos 30 grados creando una curvatura en la zona lumbar y sacando el pecho. Esta es la posición inicial."
    - "Mientras espiras, baja la barra hasta que toque la parte alta del pecho llevando los hombros y la parte superior de los brazos hacia abajo y atrás. Consejo: concéntrate en apretar los músculos de la espalda cuando llegues a la posición de máxima contracción. La parte alta del tronco debe permanecer quieta y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra; por tanto, no intentes bajar la barra con los antebrazos."
    - "Tras un segundo en la posición contraída apretando las escápulas, sube lentamente la barra hasta la posición inicial, con los brazos totalmente extendidos y los dorsales totalmente estirados. Inspira durante esta parte del movimiento."
    - "Repite este movimiento el número de repeticiones prescrito."
Wide-Grip_Pulldown_Behind_The_Neck:
  name: "Jalón tras nuca (agarre ancho)"
  instructions:
    - "Siéntate en una máquina de jalón con una barra ancha colocada en la polea alta. Asegúrate de ajustar el rodillo de rodillas de la máquina a tu altura. Estos rodillos evitarán que la resistencia de la barra te levante el cuerpo."
    - "Agarra la barra con las palmas hacia delante usando el agarre prescrito. Nota sobre los agarres: para un agarre ancho, las manos deben estar separadas a una distancia mayor que la anchura de los hombros. Para un agarre medio, las manos deben estar separadas a una distancia igual a la anchura de los hombros y para un agarre cerrado, a una distancia menor que la anchura de los hombros."
    - "Con ambos brazos extendidos frente a ti sujetando la barra a la anchura de agarre elegida, lleva el tronco y la cabeza hacia delante. Imagina una línea desde el centro de la barra hasta la nuca. Esta es la posición inicial."
    - "Mientras espiras, baja la barra hasta que toque la nuca llevando los hombros y la parte superior de los brazos hacia abajo y atrás. Consejo: concéntrate en apretar los músculos de la espalda cuando llegues a la posición de máxima contracción. La parte alta del tronco debe permanecer quieta y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra; por tanto, no intentes bajar la barra con los antebrazos."
    - "Tras un segundo en la posición contraída apretando las escápulas, sube lentamente la barra hasta la posición inicial, con los brazos totalmente extendidos y los dorsales totalmente estirados. Inspira durante esta parte del movimiento."
    - "Repite este movimiento el número de repeticiones prescrito."
Wide-Grip_Rear_Pull-Up:
  name: "Dominada tras nuca (agarre ancho)"
  instructions:
    - "Agarra la barra de dominadas con las palmas hacia delante usando un agarre ancho."
    - "Con ambos brazos extendidos frente a ti sujetando la barra, lleva el tronco y la cabeza hacia delante de modo que haya una línea imaginaria desde la barra de dominadas hasta la nuca. Esta es la posición inicial."
    - "Sube el tronco hasta que la barra quede cerca de la nuca. Para ello, lleva los hombros y la parte superior de los brazos hacia abajo y atrás mientras inclinas ligeramente la cabeza hacia delante. Espira mientras realizas esta parte del movimiento. Consejo: concéntrate en apretar los músculos de la espalda cuando llegues a la posición de máxima contracción. La parte alta del tronco debe permanecer quieta mientras se desplaza por el espacio y solo deben moverse los brazos. Los antebrazos no deben hacer más trabajo que sujetar la barra."
    - "Tras un segundo en la posición contraída, empieza a inspirar y baja lentamente el tronco hasta la posición inicial, con los brazos totalmente extendidos y los dorsales totalmente estirados."
    - "Repite este movimiento el número de repeticiones prescrito."
Wide-Grip_Standing_Barbell_Curl:
  name: "Curl con barra de pie (agarre ancho)"
  instructions:
    - "Ponte de pie con el tronco erguido sujetando una barra por el agarre exterior ancho. Las palmas de las manos deben mirar hacia delante. Los codos deben estar pegados al tronco. Esta es la posición inicial."
    - "Manteniendo quietos los brazos, sube las pesas hacia delante contrayendo los bíceps mientras espiras. Consejo: solo deben moverse los antebrazos."
    - "Continúa el movimiento hasta que los bíceps estén totalmente contraídos y la barra quede a la altura de los hombros. Mantén la posición contraída un segundo y aprieta con fuerza los bíceps."
    - "Empieza a devolver lentamente la barra a la posición inicial mientras inspiras."
    - "Repite el número de repeticiones indicado."
Wide_Stance_Barbell_Squat:
  name: "Sentadilla con barra con postura ancha"
  instructions:
    - "Este ejercicio es mejor realizarlo dentro de un rack de sentadillas por seguridad. Para empezar, coloca la barra en un rack que se ajuste a tu altura. Una vez elegida la altura correcta y cargada la barra, métete debajo de ella y apóyala sobre la parte posterior de los hombros (ligeramente por debajo del cuello)."
    - "Sujeta la barra con ambos brazos a cada lado y sácala del rack empujando primero con las piernas y enderezando a la vez el tronco."
    - "Aléjate del rack y coloca las piernas con una postura más ancha que los hombros, con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te desequilibrará, y mantén también la espalda recta. Esta es la posición inicial."
    - "Empieza a bajar lentamente la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que el ángulo entre el muslo y las pantorrillas sea ligeramente inferior a 90 grados (que es el punto en el que los muslos quedan por debajo del paralelo con el suelo). Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si sobrepasan las puntas de los pies), estás sometiendo la rodilla a un estrés excesivo y el ejercicio se ha realizado de forma incorrecta."
    - "Empieza a subir la barra mientras espiras empujando el suelo con el talón mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Wide_Stance_Stiff_Legs:
  name: "Peso muerto con piernas rígidas y postura ancha"
  instructions:
    - "Empieza con una barra cargada en el suelo. Adopta una postura ancha y luego flexiona la cadera para agarrar la barra. La cadera debe estar lo más atrás posible y las piernas casi rectas. Mantén la espalda recta y la cabeza y el pecho altos. Esta es la posición inicial."
    - "Inicia el movimiento activando la cadera, llevándola hacia delante mientras dejas que los brazos cuelguen rectos. Continúa hasta quedar de pie totalmente erguido y luego devuelve lentamente el peso a la posición inicial. En las repeticiones sucesivas, el peso no necesita tocar el suelo."
Wind_Sprints:
  name: "Elevaciones rápidas de rodillas colgado"
  instructions:
    - "Cuélgate de una barra de dominadas con agarre prono. Los brazos y las piernas deben estar extendidos. Esta es la posición inicial."
    - "Empieza subiendo rápidamente una rodilla lo más alto que puedas. No balancees el cuerpo ni las piernas."
    - "Invierte inmediatamente el movimiento, devolviendo esa pierna a la posición inicial. Simultáneamente sube la rodilla contraria lo más alto posible."
    - "Continúa alternando las piernas hasta completar la serie."
Windmills:
  name: "Molinos tumbado"
  instructions:
    - "Túmbate boca arriba con los brazos extendidos hacia los lados y las piernas rectas. Esta es la posición inicial."
    - "Levanta una pierna y crúzala rápidamente por encima del cuerpo, intentando tocar el suelo cerca de la mano contraria."
    - "Vuelve a la posición inicial y repite con la otra pierna. Continúa alternando de 10 a 20 repeticiones."
Worlds_Greatest_Stretch:
  name: "El mejor estiramiento del mundo"
  instructions:
    - "Este es un estiramiento en tres partes. Empieza dando una zancada hacia delante, con el pie delantero apoyado por completo en el suelo y sobre la punta del pie trasero. Con las rodillas flexionadas, baja hasta que la rodilla casi toque el suelo. Mantén el tronco erguido y mantén esta posición de 10 a 20 segundos."
    - "Ahora, apoya en el suelo el brazo del mismo lado que la pierna delantera, con el codo junto al pie. Apoya la otra mano en el suelo, paralela a la pierna adelantada, para ayudarte a sostenerte durante esta parte del estiramiento."
    - "Pasados 10-20 segundos, apoya las manos a ambos lados del pie delantero. Levanta la punta del pie delantero del suelo y estira la pierna. Puede que tengas que recolocar la pierna trasera para hacerlo. Mantén de 10 a 20 segundos y luego repite toda la secuencia con el otro lado."
Wrist_Circles:
  name: "Círculos de muñeca"
  instructions:
    - "Empieza de pie, recto, con los pies separados a la anchura de los hombros. Eleva los brazos hacia los lados hasta que queden totalmente extendidos y paralelos al suelo, a una altura alineada con los hombros. Consejo: el tronco y los brazos deben formar la letra \"T\". Las palmas deben mirar hacia abajo. Esta es la posición inicial."
    - "Manteniendo todo el cuerpo quieto salvo las muñecas, empieza a rotar ambas muñecas hacia delante en un movimiento circular. Consejo: imagina que intentas dibujar círculos usando las manos como pincel. Respira con normalidad mientras realizas este ejercicio."
    - "Repite el número de repeticiones indicado."
Wrist_Roller:
  name: "Rodillo de muñeca"
  instructions:
    - "Para empezar, ponte de pie, recto, agarrando un rodillo de muñeca con agarre prono (palmas hacia abajo). Los pies deben estar separados a la anchura de los hombros."
    - "Levanta lentamente ambos brazos hasta que queden totalmente extendidos y paralelos al suelo frente a ti. Nota: asegúrate de que la cuerda no esté enrollada en el rodillo. Todo el cuerpo debe permanecer quieto salvo los antebrazos. Esta es la posición inicial."
    - "Rota una muñeca cada vez hacia arriba para subir el peso hasta la barra enrollando la cuerda alrededor del rodillo."
    - "Una vez que el peso haya llegado a la barra, empieza a bajarlo lentamente rotando la muñeca hacia abajo hasta que el peso llegue a la posición inicial."
    - "Repite el número de repeticiones prescrito en tu programa."
Wrist_Rotations_with_Straight_Bar:
  name: "Rotaciones de muñeca con barra recta"
  instructions:
    - "Sujeta una barra con ambas manos y las palmas hacia abajo; las manos separadas a la anchura de los hombros aproximadamente. Esta es la posición inicial."
    - "Alternando entre ambas manos, realiza el movimiento extendiendo la muñeca como si estuvieras enrollando un periódico. Continúa alternando hasta el fallo."
    - "Invierte el movimiento flexionando la muñeca, enrollando en la dirección contraria. Continúa el movimiento alterno hasta el fallo."
Yoke_Walk:
  name: "Paseo del yugo"
  instructions:
    - "El yugo normalmente se hace con un aparato específico, pero a veces se ve con frigoríficos u otros objetos pesados."
    - "Empieza apoyando el aparato sobre la parte posterior de los hombros. Con la cabeza mirando al frente y la espalda arqueada, levanta el yugo empujando con los talones."
    - "Empieza a caminar lo más rápido posible con pasos cortos y rápidos. Puedes agarrar los postes laterales del yugo para ayudar a estabilizarlo y mantenerlo en posición. Continúa la distancia indicada lo más rápido posible, normalmente unos 23-30 m."
Zercher_Squats:
  name: "Sentadilla Zercher"
  instructions:
    - "Este ejercicio es mejor realizarlo dentro de un rack de sentadillas por seguridad. Para empezar, coloca la barra en un rack que se ajuste a tu altura. La altura correcta debe estar por encima de la cintura pero por debajo del pecho. Una vez elegida la altura correcta y cargada la barra, entrelaza las manos y coloca la barra sobre los brazos, en el pliegue entre el antebrazo y la parte superior del brazo."
    - "Levanta la barra de modo que quede apoyada sobre los antebrazos. Si sujetas la barra correctamente, debe parecer que tienes los brazos cruzados pero con una barra atravesada sobre ellos."
    - "Aléjate del rack y coloca las piernas con una postura media, a la anchura de los hombros, con las puntas de los pies ligeramente hacia fuera. Mantén la cabeza alta en todo momento, ya que mirar hacia abajo te desequilibrará, y mantén también la espalda recta. Esta es la posición inicial. (Nota: a efectos de esta explicación usaremos la postura media descrita arriba, que trabaja el desarrollo general; sin embargo, puedes elegir cualquiera de las tres posturas descritas en la sección de posturas de los pies)."
    - "Empieza a bajar la barra flexionando las rodillas mientras mantienes una postura recta con la cabeza alta. Continúa bajando hasta que el ángulo entre el muslo y las pantorrillas sea ligeramente inferior a 90 grados (que es el punto en el que los muslos quedan por debajo del paralelo con el suelo). Inspira mientras realizas esta parte del movimiento. Consejo: si has realizado el ejercicio correctamente, la parte delantera de las rodillas debe formar una línea recta imaginaria con las puntas de los pies, perpendicular al frente. Si las rodillas sobrepasan esa línea imaginaria (si sobrepasan las puntas de los pies), estás sometiendo la rodilla a un estrés excesivo y el ejercicio se ha realizado de forma incorrecta."
    - "Empieza a subir la barra mientras espiras empujando el suelo principalmente con la parte delantera del pie mientras estiras de nuevo las piernas y vuelves a la posición inicial."
    - "Repite el número de repeticiones indicado."
Zottman_Curl:
  name: "Curl Zottman"
  instructions:
    - "Ponte de pie con el tronco erguido y una mancuerna en cada mano, sujetas con los brazos extendidos. Los codos deben estar pegados al tronco."
    - "Asegúrate de que las palmas de las manos se miren entre sí. Esta es la posición inicial."
    - "Manteniendo quieta la parte superior del brazo, sube las pesas contrayendo los bíceps mientras espiras. Solo deben moverse los antebrazos. Rota la muñeca para acabar con un agarre supino (palmas hacia arriba). Continúa el movimiento hasta que los bíceps estén totalmente contraídos y las mancuernas queden a la altura de los hombros."
    - "Mantén la posición contraída un segundo mientras aprietas los bíceps."
    - "Ahora, en la posición contraída, rota la muñeca hasta tener un agarre prono (palmas hacia abajo) con el pulgar más alto que el meñique."
    - "Empieza a bajar lentamente las mancuernas usando el agarre prono."
    - "Cuando las mancuernas se acerquen a los muslos, empieza a rotar la muñeca para volver a un agarre neutro (palmas hacia el cuerpo)."
    - "Repite el número de repeticiones indicado."
Zottman_Preacher_Curl:
  name: "Curl predicador Zottman"
  instructions:
    - "Coge una mancuerna en cada mano y apoya la parte superior de los brazos sobre el banco predicador o el banco inclinado. Las mancuernas deben sostenerse a la altura de los hombros y los codos deben estar flexionados. Sujeta las mancuernas con las palmas de las manos hacia abajo. Esta es la posición inicial."
    - "Mientras inspiras, baja lentamente las mancuernas manteniendo las palmas hacia abajo hasta que la parte superior del brazo quede extendida y los bíceps totalmente estirados."
    - "Ahora rota las muñecas cuando estés en la parte baja del movimiento de modo que las palmas de las manos miren hacia arriba."
    - "Mientras espiras, usa los bíceps para subir las pesas hasta que estén totalmente contraídos y las mancuernas queden a la altura de los hombros. Recuerda de nuevo que, para asegurar la contracción completa, debes subir el meñique más alto que el pulgar."
    - "Aprieta con fuerza los bíceps durante un segundo en la posición contraída y rota las muñecas de modo que las palmas vuelvan a mirar hacia abajo."
    - "Repite el número de repeticiones indicado."
