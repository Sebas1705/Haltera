  - id: pull-up
    name: { en: Pull-Up, es: Dominada }
    variants:
      - source: Pullups
      - source: Band_Assisted_Pull-Up
        suffix: band-assisted
  - id: lat-pulldown
    name: { en: Lat Pulldown, es: Jalón al pecho }
    variants:
      - source: Wide-Grip_Lat_Pulldown
        suffix: wide-grip
      - source: Close-Grip_Front_Lat_Pulldown
        suffix: close-grip
      - source: V-Bar_Pulldown
