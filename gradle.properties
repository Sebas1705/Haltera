org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# iOS targets cannot be built on Windows/Linux; skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true

# AGP 9: composeApp still combines com.android.application with the KMP plugin (androidTarget()), which AGP 9
# only allows with built-in Kotlin and the new DSL turned off. Library modules use
# com.android.kotlin.multiplatform.library and are unaffected. Both opt-outs disappear in AGP 10: the way out
# is a separate pure-Android app module (see docs in the AGP 9 upgrade PR).
android.builtInKotlin=false
android.newDsl=false
