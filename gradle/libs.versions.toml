[versions]
kotlin                  = "2.4.20"
compose-multiplatform   = "1.11.1"
compose-material3       = "1.9.0"
compose-material-icons  = "1.7.3"
agp                     = "8.13.2"

coroutines              = "1.11.0"
serialization           = "1.11.0"
datetime                = "0.8.0"
immutable-collections   = "0.5.2"

lifecycle               = "2.10.0"
navigation              = "2.9.2"

ktor                    = "3.6.0"
koin                    = "4.2.2"
sqldelight              = "2.4.1"
datastore               = "1.2.1"
coil                    = "3.5.0"
kermit                  = "2.2.0"
multiplatform-settings  = "1.3.0"

# Firebase (account and sync, docs/designs/2026-10-14-sync-design.md): same versions as Owlsplit.
gitlive-firebase        = "2.7.0"
google-services         = "4.5.0"
credentials             = "1.6.0"
googleid                = "1.2.1"

detekt                  = "1.23.8"
detekt-kotlin           = "2.0.21"

security-crypto         = "1.1.0-beta01"
leakcanary              = "2.14"
turbine                 = "1.2.1"
compose-icons           = "1.1.1"
roborazzi               = "1.76.0"
robolectric             = "4.17"
androidx-compose-test   = "1.11.3"
junit4                  = "4.13.2"
qrose                   = "1.1.2"
play-services-code-scanner = "16.1.0"
health-connect          = "1.1.0"

androidx-test-runner    = "1.7.0"
androidx-test-core      = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "datetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "immutable-collections" }

compose-runtime            = { module = "org.jetbrains.compose.runtime:runtime",                   version.ref = "compose-multiplatform" }
compose-foundation         = { module = "org.jetbrains.compose.foundation:foundation",             version.ref = "compose-multiplatform" }
compose-ui                 = { module = "org.jetbrains.compose.ui:ui",                             version.ref = "compose-multiplatform" }
compose-ui-backhandler     = { module = "org.jetbrains.compose.ui:ui-backhandler",                 version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview",             version.ref = "compose-multiplatform" }
compose-animation          = { module = "org.jetbrains.compose.animation:animation",               version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3          = { module = "org.jetbrains.compose.material3:material3",               version.ref = "compose-material3" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core",    version.ref = "compose-material-icons" }

lifecycle-viewmodel         = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel",         version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
navigation-compose          = { module = "org.jetbrains.androidx.navigation:navigation-compose",         version.ref = "navigation" }

ktor-client-core                = { module = "io.ktor:ktor-client-core",                version.ref = "ktor" }
ktor-client-mock                = { module = "io.ktor:ktor-client-mock",                version.ref = "ktor" }
ktor-client-okhttp              = { module = "io.ktor:ktor-client-okhttp",              version.ref = "ktor" }
ktor-client-darwin              = { module = "io.ktor:ktor-client-darwin",              version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging             = { module = "io.ktor:ktor-client-logging",             version.ref = "ktor" }
ktor-client-auth                = { module = "io.ktor:ktor-client-auth",                version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

koin-core              = { module = "io.insert-koin:koin-core",              version.ref = "koin" }
koin-android           = { module = "io.insert-koin:koin-android",           version.ref = "koin" }
koin-compose           = { module = "io.insert-koin:koin-compose",           version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test              = { module = "io.insert-koin:koin-test",              version.ref = "koin" }

sqldelight-runtime        = { module = "app.cash.sqldelight:runtime",               version.ref = "sqldelight" }
sqldelight-coroutines     = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver",        version.ref = "sqldelight" }
sqldelight-native-driver  = { module = "app.cash.sqldelight:native-driver",         version.ref = "sqldelight" }
sqldelight-jvm-driver     = { module = "app.cash.sqldelight:sqlite-driver",         version.ref = "sqldelight" }

datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
datastore-preferences      = { module = "androidx.datastore:datastore-preferences",      version.ref = "datastore" }

coil-compose      = { module = "io.coil-kt.coil3:coil-compose",       version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

gitlive-firebase-auth      = { module = "dev.gitlive:firebase-auth",      version.ref = "gitlive-firebase" }
gitlive-firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitlive-firebase" }
androidx-credentials       = { module = "androidx.credentials:credentials",                    version.ref = "credentials" }
androidx-credentials-play  = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
google-identity-googleid   = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

multiplatform-settings             = { module = "com.russhwolf:multiplatform-settings",             version.ref = "multiplatform-settings" }
multiplatform-settings-no-arg      = { module = "com.russhwolf:multiplatform-settings-no-arg",      version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines  = { module = "com.russhwolf:multiplatform-settings-coroutines",  version.ref = "multiplatform-settings" }
multiplatform-settings-test        = { module = "com.russhwolf:multiplatform-settings-test",        version.ref = "multiplatform-settings" }

security-crypto = { module = "androidx.security:security-crypto",          version.ref = "security-crypto" }
leakcanary      = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
turbine         = { module = "app.cash.turbine:turbine",                   version.ref = "turbine" }
compose-icons-tabler       = { module = "br.com.devsrsouza.compose.icons:tabler-icons", version.ref = "compose-icons" }
roborazzi                  = { module = "io.github.takahirom.roborazzi:roborazzi",         version.ref = "roborazzi" }
roborazzi-compose          = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
robolectric                = { module = "org.robolectric:robolectric",                     version.ref = "robolectric" }
androidx-compose-ui-test-junit4   = { module = "androidx.compose.ui:ui-test-junit4",   version.ref = "androidx-compose-test" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-test" }
junit4                     = { module = "junit:junit", version.ref = "junit4" }
qrose                      = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "play-services-code-scanner" }
androidx-health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "health-connect" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

androidx-test-runner       = { module = "androidx.test:runner",           version.ref = "androidx-test-runner" }
androidx-test-core         = { module = "androidx.test:core",             version.ref = "androidx-test-core" }
androidx-test-ext-junit    = { module = "androidx.test.ext:junit",        version.ref = "androidx-test-ext-junit" }

[bundles]
ktor-common         = ["ktor-client-core", "ktor-client-content-negotiation", "ktor-client-logging", "ktor-client-auth", "ktor-serialization-kotlinx-json"]
koin-compose-bundle = ["koin-compose", "koin-compose-viewmodel"]
settings-bundle     = ["multiplatform-settings", "multiplatform-settings-coroutines"]
compose-core        = ["compose-runtime", "compose-foundation", "compose-ui", "compose-animation", "compose-material3", "compose-material-icons-core", "compose-components-resources", "compose-ui-tooling-preview"]

[plugins]
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform",          version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",                       version.ref = "compose-multiplatform" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
android-application   = { id = "com.android.application",                     version.ref = "agp" }
android-library       = { id = "com.android.library",                         version.ref = "agp" }
sqldelight            = { id = "app.cash.sqldelight",                         version.ref = "sqldelight" }
detekt                = { id = "io.gitlab.arturbosch.detekt",                 version.ref = "detekt" }
roborazzi             = { id = "io.github.takahirom.roborazzi",               version.ref = "roborazzi" }
google-services       = { id = "com.google.gms.google-services",              version.ref = "google-services" }

kmp-library     = { id = "haltera.kmp.library" }
kmp-feature     = { id = "haltera.kmp.feature" }
kmp-data        = { id = "haltera.kmp.data" }
kmp-domain      = { id = "haltera.kmp.domain" }
kmp-core        = { id = "haltera.kmp.core" }
kmp-app         = { id = "haltera.kmp.app" }
haltera-detekt = { id = "haltera.detekt" }
