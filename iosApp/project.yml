# Xcode project of the iOS app, generated with XcodeGen (`cd iosApp && xcodegen generate`):
# the .xcodeproj is not committed. CI builds it for the simulator without signing
# (.github/workflows/ci.yml). Signing needs the Apple Developer Team ID (later phase).
name: Haltera
options:
  bundleIdPrefix: es.sebas1705
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # The version GitLive 2.7.0 is built against (same as Owlsplit).
    exactVersion: 11.8.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # REVERSED_CLIENT_ID of GoogleService-Info.plist (Google enabled in Firebase on 2026-10-14).
    # Without a matching URL scheme the app hides Google sign-in (GoogleSignIn.swift, isConfigured).
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.695669078657-cvv2rrr9t5tgi79fs92elrojvc9k5u98

targets:
  Haltera:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Haltera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.sebas1705.haltera
        PRODUCT_NAME: Haltera
        # Assets.xcassets/AppIcon: rendered from brand/icon.svg by `node scripts/brand.mjs --png` (docs/BRAND.md).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The shared code (Kotlin/Native static framework built by the phase below).
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, ComposeApp, -lsqlite3]
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
