# Bundled generic foods (nutrition design §2). The pipeline (scripts/nutrition/build.mjs) reads the USDA
# snapshot in sources/usda-foods.json and keeps only the foods listed here, with these English names; the
# Spanish names live in i18n/es.yaml. See nutrition/README.md for the rules.
#
# Entry fields:
#   fdc      USDA FoodData Central id (the food id is `usda-<fdc>`, stable forever)
#   en       English display name (short, "Food, state" style)
#   unit     G (default) or ML for drinks: values stay per 100 g and 1 ml is taken as 1 g
#   serving  [kind, grams or ml] — one typical serving; kinds are listed under `servingKinds`
foodsVersion: 1
released: false

servingKinds:
  unit: { en: "unit", es: "unidad" }
  slice: { en: "slice", es: "rebanada" }
  glass: { en: "glass", es: "vaso" }
  cup: { en: "cup", es: "taza" }
  bowl: { en: "bowl", es: "cuenco" }
  tbsp: { en: "tablespoon", es: "cucharada" }
  tsp: { en: "teaspoon", es: "cucharadita" }
  handful: { en: "handful", es: "puñado" }
  pot: { en: "pot", es: "tarrina" }
  can: { en: "can", es: "lata" }
  portion: { en: "portion", es: "ración" }
  fillet: { en: "fillet", es: "filete" }
  scoop: { en: "scoop", es: "bola" }
  measure: { en: "scoop", es: "cacito" }
  square: { en: "square", es: "onza" }
  clove: { en: "clove", es: "diente" }
  pat: { en: "pat", es: "porción" }

